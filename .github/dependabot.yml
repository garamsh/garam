# The movers docs/convention/ci.md §Verify a pinned dependency before
# adopting it requires of a pin. Each entry states what it covers and
# what it does not.
#
# A pin belongs on the list below when two things hold: §Verify reaches
# it, and no entry here moves it.
#
# §Verify reaches what the pipeline pulls in from outside this
# repository — a published component, container image or tool version.
# A reference to something this repository builds itself is not one:
# nothing published it, so there is no upstream release for a mover to
# propose. That is what leaves the garam:local and garam-web:local
# images in deploy/local/minikube/garam.yaml and migrate-job.yaml off
# the list, correctly recording nothing, while the alpine image beside
# them in the same file is on it.
#
# Eight pins meet both tests. Five record the absence at their own site,
# so the list is checked against the tree rather than trusted:
#
#   - the Makefile's HELM and CNPG_MANIFEST
#   - machine.copyImage in deploy/charts/garam/values.yaml, the one pin
#     in that file: image.server.tag and image.web.tag are empty
#   - the key-material container's image in
#     deploy/local/minikube/garam.yaml
#   - imageName in deploy/local/minikube/postgres.yaml
#
# Each says at the pin that no bot proposes a bump and no scheduled
# review is named, so it is the PM's to move under AGENTS.md §Roles. A
# sixth such record, or a pin without one, is what this list going stale
# looks like.
#
# Three record it here instead: go.mod's `go` directive, which the gomod
# entry never edits; `packageManager` in web/package.json, pinned to
# pnpm@11.11.0, in a file JSON gives no comment syntax; and
# web/pnpm-lock.yaml, which is generated. No entry here reaches web/ at
# all, and no scheduled review is named for any of the three, so each is
# the PM's to move under AGENTS.md §Roles.
#
# The lockfile is one record for every resolution it holds. An exact
# dependency version in web/package.json is a pin only because the
# lockfile carries the integrity hash §Verify's checksum-log test asks
# for, so what moves those versions is a move of the lockfile.
#
# What each entry covers was read from github/docs at commit
# 0dddeeb8cce75425f9ca0cdffd6a1cbd94926c07 and dependabot/dependabot-core
# at commit 98786d7814bb4f7199ca3cdb08350b6180b82983.
version: 2
updates:
  # deploy/local/Dockerfile and Dockerfile.web.
  #
  # Covers a newer tag for both, rewriting the tag and the digest
  # together.
  #
  # Does not cover: a CVE with no newer tag, because the docker
  # ecosystem receives version updates and not security updates; a base
  # republished under the same tag, which can be treated as already
  # current while the tag is unchanged; deploy/local/docker-compose.yml,
  # which is kept only if it parses as a Kubernetes resource and it does
  # not; and deploy/local/minikube/, which is a subdirectory and is not
  # searched.
  #
  # It also moves only the FROM line. go.mod's `go` directive names the
  # same Go version Dockerfile does, and web/.nvmrc the same Node major
  # as Dockerfile.web, so every bump this proposes arrives half-done and
  # splits the container's toolchain from the repository's declared
  # version unless the other half lands with it. `make check-toolchain`
  # fails on that split (#803); it reads the two pairs and not why they
  # are pairs, which is what this paragraph is for.
  - package-ecosystem: "docker"
    directory: "/deploy/local"
    schedule:
      interval: "weekly"

  # tests/testprincipal/Dockerfile, the test image (ADR-0092), whose
  # build stage takes the golang base deploy/local/Dockerfile does.
  #
  # Covers and does not cover what the entry above states, and its bump
  # arrives half-done the same way: `make check-toolchain` holds this
  # file's tag against go.mod too.
  - package-ecosystem: "docker"
    directory: "/tests/testprincipal"
    schedule:
      interval: "weekly"

  # deploy/local/docker-compose.yml's postgres image, which the entry
  # above does not read.
  #
  # Covers a newer tag, rewriting the tag and the digest together. It
  # runs the docker ecosystem's own update checker, so the two cases
  # that entry does not cover are not covered here either.
  - package-ecosystem: "docker-compose"
    directory: "/deploy/local"
    schedule:
      interval: "weekly"

  # The action pins in .github/workflows/ — ten actions across ci.yml,
  # images.yml and release.yml, one of which all three files use.
  #
  # Covers a newer release for an action pinned by full commit SHA,
  # rewriting the SHA and the trailing version comment together.
  #
  # Does not cover an action referenced by a path rather than by
  # repository, and does not keep a version comment that carries
  # anything besides the version — see the comment in ci.yml.
  #
  # A CVE reaches this ecosystem, unlike docker, but as a security
  # update rather than as an entry here, and the fix it proposes is the
  # tag rather than the commit that tag names. Such a pull request
  # re-pins by tag, which §Verify does not accept, and has to be moved
  # back to the commit before it merges.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # go.mod's requirements, the seven generator pins, the two linter pins
  # and the mutation tester among them.
  #
  # Covers a newer version for every direct requirement, and for each
  # tool-directive module named below. Go marks a tool directive's
  # module `// indirect`, because no package here imports it, and the
  # default rule reaches direct requirements only — so each is named.
  # protoc-gen-go needs no name: it ships in google.golang.org/protobuf,
  # which this module requires directly.
  #
  # Does not cover: every other indirect requirement, including the ones
  # a named tool brings, which move only when that tool's own bump moves
  # them; go.mod's `go` directive, which this ecosystem never edits; and
  # a tool directive added later, which is reached only once its module
  # is named here.
  #
  # It also edits manifests and runs no generator. Bumping a module the
  # tool block names moves the generator itself, so what `make gen`
  # writes can stop matching the committed output and the bump arrives
  # half-done: google.golang.org/protobuf 1.36.11 to 1.36.12 (#682)
  # moved protoc-gen-go's version stamp in two files under proto/gen/,
  # while mockery 3.7.3 to 3.7.4 (#681) moved nothing. The bump itself
  # does not say which of the two it is; `make check-gen` does, and the
  # regenerated output belongs in the same change as the bump.
  #
  # The two linter pins are outside that: actionlint and shfmt write no
  # output this repository commits, so `check-gen` says nothing about a
  # bump of either and what reads it is `make lint` (#840). gremlins is
  # outside it for the same reason, and further outside still: no
  # whole-set name runs it, so what reads a bump of it is `make
  # mutation`, which a person invokes (#875).
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    allow:
      - dependency-type: "direct"
      - dependency-name: "github.com/bufbuild/buf"
      - dependency-name: "github.com/go-gremlins/gremlins"
      - dependency-name: "github.com/oapi-codegen/oapi-codegen/v2"
      - dependency-name: "github.com/rhysd/actionlint"
      - dependency-name: "github.com/sqlc-dev/sqlc"
      - dependency-name: "github.com/vektra/mockery/v3"
      - dependency-name: "golang.org/x/tools"
      - dependency-name: "google.golang.org/grpc/cmd/protoc-gen-go-grpc"
      - dependency-name: "mvdan.cc/sh/v3"
