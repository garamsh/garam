name: ci

# Each action is pinned to a full commit SHA, and the trailing comment is
# the tag that commit carries. Dependabot moves the two together only
# while the comment ends with that version, so a note appended to one
# leaves it naming a version the SHA is not.

# `pull_request` is the only trigger. A push to `main` re-ran what the
# pull request's own run had just read — both read the merge result, and
# six merges on 2026-09-01 produced six such runs at three jobs each — so
# what it alone covered is a `main` that moved between the two. Nothing
# mechanical covers that: AGENTS.md §Roles binds the role that merges to
# cover it, and the mechanical replacement is a required status check
# with "branches must be up to date", a repository setting and so the
# account owner's.

on:
  pull_request:

permissions: read-all

jobs:
  # `make ci` covers both toolchains, so both are set up here and the
  # checks are one step (docs/convention/ci.md §One entry point per
  # task). `make web-install` is setup rather than a check: it pins the
  # install to the lockfile that pnpm would otherwise resolve itself.
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          package-json-file: web/package.json
          install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: make web-install
      - run: make ci

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make db-up e2e

  web-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          package-json-file: web/package.json
          install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: make web-install
      - run: make backend-up
      - run: make web-e2e
