name: ci

# Each action is pinned to a full commit SHA, and the trailing
# comment is the tag that commit carries. Dependabot moves the two
# together only while the comment ends with that version, so a note
# appended to one leaves it naming a version the SHA is not.

# `pull_request` is the only trigger. A push to `main` re-ran what
# the pull request's own run had just read — both read the merge
# result, and six merges on 2026-09-01 produced six such runs at
# three jobs each — so what it alone covered is a `main` that moved
# between the two. Nothing mechanical covers that: AGENTS.md §Roles
# binds the role that merges to cover it, and the mechanical
# replacement is a required status check with "branches must be up
# to date", a repository setting and so the account owner's.

# `dev` is the default branch and every pull request but the
# promotion pull request targets it (`docs/convention/git.md`
# §Promotion). Both are named, so every pull request into either is
# verified on the forge before it lands (#1657). A pull request into
# any other branch starts nothing.

on:
  pull_request:
    branches: [main, dev]

permissions: read-all

# A push that supersedes a head cancels the run reading the old one.
# `pull_request` is the only trigger, so `github.ref` is the pull
# request's merge ref: one value per pull request, unchanged by a push
# to it. `github.workflow` keeps this group apart from images.yml's, a
# group being scoped to the repository.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which modules this change can affect, by the entry point a
  # contributor runs locally (ci.md §One entry point per task):
  # `make affected` prints each module with its reason and hands the
  # jobs below the ones defining each verb. The pull request's merge
  # ref has the base as its first parent, so a depth of two holds the
  # merge base. A promotion into `main` runs every module (git.md
  # §Promotion).
  changes:
    runs-on: ubuntu-24.04
    outputs:
      ci: ${{ steps.affected.outputs.ci }}
      suites: ${{ steps.affected.outputs.suites }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - run: tooling/record-runner-image.sh
      - id: affected
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          AFFECTED_EVERY: ${{ github.base_ref == 'main' && 'a promotion into main runs every module' || '' }}
        run: AFFECTED_OUTPUT="$GITHUB_OUTPUT" make affected BASE="$BASE"

  # Each selected module's fast gate, `make -C <module> ci`. Both
  # toolchains are set up for every module: a Go module's gate can
  # build a web package (cowork's gen bundles cowork/engine), and the
  # setup costs less than a second list of which needs which.
  ci:
    needs: changes
    if: needs.changes.outputs.ci != '[]'
    name: ci (${{ matrix.module }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.changes.outputs.ci) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: tooling/record-runner-image.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: platform/go.mod
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          package-json-file: package.json
          install: false
          node-version-file: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: console/.nvmrc
          # Only a web package installs into the pnpm store; in any
          # other module the store's path never exists, and the
          # post-job save fails the job on it.
          cache: ${{ hashFiles(format('{0}/package.json', matrix.module)) != '' && 'pnpm' || '' }}
          cache-dependency-path: pnpm-lock.yaml
      - env:
          MODULE: ${{ matrix.module }}
        run: make -C "$MODULE" ci

  # Each selected module's suites, against the stack its `stack-up`
  # names: `make -C <module> stack-up suites`.
  suites:
    needs: changes
    if: needs.changes.outputs.suites != '[]'
    name: suites (${{ matrix.module }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.changes.outputs.suites) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: tooling/record-runner-image.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: platform/go.mod
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          package-json-file: package.json
          install: false
          node-version-file: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: console/.nvmrc
          # Only a web package installs into the pnpm store; in any
          # other module the store's path never exists, and the
          # post-job save fails the job on it.
          cache: ${{ hashFiles(format('{0}/package.json', matrix.module)) != '' && 'pnpm' || '' }}
          cache-dependency-path: pnpm-lock.yaml
      # Reuse the server image's layers from the GitHub Actions cache
      # (#1519). The runtime action hands the build the cache's URL and
      # token, which a `run:` step is not given.
      - run: tooling/enable-containerd-image-store.sh
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - env:
          MODULE: ${{ matrix.module }}
          IMAGE_BUILD_CACHE: gha
        run: make -C "$MODULE" stack-up
      - env:
          MODULE: ${{ matrix.module }}
        run: make -C "$MODULE" suites

  # The one check branch protection needs (#1661). It fails when a job
  # above failed or was cancelled, and when one was skipped although
  # `changes` selected modules for it; a job is skipped rightly only
  # when its list is empty. alls-green reads every job's result from
  # `needs`.
  ci-ok:
    if: always()
    needs: [changes, ci, suites]
    runs-on: ubuntu-24.04
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          allowed-skips: ${{ needs.changes.outputs.ci == '[]' && 'ci,' || '' }}${{ needs.changes.outputs.suites == '[]' && 'suites' || '' }}
          jobs: ${{ toJSON(needs) }}
