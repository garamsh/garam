name: ci

# Each action is pinned to a full commit SHA, and the trailing
# comment is the tag that commit carries. Dependabot moves the two
# together only while the comment ends with that version, so a note
# appended to one leaves it naming a version the SHA is not.

# `pull_request` is the only trigger. A push to `main` re-ran what
# the pull request's own run had just read — both read the merge
# result, and six merges on 2026-09-01 produced six such runs at
# three jobs each — so what it alone covered is a `main` that moved
# between the two. Nothing mechanical covers that: AGENTS.md §Roles
# binds the role that merges to cover it, and the mechanical
# replacement is a required status check with "branches must be up
# to date", a repository setting and so the account owner's.

# `dev` is the default branch and every pull request but the
# promotion pull request targets it (`docs/convention/git.md`
# §Promotion), so `branches` selects the promotion pull request and
# no pull request into `dev` starts these three jobs.

on:
  pull_request:
    branches: [main]

permissions: read-all

# A push that supersedes a head cancels the run reading the old one.
# `pull_request` is the only trigger, so `github.ref` is the pull
# request's merge ref: one value per pull request, unchanged by a push
# to it. `github.workflow` keeps this group apart from images.yml's, a
# group being scoped to the repository.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # `make ci` covers both toolchains, so both are set up here and the
  # checks are one step (docs/convention/ci.md §One entry point per
  # task). `make web-install` is setup rather than a check: it pins the
  # install to the lockfile that pnpm would otherwise resolve itself.
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/record-runner-image.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          package-json-file: web/package.json
          install: false
          node-version-file: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: make web-install
      - run: make ci

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/record-runner-image.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make db-up integration e2e

  web-e2e:
    runs-on: ubuntu-24.04
    permissions:
      # A job's block replaces the workflow's read-all, so the
      # checkout's read is restated beside the token the ECR Public
      # login needs.
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/record-runner-image.sh
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          package-json-file: web/package.json
          install: false
          node-version-file: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: make web-install
      # Reuse the server image's layers from the GitHub Actions cache
      # (#1519). The runtime action hands the build the cache's URL and
      # token, which a `run:` step is not given.
      - run: scripts/enable-containerd-image-store.sh
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      # Pull the public.ecr.aws bases as the role
      # GARAM_ECR_PULL_ROLE_ARN names, not under the anonymous data
      # limit a hosted runner's address shares; the layer cache does
      # not avoid that pull (#1519). Unset, both steps are skipped.
      # ECR Public authenticates in us-east-1 only.
      - if: vars.GARAM_ECR_PULL_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.GARAM_ECR_PULL_ROLE_ARN }}
          aws-region: us-east-1
      - if: vars.GARAM_ECR_PULL_ROLE_ARN != ''
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        with:
          registry-type: public
      - run: make backend-up
        env:
          IMAGE_BUILD_CACHE: gha
      - run: make web-e2e
