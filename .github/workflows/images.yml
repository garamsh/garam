name: images

# Action pins take the form ci.yml states.

# A workflow of its own rather than a fourth job in ci.yml: a path
# filter is evaluated per workflow, so a run this one excludes starts no
# runner at all, where a job held back by an `if:` has already started
# one and billed a minute.
#
# `docs/**` is the whole ignore list because it is the only path the
# build itself keeps out of both images: `.dockerignore` names `docs`,
# and the web image's context is `web/`. A wider one would rest on a
# property that holds today rather than one the build enforces, and a
# filter that quietly stops covering a change is what #850 is about.
#
# `dev` is the default branch and every pull request but the
# promotion pull request targets it (`docs/convention/git.md`
# §Promotion), so `branches` selects the promotion pull request and a
# pull request into `dev` starts no runner at all, the property the
# paragraph above buys for `docs/**`.
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"

permissions: read-all

# The concurrency group takes the form ci.yml states. `paths-ignore`
# is read before it, so a push touching only `docs/` starts no run
# here and cancels none — leaving the running one reading image
# content the new head has not changed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # `make ci` proves the Go module and the web app build, which is
  # not that the images do — Next.js standalone output is where the
  # two come apart (#760). This builds both from what release.yml
  # says each is built from, then checks the web one, whose failure
  # during a release is the irreversible half (ADR-0039
  # §Consequences).
  #
  # Neither toolchain is reached except through a Dockerfile, so the
  # runner's own Docker and make are all this needs, with the python3
  # tests/image/web.sh reserves a host port through.
  images:
    runs-on: ubuntu-24.04
    permissions:
      # A job's block replaces the workflow's read-all, so the
      # checkout's read is restated beside the token the ECR Public
      # login below needs.
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/record-runner-image.sh
      # The layer cache ci.yml's web-e2e states, one scope per image.
      - run: scripts/enable-containerd-image-store.sh
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      # The ECR Public login ci.yml's web-e2e states.
      - if: vars.GARAM_ECR_PULL_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.GARAM_ECR_PULL_ROLE_ARN }}
          aws-region: us-east-1
      - if: vars.GARAM_ECR_PULL_ROLE_ARN != ''
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        with:
          registry-type: public
      - run: make web-image-e2e
        env:
          IMAGE_BUILD_CACHE: gha
