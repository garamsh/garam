name: release

# Action pins take the form ci.yml states.

# ADR-0039 fixes this trigger: a merge to `main` publishes nothing, so
# the registry holds released versions and no build residue. It is also
# the only trigger the push role admits — its trust policy matches the
# subject `repo:garamsh@307152666/garam@1307729369:ref:refs/tags/v*`,
# and a run on any other ref gets no credential.
on:
  push:
    tags: ["v*"]

permissions: read-all

# No concurrency group, and the absence is the guard rather than a
# `cancel-in-progress: false` that would read like one. A group cancels
# a pending run of that group when a newer one queues behind it,
# whichever way that key is set, so a `vX.Y.Z` tag could publish
# nothing; and a run cancelled between the two pushes leaves the
# version half-published, which only the next version repairs
# (ADR-0039 §Consequences).

jobs:
  images:
    runs-on: ubuntu-24.04
    permissions:
      # A job's block replaces the workflow's rather than adding to it,
      # so the read the checkout needs is written here beside the
      # federated push credential. This job writes nothing back.
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      registry: ${{ steps.ecr.outputs.registry }}
      server-digest: ${{ steps.push.outputs.server-digest }}
      web-digest: ${{ steps.push.outputs.web-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/record-runner-image.sh

      # ADR-0039: a release is a `vX.Y.Z` git tag and the image tag is
      # that tag without the `v`. The trigger admits every `v*`, and the
      # repositories are IMMUTABLE, so a tag that is not `vX.Y.Z` is
      # refused here rather than published under a name nothing can take
      # back. The tag name reaches the shell through the environment.
      - id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ! printf '%s' "$REF_NAME" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "tag $REF_NAME is not vX.Y.Z: nothing published" >&2
            exit 1
          fi
          echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # The commit the build reads, taken from the checked-out tree
      # rather than from `github.sha`. The two agree on this trigger —
      # a tag push carries the commit the tag names — and what the
      # image records is what was compiled, so it is read from what
      # was compiled. A run reaching here on another ref, or a
      # checkout given one, then records the commit it built rather
      # than the one the event mentioned.
      - id: revision
        run: echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The push role, as `garam-dev-ecr-push`, was assumed once, by
      # `v0.1.0` on 2026-09-01, and it succeeded — so no failure of the
      # step below has been seen, and a successful
      # AssumeRoleWithWebIdentity event does not record the subject
      # presented. Printing the presented subject makes such a failure
      # readable by eye against the pattern quoted at the top of this
      # file. It verifies nothing, it calls no AWS API, and it stands
      # after the version guard so a malformed tag still costs nothing.
      - run: scripts/oidc-subject.sh

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::486152169996:role/github-actions-garam
          aws-region: ap-northeast-2

      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # `load: true` is what leaves anything to push: the builder
      # docker/setup-buildx-action selects takes the `docker-container`
      # driver, whose result stays in a build cache `docker push` cannot
      # reach, and `load` writes each image into the runner's image
      # store. `push: false` defers both pushes to the step below, which
      # pushes neither image unless both were built (ADR-0039
      # §Consequences, scripts/image-push.sh).
      - id: server
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/local/Dockerfile
          platforms: linux/amd64
          provenance: false
          sbom: false
          push: false
          load: true
          # IMAGE_REVISION and IMAGE_VERSION reach
          # org.opencontainers.image.revision and …version through
          # the ARG/LABEL pair each Dockerfile ends with, so a build
          # of the same file outside this workflow records them the
          # same way. What a label carries is what the build claimed
          # rather than a property of the bytes — nothing derives it
          # from the layers. Both values are resolved per run, which
          # is why scripts/image-build.sh names them and passes
          # neither (#1020).
          build-args: |
            IMAGE_REVISION=${{ steps.revision.outputs.revision }}
            IMAGE_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.ecr.outputs.registry }}/garam/garam-server:${{ steps.version.outputs.version }}

      - id: web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: web
          file: deploy/local/Dockerfile.web
          platforms: linux/amd64
          provenance: false
          sbom: false
          push: false
          load: true
          # The `/api/*` rewrite target is baked in, so a published
          # image is bound to one address: the api Service a release
          # named `garam` renders, and no other release name (ADR-0056,
          # taking the choice ADR-0039 left to this workflow).
          # `make chart` reads this value against that render, so the
          # two are compared rather than kept equal by hand, and
          # `deploy/charts/garam/README.md` §Choosing a release name is
          # where a deployment meets what it binds.
          build-args: |
            GARAM_API_URL=http://garam-api:8080
            IMAGE_REVISION=${{ steps.revision.outputs.revision }}
            IMAGE_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.ecr.outputs.registry }}/garam/garam-web:${{ steps.version.outputs.version }}

      # Both images are in the runner's image store and neither
      # repository has been written to yet. Each reference is named
      # again here rather than read off the step that built it: the
      # `tags:` above are also what scripts/image-build.sh parses to
      # build the same two on a pull request (#870), so they stay
      # written out, and a rename reaching one site and not the other
      # fails this step before it pushes anything.
      - id: push
        env:
          SERVER: ${{ steps.ecr.outputs.registry }}/garam/garam-server:${{ steps.version.outputs.version }}
          WEB: ${{ steps.ecr.outputs.registry }}/garam/garam-web:${{ steps.version.outputs.version }}
        run: scripts/image-push.sh "server=$SERVER" "web=$WEB"

  release:
    needs: images
    runs-on: ubuntu-24.04
    permissions:
      # The release is the only thing this workflow writes back.
      contents: write
    steps:
      # Checked out only for scripts/record-runner-image.sh, so the
      # job's write token is kept out of .git/config: nothing here
      # needs git to hold it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/record-runner-image.sh

      # ADR-0039: the release records each image's digest alongside its
      # tag, so a consumer that would rather pin a digest reads one here
      # instead of discovering it.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body: |
            ${{ needs.images.outputs.registry }}/garam/garam-server:${{ needs.images.outputs.version }}
            ${{ needs.images.outputs.server-digest }}

            ${{ needs.images.outputs.registry }}/garam/garam-web:${{ needs.images.outputs.version }}
            ${{ needs.images.outputs.web-digest }}
