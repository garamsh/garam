name: test-image

# Action pins take the form ci.yml states.

# ADR-0092 and ADR-0093: the test image is published on every push to
# `dev`, under the commit's full hash, to an ECR repository of its own
# that no release writes to. A version tag stays the only trigger that
# publishes a release image (ADR-0039); this workflow builds none.
#
# A dispatch pins and publishes nothing: `commit` and `consumer` move
# the tag `pinned-<consumer>` to that commit's image. Nothing here
# deletes an image; the repository's lifecycle policy, held in
# garamsh/infra, is what expires one.
on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      commit:
        description: Full hash of the dev commit whose image is pinned
        required: true
        type: string
      consumer:
        description: The repository pinning it, as in pinned-<consumer>
        required: true
        type: string

permissions: read-all

env:
  # TODO(PM): both values are placeholders until garamsh/infra supplies
  # the repository and the publisher role (#1227).
  # scripts/image-test-target.sh refuses them, so every job stops
  # before it assumes a role or pushes anything.
  TEST_IMAGE_ECR_REPOSITORY: PLACEHOLDER-ecr-repository-from-garamsh-infra
  TEST_IMAGE_PUBLISHER_ROLE: PLACEHOLDER-publisher-role-arn-from-garamsh-infra

# Every job names this repository in its `if:`, so a fork's push to
# `dev` or its dispatch assumes no role.
jobs:
  # No concurrency group: a group cancels a pending run when a newer
  # one queues, and every commit on `dev` is owed its image.
  publish:
    if: github.repository == 'garamsh/garam' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: scripts/image-test-target.sh "$TEST_IMAGE_PUBLISHER_ROLE" "$TEST_IMAGE_ECR_REPOSITORY"

      # The publisher role has never been assumed, so the subject it is
      # refused on is printed first, as release.yml does for its role.
      - run: scripts/oidc-subject.sh

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ env.TEST_IMAGE_PUBLISHER_ROLE }}
          aws-region: ap-northeast-2

      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      # Builds the image under the reference it is pushed as, then
      # checks it; nothing is pushed unless the check passed.
      - env:
          IMAGE_REPOSITORY: ${{ steps.ecr.outputs.registry }}/${{ env.TEST_IMAGE_ECR_REPOSITORY }}
        run: make test-image-e2e TEST_IMAGE_REPOSITORY="$IMAGE_REPOSITORY"

      - env:
          IMAGE_REPOSITORY: ${{ steps.ecr.outputs.registry }}/${{ env.TEST_IMAGE_ECR_REPOSITORY }}
        run: scripts/image-push.sh "test-image=$IMAGE_REPOSITORY:$(git rev-parse HEAD)"

  # A dispatch runs the workflow file of the ref it names, so one from
  # any other branch would run that branch's copy; the publisher role
  # admits `refs/heads/dev` alone as well.
  dispatch:
    if: github.repository == 'garamsh/garam' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: scripts/image-test-target.sh "$TEST_IMAGE_PUBLISHER_ROLE" "$TEST_IMAGE_ECR_REPOSITORY"

      - run: scripts/oidc-subject.sh

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ env.TEST_IMAGE_PUBLISHER_ROLE }}
          aws-region: ap-northeast-2

      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      # Both inputs reach the shell through the environment.
      - env:
          IMAGE_REPOSITORY: ${{ steps.ecr.outputs.registry }}/${{ env.TEST_IMAGE_ECR_REPOSITORY }}
          COMMIT: ${{ inputs.commit }}
          CONSUMER: ${{ inputs.consumer }}
        run: scripts/image-test-pin.sh "$IMAGE_REPOSITORY" "$COMMIT" "$CONSUMER"
