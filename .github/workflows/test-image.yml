name: test-image

# Action pins take the form ci.yml states.

# ADR-0092: the test image is published on every push to `dev`, under
# the commit's full hash, to a GHCR package of its own that no release
# writes to. A version tag stays the only trigger that publishes a
# release image (ADR-0039); this workflow builds none.
#
# A dispatch pins or previews, and publishes nothing: `commit` and
# `consumer` move the tag `pinned-<consumer>` to that commit's image,
# which the prune never deletes, and `dry-run` prints what a prune
# would delete.
on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      commit:
        description: Full hash of the dev commit whose image is pinned
        required: false
        type: string
      consumer:
        description: The repository pinning it, as in pinned-<consumer>
        required: false
        type: string
      dry-run:
        description: Print what a prune would delete, and delete nothing
        required: false
        type: boolean
        default: false

permissions: read-all

env:
  IMAGE_REPOSITORY: ghcr.io/garamsh/garam-test

# Every job names this repository in its `if:`, so a fork's push to
# `dev` or its dispatch builds and deletes nothing.
jobs:
  # No concurrency group: a group cancels a pending run when a newer
  # one queues, and every commit on `dev` is owed its image.
  publish:
    if: github.repository == 'garamsh/garam' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Builds the image under the reference it is pushed as, then
      # checks it; nothing is pushed unless the check passed.
      - run: make test-image-e2e TEST_IMAGE_REPOSITORY="$IMAGE_REPOSITORY"

      - run: scripts/image-push.sh "test-image=$IMAGE_REPOSITORY:$(git rev-parse HEAD)"

  # The prune and the pin share a group, so a pin cannot land on a
  # version a prune has already listed for deletion. A pending prune
  # replaced by a newer one loses nothing; the newer one does the same.
  prune:
    needs: publish
    if: github.repository == 'garamsh/garam'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    concurrency:
      group: test-image-retention
      cancel-in-progress: false
    steps:
      # `exclude-tags` is applied before `keep-n-tagged`, so this keeps
      # the 8 newest unpinned versions and every pinned one (ADR-0092).
      # scripts/image-test-workflow-test.sh holds both values.
      - uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          package: garam-test
          keep-n-tagged: 8
          exclude-tags: pinned-*

  # A dispatch runs the workflow file of the ref it names, so one from
  # any other branch would run that branch's copy with packages: write.
  dispatch:
    if: github.repository == 'garamsh/garam' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: test-image-retention
      cancel-in-progress: false
    steps:
      - if: inputs.commit != '' || inputs.consumer != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - if: inputs.commit != '' || inputs.consumer != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Both inputs reach the shell through the environment.
      - if: inputs.commit != '' || inputs.consumer != ''
        env:
          COMMIT: ${{ inputs.commit }}
          CONSUMER: ${{ inputs.consumer }}
        run: scripts/image-test-pin.sh "$IMAGE_REPOSITORY" "$COMMIT" "$CONSUMER"

      - if: inputs.dry-run
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          package: garam-test
          keep-n-tagged: 8
          exclude-tags: pinned-*
          dry-run: true
