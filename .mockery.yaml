all: false
template: testify
formatter: goimports
log-level: info
dir: "{{.InterfaceDir}}/mocks"
filename: "{{.InterfaceName | firstLower}}_test.go"
pkgname: "{{.SrcPackageName}}_test"
structname: "Mock{{.InterfaceName}}"
packages:
  github.com/garamsh/gaon/internal/org:
    interfaces:
      Store: {}
  github.com/garamsh/gaon/internal/user:
    interfaces:
      Store: {}
  github.com/garamsh/gaon/internal/agent:
    interfaces:
      Store: {}
  github.com/garamsh/gaon/internal/api:
    interfaces:
      Evaluator:
        config:
          # Imported by internal/api's tests, so it must build as a
          # regular package; test-only files cannot be imported.
          filename: "evaluator.go"
          pkgname: "mocks"
