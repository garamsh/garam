all: false
template: testify
formatter: goimports
log-level: info
dir: "{{.InterfaceDir}}/mocks"
# Mocks live in importable packages: Go cannot import a package made
# only of _test.go files.
filename: "{{.InterfaceName | firstLower}}.go"
pkgname: "mocks"
structname: "Mock{{.InterfaceName}}"
packages:
  github.com/garamsh/gaon/internal/org:
    interfaces:
      Store: {}
  github.com/garamsh/gaon/internal/user:
    interfaces:
      Store: {}
  github.com/garamsh/gaon/internal/agent:
    interfaces:
      Store: {}
  github.com/garamsh/gaon/internal/api:
    interfaces:
      Evaluator: {}
  github.com/garamsh/gaon/internal/authz:
    interfaces:
      Store: {}
