# yaml-language-server: $schema=https://raw.githubusercontent.com/oapi-codegen/oapi-codegen/HEAD/configuration-schema.json
# The CLI's client of the browser API (ADR-0120). Its types are
# server.gen.go's, so this config generates the client alone, for every
# operation: internal/cli/cligen derives a command for each that
# internal/cli/commands.yaml does not exclude (ADR-0122).
package: api
output: api/client.gen.go
generate:
  client: true
output-options:
  skip-prune: true
