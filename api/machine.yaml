openapi: 3.1.0
info:
  title: garam machine API
  version: 0.1.0
  description: >-
    What `garam serve machine` serves (ADR-0017). A caller is a client
    certificate whose SAN URI holds its GRN (ADR-0014, ADR-0015): no
    session cookie and no user row exist on this listener, a caller
    presents no membership and none is looked up to admit it, and the
    organization segment of that GRN is the whole of the tenancy it
    carries. This is a different listener from the one
    `api/openapi.yaml` describes and shares nothing with it.

    One operation is reached without a certificate, because it is how a
    caller obtains its first one: `enrollOperator` carries
    `security: []` and is authenticated by the one-time token the
    console minted (ADR-0064). Every other operation requires the
    certificate, and which is which is read from this file rather than
    remembered. An enrolling caller still verifies garam against the
    garam server root, which it holds before it calls: the listener
    presents that root's leaf to everyone (ADR-0040), and a caller that
    does not check it is talking to whoever answered.

    An operation's `responses` list is what it answers when garam is
    working, and is not the complete set of statuses it can return. No
    operation declares a 5xx, because a 5xx belongs to the listener
    rather than to a route (ADR-0050): every operation can answer
    `500`, and one that reaches the policy engine or the database
    answers `503` when that dependency is unreachable. Both carry the
    `Error` schema with `message` set to `internal error` — a 5xx names
    no cause, and what a caller does next is on the status line. `501`
    and `504` are in garam's kind mapping and nothing produces them.

    `version` above is required by OpenAPI and promises nothing
    (ADR-0049). garam publishes no release of this contract and no
    compatibility window, and the number does not move when this
    surface changes: do not read stability, a deprecation notice or a
    breaking change out of it. The tag garam publishes its images under
    names a build and not this document (ADR-0039).
tags:
  - name: identity
    description: >-
      The identity a connection authenticated as, and the certificate
      it authenticated with. An operator obtains its first certificate
      here by enrolling with a one-time token (ADR-0064), and replaces
      that certificate here while it still holds it (ADR-0046). Both
      routes leave the private key where it was generated: the renewal
      generates it inside the answer and returns it once, and the
      enrollment never has it, because the operator made it in its own
      cluster and sent only the request over it.
  - name: agent
    description: >-
      The agents an operator creates and holds, and what the two
      parties report about them. What an operator may obtain is exactly
      the agents assigned to it at the current epoch (ADR-0015), and
      what it may report about is bounded the same way. An agent
      reaches two routes of its own here: it renews its own certificate
      over the connection that certificate authenticated (ADR-0040),
      and it reports its own runtime state. Provisioning state and
      runtime state are separate facts reported by different parties,
      and each report is accepted only at the assignment's current
      epoch (ADR-0012).
  - name: definition
    description: >-
      What an organization says its agents should be, read by the
      operator each definition names (ADR-0026). An operator polls its
      definitions and claims one, which binds it to the agent GRN the
      definition minted and admits it to that agent's certificate route
      (ADR-0033).
  - name: message
    description: >-
      The queue a message reaches an agent through (ADR-0013). A caller
      posts inside its own organization to the recipients its policies
      reach (ADR-0024), and outside it only where both organizations
      consent (ADR-0035). It acts on messages for the agent it
      authenticates as and no other, and it reads back the state of the
      messages it sent and of no others (ADR-0055). garam announces
      none of that: a sender that wants to know asks.
  - name: authority
    description: >-
      What a hosted operator reads back about the operations members
      hand it under its delegation (ADR-0078), and the proof of a
      controller's current authority it obtains before each lifecycle
      decision, each decided from current state when it is asked.
  - name: execution
    description: >-
      Which process of an agent may act, and with which credentials
      (ADR-0078). The hosted Operator control service activates a
      runtime generation, deactivates it, recovers a lost credential
      lineage and asks whether a certificate and a generation are
      current; an agent's own certificate can do none of it. Once an
      agent is activated, its own protected calls carry the token the
      activation issued, and every one of them is admitted against the
      current activation and lineage when it writes, on a connection
      already open too (ADR-0080).
  - name: watch
    description: >-
      What an agent is saying now, on its way to the people watching it
      (ADR-0022). A caller forwards it while the watcher count on its
      claim says someone is there, and forwards nothing otherwise:
      garam keeps none of it, so an agent nobody watches costs nothing
      here.
security:
  - machineCertificate: []
paths:
  /identity:
    get:
      operationId: getIdentity
      tags: [identity]
      summary: Return the identity the connection authenticated as.
      responses:
        '200':
          description: The caller's identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
        '401':
          $ref: '#/components/responses/Error'
  /identity/certificate:
    post:
      operationId: renewIdentityCertificate
      tags: [identity]
      summary: Renew the certificate the connection authenticated with.
      description: >-
        The successor to the certificate the caller is presenting, for
        an operator renewing its own (ADR-0046). The route names no
        subject: what is replaced is what the connection authenticated
        with, so there is no other identity to ask for and nothing to
        authorize beyond the handshake. An agent is refused here — its
        certificate is admitted by the claim its operator made and
        renewed on the route that admits it (ADR-0040).

        Three things refuse a renewal. A certificate that has expired
        never reaches this route, because it authenticates nothing and
        the request carries no identity: an expired operator has no
        certificate left to renew from, and what follows is a token to
        enrol with (ADR-0064) or a mint out of band (ADR-0032). A
        certificate with more than a third of its validity still to run
        is refused as too early, under `failed_precondition`, and the
        caller asks again closer to expiry. A certificate garam has
        already replaced is refused as superseded, under
        `already_exists`: either an answer this caller never received
        took the lineage, or another holder of the same identity did,
        and only a mint out of band recovers from it. garam has no
        revocation, and that refusal is what keeps a renewable
        certificate from being a permanent one.

        Each call signs a new certificate and generates the private key
        it returns once, so it is a POST rather than a GET.
      responses:
        '201':
          description: Certificate issued. The one presented is now superseded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineCertificate'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /enrollment:
    post:
      operationId: enrollOperator
      tags: [identity]
      summary: Obtain an operator's first certificate with an enrollment token.
      description: >-
        Signs the certificate signing request for the operator the
        token names, and spends the token (ADR-0064). This is the one
        operation on this listener that requires no client certificate,
        because it is what a caller with no certificate calls; what
        authenticates it is the token, which a signed-in member of the
        organization minted by registering the operator.

        **The token is permission to ask for one certificate, once.** It
        is not a credential to the operator's identity: it authenticates
        no other operation here, it is spent by the first call that
        presents it whether or not that call goes on to succeed, and it
        stops being spendable ten minutes after it was minted. A token
        that is refused is a token to register again for, not one to
        retry with.

        **What the certificate names is the token's to say and never the
        request's.** Nothing in the certificate signing request is read
        but the public key it carries and the signature proving the
        sender holds the private half: a subject name, a SAN or an
        extension request in it is discarded. So a token cannot be
        turned into a certificate for any identity but the operator it
        was minted for, whatever the request asks for.

        The answer carries no private key, because garam never had one.
        The operator generated the key pair where the certificate will
        be used, and what crossed the wire was a public key and a
        signature over it. A caller that loses the key it generated
        registers again rather than recovering.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Enrollment'
      responses:
        '201':
          description: Certificate signed. The token is spent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrolledCertificate'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
  /agents:
    post:
      operationId: createAgent
      tags: [agent]
      summary: Create an agent and assign it to the calling operator.
      description: >-
        garam mints the agent's GRN in the calling operator's
        organization (ADR-0012) and assigns the agent to that operator.
        There is no request body: the organization and the operator are
        what the certificate names. A caller that is not an operator is
        refused.

        The agent it mints has no definition. This route keeps minting
        for agents no definition describes (ADR-0033) and writes none
        itself, so the agent is assigned to the caller and absent from
        every `listDefinitions` answer, which answers definitions
        rather than assignments. It is an ordinary assigned agent
        otherwise: `issueAgentCertificate` answers for it on the
        assignment alone. An operator that constructs the agents its
        definitions name therefore never constructs this one.
      responses:
        '201':
          description: Agent created and assigned to the calling operator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentAssignment'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /agents/{agent}/certificate:
    post:
      operationId: issueAgentCertificate
      tags: [agent]
      security:
        - machineCertificate: []
          executionToken: []
        - machineCertificate: []
      summary: Issue the certificate an agent authenticates with.
      description: >-
        Answers for an agent assigned to the calling operator at the
        current epoch, and for the agent itself renewing over the
        connection its current certificate authenticated (ADR-0040).

        Once an agent's execution has been activated, its operator is
        refused here with 409: its certificates come from its own
        renewal or from `recoverAgentCredential` (ADR-0078). The agent's
        own renewal then presents its execution token and is admitted
        against the current activation and credential lineage, which
        the new certificate joins; the certificate it renews stays
        valid until it expires, so no restart is needed. A missing
        token is 401, one that is not current 403, and a certificate
        that is not current 409.
        Every other caller is refused, which is the whole of the
        authorization here (ADR-0015). A renewal grants nothing: the
        caller already holds that identity, and an expired certificate
        has no connection left to renew over. Each call signs a new
        certificate and generates the private key it returns once, so
        it is a POST rather than a GET.

        The assignment is the whole of the precondition as well. There
        is no renewal window and no lineage here: a caller the
        assignment admits may ask at any time and as often as it needs,
        and a certificate this route has already replaced asks again
        successfully. Contrast `renewIdentityCertificate`, which
        replaces the caller's own certificate and holds both bounds.
        The durable step is therefore storing what comes back rather
        than making the call, and a store that fails is answered by
        asking for another certificate rather than by retrying the
        store.
      parameters:
        - $ref: '#/components/parameters/agent'
      responses:
        '201':
          description: Certificate issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineCertificate'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /agents/{agent}/provisioning-state:
    post:
      operationId: reportProvisioningState
      tags: [agent]
      summary: Report what the operator sees of an agent's pod.
      description: >-
        What the calling operator says about the agent it provisioned
        outside garam (ADR-0012). garam learns this from the operator
        and from nowhere else: it dials no cluster and reads no pod, so
        an agent nobody reports on stays at `pending` and cannot be
        told from one that never started.

        The report carries the epoch the operator holds the agent at,
        and garam accepts it only at the epoch the assignment is
        currently on. A stale one is refused under
        `failed_precondition`, which is what stops the pod a replaced
        operator left running from writing over its successor's report;
        an agent with no assignment has no current epoch, so every
        report about it is stale. The epoch to send is the one
        `createAgent` or `claimDefinition` answered with.

        An operator the agent is not assigned to is refused, and an
        agent that does not exist is refused the same way, so a caller
        learns nothing about the agents it does not hold. This route
        never moves the runtime state: that is the agent's own fact and
        `reportRuntimeState` is where it is reported.

        garam keeps the last report and nothing before it. It expires
        none of them either, so a state stands until it is reported
        again — a report is evidence of what the operator saw, never
        evidence that the operator is still there.
      parameters:
        - $ref: '#/components/parameters/agent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProvisioningStateReport'
      responses:
        '204':
          description: Recorded. garam has nothing to answer with.
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /agents/{agent}/runtime-state:
    post:
      operationId: reportRuntimeState
      tags: [agent]
      security:
        - machineCertificate: []
          executionToken: []
        - machineCertificate: []
      summary: Report what an agent says about itself.
      description: >-
        The agent's own account of whether it is running (ADR-0012).
        The caller reports for the agent it authenticates as and is
        refused every other one, as it is on its own queue and its own
        turn events.

        The report carries the epoch, and garam accepts it only at the
        epoch the agent's assignment is currently on; a stale one is
        refused under `failed_precondition`. The agent is told its
        epoch by the operator that constructed it — garam answers the
        operator with it on `createAgent` and `claimDefinition` and
        serves it to the agent nowhere.

        This route never moves the provisioning state: that is what the
        operator sees of the pod, and `reportProvisioningState` is
        where it is reported. The two facts are kept apart and neither
        substitutes for the other.

        garam keeps the last report and expires none, so an agent that
        stops reporting stays in the state it last claimed. Silence is
        not `disconnected`, and nothing here turns one into the other.

        An agent whose execution has been activated presents its
        execution token here, and the call is admitted against the
        current activation and credential lineage in the transaction
        of its own write: after a replacement, a reassignment, a
        recovery or the certificate's expiry it is refused, on a
        connection already open too (ADR-0080). A missing token is
        401, one that is not current 403, and a certificate that is
        not current, or a token presented for an agent never
        activated, 409.
      parameters:
        - $ref: '#/components/parameters/agent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeStateReport'
      responses:
        '204':
          description: Recorded. garam has nothing to answer with.
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /definitions:
    get:
      operationId: listDefinitions
      tags: [definition]
      summary: List the definitions naming the calling operator.
      description: >-
        The agents the organization says this operator should run
        (ADR-0026): the agent GRN each definition minted, the values the
        operator constructs it from, and whether it is claimed. The
        answer is scoped by the definition's operator field, so it names
        nothing the caller is not named in and no policy check stands in
        front of it (ADR-0033). A caller that is not an operator is
        refused.

        This answers definitions, not assignments. An agent assigned to
        the calling operator that no definition describes is absent
        from it, and `createAgent` mints exactly that: it assigns the
        agent it creates and writes no definition (ADR-0033). Such an
        agent hands over a certificate on request and appears in no
        answer here, so a loop that constructs the agents this route
        names constructs a subset of the agents assigned to the caller.
        Nothing reports the difference, and this listener answers no
        list of assignments to compare against.

        A claim here is not evidence of holding. What the claim field
        reports is the agent's assignment as it stands now, while the
        definition carrying it names its operator once and is never
        rewritten — so the two come apart as soon as the agent is
        assigned elsewhere, and the definition stays listed, stays
        claimed, and carries the epoch of whoever holds the agent by
        then. The certificate route is the only place that epoch is
        met: it is where an operator the assignment no longer names is
        refused, under `permission_denied`, and nothing before it
        refuses one.
      responses:
        '200':
          description: The caller's definitions, ordered by agent GRN.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Definition'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /definitions/{agent}/claim:
    post:
      operationId: claimDefinition
      tags: [definition]
      summary: Claim the agent a definition minted for the calling operator.
      description: >-
        Binds the calling operator to the definition's agent GRN: the
        assignment is written at its first epoch, and it is what admits
        the operator to that agent's certificate route — which refuses
        the GRN as unassigned until then, exactly as before (ADR-0033).
        A definition is claimed once: a second claim of the same agent
        GRN is a conflict, never an override. A definition that names
        another operator answers as one that does not exist, because the
        claim inherits the read's scoping.
      parameters:
        - $ref: '#/components/parameters/agent'
      responses:
        '201':
          description: The agent is assigned to the calling operator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentAssignment'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /messages:
    post:
      operationId: postMessage
      tags: [message]
      security:
        - machineCertificate: []
          executionToken: []
        - machineCertificate: []
      summary: Post a message to a recipient.
      description: >-
        The sender is what the certificate names, so the body carries
        the recipient and nothing about who is sending. garam answers
        once the message is durably stored and does not check that the
        recipient exists: rejecting a message it cannot route would
        destroy it and tell the sender nothing, so a routing failure
        comes back later as an ordinary message instead (ADR-0013).
        The sender's idempotency key is what makes a retry store one
        message rather than two.

        Which recipients a sender may reach is two questions, and they
        are refused two different ways.

        Inside the sender's own organization, policy decides
        (ADR-0024): it reaches every recipient unless a policy attached
        to it says otherwise. A recipient a policy refuses is a 403 and
        nothing is stored, because garam could have routed the message
        and the organization said not to, so storing it would deliver
        what was refused.

        Across the organization boundary the precondition is a consent
        relation both organizations hold, which no policy reaches past
        (ADR-0035). Where that relation does not stand garam cannot
        route the message, so the post is stored and answered 201 like
        any other: what is stored is the refusal, addressed back to the
        sender as an ordinary inbound message whose sender is the
        recipient that could not be reached and whose body names the
        two organizations that do not both consent (ADR-0013). The 201
        carries that refusal rather than the message submitted, which
        is how a caller tells the two apart, and its idempotency key
        derives from the sender's so a retried post is answered with
        the one refusal already stored.

        An agent whose execution has been activated presents its
        execution token here, and the call is admitted against the
        current activation and credential lineage in the transaction
        of its own write: after a replacement, a reassignment, a
        recovery or the certificate's expiry it is refused, on a
        connection already open too (ADR-0080). A missing token is
        401, one that is not current 403, and a certificate that is
        not current, or a token presented for an agent never
        activated, 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageSubmission'
      responses:
        '201':
          description: Message stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /messages/{message}:
    get:
      operationId: getMessageStatus
      tags: [message]
      security:
        - machineCertificate: []
          executionToken: []
        - machineCertificate: []
      summary: Read how far a message the caller sent has got.
      description: >-
        What garam knows about the message and the sender does not: the
        state it is in, how many attempts it has spent, and when garam
        stored it (ADR-0055). The recipient, the key and the body were
        the sender's own submission and are not answered back.

        The caller reads the messages it sent and no others. A message
        another identity sent, one that never existed, and one the
        thirty-day sweep has deleted are all `404`: nothing about the
        queue outside the caller's own messages is learnable by asking.
        That makes the answer to an expired message its absence rather
        than a state — a sender holding the `201` knows the message was
        stored, and the sweep is the only thing that removes a stored
        one (ADR-0034).

        There is no state meaning expired for the same reason: a
        message past the retention window that the sweep has not
        reached yet is still handed to a reader, so calling it expired
        would name something the queue does not do. `createdAt` is what
        a sender measures the window against.

        The body is never answered. A completed message no longer has
        one (ADR-0034), so a field carrying it would be present in some
        states and absent in others, and its absence would mean two
        things.

        garam reports none of this on its own. A post refused across an
        organization boundary is answered with the refusal message
        rather than the one submitted (see `postMessage`), and that
        refusal's sender is not the caller — so its identifier is not
        one this route answers, and there is nothing to track: the
        refusal arrives on the caller's own queue.

        An agent whose execution has been activated presents its
        execution token here, and the call is admitted against the
        current activation and credential lineage in the transaction
        of its own write: after a replacement, a reassignment, a
        recovery or the certificate's expiry it is refused, on a
        connection already open too (ADR-0080). A missing token is
        401, one that is not current 403, and a certificate that is
        not current, or a token presented for an agent never
        activated, 409.
      parameters:
        - $ref: '#/components/parameters/message'
      responses:
        '200':
          description: How far the message has got.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageStatus'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /agents/{agent}/claims:
    post:
      operationId: claimMessage
      tags: [message]
      security:
        - machineCertificate: []
          executionToken: []
        - machineCertificate: []
      summary: Claim the next message addressed to an agent.
      description: >-
        A long poll: the call waits for a message rather than answering
        an empty queue at once, and answers 204 when none arrives in
        that time. The caller claims for the agent it authenticates as
        and is refused every other one. Exactly one caller holds a
        given message, under a lease that garam measures; a claim
        nobody completes lapses and the message is handed on, up to a
        bounded number of attempts (ADR-0018).

        An agent whose execution has been activated presents its
        execution token here, and the call is admitted against the
        current activation and credential lineage in the transaction
        of its own write: after a replacement, a reassignment, a
        recovery or the certificate's expiry it is refused, on a
        connection already open too (ADR-0080). A missing token is
        401, one that is not current 403, and a certificate that is
        not current, or a token presented for an agent never
        activated, 409.
      parameters:
        - $ref: '#/components/parameters/agent'
      responses:
        '200':
          description: A message, and the hold the caller now has on it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
        '204':
          description: Nothing was ready before the wait ran out. Ask again.
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /agents/{agent}/claims/{claim}/renewal:
    post:
      operationId: renewClaim
      tags: [message]
      security:
        - machineCertificate: []
          executionToken: []
        - machineCertificate: []
      summary: Extend a claim while the message is still being worked on.
      description: >-
        Renewal is what keeps a long turn from losing its claim
        mid-flight. It carries the hold no further than a ceiling
        measured from when the claim was taken, and a renewal reaching
        past that ceiling is held at it: the ceiling is the backstop
        for a completion that never arrives, so it is not renewable
        away (ADR-0018). A claim already lapsed, handed on, or
        completed is refused.

        An agent whose execution has been activated presents its
        execution token here, and the call is admitted against the
        current activation and credential lineage in the transaction
        of its own write: after a replacement, a reassignment, a
        recovery or the certificate's expiry it is refused, on a
        connection already open too (ADR-0080). A missing token is
        401, one that is not current 403, and a certificate that is
        not current, or a token presented for an agent never
        activated, 409.
      parameters:
        - $ref: '#/components/parameters/agent'
        - $ref: '#/components/parameters/claim'
      responses:
        '200':
          description: The hold as it now stands.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /agents/{agent}/turn-events:
    post:
      operationId: forwardTurnEvent
      tags: [watch]
      security:
        - machineCertificate: []
          executionToken: []
        - machineCertificate: []
      summary: Forward one turn event to whoever is watching the agent.
      description: >-
        What the agent is saying now, on its way to the browsers
        watching it. The caller forwards for the agent it authenticates
        as and is refused every other one.

        Nothing is stored and nobody acknowledges. garam announces the
        event to the process holding each stream, and an event arriving
        while nobody watches reaches no one — so a success here says the
        event was announced and never that a person saw it (ADR-0022).
        The watcher count on `claimMessage` and `renewClaim` is what
        says whether to forward at all, and forwarding to an agent
        nobody watches is the cost that decision exists to avoid.

        An event larger than one announcement carries is refused rather
        than shortened: a shortened turn would put words in the agent's
        mouth, where a refused event is the gap this stream already
        permits.

        An agent whose execution has been activated presents its
        execution token here, and the call is admitted against the
        current activation and credential lineage in the transaction
        of its own write: after a replacement, a reassignment, a
        recovery or the certificate's expiry it is refused, on a
        connection already open too (ADR-0080). A missing token is
        401, one that is not current 403, and a certificate that is
        not current, or a token presented for an agent never
        activated, 409.

        An event admitted before a replacement is announced before that
        replacement commits; when a watcher receives it is not part of
        that order.
      parameters:
        - $ref: '#/components/parameters/agent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TurnEvent'
      responses:
        '202':
          description: >-
            Announced. Nothing is stored, so this is not evidence that
            a watcher received it.
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /agents/{agent}/claims/{claim}/completion:
    post:
      operationId: completeClaim
      tags: [message]
      security:
        - machineCertificate: []
          executionToken: []
        - machineCertificate: []
      summary: Report the claimed message delivered.
      description: >-
        Completion is fenced by the claim rather than by the message,
        so a caller whose lease was handed on completes nothing.
        Completing twice reports the same delivery, because a caller
        that could not read the answer retries.

        An agent whose execution has been activated presents its
        execution token here, and the call is admitted against the
        current activation and credential lineage in the transaction
        of its own write: after a replacement, a reassignment, a
        recovery or the certificate's expiry it is refused, on a
        connection already open too (ADR-0080). A missing token is
        401, one that is not current 403, and a certificate that is
        not current, or a token presented for an agent never
        activated, 409.
      parameters:
        - $ref: '#/components/parameters/agent'
        - $ref: '#/components/parameters/claim'
      responses:
        '204':
          description: The message is delivered and is not handed out again.
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /operation-authorities/introspection:
    post:
      operationId: introspectOperationAuthority
      tags: [authority]
      summary: Read what an operation authority binds, once current state still authorizes it.
      description: >-
        The calling operator must be the authority's audience. Unknown,
        expired, and another audience's authority are one 404. A known
        operation that current membership, roles, groups, persisted
        policies, the grant, the bound controller's registration or a
        configuration change's placement no longer authorizes is 403,
        and one garam cannot decide from current state is 503. Nothing
        is consumed: a retry introspects again. Check `bodySha256`
        against the exact body received, and introspect before
        revealing any stored result for `requestId`.
      parameters:
        - $ref: '#/components/parameters/contractVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorityIntrospection'
      responses:
        '200':
          description: The authority's binding.
          headers:
            Garam-Contract-Version:
              $ref: '#/components/headers/ContractVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationBinding'
        '400':
          $ref: '#/components/responses/ContractError'
        '401':
          $ref: '#/components/responses/ContractError'
        '403':
          $ref: '#/components/responses/ContractError'
        '404':
          $ref: '#/components/responses/ContractError'
  /operation-references/{ref}:
    get:
      operationId: checkOperationReference
      tags: [authority]
      summary: Recheck a durable operation reference before activating a new desired revision.
      description: >-
        Decides the reference as introspection decides an authority,
        without the short token's expiry. It is not a restart
        capability: restarting a revision already applied uses the
        lifecycle authority (ADR-0078). The answer carries no
        `expiresAt`.
      parameters:
        - $ref: '#/components/parameters/contractVersion'
        - $ref: '#/components/parameters/ref'
      responses:
        '200':
          description: The reference's binding, currently authorized.
          headers:
            Garam-Contract-Version:
              $ref: '#/components/headers/ContractVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationBinding'
        '400':
          $ref: '#/components/responses/ContractError'
        '401':
          $ref: '#/components/responses/ContractError'
        '403':
          $ref: '#/components/responses/ContractError'
        '404':
          $ref: '#/components/responses/ContractError'
  /operators/{controller}/introspection:
    post:
      operationId: introspectController
      tags: [authority]
      summary: Prove a controller's current authority, and an agent's placement on it, for one decision.
      description: >-
        The calling operator is the hosted control audience and forwards
        the controller's leaf certificate exactly as that controller
        presented it in its own TLS handshake; garam verifies the
        certificate and never a forwarded GRN. The answer is a positive
        proof, and 200 is returned only when every check passes, each
        read on this request: the caller's own certificate is still
        within its validity and its registration is still held; the
        forwarded certificate names `controller` in its SAN, chains to
        the organization's authority, is within its validity, and the
        controller is still registered; the caller's current grant
        covers `agent:activate` for that controller; and current policy
        for the caller and its current groups, beside an Allow of
        `agent:activate` on the organization (or, with `agent`, on that
        agent) that the grant contributes, does not deny it. With
        `agent`, the agent must currently be assigned to `controller`,
        and the answer carries that assignment's epoch, which the caller
        compares with the epoch it expects. A session admitted without
        an agent is not permission to release any agent's desired
        content, status or placement: obtain the agent-bound proof
        before each such decision, again after a long wait, and never
        reuse one across decisions. Malformed input is 400; a
        certificate that does not prove `controller` is 422; a
        controller or agent that is unknown, of another organization,
        or no longer registered is 404; any other current-authority
        refusal — a certificate outside its validity, the caller's
        withdrawn registration, an ended or out-of-scope grant, a Deny,
        or an agent assigned elsewhere — is 403; and authority garam
        cannot read as current is 503. This proves current authority as
        of its reads and is not a transaction with the caller's store.
      parameters:
        - $ref: '#/components/parameters/contractVersion'
        - $ref: '#/components/parameters/controller'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControllerIntrospection'
      responses:
        '200':
          description: The proof.
          headers:
            Garam-Contract-Version:
              $ref: '#/components/headers/ContractVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControllerProof'
        '400':
          $ref: '#/components/responses/ContractError'
        '401':
          $ref: '#/components/responses/ContractError'
        '403':
          $ref: '#/components/responses/ContractError'
        '404':
          $ref: '#/components/responses/ContractError'
        '422':
          $ref: '#/components/responses/ContractError'
  /agents/{agent}/activations:
    post:
      operationId: activateAgent
      tags: [execution]
      summary: Admit a runtime generation of an agent, and issue the token its calls carry.
      description: >-
        The caller is the hosted Operator control service, which has
        proven the placement and that the previous writer stopped
        before it calls. Per request, garam reads the caller's
        registration, its current grant, which must cover
        `agent:activate` for the agent's current assignee, and current
        policy on the agent, where an explicit Deny wins. It verifies
        `certificatePem`, the agent's leaf as the caller received it,
        against the agent's organization authority. Then, under the
        agent's execution lock, it rechecks the assignment, the
        epoch, the grant's expiry, and whether that certificate is
        current: inside its validity and in the agent's credential
        lineage. An agent's own certificate cannot activate.


        `replacesActivationId` names the agent's most recent
        activation, current or ended, and is null only before the
        first. Another value is 409, so a stale placement's replay never
        wins, and a generation already activated in the current lineage
        is 409 too. The first activation is the agent's cutover, after
        which every call offering `executionToken` requires the token.


        `operationRef` is null for the revision the runtime last
        reported as effective, and is a durable `agent:configure`
        reference for a pending revision. garam rechecks that reference
        as current and requires it to bind this caller, this agent and
        its current assignment. Whether one is needed is the caller's to
        decide: garam keeps no revision. An `agent:create` reference is
        422.


        The same `requestId` with the same request answers the same
        activation with 200, a new token and a higher `tokenVersion`;
        only the last token issued is admitted, so keep the highest
        version. The same `requestId` with another request, or for an
        activation that has ended, is 409.
      parameters:
        - $ref: '#/components/parameters/executionContractVersion'
        - $ref: '#/components/parameters/agent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivationRequest'
      responses:
        '200':
          description: The activation a retry already made, with a new token.
          headers:
            Garam-Contract-Version:
              $ref: '#/components/headers/ExecutionContractVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activation'
        '201':
          description: The activation.
          headers:
            Garam-Contract-Version:
              $ref: '#/components/headers/ExecutionContractVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activation'
        '400':
          $ref: '#/components/responses/ExecutionContractError'
        '401':
          $ref: '#/components/responses/ExecutionContractError'
        '403':
          $ref: '#/components/responses/ExecutionContractError'
        '404':
          $ref: '#/components/responses/ExecutionContractError'
        '409':
          $ref: '#/components/responses/ExecutionContractError'
        '422':
          $ref: '#/components/responses/ExecutionContractError'
  /agents/{agent}/activations/{activation}/deactivation:
    post:
      operationId: deactivateAgent
      tags: [execution]
      summary: End an activation of an agent, if it is still the current one.
      description: >-
        Authorized as `activateAgent` is, on every call. Ending the
        current activation refuses its token from the next call on, on
        a connection already open too. An activation that already ended
        is answered the same and nothing changes, so a replayed request
        never reaches its successor. Deactivation never moves the anchor
        `replacesActivationId` names: the next activation names the
        agent's most recent activation, which is this one only if
        nothing replaced it. This fences collaboration only: it does not
        stop the runtime's writer.
      parameters:
        - $ref: '#/components/parameters/executionContractVersion'
        - $ref: '#/components/parameters/agent'
        - $ref: '#/components/parameters/activation'
      responses:
        '200':
          description: The activation is not current.
          headers:
            Garam-Contract-Version:
              $ref: '#/components/headers/ExecutionContractVersion'
        '400':
          $ref: '#/components/responses/ExecutionContractError'
        '401':
          $ref: '#/components/responses/ExecutionContractError'
        '403':
          $ref: '#/components/responses/ExecutionContractError'
        '404':
          $ref: '#/components/responses/ExecutionContractError'
  /agents/{agent}/execution/introspection:
    post:
      operationId: introspectAgentExecution
      tags: [execution]
      summary: Ask whether an agent certificate and a generation are current, together.
      description: >-
        Authorized as `activateAgent` is, on every call. `certificatePem`
        is the agent's leaf as the caller received it; a leaf that does
        not chain to the agent's organization authority or names
        another identity is 422. One that does is answered `current`
        only if it is inside its validity now and in the agent's
        credential lineage, and `fenced` otherwise, including when it
        has expired. The answer is read from one snapshot, so its parts
        were current together. Ask per decision, never per connection.
      parameters:
        - $ref: '#/components/parameters/executionContractVersion'
        - $ref: '#/components/parameters/agent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutionIntrospectionRequest'
      responses:
        '200':
          description: The certificate's and the generation's standing.
          headers:
            Garam-Contract-Version:
              $ref: '#/components/headers/ExecutionContractVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionIntrospection'
        '400':
          $ref: '#/components/responses/ExecutionContractError'
        '401':
          $ref: '#/components/responses/ExecutionContractError'
        '403':
          $ref: '#/components/responses/ExecutionContractError'
        '404':
          $ref: '#/components/responses/ExecutionContractError'
        '422':
          $ref: '#/components/responses/ExecutionContractError'
  /agents/{agent}/credential-recovery:
    post:
      operationId: recoverAgentCredential
      tags: [execution]
      security:
        - machineCertificate: []
          operationAuthority: []
      summary: Replace an agent's credential lineage under an administrator's handoff.
      description: >-
        For an agent whose credential is lost or compromised. The
        agent keeps its GRN and everything bound to it. Authorized as
        `activateAgent` is, with `agent:recover` in place of
        `agent:activate`, and with an `agent:recover` handoff an
        administrator minted for exactly this request body: the handoff
        must bind this caller, this agent and its current assignment,
        and the SHA-256 of the received body must equal its digest, or
        the request is refused with 409 and the handoff is not spent.
        The certificate is signed over `certificateRequestPem`'s key,
        which never leaves the holder.


        The recovery ends the current activation and starts a new
        lineage: every certificate the agent held before stops
        authorizing protected calls and renewal, on connections already
        open too. The runtime is then activated again, and may keep its
        generation. The same `requestId` with the same body and handoff
        reference answers the certificate it issued; any other request
        under that `requestId`, or a second recovery with the same
        reference, is 409.
      parameters:
        - $ref: '#/components/parameters/executionContractVersion'
        - $ref: '#/components/parameters/agent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialRecoveryRequest'
      responses:
        '201':
          description: The recovered certificate, the first time or again.
          headers:
            Garam-Contract-Version:
              $ref: '#/components/headers/ExecutionContractVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveredCredential'
        '400':
          $ref: '#/components/responses/ExecutionContractError'
        '401':
          $ref: '#/components/responses/ExecutionContractError'
        '403':
          $ref: '#/components/responses/ExecutionContractError'
        '404':
          $ref: '#/components/responses/ExecutionContractError'
        '409':
          $ref: '#/components/responses/ExecutionContractError'
components:
  parameters:
    executionContractVersion:
      name: Garam-Contract-Version
      in: header
      required: true
      description: Must be `execution-fence.v1`; any other value is refused with 400 naming it.
      x-go-name: ExecutionContractVersion
      schema:
        type: string
    activation:
      name: activation
      in: path
      required: true
      description: Activation identifier, as `activateAgent` returned it.
      x-go-name: ActivationId
      schema:
        type: string
    contractVersion:
      name: Garam-Contract-Version
      in: header
      required: true
      description: Must be `operation-authority.v1` (ADR-0079); any other value is refused with 400 naming it.
      x-go-name: ContractVersion
      schema:
        type: string
    controller:
      name: controller
      in: path
      required: true
      description: The controller's operator GRN.
      x-go-name: ControllerGrn
      schema:
        type: string
    ref:
      name: ref
      in: path
      required: true
      description: Operation reference, as minting the authority returned it.
      x-go-name: OperationRef
      schema:
        type: string
    claim:
      name: claim
      in: path
      required: true
      description: Claim identifier, as `claimMessage` returned it.
      x-go-name: ClaimId
      schema:
        type: string
    agent:
      name: agent
      in: path
      required: true
      description: Agent GRN, as `createAgent` or `listDefinitions` returned it.
      x-go-name: AgentGrn
      schema:
        type: string
    message:
      name: message
      in: path
      required: true
      description: Message identifier, as `postMessage` returned it.
      x-go-name: MessageId
      schema:
        type: string
  schemas:
    Identity:
      type: object
      required: [grn]
      properties:
        grn:
          type: string
          example: grn:acme:default:agent:0a1b2c3d4e5f6071
    AgentAssignment:
      type: object
      description: >-
        An agent and the operator that runs it, at the epoch that
        binding holds.
      required: [grn, operator, epoch]
      properties:
        grn:
          type: string
          example: grn:acme:default:agent:0a1b2c3d4e5f6071
        operator:
          type: string
          example: grn:acme:default:operator:one
        epoch:
          type: integer
          minimum: 1
          description: >-
            Rises with every assignment and fences the operator it
            replaced. An agent presents it when it connects.
    ProvisioningState:
      type: string
      description: >-
        What the operator reports about the agent's pod. `pending` is
        an agent no operator has reported on yet. `provisioned` is an
        agent whose workload an operator built and which reports no
        ready replica: it says the pod was built and nothing about its
        health. `ready` is an agent whose workload reports a ready
        replica, so its containers are running; it says nothing about
        whether the agent inside them works. `failed` is reserved —
        report it only from an observation that separates a workload
        that cannot start from one that is still starting, which a
        ready replica count does not, so a reporter reading that count
        alone reports `provisioned`.
      enum: [pending, provisioned, ready, failed]
    RuntimeState:
      type: string
      description: >-
        What the agent reports about itself. `unknown` is an agent that
        has not reported since it was created.
      enum: [unknown, connected, disconnected]
    ProvisioningStateReport:
      type: object
      description: >-
        One operator's account of an agent's pod, at the epoch it holds
        the agent. It carries no runtime state: what the agent says
        about itself is the agent's to report.
      required: [epoch, state]
      properties:
        epoch:
          type: integer
          minimum: 1
          description: >-
            The epoch the reporter believes the assignment is on, as
            `createAgent` or `claimDefinition` answered with. garam
            accepts the report only at the epoch the assignment is
            currently on.
        state:
          $ref: '#/components/schemas/ProvisioningState'
    RuntimeStateReport:
      type: object
      description: >-
        One agent's account of itself, at the epoch its assignment is
        on. It carries no provisioning state: what the pod looks like
        from outside is the operator's to report.
      required: [epoch, state]
      properties:
        epoch:
          type: integer
          minimum: 1
          description: >-
            The epoch the reporter believes the assignment is on. An
            agent is told it by the operator that constructed it; garam
            serves it to the agent on no route.
        state:
          $ref: '#/components/schemas/RuntimeState'
    Enrollment:
      type: object
      description: >-
        What an enrolling operator presents: the token it was given and
        the certificate signing request over the key it generated. The
        key itself does not appear here and never leaves the cluster it
        was made in.
      required: [token, certificateRequestPem]
      properties:
        token:
          type: string
          description: >-
            The one-time enrollment token, as the console showed it
            once. It names the operator this request obtains a
            certificate for, so the request names no subject of its own.
        certificateRequestPem:
          type: string
          description: >-
            A PEM-encoded PKCS#10 certificate signing request over an
            ECDSA P-256 key the caller generated. Its signature is what
            proves the caller holds the private half; nothing else in it
            is read.
    EnrolledCertificate:
      type: object
      description: >-
        What an enrollment answers: the signed certificate, the
        authority that signed it, and the garam server root the holder
        verifies garam by. There is no private key field, and its
        absence is the property rather than an omission — garam signed a
        key it never held and cannot return one (ADR-0064). Contrast
        `MachineCertificate`, which the two routes that generate a key
        pair answer with.
      required: [grn, certificatePem, issuerPem, serverRootPem, notAfter]
      properties:
        grn:
          type: string
          description: >-
            The identity the certificate names, which is also what its
            SAN URI holds. It is the operator the token named.
          example: grn:acme:default:operator:field-one
        certificatePem:
          type: string
        issuerPem:
          type: string
          description: >-
            The authority that signed this certificate. It is not what
            garam is verified against: the two directions rest on
            different roots (ADR-0040).
        serverRootPem:
          type: string
          description: >-
            The garam server root. A holder verifies garam's listener
            against this and against nothing else — one root for every
            organization, separate from the authority above and signing
            only what garam presents (ADR-0040).
        notAfter:
          type: string
          format: date-time
          description: >-
            When the certificate stops being valid. It carries jitter,
            so certificates issued together do not expire together.
    MachineCertificate:
      type: object
      description: >-
        A client certificate, the private key it was issued with, the
        authority that signed it, and the garam server root the holder
        verifies garam by. garam stores no private key, so this one is
        returned once and a holder that loses it asks for another
        certificate. One shape for both routes that generate a key pair:
        what an agent is given and what an operator renews differ in who
        may ask, not in what comes back. An enrollment answers
        `EnrolledCertificate` instead, because garam generated no key
        there and has none to return.
      required: [grn, certificatePem, privateKeyPem, issuerPem, serverRootPem, notAfter]
      properties:
        grn:
          type: string
          description: >-
            The identity the certificate names, which is also what its
            SAN URI holds.
          example: grn:acme:default:agent:0a1b2c3d4e5f6071
        certificatePem:
          type: string
        privateKeyPem:
          type: string
        issuerPem:
          type: string
          description: >-
            The authority that signed this certificate. It is not what
            garam is verified against: the two directions rest on
            different roots (ADR-0040).
        serverRootPem:
          type: string
          description: >-
            The garam server root. A holder verifies garam's listener
            against this and against nothing else — one root for every
            organization, separate from the authority above and signing
            only what garam presents (ADR-0040).
        notAfter:
          type: string
          format: date-time
          description: >-
            When the certificate stops being valid. It carries jitter,
            so certificates issued together do not expire together.
    Definition:
      type: object
      description: >-
        What an organization says an agent should be, answered to the
        operator it names (ADR-0026). `claim` is absent while no
        operator has claimed the definition and carries the agent's
        assignment epoch once one has — the only claimant a definition
        admits is the operator it names, so who claimed it is always
        the caller.
      required: [agentGrn, values]
      properties:
        agentGrn:
          type: string
          description: >-
            The identity garam minted for the agent this definition
            describes. No agent answers under it until the claim.
          example: grn:acme:default:agent:9f2ac1b40d8e7a35
        values:
          type: object
          description: >-
            What the operator constructs the agent from. garam stores
            the keys and the strings and interprets neither.
          additionalProperties:
            type: string
        claim:
          $ref: '#/components/schemas/DefinitionClaim'
    DefinitionClaim:
      type: object
      description: The agent's assignment, first written by the claim (ADR-0033).
      required: [epoch]
      properties:
        epoch:
          type: integer
          minimum: 1
          description: The epoch the agent's assignment holds at now.
    MessageSubmission:
      type: object
      description: What a sender supplies. Who is sending is the certificate's to say.
      required: [recipient, idempotencyKey, body]
      properties:
        recipient:
          type: string
          description: >-
            GRN of the identity the message is addressed to. It does
            not have to name an agent garam knows.
          example: grn:acme:default:agent:0a1b2c3d4e5f6071
        idempotencyKey:
          type: string
          description: >-
            The sender's own key for this message. Posting the same key
            twice stores one message and answers with it both times.
        body:
          type: string
          maxLength: 65536
          description: >-
            The message itself. The queue carries it and never reads
            it, so it may be empty. It is bounded (ADR-0034):
            `maxLength` counts characters, so the bound is 65536 of
            them — well past any plausible agent turn — and UTF-8
            spends up to four bytes on each, so a body weighs up to 256
            KiB. The bound is what keeps the table's worst case
            arithmetic, and 256 KiB is the figure that arithmetic runs
            on: size a buffer or a row estimate against it, not against
            the character count.
    Message:
      type: object
      description: One stored message, under an identifier the queue minted.
      required: [id, recipient, sender, idempotencyKey, body, createdAt]
      properties:
        id:
          type: string
          description: >-
            The queue's identifier for the message. A message is a queue
            entry rather than a resource a policy names, so it is opaque
            and not a GRN.
        recipient:
          type: string
          example: grn:acme:default:agent:0a1b2c3d4e5f6071
        sender:
          type: string
          example: grn:acme:default:agent:9f8e7d6c5b4a3021
        idempotencyKey:
          type: string
        body:
          type: string
        createdAt:
          type: string
          format: date-time
    MessageState:
      type: string
      description: >-
        How far a message has got. `pending` is waiting for a reader or
        waiting to be handed out again; `claimed` is held by a reader
        whose lease has not run out; `completed` is reported delivered;
        `exhausted` has spent its attempts and is handed out no further
        (ADR-0018). Nothing here means expired — a message the sweep
        deleted is answered by `getMessageStatus` as one that is not
        there (ADR-0055).
      enum: [pending, claimed, completed, exhausted]
    MessageStatus:
      type: object
      description: >-
        What garam knows about one message and its sender does not. It
        carries no body: the sender wrote it, and a completed message
        no longer has one (ADR-0034).
      required: [id, state, attempts, createdAt]
      properties:
        id:
          type: string
          description: The queue's identifier for the message, as `postMessage` answered with.
        state:
          $ref: '#/components/schemas/MessageState'
        attempts:
          type: integer
          minimum: 0
          description: >-
            How many times the message has been handed to a reader.
            Zero is a message nothing has looked at yet, and a rising
            count on a message that is not `completed` is a turn
            failing the same way each time (ADR-0018).
        createdAt:
          type: string
          format: date-time
          description: >-
            When garam stored the message. An undelivered message is
            deleted thirty days after it, so this is what a sender
            measures the retention window against (ADR-0034).
    Claim:
      type: object
      description: >-
        One caller's hold on one message, and the token that fences it.
        Renewal and completion carry that token, and a hold handed on to
        the next caller stops matching.
      required: [id, expiresAt, attempt, watchers, message]
      properties:
        id:
          type: string
          description: The claim's identifier, which renewal and completion name.
        expiresAt:
          type: string
          format: date-time
          description: >-
            When the hold lapses and the message is handed to the next
            caller. garam measures it, so no caller's clock decides it.
        attempt:
          type: integer
          minimum: 1
          description: >-
            Which delivery of this message the caller is holding.
            Delivery is at-least-once (ADR-0018), so this is what tells
            a first delivery from a repeat; a message that reaches the
            bound is not handed out again.
        watchers:
          type: integer
          minimum: 0
          description: >-
            How many streams garam was holding for this agent when it
            answered, which is what says whether to forward the turn's
            events (ADR-0022). Zero is the ordinary answer and the field
            is always here: garam stores nothing for an agent nobody
            watches, so it is answered in the same shape as one somebody
            watches. Every renewal carries the count again, so a person
            who opened the view mid-turn is seen without a call of their
            own — and one who left is stopped forwarding to.
        message:
          $ref: '#/components/schemas/Message'
    TurnEvent:
      type: object
      description: >-
        One event from the agent's monitoring stream, as the agent
        platform emitted it. garam carries it and never reads it, so
        what a kind means and what a body holds are the platform's to
        say.
      required: [kind, body]
      properties:
        kind:
          type: string
          maxLength: 64
          description: >-
            What the platform called this event. It reaches a browser as
            the name of a server-sent event, so it is one line.
        body:
          type: string
          maxLength: 4000
          description: >-
            The event itself. It may be empty and it may span lines.
    AuthorityIntrospection:
      type: object
      required: [authority]
      properties:
        authority:
          type: string
          description: The opaque authority, carried in the body so it never reaches a URL.
    OperationBinding:
      type: object
      required: [operationRef, grantId, orgGrn, actorGrn, audienceGrn, operation, targetGrn, requestId, bodySha256]
      properties:
        operationRef:
          type: string
        grantId:
          type: string
        orgGrn:
          type: string
        actorGrn:
          type: string
          description: The user the operation is performed for.
        audienceGrn:
          type: string
        operation:
          type: string
          enum: [agent:create, agent:configure, agent:recover]
        targetGrn:
          type: string
          description: The controller for `agent:create`, the agent for `agent:configure` and `agent:recover`.
        assignment:
          $ref: '#/components/schemas/BoundAssignment'
        requestId:
          type: string
        bodySha256:
          type: string
        expiresAt:
          type: string
          format: date-time
          description: When the presented authority stops being usable. Absent on a reference check.
    BoundAssignment:
      type: object
      required: [operatorGrn, epoch]
      description: Where the agent ran when an operation on it was authorized. Present for `agent:configure` and `agent:recover` only.
      properties:
        operatorGrn:
          type: string
        epoch:
          type: string
          description: Opaque.
    ControllerIntrospection:
      type: object
      required: [certificatePem]
      properties:
        certificatePem:
          type: string
          description: >-
            The controller's leaf certificate in PEM form, exactly as the
            controller presented it in its TLS handshake with the caller.
        agent:
          type: [string, 'null']
          description: >-
            An agent GRN, to prove that agent's placement on the
            controller. Absent or null proves the controller alone.
    ControllerProof:
      type: object
      required: [operator, org, agent]
      properties:
        operator:
          type: string
          description: The controller's GRN.
        org:
          type: string
          description: The organization's GRN.
        agent:
          description: The agent's current placement, null where no agent was supplied.
          oneOf:
            - $ref: '#/components/schemas/ProvenAgent'
            - type: 'null'
    ProvenAgent:
      type: object
      required: [grn, epoch]
      properties:
        grn:
          type: string
        epoch:
          type: string
          description: The current assignment's epoch. Opaque; compare it for equality only.
    ActivationRequest:
      type: object
      required: [requestId, epoch, generation, replacesActivationId, operationRef, certificatePem]
      properties:
        requestId:
          type: string
          pattern: '^[A-Za-z0-9._~-]{1,128}$'
        epoch:
          type: string
          description: The assignment's epoch the caller expects. Opaque.
        generation:
          type: string
          pattern: '^[0-9a-f]{32}$'
          description: The runtime's start nonce for this process.
        replacesActivationId:
          type: [string, 'null']
          description: The agent's most recent activation, null only before the first.
        operationRef:
          type: [string, 'null']
          description: A durable `agent:configure` reference for a pending revision, null otherwise.
        certificatePem:
          type: string
          maxLength: 8192
          description: The agent's leaf certificate in PEM form, exactly as the agent presented it to the caller.
    Activation:
      type: object
      required: [activationId, token, tokenVersion, grn, epoch, generation, lineage]
      properties:
        activationId:
          type: string
        token:
          type: string
          description: >-
            What the runtime's calls carry as `Authorization:
            Garam-Execution <token>`. Shown once; garam keeps its hash.
        tokenVersion:
          type: integer
          minimum: 1
          description: Rises with every token issued for this activation; keep the highest.
        grn:
          type: string
        epoch:
          type: string
          description: Opaque.
        generation:
          type: string
        lineage:
          type: [string, 'null']
          description: The credential lineage checked, null for the certificates issued before any recovery.
    ExecutionIntrospectionRequest:
      type: object
      required: [certificatePem]
      properties:
        certificatePem:
          type: string
          maxLength: 8192
          description: The agent's leaf certificate in PEM form, exactly as the agent presented it to the caller.
        generation:
          type: [string, 'null']
          description: A generation to compare with the active one.
    ExecutionIntrospection:
      type: object
      required: [grn, org, assignee, epoch, mode, credential, generation, activationId]
      properties:
        grn:
          type: string
        org:
          type: string
        assignee:
          type: string
          description: The operator the agent is assigned to.
        epoch:
          type: string
          description: Opaque.
        mode:
          type: string
          enum: [legacy, fenced]
          description: '`fenced` once the agent has been activated.'
        credential:
          type: string
          enum: [current, fenced]
        generation:
          type: string
          enum: [current, not_current, none, not_supplied]
          description: >-
            With a generation supplied, whether it is the active one;
            without one, `none` when no generation is active and
            `not_supplied` otherwise.
        activationId:
          type: [string, 'null']
          description: The current activation, null when none is.
    CredentialRecoveryRequest:
      type: object
      required: [requestId, epoch, certificateRequestPem]
      properties:
        requestId:
          type: string
          pattern: '^[A-Za-z0-9._~-]{1,128}$'
        epoch:
          type: string
          description: The assignment's epoch the caller expects. Opaque.
        certificateRequestPem:
          type: string
          maxLength: 4096
          description: >-
            A PEM-encoded PKCS#10 request over an ECDSA P-256 key the
            holder generated. Only its key is read.
    RecoveredCredential:
      type: object
      required: [grn, lineage, certificatePem]
      properties:
        grn:
          type: string
        lineage:
          type: string
        certificatePem:
          type: string
    Error:
      type: object
      required: [kind, message]
      properties:
        kind:
          type: string
          description: errorx kind, e.g. `not_found`, `permission_denied`.
        message:
          type: string
  headers:
    ExecutionContractVersion:
      description: The contract version this answer follows, `execution-fence.v1`.
      schema:
        type: string
    ContractVersion:
      description: The contract version this answer follows, `operation-authority.v1`.
      schema:
        type: string
  responses:
    Error:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ExecutionContractError:
      description: Error response of an execution route.
      headers:
        Garam-Contract-Version:
          $ref: '#/components/headers/ExecutionContractVersion'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ContractError:
      description: Error response of a versioned contract route.
      headers:
        Garam-Contract-Version:
          $ref: '#/components/headers/ContractVersion'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    executionToken:
      type: http
      scheme: Garam-Execution
      description: >-
        The token an activation issued, as `Authorization:
        Garam-Execution <token>` beside the client certificate. An agent
        whose execution has been activated presents it on every call
        that offers this scheme, and is refused without it; one never
        activated presents none, and is refused with one. garam stores
        only its hash.
    operationAuthority:
      type: http
      scheme: Garam-Operation
      description: >-
        A user's handoff for one operation, as `Authorization:
        Garam-Operation <authority>` beside the client certificate. It
        is minted for the exact request body it accompanies.
    machineCertificate:
      type: mutualTLS
      description: >-
        The client certificate the listener requires. Its SAN URI holds
        the caller's GRN and nothing else — no roles and no claims.
