    post:
      operationId: introspectAgentExecution
      tags: [execution]
      security:
        - machineCertificate: []
        - machineToken: []
        - machineBearer: []
      summary: Ask whether an agent certificate and a generation are current, together.
      description: >-
        Authorized as `activateAgent` is, on every call. `certificatePem`
        is the agent's leaf as the caller received it; a leaf that does
        not chain to the agent's organization authority or names
        another identity is 422. One that does is answered `current`
        only if it is inside its validity now and in the agent's
        credential lineage, and `fenced` otherwise, including when it
        has expired. The answer is read from one snapshot, so its parts
        were current together. Ask per decision, never per connection.


        Under `execution-fence.v2` `token` replaces `certificatePem` as
        `activateAgent` describes. A token of an earlier epoch or
        lineage, or one that has expired, is answered `fenced` while
        garam still holds its row, and 422 once the row is gone: a mint
        deletes the agent's expired tokens and keeps its newest five
        per audience. Either answer means the token may not act
        (ADR-0100).
      parameters:
        - $ref: '#/components/parameters/executionContractVersion'
        - $ref: '#/components/parameters/agent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutionIntrospectionRequest'
      responses:
        '200':
          description: The certificate's and the generation's standing.
          headers:
            Garam-Contract-Version:
              $ref: '#/components/headers/ExecutionContractVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionIntrospection'
        '400':
          $ref: '#/components/responses/ExecutionContractError'
        '401':
          $ref: '#/components/responses/ExecutionContractError'
        '403':
          $ref: '#/components/responses/ExecutionContractError'
        '404':
          $ref: '#/components/responses/ExecutionContractError'
        '422':
          $ref: '#/components/responses/ExecutionContractError'
  /agents/{agent}/credential-recovery:
    post:
      operationId: recoverAgentCredential
      tags: [execution]
      security:
        - machineCertificate: []
          operationAuthority: []
        - machineToken: []
        - machineBearer: []
          operationHeader: []
      summary: Replace an agent's credential lineage under an administrator's handoff.
      description: >-
        For an agent whose credential is lost or compromised. The
        agent keeps its GRN and everything bound to it. Authorized as
        `activateAgent` is, with `agent:recover` in place of
        `agent:activate`, and with an `agent:recover` handoff an
        administrator minted for exactly this request body: the handoff
        must bind this caller, this agent and its current assignment,
        and the SHA-256 of the received body must equal its digest, or
        the request is refused with 409 and the handoff is not spent.
        The certificate is signed over `certificateRequestPem`'s key,
        which never leaves the holder, and the answer names the
        authority that signed it and the garam server root, so the
        holder verifies the recovered credential from the answer alone.


        The recovery ends the current activation and starts a new
        lineage: every certificate the agent held before stops
        authorizing protected calls and renewal, on connections already
        open too. The runtime is then activated again, and may keep its
        generation. The same `requestId` with the same body and handoff
        reference answers the certificate it issued and its chain; any
        other request under that `requestId`, or a second recovery with
        the same reference, is 409. Past garam's ten-second deadline the
        answer is 503, which does not say whether the recovery
        committed: retry it under the same `requestId`.


        Under `execution-fence.v2` the caller presents its own token,
        and the handoff travels in a `Garam-Operation` header of its
        own. The body carries `requestId` and `epoch` and no
        `certificateRequestPem`: nothing is signed, and the answer names
        `grn` and the new `lineage` alone. Every agent token minted
        before it is refused from the next request, and the assignee
        mints the agent's tokens in the new lineage (ADR-0100).
      parameters:
        - $ref: '#/components/parameters/executionContractVersion'
        - $ref: '#/components/parameters/agent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialRecoveryRequest'
      responses:
        '201':
          description: The recovered certificate, the first time or again.
          headers:
            Garam-Contract-Version:
              $ref: '#/components/headers/ExecutionContractVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveredCredential'
        '400':
          $ref: '#/components/responses/ExecutionContractError'
        '401':
          $ref: '#/components/responses/ExecutionContractError'
        '403':
          $ref: '#/components/responses/ExecutionContractError'
        '404':
          $ref: '#/components/responses/ExecutionContractError'
        '409':
          $ref: '#/components/responses/ExecutionContractError'
  /agents/{agent}/cutover:
    get:
      operationId: getAgentCutover
      tags: [cutover]
      security:
        - machineCertificate: []
          operationAuthority: []
        - machineToken: []
        - machineBearer: []
          operationHeader: []
      summary: Read what the Operator imports a legacy agent from, and its most recent cutover attempt.
      description: >-
        Authorized as `activateAgent` is, and additionally by
        `Authorization: Garam-Operation <ref>`, where `ref` is a durable
        `agent:cutover` reference an owner or an administrator minted
        for this caller, this agent, the assignment it is on now and
        this route's exact request target: its escaped path and raw
        query, as the request carries them. garam rechecks the
        reference from current state on this and every cutover call,
        and compares its request target with the one received, so a
        reference minted for one cutover route authorizes no other
        (ADR-0086). A GRN no operator holds, an unclaimed definition's
        included, is 403 on every cutover route, as an agent the caller
        holds no authority over is: authorization runs before
        eligibility.


