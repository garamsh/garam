            Garam-Contract-Version:
              $ref: '#/components/headers/ContractVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationBinding'
        '400':
          $ref: '#/components/responses/ContractError'
        '401':
          $ref: '#/components/responses/ContractError'
        '403':
          $ref: '#/components/responses/ContractError'
        '404':
          $ref: '#/components/responses/ContractError'
  /operators/{controller}/introspection:
    post:
      operationId: introspectController
      tags: [authority]
      security:
        - machineCertificate: []
        - machineToken: []
        - machineBearer: []
      summary: Prove a controller's current authority, and an agent's placement on it, for one decision.
      description: >-
        The calling operator is the hosted control audience and forwards
        the controller's leaf certificate exactly as that controller
        presented it in its own TLS handshake; garam verifies the
        certificate and never a forwarded GRN. The answer is a positive
        proof, and 200 is returned only when every check passes, each
        read on this request: the caller's own certificate is still
        within its validity and its registration is still held; the
        forwarded certificate names `controller` in its SAN, chains to
        the organization's authority, is within its validity, and the
        controller is still registered; the caller's current grant
        covers `agent:activate` for that controller; and current policy
        for the caller and its current groups, beside an Allow of
        `agent:activate` on the organization (or, with `agent`, on that
        agent) that the grant contributes, does not deny it. With
        `agent`, the agent must currently be assigned to `controller`,
        and the answer carries that assignment's epoch, which the caller
        compares with the epoch it expects. A session admitted without
        an agent is not permission to release any agent's desired
        content, status or placement: obtain the agent-bound proof
        before each such decision, again after a long wait, and never
        reuse one across decisions. Malformed input is 400; a
        certificate that does not prove `controller` is 422; a
        controller or agent that is unknown, of another organization,
        or no longer registered is 404; any other current-authority
        refusal — a certificate outside its validity, the caller's
        withdrawn registration, an ended or out-of-scope grant, a Deny,
        or an agent assigned elsewhere — is 403; and authority garam
        cannot read as current is 503. This proves current authority as
        of its reads and is not a transaction with the caller's store.


        Under `operation-authority.v2` the caller presents its own token
        and no certificate, and forwards `token` in place of
        `certificatePem`: the token the controller exchanged its
        credential for to be shown to the caller. It proves `controller`
        only while it is live, names `controller`, and names the caller
        as its audience; one that does not is 422, as a certificate that
        does not prove `controller` is (ADR-0100).
      parameters:
        - $ref: '#/components/parameters/contractVersion'
        - $ref: '#/components/parameters/controller'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControllerIntrospection'
      responses:
        '200':
          description: The proof.
          headers:
            Garam-Contract-Version:
              $ref: '#/components/headers/ContractVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControllerProof'
        '400':
          $ref: '#/components/responses/ContractError'
        '401':
          $ref: '#/components/responses/ContractError'
        '403':
          $ref: '#/components/responses/ContractError'
        '404':
          $ref: '#/components/responses/ContractError'
        '422':
          $ref: '#/components/responses/ContractError'
  /agents/{agent}/activations:
    post:
      operationId: activateAgent
      tags: [execution]
      security:
        - machineCertificate: []
        - machineToken: []
        - machineBearer: []
      summary: Admit a runtime generation of an agent, and issue the token its calls carry.
      description: >-
        The caller is the hosted Operator control service, which has
        proven the placement and that the previous writer stopped
        before it calls. Per request, garam reads the caller's
        registration, its current grant, which must cover
        `agent:activate` for the agent's current assignee, and current
        policy on the agent, where an explicit Deny wins. It verifies
        `certificatePem`, the agent's leaf as the caller received it,
        against the agent's organization authority. Then, under the
        agent's execution lock, it rechecks the assignment, the
        epoch, the grant's expiry, and whether that certificate is
        current: inside its validity and in the agent's credential
        lineage. An agent's own certificate cannot activate.


        `replacesActivationId` names the agent's most recent
        activation, current or ended, and is null only before the
        first. Another value is 409, so a stale placement's replay never
        wins, and a generation already activated in the current lineage
        is 409 too. The first activation is the agent's cutover, after
        which every call offering `executionToken` requires the token.


        `operationRef` is null for the revision the runtime last
        reported as effective, and is a durable `agent:configure`
        reference for a pending revision. garam rechecks that reference
        as current and requires it to bind this caller, this agent and
        its current assignment. Whether one is needed is the caller's to
        decide: garam keeps no revision. The one exception is an agent
        `createManagedAgent` made: until an activation of it has
        succeeded, a null `operationRef` is 403, and the reference is
        either such an `agent:configure` reference or the
        `agent:create` reference of that agent's own creation, while it
        is still assigned where that creation put it. An `agent:create`
        reference is accepted for that first activation alone, with a
        null `replacesActivationId`, and for its identical retry; any
        other `agent:create` reference is 403.


        An agent that has never been activated and that no managed
        creation or standalone approval made is a legacy agent, and its
        first activation is the last step of its cutover (ADR-0086):
        until `switchAgentCutover` has recorded its switch, it is 409
        with `reason` `cutover_required`, whatever else the request
        carries. That is the only refusal here that sets `reason`.


        The same `requestId` with the same request answers the same
        activation with 200, a new token and a higher `tokenVersion`;
        only the last token issued is admitted, so keep the highest
        version. The same `requestId` with another request, or for an
        activation that has ended, is 409. Past garam's ten-second
        deadline the answer is 503, which does not say whether the
        activation committed: retry it under the same `requestId`.


        Under `execution-fence.v2` the caller presents its own token and
        no certificate, and forwards `token` in place of
        `certificatePem`: the agent's token its assignee minted to be
        shown to the caller, or, where the caller is the assignee
        itself — a standalone host's supervisor — the token it minted
        for garam. A token that is neither, for this agent, is 422. The fence judges it as it judges a
        certificate: current while inside its dates, minted at the
        agent's current assignee and epoch, and in its current lineage
        (ADR-0100).
      parameters:
        - $ref: '#/components/parameters/executionContractVersion'
        - $ref: '#/components/parameters/agent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivationRequest'
      responses:
        '200':
          description: The activation a retry already made, with a new token.
          headers:
            Garam-Contract-Version:
              $ref: '#/components/headers/ExecutionContractVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activation'
        '201':
          description: The activation.
          headers:
            Garam-Contract-Version:
              $ref: '#/components/headers/ExecutionContractVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activation'
        '400':
          $ref: '#/components/responses/ExecutionContractError'
        '401':
          $ref: '#/components/responses/ExecutionContractError'
        '403':
          $ref: '#/components/responses/ExecutionContractError'
        '404':
          $ref: '#/components/responses/ExecutionContractError'
        '409':
          $ref: '#/components/responses/ExecutionContractError'
        '422':
          $ref: '#/components/responses/ExecutionContractError'
  /agents/{agent}/activations/{activation}/deactivation:
    post:
      operationId: deactivateAgent
