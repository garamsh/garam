        `epoch` with 200, however many times and from however many
        concurrent requests, while the agent is still assigned where
        its creation put it; once it has moved, the retry is 409. A
        reference bound to another controller or request identifier,
        or a `requestId` an earlier creation holds under another
        reference, is 409. A controller of another organization or one
        that is not an operator is 404, as is an unknown reference or
        another audience's; a reference of another kind is 403, and so
        is one current state no longer authorizes. Authority garam
        cannot read as current is 503.


        Under `managed-enrollment.v2` the caller presents its own token
        and no certificate; nothing else changes. Creation opens the
        agent's lineage under either value, and under v2 the controller
        mints the agent's tokens in it with `mintAgentToken` instead of
        `issueInitialCertificate`, which takes no token (ADR-0100).
      parameters:
        - $ref: '#/components/parameters/enrollmentContractVersion'
        - $ref: '#/components/parameters/controller'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagedAgentRequest'
      responses:
        '200':
          description: The agent an identical earlier request created.
          headers:
            Garam-Contract-Version:
              $ref: '#/components/headers/EnrollmentContractVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedAgent'
        '201':
          description: The agent, created and assigned to the controller.
          headers:
            Garam-Contract-Version:
              $ref: '#/components/headers/EnrollmentContractVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedAgent'
        '400':
          $ref: '#/components/responses/EnrollmentContractError'
        '401':
          $ref: '#/components/responses/EnrollmentContractError'
        '403':
          $ref: '#/components/responses/EnrollmentContractError'
        '404':
          $ref: '#/components/responses/EnrollmentContractError'
        '409':
          $ref: '#/components/responses/EnrollmentContractError'
  /agents/{agent}/initial-certificate:
    post:
      operationId: issueInitialCertificate
      tags: [enrollment]
      summary: Sign a managed agent's first certificate over the key its controller generated.
      description: >-
        For an agent `createManagedAgent` made. Authorized as
        `activateAgent` is, on every call, and also by `operationRef`,
        which must be the `agent:create` reference of this agent's own
        creation, rechecked as current; a reference of another agent's
        creation, on the same controller too, is 403. The agent must
        still be assigned where its creation put it, at `epoch`.


        It takes a certificate and no token: a token is 401. A
        controller that created the agent under `managed-enrollment.v2`
        asks nothing here, and mints the agent's tokens with
        `mintAgentToken` instead (ADR-0100).


        The certificate is signed over `certificateRequestPem`'s key,
        which never leaves the controller. garam reads the key alone:
        the request's subject, SAN and extension requests are ignored,
        and the certificate names the agent's GRN as its one SAN URI
        for client authentication. A request that is not one PEM
        `CERTIFICATE REQUEST` proving possession of an ECDSA P-256 key
        is 422. Signing happens before the agent's execution lock;
        under it garam rechecks the assignment, the epoch and the
        grant's expiry, and records the certificate as the first of the
        agent's lineage. From then on that certificate, and the ones it
        renews into, are the agent's current credential; no other
        certificate naming the agent is.


        The first answer is 201. The same `requestId`, `operationRef`,
        `epoch` and `certificateRequestPem` answer exactly the stored
        public result with 200, even after the reference's short token
        has expired, while current authority still permits it; a lost
        answer never issues a second effective certificate. Any other
        request once one is recorded is 409, and so is every request,
        identical ones included, once `recoverAgentCredential` has
        replaced the lineage: recovery, not this route, replaces a lost
        credential. A stale `epoch` is 409. Authority garam cannot read
        as current is 503.
      parameters:
        - $ref: '#/components/parameters/enrollmentContractVersion'
        - $ref: '#/components/parameters/agent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitialCertificateRequest'
      responses:
        '200':
          description: The certificate an identical earlier request issued.
          headers:
            Garam-Contract-Version:
              $ref: '#/components/headers/EnrollmentContractVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InitialCertificate'
        '201':
          description: The agent's first certificate.
          headers:
            Garam-Contract-Version:
              $ref: '#/components/headers/EnrollmentContractVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InitialCertificate'
        '400':
          $ref: '#/components/responses/EnrollmentContractError'
        '401':
          $ref: '#/components/responses/EnrollmentContractError'
        '403':
          $ref: '#/components/responses/EnrollmentContractError'
        '404':
          $ref: '#/components/responses/EnrollmentContractError'
        '409':
          $ref: '#/components/responses/EnrollmentContractError'
        '422':
          $ref: '#/components/responses/EnrollmentContractError'
  /agent-enrollments:
    post:
      operationId: enrollStandaloneAgent
      tags: [standalone]
      summary: Spend an administrator's approval and obtain a supervisor's credential, or its and its agent's first certificates.
      description: >-
        Authenticated by `Authorization: Garam-Bootstrap <secret>`,
        whose SHA-256 an administrator approved with
        `approveAgentEnrollment` together with the two key fingerprints
        and `requestId` this body carries; no client certificate is
        read. An unknown, withdrawn or expired secret, and one of
        another organization's approval, are one 401. Each certificate
        request must prove possession of the key whose fingerprint was
        approved, or the call is 403 and spends nothing; one that is not
        a PEM `CERTIFICATE REQUEST` proving an ECDSA P-256 key is 422.
        The approving administrator's `agent:enroll` is read again from
        current state on every call: denied is 403, and authority garam
        cannot read as current is 503.


        A new agent is created with an execution fenced from birth,
        assigned to the supervisor at epoch 1, and its certificate is
        the first of its credential lineage. A replacement moves the
        agent from exactly the supervisor and epoch the approval named
        to the new supervisor at the next epoch, ends the replaced
        registration and the agent's activation, and starts a new
        lineage holding the new certificate, so every earlier
        certificate of the agent is fenced; the agent's GRN is
        unchanged and garam holds none of its memory. Where the
        assignment has moved since the approval, the call is 409 and
        writes nothing.


        The first answer is 201. The same secret and the same exact
        body answer the stored public result with 200 while the
        approval is unexpired and its registration still holds the
        agent at the recorded epoch; once a later replacement or a
        revocation has ended it, the replay is 409 and discloses
        nothing. Any other body once the approval is spent is 409.


        Under `standalone-enrollment.v2` the approval binds no key and
        the body carries `requestId` alone. Nothing is signed: the agent
        is placed as above, the supervisor is registered holding no
        certificate, and the answer names `credential`, the supervisor's
        credential, beside the agent, the supervisor, the epoch, the
        lineage and the garam server root. garam stores the credential's
        hash alone, so an identical retry while the registration still
        holds the agent re-issues it: the credential answered before,
        and every token it was exchanged for, is refused from then on.
        The supervisor exchanges the credential for hour-long tokens
        with `exchangeToken`, mints its agent's tokens with
        `mintAgentToken`, and presents its token on the execution routes
        it holds authority on. An approval binding the host's keys is
        spent under v1 alone and one binding none under v2 alone;
        spending either under the other value is 400 and spends nothing
        (ADR-0100).


        The answer names the `placement` the administrator approved.
        `standalone` is a host whose supervisor starts the runtime, its
        workspace and the adapter as three containers (ADR-0085).
        `direct` is a host whose supervisor attaches to a runtime
        already running there and starts nothing (ADR-0111); its
        approval binds no key, so it is spent under v2 alone. garam
        places, registers and fences both alike.
      security: []
      parameters:
        - $ref: '#/components/parameters/standaloneContractVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StandaloneEnrollmentRequest'
      responses:
        '200':
          description: The result an identical earlier request recorded.
          headers:
            Garam-Contract-Version:
              $ref: '#/components/headers/StandaloneContractVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandaloneEnrollment'
        '201':
          description: The supervisor is registered and both certificates are issued.
          headers:
            Garam-Contract-Version:
              $ref: '#/components/headers/StandaloneContractVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandaloneEnrollment'
        '400':
          $ref: '#/components/responses/StandaloneContractError'
        '401':
          $ref: '#/components/responses/StandaloneContractError'
        '403':
          $ref: '#/components/responses/StandaloneContractError'
        '409':
          $ref: '#/components/responses/StandaloneContractError'
        '422':
          $ref: '#/components/responses/StandaloneContractError'
  /supervisors/self/certificate:
    post:
      operationId: renewSupervisorCertificate
      tags: [standalone]
      summary: Renew the calling supervisor's certificate over a key it generated.
      description: >-
        The caller is a supervisor, presenting the certificate garam
        last issued it with more than two thirds of its validity spent;
        an earlier one is 409 as too early, and a caller that is not a
        supervisor is 403. The new certificate is signed over the key
        `certificateRequestPem` proves, with the lifetime every
        certificate garam issues has, and becomes the one renewals are
        measured against.


        The first answer is 201. The certificate that renewal replaced,
        presented again with the same `requestId` and
        `certificateRequestPem` while still valid, answers the stored
        public result with 200, so a lost answer or a restart never
        strands the supervisor. Any other request from it, and any
        request from an older certificate, is 409. A supervisor whose
        registration was revoked or replaced is refused at the
        connection, and an expired certificate cannot connect: both
        recover only by an administrator's new approval.


        A supervisor `enrollStandaloneAgent` registered under
        `standalone-enrollment.v2` holds no certificate to renew: it
        exchanges its credential for tokens with `exchangeToken`
        (ADR-0100).
      parameters:
        - $ref: '#/components/parameters/standaloneContractVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupervisorRenewalRequest'
      responses:
        '200':
          description: The certificate an identical earlier renewal issued.
          headers:
            Garam-Contract-Version:
              $ref: '#/components/headers/StandaloneContractVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InitialCertificate'
        '201':
          description: The supervisor's next certificate.
          headers:
            Garam-Contract-Version:
              $ref: '#/components/headers/StandaloneContractVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InitialCertificate'
        '400':
          $ref: '#/components/responses/StandaloneContractError'
        '401':
          $ref: '#/components/responses/StandaloneContractError'
        '403':
          $ref: '#/components/responses/StandaloneContractError'
        '404':
          $ref: '#/components/responses/StandaloneContractError'
        '409':
          $ref: '#/components/responses/StandaloneContractError'
        '422':
          $ref: '#/components/responses/StandaloneContractError'
  /agent-enrollment-approvals:
    post:
      operationId: prepareAgentEnrollment
      tags: [agent-enrollment]
      security:
        - machineToken: []
        - machineBearer: []
      summary: Prepare the approval agent-enrollment.v1 admits one agent under.
      description: >-
        The first of the contract's three stages (ADR-0102). The caller
        is the hosted Operator control service and presents its own
        token; a certificate is 401. It binds one approval to its
        organization, `requestId`, `placement`, `assignee` and the
        member's `agent:create` reference, rechecked from current state
        as `createManagedAgent` rechecks it: an `agent:create`
        reference handed to this caller in its own organization, minted
        under this `requestId` for this `assignee`. Nothing is admitted
        and no agent exists yet.


        The first answer is 201. The same binding under the same
        `requestId` answers the same approval with 200. Another binding
        under that `requestId`, or a reference minted for another
        assignee or request identifier, is 409 with reason
        `binding_conflict`. A reference of another kind, or one current
        state no longer authorizes, is 403; an unknown reference or
        another audience's, and an assignee of another organization or
        that is not an operator, is 404; authority garam cannot read as
        current is 503.


        A body naming `replaces` binds a replacement, which moves
        `replaces.agent` to `assignee` under its GRN (ADR-0107). Its
        `operationRef` is an owner's or administrator's `agent:replace`
        reference instead, handed to this caller in its own
        organization and minted under this `requestId` for
        `replaces.agent`, at `replaces.expectedAssignee` and
        `replaces.expectedEpoch`, with `assignee` as its destination;
        the caller's current grant covers `agent:replace` for both
        controllers. One minted for another agent, assignment,
        destination or request identifier is 409 with reason
        `binding_conflict`, and one the agent has moved away from is
        403, as any reference current state no longer authorizes.


        `placement: direct` is 409 with reason
        `direct_placement_requires_administrator_approval` whatever else
        the body says: a direct agent's authority is an administrator's
        `agent:enroll` approval and a supervisor registered for that one
        agent, never an operator (ADR-0111). The browser surface's
        `approveAgentEnrollment` with `placement: direct` is that
        approval, and the host spends it with `enrollStandaloneAgent`
        under `standalone-enrollment.v2`.
      parameters:
        - $ref: '#/components/parameters/agentEnrollmentContractVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentEnrollmentBinding'
      responses:
        '200':
          description: The approval an identical earlier request prepared.
          headers:
            Garam-Contract-Version:
              $ref: '#/components/headers/AgentEnrollmentContractVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentEnrollmentApproval'
        '201':
          description: The approval.
          headers:
            Garam-Contract-Version:
              $ref: '#/components/headers/AgentEnrollmentContractVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentEnrollmentApproval'
        '400':
          $ref: '#/components/responses/AgentEnrollmentContractError'
        '401':
          $ref: '#/components/responses/AgentEnrollmentContractError'
        '403':
          $ref: '#/components/responses/AgentEnrollmentContractError'
        '404':
          $ref: '#/components/responses/AgentEnrollmentContractError'
        '409':
          $ref: '#/components/responses/AgentEnrollmentContractError'
  /agent-enrollment-approvals/{approval}/admission:
    post:
      operationId: admitAgentEnrollment
      tags: [agent-enrollment]
      security:
        - machineToken: []
        - machineBearer: []
      summary: Admit the agent an approval binds, fenced and with no active generation.
      description: >-
        The second stage. The caller is the approval's own audience and
        repeats the binding it prepared; a certificate is 401, and an
        approval of another organization or another audience is 404.
        garam rechecks the reference from current state as
        `prepareAgentEnrollment` does, mints the agent's GRN and writes
        the agent, its first assignment to `assignee` and its execution
        in one transaction, which also spends the approval. The
        execution is fenced from birth, in a credential lineage of its
        own and with no active generation. Admission creates no
        workload, process, memory, volume or message-channel
        permission.


        The first answer is 201. The same binding answers the same
        `grn`, `epoch` and `lineage` with 200, however many times and
        from however many concurrent requests, while the agent is still
        assigned where admission put it; once it has moved, the retry is
        409 with reason `superseded`. A body binding other than the
        approval's is 409 with reason `binding_conflict` before the
        approval is spent and `approval_spent` after; so is an approval
        whose reference a `createManagedAgent` creation already spent.
        Refusals by placement and current authority are
        `prepareAgentEnrollment`'s.


        A replacement writes no agent. Under the agent's execution lock
        it moves the assignment from exactly `replaces.expectedAssignee`
        at `replaces.expectedEpoch` to `assignee`, raises the epoch,
        ends the current activation and moves the agent into a new
        lineage, which spends the approval; `grn` is `replaces.agent`.
        Every token of the earlier lineage is refused from the next
        request. An agent that has left the expected assignment before
        the approval is spent is 409 with reason `superseded`, and a
        retry is answered as a new agent's is.


        The third stage, credential delivery, is `mintAgentToken`:
        `assignee` mints the agent's garam token, and one whose
        `audience` names the hosted control service, in the epoch and
        lineage admission answered. The fourth, activation, is
        `activateAgent` under `execution-fence.v2`, whose first
        activation carries this reference as `operationRef`; after a
        replacement, an agent that was active names the activation the
        replacement ended in `replaces` instead. Neither delivery nor
        admission activates anything by itself.
      parameters:
        - $ref: '#/components/parameters/agentEnrollmentContractVersion'
        - $ref: '#/components/parameters/approval'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentEnrollmentBinding'
      responses:
        '200':
          description: The agent an identical earlier admission admitted.
          headers:
            Garam-Contract-Version:
              $ref: '#/components/headers/AgentEnrollmentContractVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentAdmission'
        '201':
          description: The admitted agent.
          headers:
            Garam-Contract-Version:
              $ref: '#/components/headers/AgentEnrollmentContractVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentAdmission'
        '400':
          $ref: '#/components/responses/AgentEnrollmentContractError'
        '401':
          $ref: '#/components/responses/AgentEnrollmentContractError'
        '403':
          $ref: '#/components/responses/AgentEnrollmentContractError'
        '404':
          $ref: '#/components/responses/AgentEnrollmentContractError'
        '409':
          $ref: '#/components/responses/AgentEnrollmentContractError'
components:
  parameters:
    agentEnrollmentContractVersion:
      name: Garam-Contract-Version
      in: header
      required: true
      description: >-
        `agent-enrollment.v1`, presented beside a token (ADR-0102); any
        other value is refused with 400 naming it.
      x-go-name: AgentEnrollmentContractVersion
      schema:
        type: string
    approval:
      name: approval
      in: path
      required: true
      description: Approval identifier, as `prepareAgentEnrollment` returned it.
      x-go-name: ApprovalId
      schema:
        type: string
    standaloneContractVersion:
      name: Garam-Contract-Version
      in: header
      required: true
      description: >-
        `standalone-enrollment.v1` or, on `enrollStandaloneAgent`,
        `standalone-enrollment.v2` (ADR-0100); any other value is refused
        with 400 naming what the route serves. `renewSupervisorCertificate`
        takes no v2 value.
      x-go-name: StandaloneContractVersion
      schema:
        type: string
    enrollmentContractVersion:
      name: Garam-Contract-Version
      in: header
      required: true
      description: >-
        `managed-enrollment.v1` where the caller presents a certificate
        and, on `createManagedAgent`, `managed-enrollment.v2` where it
        presents a token (ADR-0100); any other value, or one that
        disagrees with the credential, is refused with 400 naming the
        value the credential takes. `issueInitialCertificate` takes no
        token and no v2 value.
      x-go-name: EnrollmentContractVersion
      schema:
        type: string
    tokenContractVersion:
      name: Garam-Contract-Version
      in: header
      required: true
      description: Must be `machine-token.v1` (ADR-0100); any other value is refused with 400 naming it.
      x-go-name: TokenContractVersion
      schema:
        type: string
    deliveryContractVersion:
      name: Garam-Contract-Version
      in: header
      required: true
      description: >-
        `durable-delivery.v1` where the caller presents a certificate and
        `durable-delivery.v2` where it presents an agent token (ADR-0083,
        ADR-0100); any other value, or one that disagrees with the
        credential, is refused with 400 naming the value the credential
        takes.
      x-go-name: DeliveryContractVersion
      schema:
        type: string
    cutoverContractVersion:
      name: Garam-Contract-Version
      in: header
      required: true
      description: >-
        `agent-cutover.v1` where the caller presents a certificate and
        `agent-cutover.v2` where it presents a token (ADR-0086, ADR-0100); any other
        value, or one that disagrees with the credential, is refused
        with 400 naming the value the credential takes.
      x-go-name: CutoverContractVersion
      schema:
        type: string
    executionContractVersion:
      name: Garam-Contract-Version
      in: header
      required: true
      description: >-
        `execution-fence.v1` where the caller presents a certificate and
        `execution-fence.v2` where it presents a token (ADR-0100); any other
        value, or one that disagrees with the credential, is refused
        with 400 naming the value the credential takes.
      x-go-name: ExecutionContractVersion
      schema:
        type: string
    activation:
      name: activation
      in: path
      required: true
      description: Activation identifier, as `activateAgent` returned it.
      x-go-name: ActivationId
      schema:
        type: string
    contractVersion:
      name: Garam-Contract-Version
      in: header
      required: true
      description: >-
        `operation-authority.v1` where the caller presents a certificate and
        `operation-authority.v2` where it presents a token (ADR-0079, ADR-0100); any other
        value, or one that disagrees with the credential, is refused
        with 400 naming the value the credential takes.
      x-go-name: ContractVersion
      schema:
        type: string
    controller:
      name: controller
      in: path
      required: true
      description: The controller's operator GRN.
      x-go-name: ControllerGrn
      schema:
        type: string
    ref:
      name: ref
      in: path
      required: true
      description: Operation reference, as minting the authority returned it.
      x-go-name: OperationRef
      schema:
        type: string
    claim:
      name: claim
      in: path
      required: true
      description: Claim identifier, as `claimMessage` returned it.
      x-go-name: ClaimId
      schema:
        type: string
    agent:
      name: agent
      in: path
      required: true
      description: Agent GRN, as `createAgent` or `listDefinitions` returned it.
      x-go-name: AgentGrn
      schema:
        type: string
    message:
      name: message
      in: path
      required: true
      description: Message identifier, as `postMessage` returned it.
      x-go-name: MessageId
      schema:
        type: string
  schemas:
    Identity:
      type: object
      required: [grn]
      properties:
        grn:
          type: string
          example: grn:acme:default:agent:0a1b2c3d4e5f6071
    AgentAssignment:
      type: object
      description: >-
        An agent and the operator that runs it, at the epoch that
        binding holds.
      required: [grn, operator, epoch]
      properties:
        grn:
          type: string
          example: grn:acme:default:agent:0a1b2c3d4e5f6071
        operator:
          type: string
          example: grn:acme:default:operator:one
        epoch:
          type: integer
          minimum: 1
          description: >-
            Rises with every assignment and fences the operator it
            replaced. An agent presents it when it connects.
    ProvisioningState:
      type: string
      description: >-
        What the operator reports about the agent's pod. `pending` is
        an agent no operator has reported on yet. `provisioned` is an
        agent whose workload an operator built and which reports no
        ready replica: it says the pod was built and nothing about its
        health. `ready` is an agent whose workload reports a ready
        replica, so its containers are running; it says nothing about
        whether the agent inside them works. `failed` is reserved —
        report it only from an observation that separates a workload
        that cannot start from one that is still starting, which a
        ready replica count does not, so a reporter reading that count
        alone reports `provisioned`.
      enum: [pending, provisioned, ready, failed]
    RuntimeState:
      type: string
      description: >-
        What the agent reports about itself. `unknown` is an agent that
        has not reported since it was created.
      enum: [unknown, connected, disconnected]
    ProvisioningStateReport:
      type: object
      description: >-
        One operator's account of an agent's pod, at the epoch it holds
        the agent. It carries no runtime state: what the agent says
        about itself is the agent's to report.
      required: [epoch, state]
      properties:
        epoch:
          type: integer
          minimum: 1
          description: >-
            The epoch the reporter believes the assignment is on, as
            `createAgent` or `claimDefinition` answered with. garam
            accepts the report only at the epoch the assignment is
            currently on.
        state:
          $ref: '#/components/schemas/ProvisioningState'
    RuntimeStateReport:
      type: object
      description: >-
        One agent's account of itself, at the epoch its assignment is
        on. It carries no provisioning state: what the pod looks like
        from outside is the operator's to report.
      required: [epoch, state]
      properties:
        epoch:
          type: integer
          minimum: 1
          description: >-
            The epoch the reporter believes the assignment is on. An
            agent is told it by the operator that constructed it; garam
            serves it to the agent on no route.
        state:
          $ref: '#/components/schemas/RuntimeState'
    TokenExchange:
      type: object
      description: >-
        What an exchange asks for: a token garam accepts, or one minted
        for a hosted operator of the same organization.
      properties:
        audience:
          type: string
          description: >-
            The GRN of another operator of the caller's organization the
            token is to be shown to. Absent, the token is garam's.
          example: grn:acme:default:operator:control
    ClientAssertionRequest:
      type: object
      description: >-
        The client credentials request `exchangeClientAssertion` reads
        (ADR-0102). Each parameter appears once.
      required: [grant_type, client_id, client_assertion_type, client_assertion]
      properties:
        grant_type:
          type: string
          enum: [client_credentials]
        client_id:
          type: string
          description: The operator's canonical GRN, which the assertion's `iss` and `sub` equal.
          example: grn:acme:default:operator:controller
        client_assertion_type:
          type: string
          enum: ['urn:ietf:params:oauth:client-assertion-type:jwt-bearer']
        client_assertion:
          type: string
          maxLength: 8192
          description: One compact RS256 JWT the operator's private key signed; never the key itself.
        audience:
          type: string
          description: >-
            The GRN of another operator of the caller's organization the
            token is to be shown to. Absent, the token is garam's.
          example: grn:acme:default:operator:control
    OAuthToken:
      type: object
      description: RFC 6749's successful token response (ADR-0102).
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
          description: >-
            The token, prefixed `garam_ot_` and opaque, presented as
            `Authorization: Bearer` or `Garam-Token`. garam stores only
            its hash.
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Seconds the token is accepted for, 3600.
          example: 3600
    OAuthError:
      type: object
      description: RFC 6749's error response (ADR-0102).
      required: [error]
      properties:
        error:
          type: string
          enum: [invalid_request, invalid_client, unsupported_grant_type, invalid_scope, temporarily_unavailable, server_error]
          description: >-
            `invalid_request` for a malformed or repeated parameter, a
            client certificate or `Authorization` header, or an audience
            that is not another operator of the organization;
            `invalid_client` for an assertion that authenticates no
            operator; `unsupported_grant_type` for a grant other than
            `client_credentials`; `invalid_scope` for any `scope`;
            `temporarily_unavailable` with 429 or 503; `server_error`
            with 500.
        error_description:
          type: string
    MachineToken:
      type: object
      required: [token, grn, expiresAt]
      properties:
        token:
          type: string
          description: >-
            The token itself, prefixed `garam_ot_` for an operator and
            `garam_st_` for a supervisor, answered once. garam stores
            only its hash.
        grn:
          type: string
          description: The operator or the supervisor the token authenticates as.
          example: grn:acme:default:operator:controller
        audience:
          type: string
          description: The hosted operator the token is minted for, where one was asked for.
        expiresAt:
          type: string
          format: date-time
          description: When garam stops accepting the token.
    AgentToken:
      type: object
      required: [token, grn, epoch, expiresAt, serverRootPem]
      properties:
        token:
          type: string
          description: >-
            The token itself, prefixed `garam_at_`, answered once. garam
            stores only its hash.
        grn:
          type: string
          description: The agent the token authenticates as.
          example: grn:acme:default:agent:0a1b2c3d4e5f6071
        epoch:
          type: integer
          description: The assignment epoch the token was minted at.
        audience:
          type: string
          description: The hosted operator the token is minted for, where one was asked for.
        expiresAt:
          type: string
          format: date-time
          description: When garam stops accepting the token.
        serverRootPem:
          type: string
          description: The garam server root the holder verifies garam by (ADR-0040).
    Enrollment:
      type: object
      description: >-
        What an enrolling operator presents: the token it was given and
        the certificate signing request over the key it generated. The
        key itself does not appear here and never leaves the cluster it
        was made in.
      required: [token, certificateRequestPem]
      properties:
        token:
          type: string
          description: >-
            The one-time enrollment token, as the console showed it
            once. It names the operator this request obtains a
            certificate for, so the request names no subject of its own.
        certificateRequestPem:
          type: string
          description: >-
            A PEM-encoded PKCS#10 certificate signing request over an
            ECDSA P-256 key the caller generated. Its signature is what
            proves the caller holds the private half; nothing else in it
            is read.
    EnrolledCertificate:
      type: object
      description: >-
        What an enrollment answers: the signed certificate, the
        authority that signed it, and the garam server root the holder
        verifies garam by. There is no private key field, and its
        absence is the property rather than an omission — garam signed a
        key it never held and cannot return one (ADR-0064). Contrast
        `MachineCertificate`, which the two routes that generate a key
        pair answer with.
      required: [grn, certificatePem, issuerPem, serverRootPem, notAfter]
      properties:
        grn:
          type: string
          description: >-
            The identity the certificate names, which is also what its
            SAN URI holds. It is the operator the token named.
          example: grn:acme:default:operator:field-one
        certificatePem:
          type: string
        issuerPem:
          type: string
          description: >-
            The authority that signed this certificate. It is not what
            garam is verified against: the two directions rest on
            different roots (ADR-0040).
        serverRootPem:
          type: string
          description: >-
            The garam server root. A holder verifies garam's listener
            against this and against nothing else — one root for every
            organization, separate from the authority above and signing
            only what garam presents (ADR-0040).
        notAfter:
          type: string
          format: date-time
          description: >-
            When the certificate stops being valid. It carries jitter,
            so certificates issued together do not expire together.
    MachineCertificate:
      type: object
      description: >-
        A client certificate, the private key it was issued with, the
        authority that signed it, and the garam server root the holder
        verifies garam by. garam stores no private key, so this one is
        returned once and a holder that loses it asks for another
        certificate. One shape for both routes that generate a key pair:
        what an agent is given and what an operator renews differ in who
        may ask, not in what comes back. An enrollment answers
        `EnrolledCertificate` instead, because garam generated no key
        there and has none to return.
      required: [grn, certificatePem, privateKeyPem, issuerPem, serverRootPem, notAfter]
      properties:
        grn:
          type: string
          description: >-
            The identity the certificate names, which is also what its
            SAN URI holds.
          example: grn:acme:default:agent:0a1b2c3d4e5f6071
        certificatePem:
          type: string
        privateKeyPem:
          type: string
        issuerPem:
          type: string
          description: >-
            The authority that signed this certificate. It is not what
            garam is verified against: the two directions rest on
            different roots (ADR-0040).
        serverRootPem:
          type: string
          description: >-
            The garam server root. A holder verifies garam's listener
            against this and against nothing else — one root for every
            organization, separate from the authority above and signing
            only what garam presents (ADR-0040).
        notAfter:
          type: string
          format: date-time
          description: >-
            When the certificate stops being valid. It carries jitter,
            so certificates issued together do not expire together.
    Definition:
      type: object
      description: >-
        What an organization says an agent should be, answered to the
        operator it names (ADR-0026). `claim` is absent while no
        operator has claimed the definition and carries the agent's
        assignment epoch once one has — the only claimant a definition
        admits is the operator it names, so who claimed it is always
        the caller.
      required: [agentGrn, values]
      properties:
        agentGrn:
          type: string
          description: >-
            The identity garam minted for the agent this definition
            describes. No agent answers under it until the claim.
          example: grn:acme:default:agent:9f2ac1b40d8e7a35
        values:
          type: object
          description: >-
            What the operator constructs the agent from. garam stores
            the keys and the strings and interprets neither.
          additionalProperties:
            type: string
        claim:
          $ref: '#/components/schemas/DefinitionClaim'
    DefinitionClaim:
      type: object
      description: The agent's assignment, first written by the claim (ADR-0033).
      required: [epoch]
      properties:
        epoch:
          type: integer
          minimum: 1
          description: The epoch the agent's assignment holds at now.
    MessageSubmission:
      type: object
      description: What a sender supplies. Who is sending is the certificate's to say.
      required: [recipient, idempotencyKey, body]
      properties:
        recipient:
          type: string
          description: >-
            GRN of the identity the message is addressed to. It does
            not have to name an agent garam knows.
          example: grn:acme:default:agent:0a1b2c3d4e5f6071
        idempotencyKey:
          type: string
          description: >-
            The sender's own key for this message. Posting the same key
            twice stores one message and answers with it both times.
        body:
          type: string
          maxLength: 65536
          description: >-
            The message itself. The queue carries it and never reads
            it, so it may be empty. It is bounded (ADR-0034):
            `maxLength` counts characters, so the bound is 65536 of
            them — well past any plausible agent turn — and UTF-8
            spends up to four bytes on each, so a body weighs up to 256
            KiB. The bound is what keeps the table's worst case
            arithmetic, and 256 KiB is the figure that arithmetic runs
            on: size a buffer or a row estimate against it, not against
            the character count.
    OutboxSubmission:
      type: object
      description: >-
        What a sender supplies for one outbox entry. Who is sending is
        the certificate's to say.
      required: [recipient, idempotencyKey, body, createdAt]
      properties:
        recipient:
          type: string
          description: >-
            GRN of the identity the message is addressed to. It does
            not have to name an agent garam knows.
          example: grn:acme:default:agent:0a1b2c3d4e5f6071
        idempotencyKey:
          type: string
          description: >-
            The entry's own identifier, unchanged on every attempt. The
            first message stored under it is the one every later
            attempt is answered with.
        body:
          type: string
          maxLength: 65536
          description: >-
            The message itself, bounded as `MessageSubmission`'s body is
            (ADR-0034).
        createdAt:
          type: string
          description: >-
            When the entry was created, as an RFC 3339 instant with any
            number of fractional digits, the same on every attempt. It
            is read as text so that garam, not the decoder, refuses one
            that does not parse.
          example: '2026-10-04T18:07:52.123456789Z'
    Message:
      type: object
      description: One stored message, under an identifier the queue minted.
      required: [id, recipient, sender, idempotencyKey, body, createdAt]
      properties:
        id:
          type: string
          description: >-
            The queue's identifier for the message. A message is a queue
            entry rather than a resource a policy names, so it is opaque
            and not a GRN.
        recipient:
          type: string
          example: grn:acme:default:agent:0a1b2c3d4e5f6071
        sender:
          type: string
          example: grn:acme:default:agent:9f8e7d6c5b4a3021
        idempotencyKey:
          type: string
        body:
          type: string
        createdAt:
          type: string
          format: date-time
    MessageState:
      type: string
      description: >-
        How far a message has got. `pending` is waiting for a reader or
        waiting to be handed out again; `claimed` is held by a reader
        whose lease has not run out; `completed` is reported delivered;
        `exhausted` has spent its attempts and is handed out no further
        (ADR-0018). Nothing here means expired — a message the sweep
        deleted is answered by `getMessageStatus` as one that is not
        there (ADR-0055).
      enum: [pending, claimed, completed, exhausted]
    MessageStatus:
      type: object
      description: >-
        What garam knows about one message and its sender does not. It
        carries no body: the sender wrote it, and a completed message
        no longer has one (ADR-0034).
      required: [id, state, attempts, createdAt]
      properties:
        id:
          type: string
          description: The queue's identifier for the message, as `postMessage` answered with.
        state:
          $ref: '#/components/schemas/MessageState'
        attempts:
          type: integer
          minimum: 0
          description: >-
            How many times the message has been handed to a reader.
            Zero is a message nothing has looked at yet, and a rising
            count on a message that is not `completed` is a turn
            failing the same way each time (ADR-0018).
        createdAt:
          type: string
          format: date-time
          description: >-
            When garam stored the message. An undelivered message is
            deleted thirty days after it, so this is what a sender
            measures the retention window against (ADR-0034).
    Claim:
      type: object
      description: >-
        One caller's hold on one message, and the token that fences it.
        A claim also carries the message's content and garam's
        signature over it (ADR-0101); a renewal carries neither, because
        it hands nothing out.
        Renewal and completion carry that token, and a hold handed on to
        the next caller stops matching.
      required: [id, expiresAt, attempt, watchers, message]
      properties:
        id:
          type: string
          description: The claim's identifier, which renewal and completion name.
        expiresAt:
          type: string
          format: date-time
          description: >-
            When the hold lapses and the message is handed to the next
            caller. garam measures it, so no caller's clock decides it.
        attempt:
          type: integer
          minimum: 1
          description: >-
            Which delivery of this message the caller is holding.
            Delivery is at-least-once (ADR-0018), so this is what tells
            a first delivery from a repeat; a message that reaches the
            bound is not handed out again.
        watchers:
          type: integer
          minimum: 0
          description: >-
            How many streams garam was holding for this agent when it
            answered, which is what says whether to forward the turn's
            events (ADR-0022). Zero is the ordinary answer and the field
            is always here: garam stores nothing for an agent nobody
            watches, so it is answered in the same shape as one somebody
            watches. Every renewal carries the count again, so a person
            who opened the view mid-turn is seen without a call of their
            own — and one who left is stopped forwarding to.
        message:
          $ref: '#/components/schemas/Message'
        content:
          type: string
          description: >-
            What the runtime is handed for this message: the
            `garam-message.v1` object of `contract`, `sender` and `body`,
            in that order, encoded so that every attempt of one message
            carries the same characters. `signature` binds a SHA-256 over
            their UTF-8 octets, so a relay forwards them unaltered.
        signature:
          type: string
          description: >-
            garam's signature over this hand-out, a compact JWS signed
            with ES256 and typed `agent-message+jwt` (ADR-0101). Its
            claims name the issuer, the sender garam vouches for, the
            recipient as audience and its organization, the message's
            identifier, the content's digest, and an expiry the lease
            ceiling after the claim was taken. Each claim signs afresh,
            and every attempt of one message carries the same content
            and identifier under it.
    MessageSigningKeySet:
      type: object
      description: A JWK Set (RFC 7517) of the keys garam signs messages with.
      required: [keys]
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/MessageSigningKey'
    MessageSigningKey:
      type: object
      description: >-
        One public P-256 key as a JWK. `kid` is its JWK thumbprint
        (RFC 7638), which is what a signature's header names.
      required: [kid, kty, crv, alg, use, x, 'y']
      properties:
        kid:
          type: string
        kty:
          type: string
          enum: [EC]
        crv:
          type: string
          enum: [P-256]
        alg:
          type: string
          enum: [ES256]
        use:
          type: string
          enum: [sig]
        x:
          type: string
          description: The x coordinate, base64url without padding.
        'y':
          type: string
          description: The y coordinate, base64url without padding.
    TurnEvent:
      type: object
      description: >-
        One event from the agent's monitoring stream, as the agent
        platform emitted it. garam carries it and never reads it, so
        what a kind means and what a body holds are the platform's to
        say.
      required: [kind, body]
      properties:
        kind:
          type: string
          maxLength: 64
          description: >-
            What the platform called this event. It reaches a browser as
            the name of a server-sent event, so it is one line.
        body:
          type: string
          maxLength: 4000
          description: >-
            The event itself. It may be empty and it may span lines.
    AuthorityIntrospection:
      type: object
      required: [authority]
      properties:
        authority:
          type: string
          description: The opaque authority, carried in the body so it never reaches a URL.
    OperationBinding:
      type: object
      required: [operationRef, grantId, orgGrn, actorGrn, audienceGrn, operation, targetGrn, requestId, bodySha256]
      properties:
        operationRef:
          type: string
        grantId:
          type: string
        orgGrn:
          type: string
        actorGrn:
          type: string
          description: The user the operation is performed for.
        audienceGrn:
          type: string
        operation:
          type: string
          enum: [agent:create, agent:configure, agent:recover, agent-template:read, agent-template:publish, execution-profile:read, agent:execution-read, agent:cutover, operator:read, agent:replace]
          description: >-
            Each operation is served on one route with one fixed HTTP
            method. A release that does not know an operation refuses
            to mint it rather than minting it without its binding.
        targetGrn:
          type: string
          description: >-
            The controller for `agent:create`; the agent for
            `agent:configure`, `agent:recover`,
            `agent:execution-read`, `agent:cutover` and
            `agent:replace`; the organization
            for
            `agent-template:read`, `agent-template:publish`,
            `execution-profile:read` and `operator:read`.
        assignment:
          $ref: '#/components/schemas/BoundAssignment'
        destinationGrn:
          type: string
          description: >-
            Present for `agent:replace` alone: the controller the
            replacement moves the agent to, which
            `admitAgentEnrollment` compares with the binding's assignee
            (ADR-0107).
        requestId:
          type: string
        bodySha256:
          type: string
        requestTarget:
          type: string
          maxLength: 2048
          description: >-
            Present for `agent-template:read`, `agent-template:publish`,
            `execution-profile:read`, `agent:execution-read`,
            `agent:cutover` and `operator:read`, absent for every other operation. For
            `agent:cutover` it is garam's own cutover route the
            reference is carried to, and garam compares it (ADR-0086).
            Otherwise it is the exact origin-form
            request target the console sent: the escaped path and the
            raw query, with no scheme or authority, including any path
            prefix of the registered control endpoint. Compare it, before
            decoding, routing or reading any data, with the target the
            request arrived with, byte for byte; the empty body's digest
            does not tell one read from another.
        expiresAt:
          type: string
          format: date-time
          description: When the presented authority stops being usable. Absent on a reference check.
    BoundAssignment:
      type: object
      required: [operatorGrn, epoch]
      description: >-
        Where the agent ran when an operation on it was authorized.
        Present for `agent:configure`, `agent:recover`,
        `agent:execution-read`, `agent:cutover` and `agent:replace`
        only.
      properties:
        operatorGrn:
          type: string
        epoch:
          type: string
          description: Opaque.
    ControllerIntrospection:
      type: object
      properties:
        certificatePem:
          type: string
          description: >-
            Under `operation-authority.v1`, the controller's leaf
            certificate in PEM form, exactly as the controller presented
            it in its TLS handshake with the caller. Required there, and
            refused under `operation-authority.v2`.
        token:
          type: string
          pattern: '^garam_ot_[0-9a-f]{64}$'
          description: >-
            Under `operation-authority.v2`, the token the controller
            exchanged its credential for to be shown to the caller,
            exactly as the controller presented it (ADR-0100). Required
            there, and refused under `operation-authority.v1`.
        agent:
          type: [string, 'null']
          description: >-
            An agent GRN, to prove that agent's placement on the
            controller. Absent or null proves the controller alone.
    ControllerProof:
      type: object
      required: [operator, org, agent]
      properties:
        operator:
          type: string
          description: The controller's GRN.
        org:
          type: string
          description: The organization's GRN.
        agent:
          description: The agent's current placement, null where no agent was supplied.
          oneOf:
            - $ref: '#/components/schemas/ProvenAgent'
            - type: 'null'
    ProvenAgent:
      type: object
      required: [grn, epoch]
      properties:
        grn:
          type: string
        epoch:
          type: string
          description: The current assignment's epoch. Opaque; compare it for equality only.
    ActivationRequest:
      type: object
      required: [requestId, epoch, generation, replacesActivationId, operationRef]
      properties:
        requestId:
          type: string
          pattern: '^[A-Za-z0-9._~-]{1,128}$'
        epoch:
          type: string
          description: The assignment's epoch the caller expects. Opaque.
        generation:
          type: string
          pattern: '^[0-9a-f]{32}$'
          description: The runtime's start nonce for this process.
        replacesActivationId:
          type: [string, 'null']
          description: The agent's most recent activation, null only before the first.
        operationRef:
          type: [string, 'null']
          description: >-
            A durable `agent:configure` reference for a pending
            revision, or a managed agent's own `agent:create` reference
            for its first activation; null otherwise.
        certificatePem:
          type: string
          maxLength: 8192
          description: >-
            Under `execution-fence.v1`, the agent's leaf certificate in
            PEM form, exactly as the agent presented it to the caller.
            Required there, and refused under `execution-fence.v2`.
        token:
          type: string
          pattern: '^garam_at_[0-9a-f]{64}$'
          description: >-
            Under `execution-fence.v2`, the agent's token its assignee
            minted to be shown to the caller, or, where the caller is
            the assignee itself — a standalone host's supervisor — the
            token it minted for garam, exactly as the agent presented it
            (ADR-0100). Required there, and refused under
            `execution-fence.v1`.
    Activation:
      type: object
      required: [activationId, token, tokenVersion, grn, epoch, generation, lineage]
      properties:
        activationId:
          type: string
        token:
          type: string
          description: >-
            What the runtime's calls carry as `Authorization:
            Garam-Execution <token>`. Shown once; garam keeps its hash.
        tokenVersion:
          type: integer
          minimum: 1
          description: Rises with every token issued for this activation; keep the highest.
        grn:
          type: string
        epoch:
          type: string
          description: Opaque.
        generation:
          type: string
        lineage:
          type: [string, 'null']
          description: The credential lineage checked, null for the certificates issued before any recovery.
    Cutover:
      type: object
      required: [agent, assignee, epoch, mode, class, source, sourceDigest, attempt]
      properties:
        agent:
          type: string
        assignee:
          type: string
          description: The operator the agent is assigned to now.
        epoch:
          type: string
          description: The assignment's epoch. Opaque.
        mode:
          type: string
          enum: [legacy, fenced]
        class:
          type: string
          enum: [eligible, 'blocked:unparseable', not-applicable]
          description: >-
            `eligible` for a legacy agent whose source garam can read,
            `blocked:unparseable` for one whose stored values it cannot,
            which stay preserved, and `not-applicable` for an agent whose
            execution is already fenced.
        source:
          oneOf:
            - $ref: '#/components/schemas/CutoverSource'
            - type: 'null'
        sourceDigest:
          type: [string, 'null']
          pattern: '^[0-9a-f]{64}$'
        attempt:
          oneOf:
            - $ref: '#/components/schemas/CutoverAttempt'
            - type: 'null'
    CutoverSource:
      type: object
      required: [operator, values, definedBy, createdAt]
      properties:
        operator:
          type: string
        values:
          type: object
          additionalProperties:
            type: string
          description: The definition's values, every one verbatim.
        definedBy:
          type: string
        createdAt:
          type: string
          format: date-time
    CutoverAttempt:
      type: object
      required: [importId, stage, frozenDigest, createdAt, switchedAt, endedAt]
      properties:
        importId:
          type: string
        stage:
          type: string
          enum: [frozen, switched, rolled_back]
        frozenDigest:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: The source digest the freeze verified.
        createdAt:
          type: string
          format: date-time
        switchedAt:
          type: [string, 'null']
          format: date-time
        endedAt:
          type: [string, 'null']
          format: date-time
          description: When the attempt was rolled back.
    CutoverError:
      type: object
      description: >-
        `Error` as the cutover routes answer it, with the closed set of
        reasons `agent-cutover.v1` lists (ADR-0086). A refusal outside
        the set carries no `reason`.
      required: [kind, message]
      properties:
        kind:
          type: string
          description: errorx kind, e.g. `not_found`, `permission_denied`.
        message:
          type: string
        reason:
          type: string
          enum: [digest_mismatch, attempt_open, attempt_ended, not_cut_over_eligible, reverse_migration_required]
    CutoverFreezeRequest:
      type: object
      required: [importId, sourceDigest, epoch]
      properties:
        importId:
          type: string
          pattern: '^[A-Za-z0-9._~-]{1,128}$'
          description: The Operator's identifier for the import, which names the attempt.
        sourceDigest:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: The digest the Operator verified its import against.
        epoch:
          type: string
          description: The assignment's epoch the import read. Opaque.
    CutoverStageRequest:
      type: object
      required: [importId]
      properties:
        importId:
          type: string
          pattern: '^[A-Za-z0-9._~-]{1,128}$'
    ExecutionIntrospectionRequest:
      type: object
      properties:
        certificatePem:
          type: string
          maxLength: 8192
          description: >-
            Under `execution-fence.v1`, the agent's leaf certificate in
            PEM form, exactly as the agent presented it to the caller.
            Required there, and refused under `execution-fence.v2`.
        token:
          type: string
          pattern: '^garam_at_[0-9a-f]{64}$'
          description: >-
            Under `execution-fence.v2`, the agent's token its assignee
            minted to be shown to the caller, or, where the caller is
            the assignee itself — a standalone host's supervisor — the
            token it minted for garam, exactly as the agent presented it
            (ADR-0100). Required there, and refused under
            `execution-fence.v1`.
        generation:
          type: [string, 'null']
          description: A generation to compare with the active one.
    ExecutionIntrospection:
      type: object
      required: [grn, org, assignee, epoch, mode, credential, generation, activationId]
      properties:
        grn:
          type: string
        org:
          type: string
        assignee:
          type: string
          description: What the agent is assigned to, an operator or a supervisor.
        epoch:
          type: string
          description: Opaque.
        mode:
          type: string
          enum: [legacy, fenced]
          description: >-
            `fenced` once the agent has been activated, and from its
            creation for an agent `createManagedAgent` made.
        credential:
          type: string
          enum: [current, fenced]
        generation:
          type: string
          enum: [current, not_current, none, not_supplied]
          description: >-
            With a generation supplied, whether it is the active one;
            without one, `none` when no generation is active and
            `not_supplied` otherwise.
        activationId:
          type: [string, 'null']
          description: The current activation, null when none is.
    CredentialRecoveryRequest:
      type: object
      required: [requestId, epoch]
      properties:
        requestId:
          type: string
          pattern: '^[A-Za-z0-9._~-]{1,128}$'
        epoch:
          type: string
          description: The assignment's epoch the caller expects. Opaque.
        certificateRequestPem:
          type: string
          maxLength: 4096
          description: >-
            Under `execution-fence.v1`, a PEM-encoded PKCS#10 request
            over an ECDSA P-256 key the holder generated; only its key is
            read. Required there, and refused under `execution-fence.v2`,
            whose recovery signs nothing: the assignee mints the agent's
            tokens in the new lineage (ADR-0100).
    RecoveredCredential:
      type: object
      description: >-
        The agent and its new lineage. Under `execution-fence.v1` it adds
        the recovered certificate, the authority that signed it and the
        garam server root the holder verifies garam by, and carries no
        private key; under `execution-fence.v2` it carries none of the
        three (ADR-0100).
      required: [grn, lineage]
      properties:
        grn:
          type: string
        lineage:
          type: string
        certificatePem:
          type: string
        issuerPem:
          type: string
          description: >-
            The authority that signed `certificatePem`. It is not what
            garam is verified against (ADR-0040).
        serverRootPem:
          type: string
          description: >-
            The garam server root the recovered credential trusts, which
            the holder verifies garam's listener against (ADR-0040).
    AgentEnrollmentBinding:
      type: object
      required: [requestId, placement, assignee, operationRef]
      properties:
        requestId:
          type: string
          pattern: '^[A-Za-z0-9._~-]{1,128}$'
          description: The request identifier the member's reference was minted under.
        placement:
          type: string
          enum: [managed, direct]
          description: >-
            Where the runtime runs: `managed`, provisioned by the
            Operator, or `direct`, running independently of it, which is
            refused until #1355 decides its writer proof.
        assignee:
          type: string
          description: The operator GRN the agent is assigned to, its controller.
        operationRef:
          type: string
          description: >-
            The member's durable `agent:create` reference, or for a
            replacement its `agent:replace` reference.
        replaces:
          $ref: '#/components/schemas/AgentEnrollmentReplacement'
    AgentEnrollmentReplacement:
      type: object
      required: [agent, expectedAssignee, expectedEpoch]
      description: >-
        The agent a replacement moves and the assignment it expects to
        move it from (ADR-0107).
      properties:
        agent:
          type: string
        expectedAssignee:
          type: string
        expectedEpoch:
          type: string
    AgentEnrollmentApproval:
      type: object
      required: [approvalId, requestId, placement, assignee, operationRef]
      properties:
        approvalId:
          type: string
          format: uuid
        requestId:
          type: string
        placement:
          type: string
          enum: [managed]
        assignee:
          type: string
        operationRef:
          type: string
        replaces:
          $ref: '#/components/schemas/AgentEnrollmentReplacement'
    AgentAdmission:
      type: object
      required: [grn, placement, assignee, epoch, lineage, mode, credentialDelivery]
      properties:
        grn:
          type: string
          example: grn:acme:default:agent:0a1b2c3d4e5f6071
        placement:
          type: string
          enum: [managed]
        assignee:
          type: string
        epoch:
          type: string
          description: >-
            The epoch admission assigned: a new agent's first, or the
            one a replacement raised. Opaque.
        lineage:
          type: string
          format: uuid
          description: The credential lineage the agent's tokens are minted in.
        mode:
          type: string
          enum: [fenced]
          description: >-
            The execution's mode: fenced from admission, with no active
            generation.
        credentialDelivery:
          type: string
          enum: [mintAgentToken]
          description: The operation `assignee` delivers the agent's tokens with.
    ManagedAgentRequest:
      type: object
      required: [requestId, operationRef]
      properties:
        requestId:
          type: string
          pattern: '^[A-Za-z0-9._~-]{1,128}$'
          description: The request identifier the member's `agent:create` reference was minted under.
        operationRef:
          type: string
          description: The member's durable `agent:create` reference.
    ManagedAgent:
      type: object
      required: [grn, epoch]
      properties:
        grn:
          type: string
          example: grn:acme:default:agent:0a1b2c3d4e5f6071
        epoch:
          type: string
          description: The first assignment's epoch. Opaque.
    InitialCertificateRequest:
      type: object
      required: [requestId, epoch, certificateRequestPem, operationRef]
      properties:
        requestId:
          type: string
          pattern: '^[A-Za-z0-9._~-]{1,128}$'
        epoch:
          type: string
          description: The assignment's epoch the caller expects. Opaque.
        certificateRequestPem:
          type: string
          maxLength: 4096
          description: >-
            One PEM-encoded PKCS#10 request over an ECDSA P-256 key the
            controller generated. Only its key is read.
        operationRef:
          type: string
          description: The `agent:create` reference of this agent's creation.
    StandaloneEnrollmentRequest:
      type: object
      required: [requestId]
      properties:
        requestId:
          type: string
          description: The identifier the host chose and the administrator approved.
        supervisorCertificateRequestPem:
          type: string
          maxLength: 4096
          description: >-
            A PKCS#10 request over the supervisor key whose fingerprint was
            approved. Required under `standalone-enrollment.v1`, and
            refused under v2.
        agentCertificateRequestPem:
          type: string
          maxLength: 4096
          description: >-
            A PKCS#10 request over the agent key whose fingerprint was
            approved. Required under `standalone-enrollment.v1`, and
            refused under v2.
    StandaloneEnrollment:
      type: object
      description: >-
        What an enrollment issued and the garam server root the host
        verifies garam by: under `standalone-enrollment.v1` both
        certificates and the authority that signed them, carrying no
        private key; under v2 the supervisor's credential (ADR-0100).
      required: [grn, supervisorGrn, epoch, lineage, serverRootPem, placement]
      properties:
        grn:
          type: string
          description: The agent's GRN.
        supervisorGrn:
          type: string
        epoch:
          type: string
          description: Opaque. The assignment epoch the supervisor holds the agent at.
        lineage:
          type: string
          format: uuid
        supervisorCertificatePem:
          type: string
          description: Under `standalone-enrollment.v1` alone.
        agentCertificatePem:
          type: string
          description: Under `standalone-enrollment.v1` alone.
        issuerPem:
          type: string
          description: >-
            The authority that signed both, under
            `standalone-enrollment.v1` alone. It is not what garam is
            verified against (ADR-0040).
        credential:
          type: string
          description: >-
            Under `standalone-enrollment.v2` alone: the supervisor's
            credential, prefixed `garam_sc_`, answered by this call alone.
            garam stores only its hash, and a retry re-issues it.
        serverRootPem:
          type: string
          description: The garam server root, which the host verifies garam's listener against (ADR-0040).
        placement:
          type: string
          enum: [standalone, direct]
          description: >-
            Where the host runs its agent's runtime, as the approval
            named it: started by the supervisor, or attached to
            (ADR-0111).
        replacesActivationId:
          type: string
          format: uuid
          description: >-
            Under a replacement alone: the agent's most recent
            activation as the replacement found it, current or ended,
            read under the execution lock the move held. The new
            supervisor's first `activateAgent` names it as
            `replacesActivationId`, which garam requires, and a host
            whose supervisor has never activated has no other way to
            learn it. A replay answers the same one. Absent for a new
            agent and for an agent never activated.
    SupervisorRenewalRequest:
      type: object
      required: [requestId, certificateRequestPem]
      properties:
        requestId:
          type: string
        certificateRequestPem:
          type: string
          maxLength: 4096
    InitialCertificate:
      type: object
      description: >-
        A managed agent's first certificate, the authority that signed
        it and the garam server root the holder verifies garam by. It
        carries no private key: the key stays where it was generated.
      required: [certificatePem, issuerPem, serverRootPem, notAfter]
      properties:
        certificatePem:
          type: string
        issuerPem:
          type: string
          description: >-
            The authority that signed this certificate. It is not what
            garam is verified against (ADR-0040).
        serverRootPem:
          type: string
          description: The garam server root, which the holder verifies garam's listener against (ADR-0040).
        notAfter:
          type: string
          format: date-time
          description: When the certificate stops being valid.
    Error:
      type: object
      required: [kind, message]
      properties:
        kind:
          type: string
          description: errorx kind, e.g. `not_found`, `permission_denied`.
        message:
          type: string
        reason:
          type: string
          description: >-
            Which refusal this is, where the kind alone does not say,
            set only on a route whose contract lists its reasons
            (ADR-0086) and absent everywhere else. The `agent-cutover.v1`
            routes set `digest_mismatch`, `attempt_open`,
            `attempt_ended`, `not_cut_over_eligible` or
            `reverse_migration_required`; `activateAgent` sets
            `cutover_required` and nothing else; the
            `agent-enrollment.v1` routes set `binding_conflict`,
            `approval_spent`, `superseded` or
            `direct_placement_requires_administrator_approval`.
            Branch on it only on
            those routes; a new reason is a new contract value.
  headers:
    AssertionContractVersion:
      description: The contract version this answer follows, `machine-token.v2`.
      schema:
        type: string
        enum: [machine-token.v2]
    RetryAfter:
      description: Seconds until the window that refused the request closes.
      schema:
        type: integer
    NoStore:
      description: '`no-store`: the answer carries a bearer token no cache keeps.'
      schema:
        type: string
        enum: [no-store]
    NoCache:
      description: '`no-cache`, for HTTP/1.0 caches.'
      schema:
        type: string
        enum: [no-cache]
    TokenContractVersion:
      description: The contract version this answer follows, `machine-token.v1`.
      schema:
        type: string
    AgentEnrollmentContractVersion:
      description: The contract version this answer follows, `agent-enrollment.v1`.
      schema:
        type: string
    StandaloneContractVersion:
      description: >-
        The contract version this answer follows: `standalone-enrollment.v1`
        or `standalone-enrollment.v2`, as the request named.
      schema:
        type: string
    EnrollmentContractVersion:
      description: >-
        The contract version this answer follows: `managed-enrollment.v1` or
        `managed-enrollment.v2`, as the request's credential takes.
      schema:
        type: string
    DeliveryContractVersion:
      description: >-
        The contract version this answer follows: `durable-delivery.v1`
        or `durable-delivery.v2`, as the request's credential takes.
      schema:
        type: string
    CutoverContractVersion:
      description: >-
        The contract version this answer follows: `agent-cutover.v1` or
        `agent-cutover.v2`, as the request's credential takes.
      schema:
        type: string
    ExecutionContractVersion:
      description: >-
        The contract version this answer follows: `execution-fence.v1` or
        `execution-fence.v2`, as the request's credential takes.
      schema:
        type: string
    ContractVersion:
      description: >-
        The contract version this answer follows: `operation-authority.v1` or
        `operation-authority.v2`, as the request's credential takes.
      schema:
        type: string
  responses:
    Error:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    OAuthError:
      description: RFC 6749's error response of the client assertion exchange.
      headers:
        Garam-Contract-Version:
          $ref: '#/components/headers/AssertionContractVersion'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OAuthError'
    TokenContractError:
      description: Error response of the token exchange.
      headers:
        Garam-Contract-Version:
          $ref: '#/components/headers/TokenContractVersion'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AgentEnrollmentContractError:
      description: Error response of an agent-enrollment.v1 route.
      headers:
        Garam-Contract-Version:
          $ref: '#/components/headers/AgentEnrollmentContractVersion'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    StandaloneContractError:
      description: Error response of a standalone enrollment route.
      headers:
        Garam-Contract-Version:
          $ref: '#/components/headers/StandaloneContractVersion'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    EnrollmentContractError:
      description: Error response of a managed enrollment route.
      headers:
        Garam-Contract-Version:
          $ref: '#/components/headers/EnrollmentContractVersion'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    DeliveryContractError:
      description: Error response of the durable submission route.
      headers:
        Garam-Contract-Version:
          $ref: '#/components/headers/DeliveryContractVersion'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    CutoverContractError:
      description: Error response of a cutover route.
      headers:
        Garam-Contract-Version:
          $ref: '#/components/headers/CutoverContractVersion'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CutoverError'
    ExecutionContractError:
      description: Error response of an execution route.
      headers:
        Garam-Contract-Version:
          $ref: '#/components/headers/ExecutionContractVersion'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ContractError:
      description: Error response of a versioned contract route.
      headers:
        Garam-Contract-Version:
          $ref: '#/components/headers/ContractVersion'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    machineToken:
      type: http
      scheme: Garam-Token
      description: >-
        A token `exchangeToken` or `mintAgentToken` answered, as
        `Authorization: Garam-Token <token>`, presented without a client
        certificate (ADR-0100). The listener reads the token's row joined
        to what it rests on for every request — an operator's
        registration, an agent's assignment and lineage — so a token
        whose operator was deleted or whose credential was re-issued,
        and an agent's after a reassignment or a recovery, is refused
        from the next request. A token minted for another audience is
        refused on every operation that lists this scheme. garam stores
        only its hash.
    machineBearer:
      type: http
      scheme: bearer
      description: >-
        The same token `machineToken` carries, as `Authorization: Bearer
        <token>` (ADR-0102, RFC 6750): resolved by the same read, held
        to the same operations, contract values and refusals, and never
        read as a certificate when it proves nothing. The scheme name
        matches case-insensitively.
    executionHeader:
      type: apiKey
      in: header
      name: Garam-Execution
      description: >-
        The token an activation issued, in a header of its own, on a
        request whose `Authorization` carries an agent token
        (`machineToken`), which takes that header (ADR-0100). It means
        what `executionToken` means beside a certificate.
    machineCredential:
      type: http
      scheme: Garam-Credential
      description: >-
        An operator's credential, as `Authorization: Garam-Credential
        <credential>`, which `exchangeToken` alone accepts (ADR-0100).
        It is issued once in the console and stored there only as a
        hash.
    executionToken:
      type: http
      scheme: Garam-Execution
      description: >-
        The token an activation issued, as `Authorization:
        Garam-Execution <token>` beside the client certificate. An agent
        whose execution has been activated presents it on every call
        that offers this scheme, and is refused without it; one never
        activated presents none, and is refused with one. garam stores
        only its hash.
    operationHeader:
      type: apiKey
      in: header
      name: Garam-Operation
      description: >-
        What `operationAuthority` carries, in a header of its own, on a
        request whose `Authorization` carries a token (`machineToken`),
        which takes that header (ADR-0100). It means what
        `operationAuthority` means beside a certificate.
    operationAuthority:
      type: http
      scheme: Garam-Operation
      description: >-
        A user's handoff for one operation, as `Authorization:
        Garam-Operation <authority>` beside the client certificate. It
        is minted for the exact request body it accompanies. On the
        cutover routes it carries instead the durable `agent:cutover`
        reference such a handoff was minted under, which binds that
        route's request target rather than a body and is rechecked from
        current state on every call (ADR-0086).
    machineCertificate:
      type: mutualTLS
      description: >-
        The client certificate the listener requires. Its SAN URI holds
        the caller's GRN and nothing else — no roles and no claims.
