                $ref: '#/components/schemas/CutoverAttempt'
        '400':
          $ref: '#/components/responses/CutoverContractError'
        '401':
          $ref: '#/components/responses/CutoverContractError'
        '403':
          $ref: '#/components/responses/CutoverContractError'
        '404':
          $ref: '#/components/responses/CutoverContractError'
        '409':
          $ref: '#/components/responses/CutoverContractError'
  /operators/{controller}/managed-agents:
    post:
      operationId: createManagedAgent
      tags: [enrollment]
      security:
        - machineCertificate: []
        - machineToken: []
        - machineBearer: []
      summary: Create an agent assigned to a controller, under a member's agent:create reference.
      description: >-
        The caller is the hosted Operator control service, the
        reference's audience. Before anything is created or an earlier
        creation answered, garam rechecks `operationRef` from current
        state: it must be an `agent:create` reference handed to this
        caller in its own organization, its grant must still cover
        `agent:create` for `controller`, the controller must still be
        registered, and the member it was minted for must still hold
        `agent:create`. The reference must bind this `controller` and
        this `requestId`. No lifecycle authority is read: creating an
        inactive identity is not activating one.


        garam mints the GRN and writes the agent, its first assignment
        to `controller` and its execution in one transaction, so a
        failure leaves no agent behind. The execution is fenced from
        birth with no active generation and in a credential lineage
        holding no certificate, so no certificate of the agent
        authorizes anything until `issueInitialCertificate` records
        the first one, and `issueAgentCertificate` and claiming a
        definition never reach it.


