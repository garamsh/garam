            application/json:
              schema:
                $ref: '#/components/schemas/CutoverAttempt'
        '201':
          description: The frozen attempt.
          headers:
            Garam-Contract-Version:
              $ref: '#/components/headers/CutoverContractVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CutoverAttempt'
        '400':
          $ref: '#/components/responses/CutoverContractError'
        '401':
          $ref: '#/components/responses/CutoverContractError'
        '403':
          $ref: '#/components/responses/CutoverContractError'
        '404':
          $ref: '#/components/responses/CutoverContractError'
        '409':
          $ref: '#/components/responses/CutoverContractError'
        '422':
          $ref: '#/components/responses/CutoverContractError'
  /agents/{agent}/cutover/switch:
