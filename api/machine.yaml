      security:
        - machineCertificate: []
        - machineToken: []
        - machineBearer: []
      summary: End an activation of an agent, if it is still the current one.
      description: >-
        Authorized as `activateAgent` is, on every call. Ending the
        current activation refuses its token from the next call on, on
        a connection already open too. An activation that already ended
        is answered the same and nothing changes, so a replayed request
        never reaches its successor. Deactivation never moves the anchor
        `replacesActivationId` names: the next activation names the
        agent's most recent activation, which is this one only if
        nothing replaced it. This fences collaboration only: it does not
        stop the runtime's writer. Past garam's ten-second deadline the
        answer is 503; repeating the request is safe.
      parameters:
        - $ref: '#/components/parameters/executionContractVersion'
        - $ref: '#/components/parameters/agent'
        - $ref: '#/components/parameters/activation'
      responses:
        '200':
          description: The activation is not current.
          headers:
            Garam-Contract-Version:
              $ref: '#/components/headers/ExecutionContractVersion'
        '400':
          $ref: '#/components/responses/ExecutionContractError'
        '401':
          $ref: '#/components/responses/ExecutionContractError'
        '403':
          $ref: '#/components/responses/ExecutionContractError'
        '404':
          $ref: '#/components/responses/ExecutionContractError'
