openapi: 3.1.0
info:
  title: garam machine API
  version: 0.1.0
  description: >-
    What `garam serve machine` serves (ADR-0017). A caller is a client
    certificate whose SAN URI holds its GRN (ADR-0014, ADR-0015): no
    session cookie and no user row exist on this listener, a caller
    presents no membership and none is looked up to admit it, and the
    organization segment of that GRN is the whole of the tenancy it
    carries. This is a different listener from the one
    `api/openapi.yaml` describes and shares nothing with it.

    A caller may present a short-lived token instead, as
    `Authorization: Garam-Token <token>`, on the operations whose
    `security` lists `machineToken` and on no other (ADR-0100). An
    operator obtains one from `exchangeToken`, presenting the
    credential its organization issued it, and mints one for an agent
    it holds from `mintAgentToken`. The listener reads a token's row
    beside what it rests on, on every request: a deleted operator, a
    re-issued credential, a reassigned agent or a recovered lineage
    is refused from the next request on a connection already open
    too. A request presents a token or a certificate, never both.

    `Authorization: Bearer <token>` is the same token under the OAuth
    scheme (ADR-0102), listed as `machineBearer` beside every
    `machineToken`: one resolver reads it, with the same confinement,
    per-request reads and v2 contract values. A request carrying more
    than one `Authorization` header while any of them presents a token
    carries no identity. An operator registered with a key obtains a
    token from `exchangeClientAssertion` under `machine-token.v2`,
    authenticated by a client assertion its private key signed.

    Four operations are reached without a certificate, and each
    carries `security: []`. Two are how a caller obtains its first
    certificate: `enrollOperator` is authenticated by the one-time
    token the console minted (ADR-0064), and `enrollStandaloneAgent` by
    the bootstrap secret whose hash an administrator approved
    (ADR-0082). The third, `getMessageSigningKeys`, publishes the
    public keys a verifier checks garam's signature on a message with
    (ADR-0101), which anyone may read. The fourth,
    `exchangeClientAssertion`, is authenticated by the client assertion
    in its body (ADR-0102). `exchangeToken` is reached without one too,
    authenticated by the operator's credential under
    `machineCredential`. Every other operation requires the
    certificate, or a token where it lists `machineToken`, and which is
    which is read from this file rather than remembered. An enrolling caller still verifies garam against the
    garam server root, which it holds before it calls: the listener
    presents that root's leaf to everyone (ADR-0040), and a caller that
    does not check it is talking to whoever answered.

    An operation's `responses` list is what it answers when garam is
    working, and is not the complete set of statuses it can return. No
    operation declares a 5xx, because a 5xx belongs to the listener
    rather than to a route (ADR-0050): every operation can answer
    `500`, and one that reaches the policy engine or the database
    answers `503` when that dependency is unreachable. Both carry the
    `Error` schema with `message` set to `internal error` — a 5xx names
    no cause, and what a caller does next is on the status line. `501`
    and `504` are in garam's kind mapping and nothing produces them.
    `exchangeClientAssertion` is the exception: it answers RFC 6749's
    error body at every status, its `503` included, because a stock
    OAuth client reads that and not `Error` (ADR-0102).

    `version` above is required by OpenAPI and promises nothing
    (ADR-0049). garam publishes no release of this contract and no
    compatibility window, and the number does not move when this
    surface changes: do not read stability, a deprecation notice or a
    breaking change out of it. The tag garam publishes its images under
    names a build and not this document (ADR-0039).
tags:
  - name: identity
    description: >-
      The identity a connection authenticated as, and the certificate
      it authenticated with. An operator obtains its first certificate
      here by enrolling with a one-time token (ADR-0064), and replaces
      that certificate here while it still holds it (ADR-0046). Both
      routes leave the private key where it was generated: the renewal
      generates it inside the answer and returns it once, and the
      enrollment never has it, because the operator made it in its own
      cluster and sent only the request over it.
  - name: agent
    description: >-
      The agents an operator creates and holds, and what the two
      parties report about them. What an operator may obtain is exactly
      the agents assigned to it at the current epoch (ADR-0015), and
      what it may report about is bounded the same way. An agent
      reaches two routes of its own here: it renews its own certificate
      over the connection that certificate authenticated (ADR-0040),
      and it reports its own runtime state. Provisioning state and
      runtime state are separate facts reported by different parties,
      and each report is accepted only at the assignment's current
      epoch (ADR-0012).
  - name: definition
    description: >-
      What an organization said its agents should be, read by the
      operator each definition names (ADR-0026). garam accepts no new
      definition (ADR-0090): those it holds are what is answered here,
      each as it was written. An operator polls its
      definitions and claims one, which binds it to the agent GRN the
      definition minted and admits it to that agent's certificate route
      (ADR-0033).
  - name: message
    description: >-
      The queue a message reaches an agent through (ADR-0013). A caller
      posts inside its own organization to the recipients its policies
      reach (ADR-0024), and outside it only where both organizations
      consent (ADR-0035). It acts on messages for the agent it
      authenticates as and no other, and it reads back the state of the
      messages it sent and of no others (ADR-0055). garam announces
      none of that: a sender that wants to know asks.
  - name: authority
    description: >-
      What a hosted operator reads back about the operations members
      hand it under its delegation (ADR-0078), and the proof of a
      controller's current authority it obtains before each lifecycle
      decision, each decided from current state when it is asked.
  - name: execution
    description: >-
      Which process of an agent may act, and with which credentials
      (ADR-0078). The hosted Operator control service activates a
      runtime generation, deactivates it, recovers a lost credential
      lineage and asks whether a certificate and a generation are
      current; a standalone host's supervisor activates, deactivates
      and inspects the one agent it is registered for, and recovers
      nothing (ADR-0082); an agent's own certificate can do none of it. Once an
      agent is activated, its own protected calls carry the token the
      activation issued, and every one of them is admitted against the
      current activation and lineage when it writes, on a connection
      already open too (ADR-0080).
  - name: cutover
    description: >-
      How the hosted Operator control service moves a legacy agent's
      source to itself under the agent's existing GRN, one agent at a
      time (ADR-0086, `agent-cutover.v1`). It reads the source, imports
      it inactive, has garam freeze and verify it, has garam record the
      switch, and only then releases the agent; a frozen attempt may be
      rolled back, a switched one may not. Each call carries an owner's
      or administrator's durable `agent:cutover` reference minted for
      that one route, rechecked fresh, beside the caller's own
      lifecycle authority.
  - name: enrollment
    description: >-
      How the hosted Operator control service creates a managed agent
      and obtains its first certificate (ADR-0077, ADR-0078). Creation
      is authorized by a member's `agent:create` reference alone and
      registers the identity, its first assignment and an execution
      fenced from birth in one transaction; the first certificate is
      signed over a key the controller generated and is the first of
      that agent's credential lineage. Neither route carries a private
      key, and a retry under the same request identifier answers what
      the first request did rather than creating or issuing again.
  - name: agent-enrollment
    description: >-
      `agent-enrollment.v1`, the one admission contract both placements
      share (ADR-0102 §Common agent enrollment): prepare an approval,
      admit the identity it binds, deliver the agent's tokens with
      `mintAgentToken`, then activate with `activateAgent`. Admission
      starts the agent fenced with no active generation and creates no
      workload, and a retry under the same request identifier answers
      what the first request did. Only `managed` placement admits
      today, a new agent under an `agent:create` reference and a
      replacement under an `agent:replace` one (ADR-0107). Every refusal the contract names carries `reason` in its
      Error body.
  - name: standalone
    description: >-
      How a standalone host's supervisor obtains its own certificate
      and its agent's by spending an administrator's approval of the
      host's keys, and renews its own afterwards (ADR-0082). Neither
      route carries a private key: the host generated both keys and the
      bootstrap secret before it asked, and a retry of the same request
      answers what the first did. A supervisor's certificate reaches
      `renewSupervisorCertificate`, `getIdentity`, `activateAgent`,
      `deactivateAgent` and `introspectAgentExecution` alone; every
      other operation answers it 403.
  - name: watch
    description: >-
      What an agent is saying now, on its way to the people watching it
      (ADR-0022). A caller forwards it while the watcher count on its
      claim says someone is there, and forwards nothing otherwise:
      garam keeps none of it, so an agent nobody watches costs nothing
      here.
security:
  - machineCertificate: []
paths:
  /identity:
    get:
      operationId: getIdentity
      tags: [identity]
      security:
        - machineCertificate: []
        - machineToken: []
        - machineBearer: []
      summary: Return the identity the connection authenticated as.
      responses:
        '200':
          description: The caller's identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
        '401':
          $ref: '#/components/responses/Error'
  /identity/certificate:
    post:
      operationId: renewIdentityCertificate
      tags: [identity]
      summary: Renew the certificate the connection authenticated with.
      description: >-
        The successor to the certificate the caller is presenting, for
        an operator renewing its own (ADR-0046). The route names no
        subject: what is replaced is what the connection authenticated
        with, so there is no other identity to ask for and nothing to
        authorize beyond the handshake. An agent is refused here — its
        certificate is admitted by the claim its operator made and
        renewed on the route that admits it (ADR-0040).

        Three things refuse a renewal. A certificate that has expired
        never reaches this route, because it authenticates nothing and
        the request carries no identity: an expired operator has no
        certificate left to renew from, and what follows is a token to
        enrol with (ADR-0064) or a mint out of band (ADR-0032). A
        certificate with more than a third of its validity still to run
        is refused as too early, under `failed_precondition`, and the
        caller asks again closer to expiry. A certificate garam has
        already replaced is refused as superseded, under
        `already_exists`: either an answer this caller never received
        took the lineage, or another holder of the same identity did,
        and only a mint out of band recovers from it. garam has no
        revocation, and that refusal is what keeps a renewable
        certificate from being a permanent one.

        An operator that authenticates with a token renews nothing
        here: it exchanges its credential with `exchangeToken`, or an
        assertion signed by a key issued to it with
        `exchangeClientAssertion`, for the next token (ADR-0100,
        ADR-0102).

        Each call signs a new certificate and generates the private key
        it returns once, so it is a POST rather than a GET.
      responses:
        '201':
          description: Certificate issued. The one presented is now superseded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineCertificate'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /tokens:
    post:
      operationId: exchangeToken
      tags: [identity]
      summary: Exchange an operator's or a supervisor's credential for a short-lived token.
      description: >-
        Answers a token for the operator the presented credential
        belongs to (ADR-0100), under `machine-token.v1`. The token is
        accepted for an hour and is refreshed by exchanging again in
        the last third of that hour; nothing here renews one token into
        another, so only the credential mints them.

        With no `audience`, the token is accepted by garam on the
        operations that list `machineToken`. With an `audience` naming
        another operator of the same organization — a hosted control
        service — the token is minted to be shown to that service, and
        garam accepts it as a credential on no operation here: the
        audience forwards it to `introspectController` under
        `operation-authority.v2`, as `token` in place of
        `certificatePem`, to prove the operator it names.

        A credential the operator's organization re-issued or withdrew
        with the operator exchanges nothing, and every token it was
        exchanged for is refused from the next request. Unknown,
        voided and withdrawn credentials are one refusal.

        A standalone host's supervisor exchanges the credential
        `enrollStandaloneAgent` answered it under
        `standalone-enrollment.v2` the same way, for a token prefixed
        `garam_st_` that names no audience; one naming an audience is
        400. A revocation or a replacement of its registration, and a
        retried enrollment re-issuing the credential, each refuse the
        credential and every token it was exchanged for from the next
        request (ADR-0100).


        For an operator's credential, one process answers at most 60
        exchanges per client address, counted before anything is read,
        and 10 per operator once the credential resolved, each per
        minute, and 429 with `Retry-After` past either. Both bounds are
        shared with `exchangeClientAssertion`: either form of exchange
        holds the operator's registration while it records the token,
        and a re-issue or a key withdrawal waits for those holds.
      security:
        - machineCredential: []
      parameters:
        - $ref: '#/components/parameters/tokenContractVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenExchange'
      responses:
        '201':
          description: Token issued, shown once.
          headers:
            Garam-Contract-Version:
              $ref: '#/components/headers/TokenContractVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineToken'
        '400':
          $ref: '#/components/responses/TokenContractError'
        '401':
          $ref: '#/components/responses/TokenContractError'
        '429':
          description: Too many exchanges from this process; try again after `Retry-After`.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            Garam-Contract-Version:
              $ref: '#/components/headers/TokenContractVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /oauth/token:
    post:
      operationId: exchangeClientAssertion
      tags: [identity]
      summary: Exchange an operator's signed client assertion for a short-lived token.
      description: >-
        The OAuth 2.0 client credentials grant authenticated by
        `private_key_jwt` (RFC 6749, RFC 7523), under
        `machine-token.v2` (ADR-0102). It is reached over the listener's
        verified server TLS with no client certificate and no
        `Authorization` header: what authenticates the request is the
        assertion in its body, signed by a live key of the operator
        `client_id` names. A request presenting either is
        `invalid_request`.

        The form carries each parameter once: `grant_type`
        `client_credentials`, `client_id` the operator's canonical GRN,
        `client_assertion_type`
        `urn:ietf:params:oauth:client-assertion-type:jwt-bearer`, and
        `client_assertion` one compact JWT. Its protected header holds
        `alg` `RS256`, `kid` the key's base64url SHA-256 RFC 7638
        thumbprint, `typ` `JWT` and nothing else. Its claims hold `iss`
        and `sub` both equal to `client_id`; `aud` one string equal byte
        for byte to the token endpoint URL the key issuance answered as
        `tokenUrl`; integer `iat` and `exp` at most 60 seconds apart; a
        `jti` of 22 to 128 base64url characters; and optionally an
        integer `nbf` no later than `exp`. garam allows 30 seconds of
        skew against its database's clock. No member repeats, in the
        header, the claims or any object inside them. The optional
        `audience` names another operator of the same organization —
        a hosted control service — the token is minted to be shown to,
        as `exchangeToken`'s does; absent, the token is garam's. A
        `scope` is `invalid_scope`, a `client_secret` and any other
        grant are refused, and unrecognised parameters are ignored.

        **Each assertion is exchanged once.** Its (`client_id`, `jti`)
        is spent in the transaction that records the token, on every
        replica and across restarts, so two copies yield one token and
        the other `invalid_client`. A lost answer is recovered with a
        fresh assertion and `jti`, never by retrying the same one.

        A bad signature, a key that is unknown, withdrawn or past its
        rollover, a wrong identity, audience or time, and a replay are
        one refusal, `invalid_client` with 400, which says nothing
        about which registrations or keys exist. A token is refused
        from the next request once its key is withdrawn. A process
        answers at most 60 exchanges per client address, counted before
        anything is read, and 10 verified ones per `client_id`, each per
        minute, and 429 with `Retry-After` past either: a flood from one
        address holds back no other, and an assertion that fails to
        verify spends no operator's budget. Both bounds are shared with
        `exchangeToken`'s for an operator's credential. An unconfigured token
        endpoint, or a database that cannot be read, answers 503 and
        issues nothing; a defect answers 500 `server_error`.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ClientAssertionRequest'
      responses:
        '200':
          description: Token issued, shown once. It is not stored and not cached.
          headers:
            Garam-Contract-Version:
              $ref: '#/components/headers/AssertionContractVersion'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Pragma:
              $ref: '#/components/headers/NoCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthToken'
        '400':
          $ref: '#/components/responses/OAuthError'
        '429':
          description: Too many exchanges from this process; try again after `Retry-After`.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            Garam-Contract-Version:
              $ref: '#/components/headers/AssertionContractVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '500':
          $ref: '#/components/responses/OAuthError'
        '503':
          $ref: '#/components/responses/OAuthError'
  /enrollment:
    post:
      operationId: enrollOperator
      tags: [identity]
      summary: Obtain an operator's first certificate with an enrollment token.
      description: >-
        Signs the certificate signing request for the operator the
        token names, and spends the token (ADR-0064). This is the one
        operation on this listener that requires no client certificate,
        because it is what a caller with no certificate calls; what
        authenticates it is the token, which a signed-in member of the
        organization minted by registering the operator.

        **The token is permission to ask for one certificate, once.** It
        is not a credential to the operator's identity: it authenticates
        no other operation here, it is spent by the first call that
        presents it whether or not that call goes on to succeed, and it
        stops being spendable ten minutes after it was minted. A token
        that is refused is a token to register again for, not one to
        retry with.

        **What the certificate names is the token's to say and never the
        request's.** Nothing in the certificate signing request is read
        but the public key it carries and the signature proving the
        sender holds the private half: a subject name, a SAN or an
        extension request in it is discarded. So a token cannot be
        turned into a certificate for any identity but the operator it
        was minted for, whatever the request asks for.

        The answer carries no private key, because garam never had one.
        The operator generated the key pair where the certificate will
        be used, and what crossed the wire was a public key and a
        signature over it. A caller that loses the key it generated
        registers again rather than recovering.

        An operator that authenticates with a token needs no
        certificate from here: it exchanges the credential its
        organization issued it with `exchangeToken`, or an assertion
        signed by a key issued to it with `exchangeClientAssertion`
        (ADR-0100, ADR-0102).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Enrollment'
      responses:
        '201':
          description: Certificate signed. The token is spent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrolledCertificate'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
  /agents:
    post:
      operationId: createAgent
      tags: [agent]
      security:
        - machineCertificate: []
        - machineToken: []
        - machineBearer: []
      summary: Create an agent and assign it to the calling operator.
      description: >-
        garam mints the agent's GRN in the calling operator's
        organization (ADR-0012) and assigns the agent to that operator.
        There is no request body: the organization and the operator are
        what the certificate names. A caller that is not an operator is
        refused.

        The agent it mints has no definition. This route keeps minting
        for agents no definition describes (ADR-0033) and writes none
        itself, so the agent is assigned to the caller and absent from
        every `listDefinitions` answer, which answers definitions
        rather than assignments. It is an ordinary assigned agent
        otherwise: `issueAgentCertificate` answers for it on the
        assignment alone. An operator that constructs the agents its
        definitions name therefore never constructs this one.

        It creates a legacy agent and nothing else: no delegation
        authorizes it and none is read. An agent the separated
        lifecycle runs is created by `createManagedAgent`, and this
        route never reaches one.
      responses:
        '201':
          description: Agent created and assigned to the calling operator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentAssignment'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /agents/{agent}/certificate:
    post:
      operationId: issueAgentCertificate
      tags: [agent]
      security:
        - machineCertificate: []
          executionToken: []
        - machineCertificate: []
        - machineToken: []
        - machineBearer: []
      summary: Issue the certificate an agent authenticates with.
      description: >-
        Answers for an agent assigned to the calling operator at the
        current epoch, and for the agent itself renewing over the
        connection its current certificate authenticated (ADR-0040).

        Once an agent's cutover is switched (ADR-0086), its operator is
        refused here with 409: the check is read after signing, under
        the agent's execution row, so no certificate is answered once
        the switch has committed.

        Once an agent's execution has been activated, or from its
        creation for an agent `createManagedAgent` made, its operator
        is refused here with 409: its certificates come from
        `issueInitialCertificate`, its own renewal or
        `recoverAgentCredential` (ADR-0078). The agent's
        own renewal then presents its execution token and is admitted
        against the current activation and credential lineage, which
        the new certificate joins; the certificate it renews stays
        valid until it expires, so no restart is needed. A missing
        token is 401, one that is not current 403, and a certificate
        that is not current 409.
        Every other caller is refused, which is the whole of the
        authorization here (ADR-0015). A renewal grants nothing: the
        caller already holds that identity, and an expired certificate
        has no connection left to renew over. Each call signs a new
        certificate and generates the private key it returns once, so
        it is a POST rather than a GET.

        An agent that authenticates with a token has no certificate to
        renew: its own token is 401 here, and its assignee mints the
        next with `mintAgentToken` (ADR-0100).

        The assignment is the whole of the precondition as well. There
        is no renewal window and no lineage here: a caller the
        assignment admits may ask at any time and as often as it needs,
        and a certificate this route has already replaced asks again
        successfully. Contrast `renewIdentityCertificate`, which
        replaces the caller's own certificate and holds both bounds.
        The durable step is therefore storing what comes back rather
        than making the call, and a store that fails is answered by
        asking for another certificate rather than by retrying the
        store.
      parameters:
        - $ref: '#/components/parameters/agent'
      responses:
        '201':
          description: Certificate issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineCertificate'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /agents/{agent}/tokens:
    post:
      operationId: mintAgentToken
      tags: [agent]
      security:
        - machineCertificate: []
        - machineToken: []
        - machineBearer: []
      summary: Mint the token an agent authenticates with in place of a certificate.
      description: >-
        Answers a short-lived token for an agent the calling operator
        holds at the current epoch, or for the one agent a standalone
        host's supervisor holds, which presents its own token to mint
        (ADR-0100), under `machine-token.v1`. The assignee hands it to
        the agent's adapter, which presents it as `Authorization:
        Garam-Token <token>`. It is accepted for an hour unless the
        deployment configures another lifetime, and the assignee mints
        the next before it runs out; minting a new one voids nothing,
        and an agent keeps its newest five per audience.

        The token is minted at the assignment's epoch and in the
        lineage the agent's execution holds, and every request
        presenting it is read against both as they stand then: a
        reassignment or a recovery refuses it from the next request,
        on a connection already open too. It is admitted where the
        certificate route would be — an agent still legacy whose
        cutover is not switched — and for an agent whose lifecycle
        authority opened a lineage, inside it. A fenced agent's protected
        calls still carry their activation's token, in the
        `Garam-Execution` header.

        With an `audience` naming another operator of the agent's
        organization, the token is minted to be shown to that hosted
        operator, and garam accepts it on no operation here. A
        supervisor mints for garam alone, and an `audience` from it is
        400.
      parameters:
        - $ref: '#/components/parameters/agent'
        - $ref: '#/components/parameters/tokenContractVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenExchange'
      responses:
        '201':
          description: Token minted, shown once.
          headers:
            Garam-Contract-Version:
              $ref: '#/components/headers/TokenContractVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentToken'
        '400':
          $ref: '#/components/responses/TokenContractError'
        '401':
          $ref: '#/components/responses/TokenContractError'
        '403':
          $ref: '#/components/responses/TokenContractError'
  /agents/{agent}/provisioning-state:
    post:
      operationId: reportProvisioningState
      tags: [agent]
      security:
        - machineCertificate: []
        - machineToken: []
        - machineBearer: []
      summary: Report what the operator sees of an agent's pod.
      description: >-
        What the calling operator says about the agent it provisioned
        outside garam (ADR-0012). garam learns this from the operator
        and from nowhere else: it dials no cluster and reads no pod, so
        an agent nobody reports on stays at `pending` and cannot be
        told from one that never started.

        The report carries the epoch the operator holds the agent at,
        and garam accepts it only at the epoch the assignment is
        currently on. A stale one is refused under
        `failed_precondition`, which is what stops the pod a replaced
        operator left running from writing over its successor's report;
        an agent with no assignment has no current epoch, so every
        report about it is stale. The epoch to send is the one
        `createAgent` or `claimDefinition` answered with.

        An operator the agent is not assigned to is refused, and an
        agent that does not exist is refused the same way, so a caller
        learns nothing about the agents it does not hold. This route
        never moves the runtime state: that is the agent's own fact and
        `reportRuntimeState` is where it is reported.

        garam keeps the last report and nothing before it. It expires
        none of them either, so a state stands until it is reported
        again — a report is evidence of what the operator saw, never
        evidence that the operator is still there.
      parameters:
        - $ref: '#/components/parameters/agent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProvisioningStateReport'
      responses:
        '204':
          description: Recorded. garam has nothing to answer with.
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /agents/{agent}/runtime-state:
    post:
      operationId: reportRuntimeState
      tags: [agent]
      security:
        - machineCertificate: []
          executionToken: []
        - machineCertificate: []
        - machineToken: []
        - machineBearer: []
          executionHeader: []
        - machineToken: []
        - machineBearer: []
      summary: Report what an agent says about itself.
      description: >-
        The agent's own account of whether it is running (ADR-0012).
        The caller reports for the agent it authenticates as and is
        refused every other one, as it is on its own queue and its own
        turn events.

        The report carries the epoch, and garam accepts it only at the
        epoch the agent's assignment is currently on; a stale one is
        refused under `failed_precondition`. The agent is told its
        epoch by the operator that constructed it — garam answers the
        operator with it on `createAgent` and `claimDefinition` and
        serves it to the agent nowhere.

        This route never moves the provisioning state: that is what the
        operator sees of the pod, and `reportProvisioningState` is
        where it is reported. The two facts are kept apart and neither
        substitutes for the other.

        garam keeps the last report and expires none, so an agent that
        stops reporting stays in the state it last claimed. Silence is
        not `disconnected`, and nothing here turns one into the other.

        An agent whose execution has been activated presents its
        execution token here, and the call is admitted against the
        current activation and credential lineage in the transaction
        of its own write: after a replacement, a reassignment, a
        recovery or the certificate's expiry it is refused, on a
        connection already open too (ADR-0080). A missing token is
        401, one that is not current 403, and a certificate that is
        not current, or a token presented for an agent never
        activated, 409.
      parameters:
        - $ref: '#/components/parameters/agent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeStateReport'
      responses:
        '204':
          description: Recorded. garam has nothing to answer with.
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /definitions:
    get:
      operationId: listDefinitions
      tags: [definition]
      security:
        - machineCertificate: []
        - machineToken: []
        - machineBearer: []
      summary: List the definitions naming the calling operator.
      description: >-
        The agents the organization says this operator should run
        (ADR-0026): the agent GRN each definition minted, the values the
        operator constructs it from, and whether it is claimed. The
        answer is scoped by the definition's operator field, so it names
        nothing the caller is not named in and no policy check stands in
        front of it (ADR-0033). A caller that is not an operator is
        refused.

        A definition whose agent's execution is fenced, or whose agent's
        cutover is frozen or switched (ADR-0086), is absent: its values
        stay preserved in garam and are no longer this operator's
        source. A rolled-back cutover lists it again.

        This answers definitions, not assignments. An agent assigned to
        the calling operator that no definition describes is absent
        from it, and `createAgent` mints exactly that: it assigns the
        agent it creates and writes no definition (ADR-0033). Such an
        agent hands over a certificate on request and appears in no
        answer here, so a loop that constructs the agents this route
        names constructs a subset of the agents assigned to the caller.
        Nothing reports the difference, and this listener answers no
        list of assignments to compare against.

        A claim here is not evidence of holding. What the claim field
        reports is the agent's assignment as it stands now, while the
        definition carrying it names its operator once and is never
        rewritten — so the two come apart as soon as the agent is
        assigned elsewhere, and the definition stays listed, stays
        claimed, and carries the epoch of whoever holds the agent by
        then. The certificate route is the only place that epoch is
        met: it is where an operator the assignment no longer names is
        refused, under `permission_denied`, and nothing before it
        refuses one.
      responses:
        '200':
          description: The caller's definitions, ordered by agent GRN.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Definition'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /definitions/{agent}/claim:
    post:
      operationId: claimDefinition
      tags: [definition]
      security:
        - machineCertificate: []
        - machineToken: []
        - machineBearer: []
      summary: Claim the agent a definition minted for the calling operator.
      description: >-
        Binds the calling operator to the definition's agent GRN: the
        assignment is written at its first epoch, and it is what admits
        the operator to that agent's certificate route — which refuses
        the GRN as unassigned until then, exactly as before (ADR-0033).
        A definition is claimed once: a second claim of the same agent
        GRN is a conflict, never an override. A definition that names
        another operator answers as one that does not exist, because the
        claim inherits the read's scoping.
      parameters:
        - $ref: '#/components/parameters/agent'
      responses:
        '201':
          description: The agent is assigned to the calling operator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentAssignment'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /messages:
    post:
      operationId: postMessage
      tags: [message]
      security:
        - machineCertificate: []
          executionToken: []
        - machineCertificate: []
        - machineToken: []
        - machineBearer: []
          executionHeader: []
        - machineToken: []
        - machineBearer: []
      summary: Post a message to a recipient.
      description: >-
        The sender is what the certificate names, so the body carries
        the recipient and nothing about who is sending. garam answers
        once the message is durably stored and does not check that the
        recipient exists: rejecting a message it cannot route would
        destroy it and tell the sender nothing, so a routing failure
        comes back later as an ordinary message instead (ADR-0013).
        The sender's idempotency key is what makes a retry store one
        message rather than two.

        Which recipients a sender may reach is two questions, and they
        are refused two different ways.

        Inside the sender's own organization, policy decides
        (ADR-0024): it reaches every recipient unless a policy attached
        to it says otherwise. A recipient a policy refuses is a 403 and
        nothing is stored, because garam could have routed the message
        and the organization said not to, so storing it would deliver
        what was refused.

        Across the organization boundary the precondition is a consent
        relation both organizations hold, which no policy reaches past
        (ADR-0035). Where that relation does not stand garam cannot
        route the message, so the post is stored and answered 201 like
        any other: what is stored is the refusal, addressed back to the
        sender as an ordinary inbound message whose sender is the
        recipient that could not be reached and whose body names the
        two organizations that do not both consent (ADR-0013). The 201
        carries that refusal rather than the message submitted, which
        is how a caller tells the two apart, and its idempotency key
        derives from the sender's so a retried post is answered with
        the one refusal already stored.

        An agent whose execution has been activated presents its
        execution token here, and the call is admitted against the
        current activation and credential lineage in the transaction
        of its own write: after a replacement, a reassignment, a
        recovery or the certificate's expiry it is refused, on a
        connection already open too (ADR-0080). A missing token is
        401, one that is not current 403, and a certificate that is
        not current, or a token presented for an agent never
        activated, 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageSubmission'
      responses:
        '201':
          description: Message stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /outbox-messages:
    post:
      operationId: postOutboxMessage
      tags: [message]
      security:
        - machineCertificate: []
          executionToken: []
        - machineCertificate: []
        - machineToken: []
        - machineBearer: []
          executionHeader: []
        - machineToken: []
        - machineBearer: []
      summary: Post a durable reply under the creation instant its outbox entry holds.
      description: >-
        The same message write as `postMessage`, reached under contract
        `durable-delivery.v1` (ADR-0083) by a sender that retries one
        outbox entry under one idempotency key until garam answers. The
        body adds `createdAt`, the instant the entry was created, and
        garam stores a new message only while that instant is inside a
        fixed seven-day budget: no later than the database's clock when
        the insert runs, and less than seven days before it. The budget
        is part of the contract and no deployment changes it. A
        request delayed on its way to the insert is judged when it
        writes, and the receipt time garam stamps is that same instant;
        `createdAt` decides admission only and is not stored.

        A key that already stores a message is answered with that
        message whatever the budget now says, a completed one whose
        body was dropped included (ADR-0034). So a sender that lost an
        answer retries the same entry and is answered with what the
        first attempt stored, and once the budget has run out on a key
        that stores nothing, no attempt under it ever stores one —
        which keeps every stored message inside the thirty-day
        retention a retry could still reach.

        Recipients, policy, the cross-organization refusal and the
        execution token are `postMessage`'s, unchanged. The refusal is
        stored under the same budget, and a 201 carrying it has the
        intended recipient as sender and the caller as recipient, which
        is how a caller tells it from its own message: verify the
        answer's `id`, `sender`, `recipient` and `idempotencyKey`
        before treating the entry as delivered.

        The answers, each with the `Garam-Contract-Version` header:
        201 is the message the key stores, stored now or earlier, or
        the refusal. 400 `invalid_argument` is a missing or unknown
        contract version, which names `durable-delivery.v1`, or a
        malformed body, including a missing `createdAt` or one that is
        not an RFC 3339 instant. 400 `out_of_range` is a `createdAt`
        later than garam's clock: the entry is not lost, and a later
        attempt may be admitted. 410 `deadline_exceeded` is a key that
        stores nothing and a budget that has run out, which no later
        attempt changes. 409 `already_exists` is a key that stores a
        message to another recipient, or with another body while it
        still holds one. A missing token is 401, one that is not current
        403, and a certificate that is not current, or a token
        presented for an agent never activated, 409 `failed_precondition`
        (ADR-0080). A garam that predates this route answers 404, as it
        does any path it does not serve, and has stored nothing.
      parameters:
        - $ref: '#/components/parameters/deliveryContractVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutboxSubmission'
      responses:
        '201':
          description: The message the key stores, or the cross-organization refusal.
          headers:
            Garam-Contract-Version:
              $ref: '#/components/headers/DeliveryContractVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/DeliveryContractError'
        '401':
          $ref: '#/components/responses/DeliveryContractError'
        '403':
          $ref: '#/components/responses/DeliveryContractError'
        '409':
          $ref: '#/components/responses/DeliveryContractError'
        '410':
          $ref: '#/components/responses/DeliveryContractError'
  /messages/{message}:
    get:
      operationId: getMessageStatus
      tags: [message]
      security:
        - machineCertificate: []
          executionToken: []
        - machineCertificate: []
        - machineToken: []
        - machineBearer: []
          executionHeader: []
        - machineToken: []
        - machineBearer: []
      summary: Read how far a message the caller sent has got.
      description: >-
        What garam knows about the message and the sender does not: the
        state it is in, how many attempts it has spent, and when garam
        stored it (ADR-0055). The recipient, the key and the body were
        the sender's own submission and are not answered back.

        The caller reads the messages it sent and no others. A message
        another identity sent, one that never existed, and one the
        thirty-day sweep has deleted are all `404`: nothing about the
        queue outside the caller's own messages is learnable by asking.
        That makes the answer to an expired message its absence rather
        than a state — a sender holding the `201` knows the message was
        stored, and the sweep is the only thing that removes a stored
        one (ADR-0034).

        There is no state meaning expired for the same reason: a
        message past the retention window that the sweep has not
        reached yet is still handed to a reader, so calling it expired
        would name something the queue does not do. `createdAt` is what
        a sender measures the window against.

        The body is never answered. A completed message no longer has
        one (ADR-0034), so a field carrying it would be present in some
        states and absent in others, and its absence would mean two
        things.

        garam reports none of this on its own. A post refused across an
        organization boundary is answered with the refusal message
        rather than the one submitted (see `postMessage`), and that
        refusal's sender is not the caller — so its identifier is not
        one this route answers, and there is nothing to track: the
        refusal arrives on the caller's own queue.

        An agent whose execution has been activated presents its
        execution token here, and the call is admitted against the
        current activation and credential lineage in the transaction
        of its own write: after a replacement, a reassignment, a
        recovery or the certificate's expiry it is refused, on a
        connection already open too (ADR-0080). A missing token is
        401, one that is not current 403, and a certificate that is
        not current, or a token presented for an agent never
        activated, 409.
      parameters:
        - $ref: '#/components/parameters/message'
      responses:
        '200':
          description: How far the message has got.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageStatus'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /message-signing-keys:
    get:
      operationId: getMessageSigningKeys
      tags: [message]
      summary: Read the public keys garam signs messages with.
      description: >-
        The JWK Set (RFC 7517) a verifier checks the signature on a
        claimed message against (ADR-0101): the key that signs now, a
        key announced to sign next, and a key that stopped signing while
        a signature it made can still be valid. A key retired at once is
        not in it. It is served at this path on the machine listener,
        and a verifier fetches it from wherever it reaches that
        listener, which is not the issuer: the issuer is an identity and
        need not resolve. The answer is complete in itself, so a
        deployment whose verifier cannot reach garam hands it the same
        document as a file.

        A key is published at least two hours before it signs. The
        answer may be cached for the hour `Cache-Control` names; a
        verifier meeting a `kid` it does not hold reads this again.
      security: []
      responses:
        '200':
          description: The published keys.
          headers:
            Cache-Control:
              description: '`max-age=3600`.'
              schema:
                type: string
          content:
            application/jwk-set+json:
              schema:
                $ref: '#/components/schemas/MessageSigningKeySet'
  /agents/{agent}/claims:
    post:
      operationId: claimMessage
      tags: [message]
      security:
        - machineCertificate: []
          executionToken: []
        - machineCertificate: []
        - machineToken: []
        - machineBearer: []
          executionHeader: []
        - machineToken: []
        - machineBearer: []
      summary: Claim the next message addressed to an agent.
      description: >-
        A long poll: the call waits for a message rather than answering
        an empty queue at once, and answers 204 when none arrives in
        that time. The caller claims for the agent it authenticates as
        and is refused every other one. Exactly one caller holds a
        given message, under a lease that garam measures; a claim
        nobody completes lapses and the message is handed on, up to a
        bounded number of attempts (ADR-0018).

        An agent whose execution has been activated presents its
        execution token here, and the call is admitted against the
        current activation and credential lineage in the transaction
        of its own write: after a replacement, a reassignment, a
        recovery or the certificate's expiry it is refused, on a
        connection already open too (ADR-0080). A missing token is
        401, one that is not current 403, and a certificate that is
        not current, or a token presented for an agent never
        activated, 409.
      parameters:
        - $ref: '#/components/parameters/agent'
      responses:
        '200':
          description: A message, and the hold the caller now has on it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
        '204':
          description: Nothing was ready before the wait ran out. Ask again.
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /agents/{agent}/claims/{claim}/renewal:
    post:
      operationId: renewClaim
      tags: [message]
      security:
        - machineCertificate: []
          executionToken: []
        - machineCertificate: []
        - machineToken: []
        - machineBearer: []
          executionHeader: []
        - machineToken: []
        - machineBearer: []
      summary: Extend a claim while the message is still being worked on.
      description: >-
        Renewal is what keeps a long turn from losing its claim
        mid-flight. It carries the hold no further than a ceiling
        measured from when the claim was taken, and a renewal reaching
        past that ceiling is held at it: the ceiling is the backstop
        for a completion that never arrives, so it is not renewable
        away (ADR-0018). A claim already lapsed, handed on, or
        completed is refused.

        An agent whose execution has been activated presents its
        execution token here, and the call is admitted against the
        current activation and credential lineage in the transaction
        of its own write: after a replacement, a reassignment, a
        recovery or the certificate's expiry it is refused, on a
        connection already open too (ADR-0080). A missing token is
        401, one that is not current 403, and a certificate that is
        not current, or a token presented for an agent never
        activated, 409.
      parameters:
        - $ref: '#/components/parameters/agent'
        - $ref: '#/components/parameters/claim'
      responses:
        '200':
          description: The hold as it now stands.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /agents/{agent}/turn-events:
    post:
      operationId: forwardTurnEvent
      tags: [watch]
      security:
        - machineCertificate: []
          executionToken: []
        - machineCertificate: []
        - machineToken: []
        - machineBearer: []
          executionHeader: []
        - machineToken: []
        - machineBearer: []
      summary: Forward one turn event to whoever is watching the agent.
      description: >-
        What the agent is saying now, on its way to the browsers
        watching it. The caller forwards for the agent it authenticates
        as and is refused every other one.

        Nothing is stored and nobody acknowledges. garam announces the
        event to the process holding each stream, and an event arriving
        while nobody watches reaches no one — so a success here says the
        event was announced and never that a person saw it (ADR-0022).
        The watcher count on `claimMessage` and `renewClaim` is what
        says whether to forward at all, and forwarding to an agent
        nobody watches is the cost that decision exists to avoid.

        An event larger than one announcement carries is refused rather
        than shortened: a shortened turn would put words in the agent's
        mouth, where a refused event is the gap this stream already
        permits.

        An agent whose execution has been activated presents its
        execution token here, and the call is admitted against the
        current activation and credential lineage in the transaction
        of its own write: after a replacement, a reassignment, a
        recovery or the certificate's expiry it is refused, on a
        connection already open too (ADR-0080). A missing token is
        401, one that is not current 403, and a certificate that is
        not current, or a token presented for an agent never
        activated, 409.

        An event admitted before a replacement is announced before that
        replacement commits; when a watcher receives it is not part of
        that order.
      parameters:
        - $ref: '#/components/parameters/agent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TurnEvent'
      responses:
        '202':
          description: >-
            Announced. Nothing is stored, so this is not evidence that
            a watcher received it.
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /agents/{agent}/claims/{claim}/completion:
    post:
      operationId: completeClaim
      tags: [message]
      security:
        - machineCertificate: []
          executionToken: []
        - machineCertificate: []
        - machineToken: []
        - machineBearer: []
          executionHeader: []
        - machineToken: []
        - machineBearer: []
      summary: Report the claimed message delivered.
      description: >-
        Completion is fenced by the claim rather than by the message,
        so a caller whose lease was handed on completes nothing.
        Completing twice reports the same delivery, because a caller
        that could not read the answer retries.

        An agent whose execution has been activated presents its
        execution token here, and the call is admitted against the
        current activation and credential lineage in the transaction
        of its own write: after a replacement, a reassignment, a
        recovery or the certificate's expiry it is refused, on a
        connection already open too (ADR-0080). A missing token is
        401, one that is not current 403, and a certificate that is
        not current, or a token presented for an agent never
        activated, 409.
      parameters:
        - $ref: '#/components/parameters/agent'
        - $ref: '#/components/parameters/claim'
      responses:
        '204':
          description: The message is delivered and is not handed out again.
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /operation-authorities/introspection:
    post:
      operationId: introspectOperationAuthority
      tags: [authority]
      security:
        - machineCertificate: []
        - machineToken: []
        - machineBearer: []
      summary: Read what an operation authority binds, once current state still authorizes it.
      description: >-
        The calling operator must be the authority's audience. Unknown,
        expired, and another audience's authority are one 404. A known
        operation that current membership, roles, groups, persisted
        policies, the grant, the bound controller's registration or a
        configuration change's placement no longer authorizes is 403,
        and one garam cannot decide from current state is 503. Nothing
        is consumed: a retry introspects again. Check `bodySha256`
        against the exact body received, and introspect before
        revealing any stored result for `requestId`.
      parameters:
        - $ref: '#/components/parameters/contractVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorityIntrospection'
      responses:
        '200':
          description: The authority's binding.
          headers:
            Garam-Contract-Version:
              $ref: '#/components/headers/ContractVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationBinding'
        '400':
          $ref: '#/components/responses/ContractError'
        '401':
          $ref: '#/components/responses/ContractError'
        '403':
          $ref: '#/components/responses/ContractError'
        '404':
          $ref: '#/components/responses/ContractError'
  /operation-references/{ref}:
    get:
      operationId: checkOperationReference
      tags: [authority]
      security:
        - machineCertificate: []
        - machineToken: []
        - machineBearer: []
      summary: Recheck a durable operation reference before activating a new desired revision.
      description: >-
        Decides the reference as introspection decides an authority,
        without the short token's expiry. It is not a restart
        capability: restarting a revision already applied uses the
        lifecycle authority (ADR-0078). The answer carries no
        `expiresAt`.
