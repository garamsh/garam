        for an agent no definition describes, whose values are empty,
        and for one whose stored values garam cannot read, whose
        `class` is `blocked:unparseable`. `sourceDigest` is the
        lowercase hex SHA-256 of the RFC 8785 JSON of `{agentGrn,
        operatorGrn, values}`, where `operatorGrn` is the definition's
        operator, or `assignee` where `source` is null; it is null where
        the values cannot be read. The name is not covered and stays
        garam's. `attempt` is the agent's most recent attempt, null
        before the first freeze.


        Under `agent-cutover.v2` the caller presents its own token, and
        the `agent:cutover` reference travels in a `Garam-Operation`
        header of its own rather than in `Authorization` (ADR-0100).
      parameters:
        - $ref: '#/components/parameters/cutoverContractVersion'
        - $ref: '#/components/parameters/agent'
      responses:
        '200':
          description: The agent's cutover.
          headers:
            Garam-Contract-Version:
              $ref: '#/components/headers/CutoverContractVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cutover'
        '400':
          $ref: '#/components/responses/CutoverContractError'
        '401':
          $ref: '#/components/responses/CutoverContractError'
        '403':
          $ref: '#/components/responses/CutoverContractError'
        '404':
          $ref: '#/components/responses/CutoverContractError'
  /agents/{agent}/cutover/freeze:
    post:
      operationId: freezeAgentCutover
      tags: [cutover]
      security:
        - machineCertificate: []
          operationAuthority: []
        - machineToken: []
        - machineBearer: []
          operationHeader: []
      summary: Freeze a legacy agent's source, verified against the digest the Operator imported.
      description: >-
        Authorized as `getAgentCutover` is. In one transaction, under
        the agent's execution lock and then its definition's, garam
        rechecks the assignment, `epoch` and the grant's expiry,
        requires the agent's execution to be legacy and no other
        attempt to be open, computes the digest of the source under
        those locks and records the attempt `frozen` only if it equals
        `sourceDigest`. From then on `listDefinitions` omits the agent,
        and its definition stays preserved and read-only.


