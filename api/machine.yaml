          headers:
            Garam-Contract-Version:
              $ref: '#/components/headers/CutoverContractVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CutoverAttempt'
        '400':
          $ref: '#/components/responses/CutoverContractError'
        '401':
          $ref: '#/components/responses/CutoverContractError'
        '403':
          $ref: '#/components/responses/CutoverContractError'
        '404':
          $ref: '#/components/responses/CutoverContractError'
        '409':
          $ref: '#/components/responses/CutoverContractError'
  /agents/{agent}/cutover/rollback:
    post:
      operationId: rollBackAgentCutover
      tags: [cutover]
      security:
        - machineCertificate: []
          operationAuthority: []
        - machineToken: []
        - machineBearer: []
          operationHeader: []
      summary: End a frozen attempt, which lists the agent's definition to its operator again.
      description: >-
        Authorized as `getAgentCutover` is, under the same two locks as
        the freeze. Moves the attempt `importId` names from `frozen` to
        `rolled_back`, after which the Operator discards its inactive
        import. A switched attempt is 409 `reverse_migration_required`:
