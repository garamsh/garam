        `attempt_ended`, which refuses a late replay. An agent whose
        execution is fenced, or whose stored values cannot be read, is
        422 `not_cut_over_eligible`; an unclaimed definition's GRN has no
        assignment to authorize against and is 403, as
        `getAgentCutover` states. The same `importId` and digest
        answer the recorded attempt with 200. Past garam's ten-second
        deadline the answer is 503, which does not say whether the
        freeze committed: read the agent's cutover back before retrying.


        Under `agent-cutover.v2` the caller presents its own token, and
        the `agent:cutover` reference travels in a `Garam-Operation`
        header of its own rather than in `Authorization` (ADR-0100).
      parameters:
        - $ref: '#/components/parameters/cutoverContractVersion'
        - $ref: '#/components/parameters/agent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CutoverFreezeRequest'
