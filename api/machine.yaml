openapi: 3.1.0
info:
  title: garam machine API
  version: 0.1.0
  description: >-
    What `garam serve machine` serves (ADR-0017). A caller presents a
    short-lived token, as `Authorization: Garam-Token <token>`, and the
    GRN the token names is its identity (ADR-0100, ADR-0118): no
    session cookie and no user row exist on this listener, a caller
    presents no membership and none is looked up to admit it, and the
    organization segment of that GRN is the whole of the tenancy it
    carries. The listener asks for no client certificate. This is a
    different listener from the one `api/openapi.yaml` describes and
    shares nothing with it.

    An operator obtains a token from `exchangeClientAssertion` under
    `machine-token.v2`, authenticated by a client assertion the private
    key issued to it signed (ADR-0102, ADR-0117), and mints one for an
    agent it holds from `mintAgentToken`; a standalone host's
    supervisor obtains one from `exchangeToken`, presenting the
    credential its enrollment answered. The listener reads a token's
    row beside what it rests on, on every request: a deleted operator,
    a withdrawn key, a reassigned agent or a recovered lineage is
    refused from the next request on a connection already open too.

    `Authorization: Bearer <token>` is the same token under the OAuth
    scheme (ADR-0102), listed as `machineBearer` beside every
    `machineToken`: one resolver reads it, with the same confinement
    and per-request reads. A request carrying more than one
    `Authorization` header while any of them presents a token carries
    no identity.

    Four operations are reached without a token, and each carries
    `security: []` or a credential of its own.
    `enrollStandaloneAgent` is authenticated by the bootstrap secret
    whose hash an administrator approved (ADR-0082).
    `getMessageSigningKeys` publishes the public keys a verifier checks
    garam's signature on a message with (ADR-0101), which anyone may
    read. `exchangeClientAssertion` is authenticated by the client
    assertion in its body (ADR-0102). `exchangeToken` is authenticated
    by a supervisor's credential under `machineCredential`. Every other
    operation requires a token. Every caller verifies garam against the
    garam server root, which it holds before it calls: the listener
    presents that root's leaf to everyone (ADR-0040), and a caller that
    does not check it is talking to whoever answered.

    An operation's `responses` list is what it answers when garam is
    working, and is not the complete set of statuses it can return. No
    operation declares a 5xx, because a 5xx belongs to the listener
    rather than to a route (ADR-0050): every operation can answer
    `500`, and one that reaches the policy engine or the database
    answers `503` when that dependency is unreachable. Both carry the
    `Error` schema with `message` set to `internal error` — a 5xx names
    no cause, and what a caller does next is on the status line. `501`
    and `504` are in garam's kind mapping and nothing produces them.
    `exchangeClientAssertion` is the exception: it answers RFC 6749's
    error body at every status, its `503` included, because a stock
    OAuth client reads that and not `Error` (ADR-0102).

    `version` above is required by OpenAPI and promises nothing
    (ADR-0049). garam publishes no release of this contract and no
    compatibility window, and the number does not move when this
    surface changes: do not read stability, a deprecation notice or a
    breaking change out of it. The tag garam publishes its images under
    names a build and not this document (ADR-0039).
tags:
  - name: identity
    description: >-
      The identity a request's token authenticated as, and the
      exchanges that obtain a token.
  - name: agent
    description: >-
      The agents an operator creates and holds, and what the two
      parties report about them. What an operator may obtain is exactly
      the agents assigned to it at the current epoch (ADR-0015), and
      what it may report about is bounded the same way. An agent
      reaches one route of its own here: it reports its own runtime
      state. Provisioning state and
      runtime state are separate facts reported by different parties,
      and each report is accepted only at the assignment's current
      epoch (ADR-0012).
  - name: message
    description: >-
      The queue a message reaches an agent through (ADR-0013). A caller
      posts inside its own organization to the recipients its policies
      reach (ADR-0024), and outside it only where both organizations
      consent (ADR-0035). It acts on messages for the agent it
      authenticates as and no other, and it reads back the state of the
      messages it sent and of no others (ADR-0055). garam announces
      none of that: a sender that wants to know asks.
  - name: authority
    description: >-
      What a hosted operator reads back about the operations members
      hand it under its delegation (ADR-0078), and the proof of a
      controller's current authority it obtains before each lifecycle
      decision, each decided from current state when it is asked.
  - name: execution
    description: >-
      Which process of an agent may act, and with which credentials
      (ADR-0078). The hosted Operator control service activates a
      runtime generation, deactivates it, recovers a lost credential
      lineage and asks whether an agent's token and a generation are
      current; a standalone host's supervisor activates, deactivates
      and inspects the one agent it is registered for, and recovers
      nothing (ADR-0082); an agent's own token can do none of it. Once
      an agent is activated, its own protected calls carry the token the
      activation issued, and every one of them is admitted against the
      current activation and lineage when it writes, on a connection
      already open too (ADR-0080).
  - name: enrollment
    description: >-
      How the hosted Operator control service creates a managed agent
      (ADR-0077, ADR-0078). Creation is authorized by a member's
      `agent:create` reference alone and registers the identity, its
      first assignment, an execution fenced from birth and the
      agent's first credential lineage in one transaction, and a retry
      under the same request identifier answers what the first request
      did rather than creating again.
  - name: agent-enrollment
    description: >-
      `agent-enrollment.v1`, the one admission contract both placements
      share (ADR-0102 §Common agent enrollment): prepare an approval,
      admit the identity it binds, deliver the agent's tokens with
      `mintAgentToken`, then activate with `activateAgent`. Admission
      starts the agent fenced with no active generation and creates no
      workload, and a retry under the same request identifier answers
      what the first request did. Only `managed` placement admits
      today, a new agent under an `agent:create` reference and a
      replacement under an `agent:replace` one (ADR-0107). Every refusal the contract names carries `reason` in its
      Error body.
  - name: standalone
    description: >-
      How a standalone host's supervisor obtains its credential by
      spending an administrator's approval of the host's bootstrap
      secret (ADR-0082, ADR-0100). A retry of the same request answers
      what the first did. A supervisor's token reaches `getIdentity`,
      `activateAgent`, `deactivateAgent`, `introspectAgentExecution`
      and its own agent's `mintAgentToken` alone; every other operation
      answers it 403.
  - name: watch
    description: >-
      What an agent is saying now, on its way to the people watching it
      (ADR-0022). A caller forwards it while the watcher count on its
      claim says someone is there, and forwards nothing otherwise:
      garam keeps none of it, so an agent nobody watches costs nothing
      here.
security:
  - machineToken: []
  - machineBearer: []
paths:
  /identity:
    get:
      operationId: getIdentity
      tags: [identity]
      security:
        - machineToken: []
        - machineBearer: []
      summary: Return the identity the connection authenticated as.
      responses:
        '200':
          description: The caller's identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
        '401':
          $ref: '#/components/responses/Error'
  /tokens:
    post:
      operationId: exchangeToken
      tags: [identity]
      summary: Exchange a supervisor's credential for a short-lived token.
      description: >-
        Answers a token for the standalone host's supervisor the
        presented credential belongs to (ADR-0100), under
        `machine-token.v1`: the credential `enrollStandaloneAgent`
        answered it under `standalone-enrollment.v2`. The token is
        prefixed `garam_st_`, is accepted for an hour on the operations
        that list `machineToken`, and is refreshed by exchanging again
        in the last third of that hour; nothing here renews one token
        into another, so only the credential mints them. A token names
        no audience, and a request naming one is 400.

        A revocation or a replacement of the supervisor's registration,
        and a retried enrollment re-issuing the credential, each refuse
        the credential and every token it was exchanged for from the
        next request (ADR-0100). Unknown, voided and withdrawn
        credentials are one refusal.

        An operator exchanges no credential here: it is registered with
        a key and exchanges an assertion with `exchangeClientAssertion`
        (ADR-0102, ADR-0117).
      security:
        - machineCredential: []
      parameters:
        - $ref: '#/components/parameters/tokenContractVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenExchange'
      responses:
        '201':
          description: Token issued, shown once.
          headers:
            Garam-Contract-Version:
              $ref: '#/components/headers/TokenContractVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineToken'
        '400':
          $ref: '#/components/responses/TokenContractError'
        '401':
          $ref: '#/components/responses/TokenContractError'
        '429':
          description: Too many exchanges from this process; try again after `Retry-After`.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            Garam-Contract-Version:
              $ref: '#/components/headers/TokenContractVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /oauth/token:
    post:
      operationId: exchangeClientAssertion
      tags: [identity]
      summary: Exchange an operator's signed client assertion for a short-lived token.
      description: >-
        The OAuth 2.0 client credentials grant authenticated by
        `private_key_jwt` (RFC 6749, RFC 7523), under
        `machine-token.v2` (ADR-0102). It is reached over the listener's
        verified server TLS with no `Authorization` header: what authenticates the request is the
        assertion in its body, signed by a live key of the operator
        `client_id` names. A request presenting either is
        `invalid_request`.

        The form carries each parameter once: `grant_type`
        `client_credentials`, `client_id` the operator's canonical GRN,
        `client_assertion_type`
        `urn:ietf:params:oauth:client-assertion-type:jwt-bearer`, and
        `client_assertion` one compact JWT. Its protected header holds
        `alg` `RS256`, `kid` the key's base64url SHA-256 RFC 7638
        thumbprint, `typ` `JWT` and nothing else. Its claims hold `iss`
        and `sub` both equal to `client_id`; `aud` one string equal byte
        for byte to the token endpoint URL the key issuance answered as
        `tokenUrl`; integer `iat` and `exp` at most 60 seconds apart; a
        `jti` of 22 to 128 base64url characters; and optionally an
        integer `nbf` no later than `exp`. garam allows 30 seconds of
        skew against its database's clock. No member repeats, in the
        header, the claims or any object inside them. The optional
        `audience` names another operator of the same organization —
        a hosted control service — the token is minted to be shown to,
        absent, the token is garam's. A
        `scope` is `invalid_scope`, a `client_secret` and any other
        grant are refused, and unrecognised parameters are ignored.

        **Each assertion is exchanged once.** Its (`client_id`, `jti`)
        is spent in the transaction that records the token, on every
        replica and across restarts, so two copies yield one token and
        the other `invalid_client`. A lost answer is recovered with a
        fresh assertion and `jti`, never by retrying the same one.

        A bad signature, a key that is unknown, withdrawn or past its
        rollover, a wrong identity, audience or time, and a replay are
        one refusal, `invalid_client` with 400, which says nothing
        about which registrations or keys exist. A token is refused
        from the next request once its key is withdrawn. A process
        answers at most 60 exchanges per client address, counted before
        anything is read, and 10 verified ones per `client_id`, each per
        minute, and 429 with `Retry-After` past either: a flood from one
        address holds back no other, and an assertion that fails to
        verify spends no operator's budget. An unconfigured token
        endpoint, or a database that cannot be read, answers 503 and
        issues nothing; a defect answers 500 `server_error`.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ClientAssertionRequest'
      responses:
        '200':
          description: Token issued, shown once. It is not stored and not cached.
          headers:
            Garam-Contract-Version:
              $ref: '#/components/headers/AssertionContractVersion'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Pragma:
              $ref: '#/components/headers/NoCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthToken'
        '400':
          $ref: '#/components/responses/OAuthError'
        '429':
          description: Too many exchanges from this process; try again after `Retry-After`.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            Garam-Contract-Version:
              $ref: '#/components/headers/AssertionContractVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '500':
          $ref: '#/components/responses/OAuthError'
        '503':
          $ref: '#/components/responses/OAuthError'
  /agents/{agent}/tokens:
    post:
      operationId: mintAgentToken
      tags: [agent]
      security:
        - machineToken: []
        - machineBearer: []
      summary: Mint the token an agent authenticates with.
      description: >-
        Answers a short-lived token for an agent the calling operator
        holds at the current epoch, or for the one agent a standalone
        host's supervisor holds, which presents its own token to mint
        (ADR-0100), under `machine-token.v1`. The assignee hands it to
        the agent's adapter, which presents it as `Authorization:
        Garam-Token <token>`. It is accepted for an hour unless the
        deployment configures another lifetime, and the assignee mints
        the next before it runs out; minting a new one voids nothing,
        and an agent keeps its newest five per audience.

        The token is minted at the assignment's epoch and in the
        lineage the agent's execution holds, and every request
        presenting it is read against both as they stand then: a
        reassignment or a recovery refuses it from the next request,
        on a connection already open too. It is admitted for an agent
        whose lifecycle authority opened a lineage, inside it. A fenced
        agent's protected
        calls still carry their activation's token, in the
        `Garam-Execution` header.

        With an `audience` naming another operator of the agent's
        organization, the token is minted to be shown to that hosted
        operator, and garam accepts it on no operation here. A
        supervisor mints for garam alone, and an `audience` from it is
        400.
      parameters:
        - $ref: '#/components/parameters/agent'
        - $ref: '#/components/parameters/tokenContractVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenExchange'
      responses:
        '201':
          description: Token minted, shown once.
          headers:
            Garam-Contract-Version:
              $ref: '#/components/headers/TokenContractVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentToken'
        '400':
          $ref: '#/components/responses/TokenContractError'
        '401':
          $ref: '#/components/responses/TokenContractError'
        '403':
          $ref: '#/components/responses/TokenContractError'
  /agents/{agent}/provisioning-state:
    post:
      operationId: reportProvisioningState
      tags: [agent]
      security:
        - machineToken: []
        - machineBearer: []
      summary: Report what the operator sees of an agent's pod.
      description: >-
        What the calling operator says about the agent it provisioned
        outside garam (ADR-0012). garam learns this from the operator
        and from nowhere else: it dials no cluster and reads no pod, so
        an agent nobody reports on stays at `pending` and cannot be
        told from one that never started.

        The report carries the epoch the operator holds the agent at,
        and garam accepts it only at the epoch the assignment is
        currently on. A stale one is refused under
        `failed_precondition`, which is what stops the pod a replaced
        operator left running from writing over its successor's report;
        an agent with no assignment has no current epoch, so every
        report about it is stale. The epoch to send is the one the
        agent's creation or admission answered with.

        An operator the agent is not assigned to is refused, and an
        agent that does not exist is refused the same way, so a caller
        learns nothing about the agents it does not hold. This route
        never moves the runtime state: that is the agent's own fact and
        `reportRuntimeState` is where it is reported.

        garam keeps the last report and nothing before it. It expires
        none of them either, so a state stands until it is reported
        again — a report is evidence of what the operator saw, never
        evidence that the operator is still there.
      parameters:
        - $ref: '#/components/parameters/agent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProvisioningStateReport'
      responses:
        '204':
          description: Recorded. garam has nothing to answer with.
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /agents/{agent}/runtime-state:
    post:
      operationId: reportRuntimeState
      tags: [agent]
      security:
        - machineToken: []
        - machineBearer: []
          executionHeader: []
        - machineToken: []
        - machineBearer: []
      summary: Report what an agent says about itself.
      description: >-
        The agent's own account of whether it is running (ADR-0012).
        The caller reports for the agent it authenticates as and is
        refused every other one, as it is on its own queue and its own
        turn events.

        The report carries the epoch, and garam accepts it only at the
        epoch the agent's assignment is currently on; a stale one is
        refused under `failed_precondition`. The agent is told its
        epoch by the operator that constructed it — garam answers the
        operator with it on `createManagedAgent` and serves it to the
        agent nowhere.

        This route never moves the provisioning state: that is what the
        operator sees of the pod, and `reportProvisioningState` is
        where it is reported. The two facts are kept apart and neither
        substitutes for the other.

        garam keeps the last report and expires none, so an agent that
        stops reporting stays in the state it last claimed. Silence is
        not `disconnected`, and nothing here turns one into the other.

        An agent presents its execution token here, which it holds once
        its execution has been activated (ADR-0118), and the call is
        admitted against the current activation and credential lineage
        in the transaction
        of its own write: after a replacement, a reassignment, a
        recovery or its agent token's expiry it is refused, on a
        connection already open too (ADR-0080). A missing execution
        token is 401, one that is not current, or one presented for an
        agent never activated, 403, and an agent token outside the
        agent's lineage, epoch or dates 409.
      parameters:
        - $ref: '#/components/parameters/agent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeStateReport'
      responses:
        '204':
          description: Recorded. garam has nothing to answer with.
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /messages:
    post:
      operationId: postMessage
      tags: [message]
      security:
        - machineToken: []
        - machineBearer: []
          executionHeader: []
        - machineToken: []
        - machineBearer: []
      summary: Post a message to a recipient.
      description: >-
        The sender is what the token names, so the body carries
        the recipient and nothing about who is sending. garam answers
        once the message is durably stored and does not check that the
        recipient exists: rejecting a message it cannot route would
        destroy it and tell the sender nothing, so a routing failure
        comes back later as an ordinary message instead (ADR-0013).
        The sender's idempotency key is what makes a retry store one
        message rather than two.

        Which recipients a sender may reach is two questions, and they
        are refused two different ways.

        Inside the sender's own organization, policy decides
        (ADR-0024): it reaches every recipient unless a policy attached
        to it says otherwise. A recipient a policy refuses is a 403 and
        nothing is stored, because garam could have routed the message
        and the organization said not to, so storing it would deliver
        what was refused.

        Across the organization boundary the precondition is a consent
        relation both organizations hold, which no policy reaches past
        (ADR-0035). Where that relation does not stand garam cannot
        route the message, so the post is stored and answered 201 like
        any other: what is stored is the refusal, addressed back to the
        sender as an ordinary inbound message whose sender is the
        recipient that could not be reached and whose body names the
        two organizations that do not both consent (ADR-0013). The 201
        carries that refusal rather than the message submitted, which
        is how a caller tells the two apart, and its idempotency key
        derives from the sender's so a retried post is answered with
        the one refusal already stored.

        An agent presents its execution token here, which it holds once
        its execution has been activated (ADR-0118), and the call is
        admitted against the current activation and credential lineage
        in the transaction
        of its own write: after a replacement, a reassignment, a
        recovery or its agent token's expiry it is refused, on a
        connection already open too (ADR-0080). A missing execution
        token is 401, one that is not current, or one presented for an
        agent never activated, 403, and an agent token outside the
        agent's lineage, epoch or dates 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageSubmission'
      responses:
        '201':
          description: Message stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /outbox-messages:
    post:
      operationId: postOutboxMessage
      tags: [message]
      security:
        - machineToken: []
        - machineBearer: []
          executionHeader: []
        - machineToken: []
        - machineBearer: []
      summary: Post a durable reply under the creation instant its outbox entry holds.
      description: >-
        The same message write as `postMessage`, reached under contract
        `durable-delivery.v2` (ADR-0083) by a sender that retries one
        outbox entry under one idempotency key until garam answers. The
        body adds `createdAt`, the instant the entry was created, and
        garam stores a new message only while that instant is inside a
        fixed seven-day budget: no later than the database's clock when
        the insert runs, and less than seven days before it. The budget
        is part of the contract and no deployment changes it. A
        request delayed on its way to the insert is judged when it
        writes, and the receipt time garam stamps is that same instant;
        `createdAt` decides admission only and is not stored.

        A key that already stores a message is answered with that
        message whatever the budget now says, a completed one whose
        body was dropped included (ADR-0034). So a sender that lost an
        answer retries the same entry and is answered with what the
        first attempt stored, and once the budget has run out on a key
        that stores nothing, no attempt under it ever stores one —
        which keeps every stored message inside the thirty-day
        retention a retry could still reach.

        Recipients, policy, the cross-organization refusal and the
        execution token are `postMessage`'s, unchanged. The refusal is
        stored under the same budget, and a 201 carrying it has the
        intended recipient as sender and the caller as recipient, which
        is how a caller tells it from its own message: verify the
        answer's `id`, `sender`, `recipient` and `idempotencyKey`
        before treating the entry as delivered.

        The answers, each with the `Garam-Contract-Version` header:
        201 is the message the key stores, stored now or earlier, or
        the refusal. 400 `invalid_argument` is a missing or unknown
        contract version, which names `durable-delivery.v2`, or a
        malformed body, including a missing `createdAt` or one that is
        not an RFC 3339 instant. 400 `out_of_range` is a `createdAt`
        later than garam's clock: the entry is not lost, and a later
        attempt may be admitted. 410 `deadline_exceeded` is a key that
        stores nothing and a budget that has run out, which no later
        attempt changes. 409 `already_exists` is a key that stores a
        message to another recipient, or with another body while it
        still holds one. A missing token is 401, one that is not current
        403, as is one presented for an agent never activated, and an
        agent token outside the agent's lineage, epoch or dates 409
        `failed_precondition` (ADR-0080). A garam that predates this route answers 404, as it
        does any path it does not serve, and has stored nothing.
      parameters:
        - $ref: '#/components/parameters/deliveryContractVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutboxSubmission'
      responses:
        '201':
          description: The message the key stores, or the cross-organization refusal.
          headers:
            Garam-Contract-Version:
              $ref: '#/components/headers/DeliveryContractVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/DeliveryContractError'
        '401':
          $ref: '#/components/responses/DeliveryContractError'
        '403':
          $ref: '#/components/responses/DeliveryContractError'
        '409':
          $ref: '#/components/responses/DeliveryContractError'
        '410':
          $ref: '#/components/responses/DeliveryContractError'
  /messages/{message}:
    get:
      operationId: getMessageStatus
      tags: [message]
      security:
        - machineToken: []
        - machineBearer: []
          executionHeader: []
        - machineToken: []
        - machineBearer: []
      summary: Read how far a message the caller sent has got.
      description: >-
        What garam knows about the message and the sender does not: the
        state it is in, how many attempts it has spent, and when garam
        stored it (ADR-0055). The recipient, the key and the body were
        the sender's own submission and are not answered back.

        The caller reads the messages it sent and no others. A message
        another identity sent, one that never existed, and one the
        thirty-day sweep has deleted are all `404`: nothing about the
        queue outside the caller's own messages is learnable by asking.
        That makes the answer to an expired message its absence rather
        than a state — a sender holding the `201` knows the message was
        stored, and the sweep is the only thing that removes a stored
        one (ADR-0034).

        There is no state meaning expired for the same reason: a
        message past the retention window that the sweep has not
        reached yet is still handed to a reader, so calling it expired
        would name something the queue does not do. `createdAt` is what
        a sender measures the window against.

        The body is never answered. A completed message no longer has
        one (ADR-0034), so a field carrying it would be present in some
        states and absent in others, and its absence would mean two
        things.

        garam reports none of this on its own. A post refused across an
        organization boundary is answered with the refusal message
        rather than the one submitted (see `postMessage`), and that
        refusal's sender is not the caller — so its identifier is not
        one this route answers, and there is nothing to track: the
        refusal arrives on the caller's own queue.

        An agent presents its execution token here, which it holds once
        its execution has been activated (ADR-0118), and the call is
        admitted against the current activation and credential lineage
        in the transaction
        of its own write: after a replacement, a reassignment, a
        recovery or its agent token's expiry it is refused, on a
        connection already open too (ADR-0080). A missing execution
        token is 401, one that is not current, or one presented for an
        agent never activated, 403, and an agent token outside the
        agent's lineage, epoch or dates 409.
      parameters:
        - $ref: '#/components/parameters/message'
      responses:
        '200':
          description: How far the message has got.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageStatus'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /message-signing-keys:
    get:
      operationId: getMessageSigningKeys
      tags: [message]
      summary: Read the public keys garam signs messages with.
      description: >-
        The JWK Set (RFC 7517) a verifier checks the signature on a
        claimed message against (ADR-0101): the key that signs now, a
        key announced to sign next, and a key that stopped signing while
        a signature it made can still be valid. A key retired at once is
        not in it. It is served at this path on the machine listener,
        and a verifier fetches it from wherever it reaches that
        listener, which is not the issuer: the issuer is an identity and
        need not resolve. The answer is complete in itself, so a
        deployment whose verifier cannot reach garam hands it the same
        document as a file.

        A key is published at least two hours before it signs. The
        answer may be cached for the hour `Cache-Control` names; a
        verifier meeting a `kid` it does not hold reads this again.
      security: []
      responses:
        '200':
          description: The published keys.
          headers:
            Cache-Control:
              description: '`max-age=3600`.'
              schema:
                type: string
          content:
            application/jwk-set+json:
              schema:
                $ref: '#/components/schemas/MessageSigningKeySet'
  /agents/{agent}/claims:
    post:
      operationId: claimMessage
      tags: [message]
      security:
        - machineToken: []
        - machineBearer: []
          executionHeader: []
        - machineToken: []
        - machineBearer: []
      summary: Claim the next message addressed to an agent.
      description: >-
        A long poll: the call waits for a message rather than answering
        an empty queue at once, and answers 204 when none arrives in
        that time. The caller claims for the agent it authenticates as
        and is refused every other one. Exactly one caller holds a
        given message, under a lease that garam measures; a claim
        nobody completes lapses and the message is handed on, up to a
        bounded number of attempts (ADR-0018).

        An agent presents its execution token here, which it holds once
        its execution has been activated (ADR-0118), and the call is
        admitted against the current activation and credential lineage
        in the transaction
        of its own write: after a replacement, a reassignment, a
        recovery or its agent token's expiry it is refused, on a
        connection already open too (ADR-0080). A missing execution
        token is 401, one that is not current, or one presented for an
        agent never activated, 403, and an agent token outside the
        agent's lineage, epoch or dates 409.
      parameters:
        - $ref: '#/components/parameters/agent'
      responses:
        '200':
          description: A message, and the hold the caller now has on it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
        '204':
          description: Nothing was ready before the wait ran out. Ask again.
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /agents/{agent}/claims/{claim}/renewal:
    post:
      operationId: renewClaim
      tags: [message]
      security:
        - machineToken: []
        - machineBearer: []
          executionHeader: []
        - machineToken: []
        - machineBearer: []
      summary: Extend a claim while the message is still being worked on.
      description: >-
        Renewal is what keeps a long turn from losing its claim
        mid-flight. It carries the hold no further than a ceiling
        measured from when the claim was taken, and a renewal reaching
        past that ceiling is held at it: the ceiling is the backstop
        for a completion that never arrives, so it is not renewable
        away (ADR-0018). A claim already lapsed, handed on, or
        completed is refused.

        An agent presents its execution token here, which it holds once
        its execution has been activated (ADR-0118), and the call is
        admitted against the current activation and credential lineage
        in the transaction
        of its own write: after a replacement, a reassignment, a
        recovery or its agent token's expiry it is refused, on a
        connection already open too (ADR-0080). A missing execution
        token is 401, one that is not current, or one presented for an
        agent never activated, 403, and an agent token outside the
        agent's lineage, epoch or dates 409.
      parameters:
        - $ref: '#/components/parameters/agent'
        - $ref: '#/components/parameters/claim'
      responses:
        '200':
          description: The hold as it now stands.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /agents/{agent}/turn-events:
    post:
      operationId: forwardTurnEvent
      tags: [watch]
      security:
        - machineToken: []
        - machineBearer: []
          executionHeader: []
        - machineToken: []
        - machineBearer: []
      summary: Forward one turn event to whoever is watching the agent.
      description: >-
        What the agent is saying now, on its way to the browsers
        watching it. The caller forwards for the agent it authenticates
        as and is refused every other one.

        Nothing is stored and nobody acknowledges. garam announces the
        event to the process holding each stream, and an event arriving
        while nobody watches reaches no one — so a success here says the
        event was announced and never that a person saw it (ADR-0022).
        The watcher count on `claimMessage` and `renewClaim` is what
        says whether to forward at all, and forwarding to an agent
        nobody watches is the cost that decision exists to avoid.

        An event larger than one announcement carries is refused rather
        than shortened: a shortened turn would put words in the agent's
        mouth, where a refused event is the gap this stream already
        permits.

        An agent presents its execution token here, which it holds once
        its execution has been activated (ADR-0118), and the call is
        admitted against the current activation and credential lineage
        in the transaction
        of its own write: after a replacement, a reassignment, a
        recovery or its agent token's expiry it is refused, on a
        connection already open too (ADR-0080). A missing execution
        token is 401, one that is not current, or one presented for an
        agent never activated, 403, and an agent token outside the
        agent's lineage, epoch or dates 409.

        An event admitted before a replacement is announced before that
        replacement commits; when a watcher receives it is not part of
        that order.
      parameters:
        - $ref: '#/components/parameters/agent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TurnEvent'
      responses:
        '202':
          description: >-
            Announced. Nothing is stored, so this is not evidence that
            a watcher received it.
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /agents/{agent}/claims/{claim}/completion:
    post:
      operationId: completeClaim
      tags: [message]
      security:
        - machineToken: []
        - machineBearer: []
          executionHeader: []
        - machineToken: []
        - machineBearer: []
      summary: Report the claimed message delivered.
      description: >-
        Completion is fenced by the claim rather than by the message,
        so a caller whose lease was handed on completes nothing.
        Completing twice reports the same delivery, because a caller
        that could not read the answer retries.

        An agent presents its execution token here, which it holds once
        its execution has been activated (ADR-0118), and the call is
        admitted against the current activation and credential lineage
        in the transaction
        of its own write: after a replacement, a reassignment, a
        recovery or its agent token's expiry it is refused, on a
        connection already open too (ADR-0080). A missing execution
        token is 401, one that is not current, or one presented for an
        agent never activated, 403, and an agent token outside the
        agent's lineage, epoch or dates 409.
      parameters:
        - $ref: '#/components/parameters/agent'
        - $ref: '#/components/parameters/claim'
      responses:
        '204':
          description: The message is delivered and is not handed out again.
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /operation-authorities/introspection:
    post:
      operationId: introspectOperationAuthority
      tags: [authority]
      security:
        - machineToken: []
        - machineBearer: []
      summary: Read what an operation authority binds, once current state still authorizes it.
      description: >-
        The calling operator must be the authority's audience. Unknown,
        expired, and another audience's authority are one 404. A known
        operation that current membership, roles, groups, persisted
        policies, the grant, the bound controller's registration or a
        configuration change's placement no longer authorizes is 403,
        and one garam cannot decide from current state is 503. Nothing
        is consumed: a retry introspects again. Check `bodySha256`
        against the exact body received, and introspect before
        revealing any stored result for `requestId`.
      parameters:
        - $ref: '#/components/parameters/contractVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorityIntrospection'
      responses:
        '200':
          description: The authority's binding.
          headers:
            Garam-Contract-Version:
              $ref: '#/components/headers/ContractVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationBinding'
        '400':
          $ref: '#/components/responses/ContractError'
        '401':
          $ref: '#/components/responses/ContractError'
        '403':
          $ref: '#/components/responses/ContractError'
        '404':
          $ref: '#/components/responses/ContractError'
  /operation-references/{ref}:
    get:
      operationId: checkOperationReference
      tags: [authority]
      security:
        - machineToken: []
        - machineBearer: []
      summary: Recheck a durable operation reference before activating a new desired revision.
      description: >-
        Decides the reference as introspection decides an authority,
        without the short token's expiry. It is not a restart
        capability: restarting a revision already applied uses the
        lifecycle authority (ADR-0078). The answer carries no
        `expiresAt`.
      parameters:
        - $ref: '#/components/parameters/contractVersion'
        - $ref: '#/components/parameters/ref'
      responses:
        '200':
          description: The reference's binding, currently authorized.
          headers:
            Garam-Contract-Version:
              $ref: '#/components/headers/ContractVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationBinding'
        '400':
          $ref: '#/components/responses/ContractError'
        '401':
          $ref: '#/components/responses/ContractError'
        '403':
          $ref: '#/components/responses/ContractError'
        '404':
          $ref: '#/components/responses/ContractError'
  /operators/{controller}/introspection:
    post:
      operationId: introspectController
      tags: [authority]
      security:
        - machineToken: []
        - machineBearer: []
      summary: Prove a controller's current authority, and an agent's placement on it, for one decision.
      description: >-
        The calling operator is the hosted control audience, presents
        its own token, and forwards `token`: the token the controller
        exchanged its credential for to be shown to the caller (ADR-0100,
        ADR-0118). garam verifies that token and never a forwarded GRN.
        The answer is a positive proof, and 200 is returned only when
        every check passes, each read on this request: the caller's own
        token is still live and its registration is still held; the
        forwarded token is live, names `controller` and names the caller
        as its audience, and the controller is still registered; the
        caller's current grant covers `agent:activate` for that
        controller; and current policy for the caller and its current
        groups, beside an Allow of `agent:activate` on the organization
        (or, with `agent`, on that agent) that the grant contributes,
        does not deny it. With `agent`, the agent must currently be
        assigned to `controller`, and the answer carries that
        assignment's epoch, which the caller compares with the epoch it
        expects. A session admitted without an agent is not permission
        to release any agent's desired content, status or placement:
        obtain the agent-bound proof before each such decision, again
        after a long wait, and never reuse one across decisions.
        Malformed input is 400; a token that does not prove
        `controller` is 422; a controller or agent that is unknown, of
        another organization, or no longer registered is 404; any other
        current-authority refusal — the caller's withdrawn registration,
        an ended or out-of-scope grant, a Deny, or an agent assigned
        elsewhere — is 403; and authority garam cannot read as current
        is 503. This proves current authority as of its reads and is
        not a transaction with the caller's store.
      parameters:
        - $ref: '#/components/parameters/contractVersion'
        - $ref: '#/components/parameters/controller'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControllerIntrospection'
      responses:
        '200':
          description: The proof.
          headers:
            Garam-Contract-Version:
              $ref: '#/components/headers/ContractVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControllerProof'
        '400':
          $ref: '#/components/responses/ContractError'
        '401':
          $ref: '#/components/responses/ContractError'
        '403':
          $ref: '#/components/responses/ContractError'
        '404':
          $ref: '#/components/responses/ContractError'
        '422':
          $ref: '#/components/responses/ContractError'
  /agents/{agent}/activations:
    post:
      operationId: activateAgent
      tags: [execution]
      security:
        - machineToken: []
        - machineBearer: []
      summary: Admit a runtime generation of an agent, and issue the token its calls carry.
      description: >-
        The caller is the hosted Operator control service, which has
        proven the placement and that the previous writer stopped
        before it calls. Per request, garam reads the caller's
        registration, its current grant, which must cover
        `agent:activate` for the agent's current assignee, and current
        policy on the agent, where an explicit Deny wins. The caller
        presents its own token and forwards `token`: the agent's token
        its assignee minted to be shown to the caller, or, where the
        caller is the assignee itself — a standalone host's supervisor —
        the token it minted for garam (ADR-0100, ADR-0118). A token that
        is neither, for this agent, is 422. Then, under the agent's
        execution lock, garam rechecks the assignment, the epoch, the
        grant's expiry, and whether that token is current: inside its
        dates, minted at the agent's current assignee and epoch, and in
        its current lineage. An agent's own token cannot activate.


        `replacesActivationId` names the agent's most recent
        activation, current or ended, and is null only before the
        first. Another value is 409, so a stale placement's replay never
        wins, and a generation already activated in the current lineage
        is 409 too. Every call offering `executionHeader` requires the
        token the current activation issued.


        `operationRef` is null for the revision the runtime last
        reported as effective, and is a durable `agent:configure`
        reference for a pending revision. garam rechecks that reference
        as current and requires it to bind this caller, this agent and
        its current assignment. Whether one is needed is the caller's to
        decide: garam keeps no revision. The one exception is an agent
        `createManagedAgent` made: until an activation of it has
        succeeded, a null `operationRef` is 403, and the reference is
        either such an `agent:configure` reference or the
        `agent:create` reference of that agent's own creation, while it
        is still assigned where that creation put it. An `agent:create`
        reference is accepted for that first activation alone, with a
        null `replacesActivationId`, and for its identical retry; any
        other `agent:create` reference is 403.


        The same `requestId` with the same request answers the same
        activation with 200, a new token and a higher `tokenVersion`;
        only the last token issued is admitted, so keep the highest
        version. The same `requestId` with another request, or for an
        activation that has ended, is 409. Past garam's ten-second
        deadline the answer is 503, which does not say whether the
        activation committed: retry it under the same `requestId`.
      parameters:
        - $ref: '#/components/parameters/executionContractVersion'
        - $ref: '#/components/parameters/agent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivationRequest'
      responses:
        '200':
          description: The activation a retry already made, with a new token.
          headers:
            Garam-Contract-Version:
              $ref: '#/components/headers/ExecutionContractVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activation'
        '201':
          description: The activation.
          headers:
            Garam-Contract-Version:
              $ref: '#/components/headers/ExecutionContractVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activation'
        '400':
          $ref: '#/components/responses/ExecutionContractError'
        '401':
          $ref: '#/components/responses/ExecutionContractError'
        '403':
          $ref: '#/components/responses/ExecutionContractError'
        '404':
          $ref: '#/components/responses/ExecutionContractError'
        '409':
          $ref: '#/components/responses/ExecutionContractError'
        '422':
          $ref: '#/components/responses/ExecutionContractError'
  /agents/{agent}/activations/{activation}/deactivation:
    post:
      operationId: deactivateAgent
      tags: [execution]
      security:
        - machineToken: []
        - machineBearer: []
      summary: End an activation of an agent, if it is still the current one.
      description: >-
        Authorized as `activateAgent` is, on every call. Ending the
        current activation refuses its token from the next call on, on
        a connection already open too. An activation that already ended
        is answered the same and nothing changes, so a replayed request
        never reaches its successor. Deactivation never moves the anchor
        `replacesActivationId` names: the next activation names the
        agent's most recent activation, which is this one only if
        nothing replaced it. This fences collaboration only: it does not
        stop the runtime's writer. Past garam's ten-second deadline the
        answer is 503; repeating the request is safe.
      parameters:
        - $ref: '#/components/parameters/executionContractVersion'
        - $ref: '#/components/parameters/agent'
        - $ref: '#/components/parameters/activation'
      responses:
        '200':
          description: The activation is not current.
          headers:
            Garam-Contract-Version:
              $ref: '#/components/headers/ExecutionContractVersion'
        '400':
          $ref: '#/components/responses/ExecutionContractError'
        '401':
          $ref: '#/components/responses/ExecutionContractError'
        '403':
          $ref: '#/components/responses/ExecutionContractError'
        '404':
          $ref: '#/components/responses/ExecutionContractError'
  /agents/{agent}/execution/introspection:
    post:
      operationId: introspectAgentExecution
      tags: [execution]
      security:
        - machineToken: []
        - machineBearer: []
      summary: Ask whether an agent token and a generation are current, together.
      description: >-
        Authorized as `activateAgent` is, on every call, and `token` is
        what `activateAgent` forwards. A token that is neither the one
        the assignee minted to be shown to the caller nor the
        assignee's own for garam, for this agent, is 422. One that is
        is answered `current` only if it is inside its dates, minted at
        the agent's current assignee and epoch, and in its current
        lineage, and `fenced` otherwise: a token of an earlier epoch or
        lineage, or one that has expired, is answered `fenced` while
        garam still holds its row, and 422 once the row is gone, since a
        mint deletes the agent's expired tokens and keeps its newest
        five per audience. Either answer means the token may not act
        (ADR-0100). The answer is read from one snapshot, so its parts
        were current together. Ask per decision, never per connection.
      parameters:
        - $ref: '#/components/parameters/executionContractVersion'
        - $ref: '#/components/parameters/agent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutionIntrospectionRequest'
      responses:
        '200':
          description: The token's and the generation's standing.
          headers:
            Garam-Contract-Version:
              $ref: '#/components/headers/ExecutionContractVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionIntrospection'
        '400':
          $ref: '#/components/responses/ExecutionContractError'
        '401':
          $ref: '#/components/responses/ExecutionContractError'
        '403':
          $ref: '#/components/responses/ExecutionContractError'
        '404':
          $ref: '#/components/responses/ExecutionContractError'
        '422':
          $ref: '#/components/responses/ExecutionContractError'
  /agents/{agent}/credential-recovery:
    post:
      operationId: recoverAgentCredential
      tags: [execution]
      security:
        - machineToken: []
        - machineBearer: []
          operationHeader: []
      summary: Replace an agent's credential lineage under an administrator's handoff.
      description: >-
        For an agent whose credential is lost or compromised. The
        agent keeps its GRN and everything bound to it. Authorized as
        `activateAgent` is, with `agent:recover` in place of
        `agent:activate`, and with an `agent:recover` handoff an
        administrator minted for exactly this request body: the handoff
        must bind this caller, this agent and its current assignment,
        and the SHA-256 of the received body must equal its digest, or
        the request is refused with 409 and the handoff is not spent.
        The caller presents its own token, and the handoff travels in a
        `Garam-Operation` header of its own. Nothing is signed, and the
        answer names `grn` and the new `lineage` alone (ADR-0100,
        ADR-0118).


        The recovery ends the current activation and starts a new
        lineage: every agent token minted before it is refused from the
        next request, on connections already open too, and the assignee
        mints the agent's tokens in the new lineage. The runtime is then
        activated again, and may keep its generation. The same
        `requestId` with the same body and handoff reference answers the
        recovery it recorded; any other request under that `requestId`,
        or a second recovery with the same reference, is 409. Past
        garam's ten-second deadline the answer is 503, which does not
        say whether the recovery committed: retry it under the same
        `requestId`.
      parameters:
        - $ref: '#/components/parameters/executionContractVersion'
        - $ref: '#/components/parameters/agent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialRecoveryRequest'
      responses:
        '201':
          description: The recovered lineage, the first time or again.
          headers:
            Garam-Contract-Version:
              $ref: '#/components/headers/ExecutionContractVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveredCredential'
        '400':
          $ref: '#/components/responses/ExecutionContractError'
        '401':
          $ref: '#/components/responses/ExecutionContractError'
        '403':
          $ref: '#/components/responses/ExecutionContractError'
        '404':
          $ref: '#/components/responses/ExecutionContractError'
        '409':
          $ref: '#/components/responses/ExecutionContractError'
  /operators/{controller}/managed-agents:
    post:
      operationId: createManagedAgent
      tags: [enrollment]
      security:
        - machineToken: []
        - machineBearer: []
      summary: Create an agent assigned to a controller, under a member's agent:create reference.
      description: >-
        The caller is the hosted Operator control service, the
        reference's audience. Before anything is created or an earlier
        creation answered, garam rechecks `operationRef` from current
        state: it must be an `agent:create` reference handed to this
        caller in its own organization, its grant must still cover
        `agent:create` for `controller`, the controller must still be
        registered, and the member it was minted for must still hold
        `agent:create`. The reference must bind this `controller` and
        this `requestId`. No lifecycle authority is read: creating an
        inactive identity is not activating one.


        garam mints the GRN and writes the agent, its first assignment
        to `controller` and its execution in one transaction, so a
        failure leaves no agent behind. The execution is fenced from
        birth with no active generation, and creation opens the agent's
        credential lineage, in which the controller then mints the
        agent's tokens with `mintAgentToken` (ADR-0100, ADR-0118).


        The first answer is 201. The same `operationRef` and
        `requestId` for the same `controller` answer the same `grn` and
        `epoch` with 200, however many times and from however many
        concurrent requests, while the agent is still assigned where
        its creation put it; once it has moved, the retry is 409. A
        reference bound to another controller or request identifier,
        or a `requestId` an earlier creation holds under another
        reference, is 409. A controller of another organization or one
        that is not an operator is 404, as is an unknown reference or
        another audience's; a reference of another kind is 403, and so
        is one current state no longer authorizes. Authority garam
        cannot read as current is 503.
      parameters:
        - $ref: '#/components/parameters/enrollmentContractVersion'
        - $ref: '#/components/parameters/controller'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagedAgentRequest'
      responses:
        '200':
          description: The agent an identical earlier request created.
          headers:
            Garam-Contract-Version:
              $ref: '#/components/headers/EnrollmentContractVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedAgent'
        '201':
          description: The agent, created and assigned to the controller.
          headers:
            Garam-Contract-Version:
              $ref: '#/components/headers/EnrollmentContractVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedAgent'
        '400':
          $ref: '#/components/responses/EnrollmentContractError'
        '401':
          $ref: '#/components/responses/EnrollmentContractError'
        '403':
          $ref: '#/components/responses/EnrollmentContractError'
        '404':
          $ref: '#/components/responses/EnrollmentContractError'
        '409':
          $ref: '#/components/responses/EnrollmentContractError'
  /agent-enrollments:
    post:
      operationId: enrollStandaloneAgent
      tags: [standalone]
      summary: Spend an administrator's approval and obtain a supervisor's credential.
      description: >-
        Authenticated by `Authorization: Garam-Bootstrap <secret>`,
        whose SHA-256 an administrator approved with
        `approveAgentEnrollment` together with the `requestId` this body
        carries. An unknown, withdrawn or expired secret, and one of
        another organization's approval, are one 401. The approving
        administrator's `agent:enroll` is read again from current state
        on every call: denied is 403, and authority garam cannot read as
        current is 503.


        A new agent is created with an execution fenced from birth,
        assigned to the supervisor at epoch 1, in a new credential
        lineage. A replacement moves the agent from exactly the
        supervisor and epoch the approval named to the new supervisor at
        the next epoch, ends the replaced registration and the agent's
        activation, and starts a new lineage, so every earlier token of
        the agent is fenced; the agent's GRN is unchanged and garam
        holds none of its memory. Where the assignment has moved since
        the approval, the call is 409 and writes nothing.


        Nothing is signed. The supervisor is registered, and the answer
        names `credential`, the supervisor's credential, beside the
        agent, the supervisor, the epoch, the lineage and the garam
        server root (ADR-0100, ADR-0118). garam stores the credential's
        hash alone, so an identical retry while the registration still
        holds the agent re-issues it: the credential answered before,
        and every token it was exchanged for, is refused from then on.
        The supervisor exchanges the credential for hour-long tokens
        with `exchangeToken`, mints its agent's tokens with
        `mintAgentToken`, and presents its token on the execution routes
        it holds authority on.


        The first answer is 201. The same secret and the same exact
        body answer the stored public result with 200 while the
        approval is unexpired and its registration still holds the
        agent at the recorded epoch; once a later replacement or a
        revocation has ended it, the replay is 409 and discloses
        nothing. Any other body once the approval is spent is 409.


        The answer names the `placement` the administrator approved.
        `standalone` is a host whose supervisor starts the runtime, its
        workspace and the adapter as three containers (ADR-0085).
        `direct` is a host whose supervisor attaches to a runtime
        already running there and starts nothing (ADR-0111). garam
        places, registers and fences both alike.
      security: []
      parameters:
        - $ref: '#/components/parameters/standaloneContractVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StandaloneEnrollmentRequest'
      responses:
        '200':
          description: The result an identical earlier request recorded.
          headers:
            Garam-Contract-Version:
              $ref: '#/components/headers/StandaloneContractVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandaloneEnrollment'
        '201':
          description: The supervisor is registered and its credential answered.
          headers:
            Garam-Contract-Version:
              $ref: '#/components/headers/StandaloneContractVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandaloneEnrollment'
        '400':
          $ref: '#/components/responses/StandaloneContractError'
        '401':
          $ref: '#/components/responses/StandaloneContractError'
        '403':
          $ref: '#/components/responses/StandaloneContractError'
        '409':
          $ref: '#/components/responses/StandaloneContractError'
        '422':
          $ref: '#/components/responses/StandaloneContractError'
  /agent-enrollment-approvals:
    post:
      operationId: prepareAgentEnrollment
      tags: [agent-enrollment]
      security:
        - machineToken: []
        - machineBearer: []
      summary: Prepare the approval agent-enrollment.v1 admits one agent under.
      description: >-
        The first of the contract's three stages (ADR-0102). The caller
        is the hosted Operator control service and presents its own
        token. It binds one approval to its
        organization, `requestId`, `placement`, `assignee` and the
        member's `agent:create` reference, rechecked from current state
        as `createManagedAgent` rechecks it: an `agent:create`
        reference handed to this caller in its own organization, minted
        under this `requestId` for this `assignee`. Nothing is admitted
        and no agent exists yet.


        The first answer is 201. The same binding under the same
        `requestId` answers the same approval with 200. Another binding
        under that `requestId`, or a reference minted for another
        assignee or request identifier, is 409 with reason
        `binding_conflict`. A reference of another kind, or one current
        state no longer authorizes, is 403; an unknown reference or
        another audience's, and an assignee of another organization or
        that is not an operator, is 404; authority garam cannot read as
        current is 503.


        A body naming `replaces` binds a replacement, which moves
        `replaces.agent` to `assignee` under its GRN (ADR-0107). Its
        `operationRef` is an owner's or administrator's `agent:replace`
        reference instead, handed to this caller in its own
        organization and minted under this `requestId` for
        `replaces.agent`, at `replaces.expectedAssignee` and
        `replaces.expectedEpoch`, with `assignee` as its destination;
        the caller's current grant covers `agent:replace` for both
        controllers. One minted for another agent, assignment,
        destination or request identifier is 409 with reason
        `binding_conflict`, and one the agent has moved away from is
        403, as any reference current state no longer authorizes.


        `placement: direct` is 409 with reason `direct_placement_gated`
        whatever else the body says. The name is the one this contract
        shipped with, and the refusal is permanent: `agent-enrollment.v1`
        never admits direct placement. A direct agent's authority is an
        administrator's `agent:enroll` approval and a supervisor
        registered for that one agent, never an operator (ADR-0111). The
        browser surface's `approveAgentEnrollment` with
        `placement: direct` is that approval, and the host spends it
        with `enrollStandaloneAgent` under `standalone-enrollment.v2`.
      parameters:
        - $ref: '#/components/parameters/agentEnrollmentContractVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentEnrollmentBinding'
      responses:
        '200':
          description: The approval an identical earlier request prepared.
          headers:
            Garam-Contract-Version:
              $ref: '#/components/headers/AgentEnrollmentContractVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentEnrollmentApproval'
        '201':
          description: The approval.
          headers:
            Garam-Contract-Version:
              $ref: '#/components/headers/AgentEnrollmentContractVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentEnrollmentApproval'
        '400':
          $ref: '#/components/responses/AgentEnrollmentContractError'
        '401':
          $ref: '#/components/responses/AgentEnrollmentContractError'
        '403':
          $ref: '#/components/responses/AgentEnrollmentContractError'
        '404':
          $ref: '#/components/responses/AgentEnrollmentContractError'
        '409':
          $ref: '#/components/responses/AgentEnrollmentContractError'
  /agent-enrollment-approvals/{approval}/admission:
    post:
      operationId: admitAgentEnrollment
      tags: [agent-enrollment]
      security:
        - machineToken: []
        - machineBearer: []
      summary: Admit the agent an approval binds, fenced and with no active generation.
      description: >-
        The second stage. The caller is the approval's own audience and
        repeats the binding it prepared, and an approval of another organization or another audience is 404.
        garam rechecks the reference from current state as
        `prepareAgentEnrollment` does, mints the agent's GRN and writes
        the agent, its first assignment to `assignee` and its execution
        in one transaction, which also spends the approval. The
        execution is fenced from birth, in a credential lineage of its
        own and with no active generation. Admission creates no
        workload, process, memory, volume or message-channel
        permission.


        The first answer is 201. The same binding answers the same
        `grn`, `epoch` and `lineage` with 200, however many times and
        from however many concurrent requests, while the agent is still
        assigned where admission put it; once it has moved, the retry is
        409 with reason `superseded`. A body binding other than the
        approval's is 409 with reason `binding_conflict` before the
        approval is spent and `approval_spent` after; so is an approval
        whose reference a `createManagedAgent` creation already spent.
        Refusals by placement and current authority are
        `prepareAgentEnrollment`'s.


        A replacement writes no agent. Under the agent's execution lock
        it moves the assignment from exactly `replaces.expectedAssignee`
        at `replaces.expectedEpoch` to `assignee`, raises the epoch,
        ends the current activation and moves the agent into a new
        lineage, which spends the approval; `grn` is `replaces.agent`.
        Every token of the earlier lineage is refused from the next
        request. An agent that has left the expected assignment before
        the approval is spent is 409 with reason `superseded`, and a
        retry is answered as a new agent's is.


        The third stage, credential delivery, is `mintAgentToken`:
        `assignee` mints the agent's garam token, and one whose
        `audience` names the hosted control service, in the epoch and
        lineage admission answered. The fourth, activation, is
        `activateAgent` under `execution-fence.v2`, whose first
        activation carries this reference as `operationRef`; after a
        replacement, an agent that was active names the activation the
        replacement ended in `replaces` instead. Neither delivery nor
        admission activates anything by itself.
      parameters:
        - $ref: '#/components/parameters/agentEnrollmentContractVersion'
        - $ref: '#/components/parameters/approval'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentEnrollmentBinding'
      responses:
        '200':
          description: The agent an identical earlier admission admitted.
          headers:
            Garam-Contract-Version:
              $ref: '#/components/headers/AgentEnrollmentContractVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentAdmission'
        '201':
          description: The admitted agent.
          headers:
            Garam-Contract-Version:
              $ref: '#/components/headers/AgentEnrollmentContractVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentAdmission'
        '400':
          $ref: '#/components/responses/AgentEnrollmentContractError'
        '401':
          $ref: '#/components/responses/AgentEnrollmentContractError'
        '403':
          $ref: '#/components/responses/AgentEnrollmentContractError'
        '404':
          $ref: '#/components/responses/AgentEnrollmentContractError'
        '409':
          $ref: '#/components/responses/AgentEnrollmentContractError'
components:
  parameters:
    agentEnrollmentContractVersion:
      name: Garam-Contract-Version
      in: header
      required: true
      description: >-
        `agent-enrollment.v1`, presented beside a token (ADR-0102); any
        other value is refused with 400 naming it.
      x-go-name: AgentEnrollmentContractVersion
      schema:
        type: string
    approval:
      name: approval
      in: path
      required: true
      description: Approval identifier, as `prepareAgentEnrollment` returned it.
      x-go-name: ApprovalId
      schema:
        type: string
    standaloneContractVersion:
      name: Garam-Contract-Version
      in: header
      required: true
      description: >-
        `standalone-enrollment.v2` (ADR-0100, ADR-0118); any other value
        is refused with 400 naming it.
      x-go-name: StandaloneContractVersion
      schema:
        type: string
    enrollmentContractVersion:
      name: Garam-Contract-Version
      in: header
      required: true
      description: >-
        `managed-enrollment.v2` (ADR-0100, ADR-0118); any other value is
        refused with 400 naming it.
      x-go-name: EnrollmentContractVersion
      schema:
        type: string
    tokenContractVersion:
      name: Garam-Contract-Version
      in: header
      required: true
      description: Must be `machine-token.v1` (ADR-0100); any other value is refused with 400 naming it.
      x-go-name: TokenContractVersion
      schema:
        type: string
    deliveryContractVersion:
      name: Garam-Contract-Version
      in: header
      required: true
      description: >-
        `durable-delivery.v2` (ADR-0083, ADR-0100, ADR-0118); any other
        value is refused with 400 naming it.
      x-go-name: DeliveryContractVersion
      schema:
        type: string
    executionContractVersion:
      name: Garam-Contract-Version
      in: header
      required: true
      description: >-
        `execution-fence.v2` (ADR-0100, ADR-0118); any other value is
        refused with 400 naming it.
      x-go-name: ExecutionContractVersion
      schema:
        type: string
    activation:
      name: activation
      in: path
      required: true
      description: Activation identifier, as `activateAgent` returned it.
      x-go-name: ActivationId
      schema:
        type: string
    contractVersion:
      name: Garam-Contract-Version
      in: header
      required: true
      description: >-
        `operation-authority.v2` (ADR-0079, ADR-0100, ADR-0118); any
        other value is refused with 400 naming it.
      x-go-name: ContractVersion
      schema:
        type: string
    controller:
      name: controller
      in: path
      required: true
      description: The controller's operator GRN.
      x-go-name: ControllerGrn
      schema:
        type: string
    ref:
      name: ref
      in: path
      required: true
      description: Operation reference, as minting the authority returned it.
      x-go-name: OperationRef
      schema:
        type: string
    claim:
      name: claim
      in: path
      required: true
      description: Claim identifier, as `claimMessage` returned it.
      x-go-name: ClaimId
      schema:
        type: string
    agent:
      name: agent
      in: path
      required: true
      description: Agent GRN, as its creation or admission answered it.
      x-go-name: AgentGrn
      schema:
        type: string
    message:
      name: message
      in: path
      required: true
      description: Message identifier, as `postMessage` returned it.
      x-go-name: MessageId
      schema:
        type: string
  schemas:
    Identity:
      type: object
      required: [grn]
      properties:
        grn:
          type: string
          example: grn:acme:default:agent:0a1b2c3d4e5f6071
    ProvisioningState:
      type: string
      description: >-
        What the operator reports about the agent's pod. `pending` is
        an agent no operator has reported on yet. `provisioned` is an
        agent whose workload an operator built and which reports no
        ready replica: it says the pod was built and nothing about its
        health. `ready` is an agent whose workload reports a ready
        replica, so its containers are running; it says nothing about
        whether the agent inside them works. `failed` is reserved —
        report it only from an observation that separates a workload
        that cannot start from one that is still starting, which a
        ready replica count does not, so a reporter reading that count
        alone reports `provisioned`.
      enum: [pending, provisioned, ready, failed]
    RuntimeState:
      type: string
      description: >-
        What the agent reports about itself. `unknown` is an agent that
        has not reported since it was created.
      enum: [unknown, connected, disconnected]
    ProvisioningStateReport:
      type: object
      description: >-
        One operator's account of an agent's pod, at the epoch it holds
        the agent. It carries no runtime state: what the agent says
        about itself is the agent's to report.
      required: [epoch, state]
      properties:
        epoch:
          type: integer
          minimum: 1
          description: >-
            The epoch the reporter believes the assignment is on, as
            the agent's creation or admission answered it. garam
            accepts the report only at the epoch the assignment is
            currently on.
        state:
          $ref: '#/components/schemas/ProvisioningState'
    RuntimeStateReport:
      type: object
      description: >-
        One agent's account of itself, at the epoch its assignment is
        on. It carries no provisioning state: what the pod looks like
        from outside is the operator's to report.
      required: [epoch, state]
      properties:
        epoch:
          type: integer
          minimum: 1
          description: >-
            The epoch the reporter believes the assignment is on. An
            agent is told it by the operator that constructed it; garam
            serves it to the agent on no route.
        state:
          $ref: '#/components/schemas/RuntimeState'
    TokenExchange:
      type: object
      description: >-
        What an exchange asks for. A supervisor's token is garam's
        alone, so the body names nothing.
      properties:
        audience:
          type: string
          description: >-
            Refused with 400: a supervisor's token is shown to no
            hosted operator.
    ClientAssertionRequest:
      type: object
      description: >-
        The client credentials request `exchangeClientAssertion` reads
        (ADR-0102). Each parameter appears once.
      required: [grant_type, client_id, client_assertion_type, client_assertion]
      properties:
        grant_type:
          type: string
          enum: [client_credentials]
        client_id:
          type: string
          description: The operator's canonical GRN, which the assertion's `iss` and `sub` equal.
          example: grn:acme:default:operator:controller
        client_assertion_type:
          type: string
          enum: ['urn:ietf:params:oauth:client-assertion-type:jwt-bearer']
        client_assertion:
          type: string
          maxLength: 8192
          description: One compact RS256 JWT the operator's private key signed; never the key itself.
        audience:
          type: string
          description: >-
            The GRN of another operator of the caller's organization the
            token is to be shown to. Absent, the token is garam's.
          example: grn:acme:default:operator:control
    OAuthToken:
      type: object
      description: RFC 6749's successful token response (ADR-0102).
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
          description: >-
            The token, prefixed `garam_ot_` and opaque, presented as
            `Authorization: Bearer` or `Garam-Token`. garam stores only
            its hash.
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Seconds the token is accepted for, 3600.
          example: 3600
    OAuthError:
      type: object
      description: RFC 6749's error response (ADR-0102).
      required: [error]
      properties:
        error:
          type: string
          enum: [invalid_request, invalid_client, unsupported_grant_type, invalid_scope, temporarily_unavailable, server_error]
          description: >-
            `invalid_request` for a malformed or repeated parameter, a
            `Authorization` header, or an audience
            that is not another operator of the organization;
            `invalid_client` for an assertion that authenticates no
            operator; `unsupported_grant_type` for a grant other than
            `client_credentials`; `invalid_scope` for any `scope`;
            `temporarily_unavailable` with 429 or 503; `server_error`
            with 500.
        error_description:
          type: string
    MachineToken:
      type: object
      required: [token, grn, expiresAt]
      properties:
        token:
          type: string
          description: >-
            The token itself, prefixed `garam_ot_` for an operator and
            `garam_st_` for a supervisor, answered once. garam stores
            only its hash.
        grn:
          type: string
          description: The operator or the supervisor the token authenticates as.
          example: grn:acme:default:operator:controller
        audience:
          type: string
          description: The hosted operator the token is minted for, where one was asked for.
        expiresAt:
          type: string
          format: date-time
          description: When garam stops accepting the token.
    AgentToken:
      type: object
      required: [token, grn, epoch, expiresAt, serverRootPem]
      properties:
        token:
          type: string
          description: >-
            The token itself, prefixed `garam_at_`, answered once. garam
            stores only its hash.
        grn:
          type: string
          description: The agent the token authenticates as.
          example: grn:acme:default:agent:0a1b2c3d4e5f6071
        epoch:
          type: integer
          description: The assignment epoch the token was minted at.
        audience:
          type: string
          description: The hosted operator the token is minted for, where one was asked for.
        expiresAt:
          type: string
          format: date-time
          description: When garam stops accepting the token.
        serverRootPem:
          type: string
          description: The garam server root the holder verifies garam by (ADR-0040).
    MessageSubmission:
      type: object
      description: What a sender supplies. Who is sending is the token's to say.
      required: [recipient, idempotencyKey, body]
      properties:
        recipient:
          type: string
          description: >-
            GRN of the identity the message is addressed to. It does
            not have to name an agent garam knows.
          example: grn:acme:default:agent:0a1b2c3d4e5f6071
        idempotencyKey:
          type: string
          description: >-
            The sender's own key for this message. Posting the same key
            twice stores one message and answers with it both times.
        body:
          type: string
          maxLength: 65536
          description: >-
            The message itself. The queue carries it and never reads
            it, so it may be empty. It is bounded (ADR-0034):
            `maxLength` counts characters, so the bound is 65536 of
            them — well past any plausible agent turn — and UTF-8
            spends up to four bytes on each, so a body weighs up to 256
            KiB. The bound is what keeps the table's worst case
            arithmetic, and 256 KiB is the figure that arithmetic runs
            on: size a buffer or a row estimate against it, not against
            the character count.
    OutboxSubmission:
      type: object
      description: >-
        What a sender supplies for one outbox entry. Who is sending is
        the token's to say.
      required: [recipient, idempotencyKey, body, createdAt]
      properties:
        recipient:
          type: string
          description: >-
            GRN of the identity the message is addressed to. It does
            not have to name an agent garam knows.
          example: grn:acme:default:agent:0a1b2c3d4e5f6071
        idempotencyKey:
          type: string
          description: >-
            The entry's own identifier, unchanged on every attempt. The
            first message stored under it is the one every later
            attempt is answered with.
        body:
          type: string
          maxLength: 65536
          description: >-
            The message itself, bounded as `MessageSubmission`'s body is
            (ADR-0034).
        createdAt:
          type: string
          description: >-
            When the entry was created, as an RFC 3339 instant with any
            number of fractional digits, the same on every attempt. It
            is read as text so that garam, not the decoder, refuses one
            that does not parse.
          example: '2026-10-04T18:07:52.123456789Z'
    Message:
      type: object
      description: One stored message, under an identifier the queue minted.
      required: [id, recipient, sender, idempotencyKey, body, createdAt]
      properties:
        id:
          type: string
          description: >-
            The queue's identifier for the message. A message is a queue
            entry rather than a resource a policy names, so it is opaque
            and not a GRN.
        recipient:
          type: string
          example: grn:acme:default:agent:0a1b2c3d4e5f6071
        sender:
          type: string
          example: grn:acme:default:agent:9f8e7d6c5b4a3021
        idempotencyKey:
          type: string
        body:
          type: string
        createdAt:
          type: string
          format: date-time
    MessageState:
      type: string
      description: >-
        How far a message has got. `pending` is waiting for a reader or
        waiting to be handed out again; `claimed` is held by a reader
        whose lease has not run out; `completed` is reported delivered;
        `exhausted` has spent its attempts and is handed out no further
        (ADR-0018). Nothing here means expired — a message the sweep
        deleted is answered by `getMessageStatus` as one that is not
        there (ADR-0055).
      enum: [pending, claimed, completed, exhausted]
    MessageStatus:
      type: object
      description: >-
        What garam knows about one message and its sender does not. It
        carries no body: the sender wrote it, and a completed message
        no longer has one (ADR-0034).
      required: [id, state, attempts, createdAt]
      properties:
        id:
          type: string
          description: The queue's identifier for the message, as `postMessage` answered with.
        state:
          $ref: '#/components/schemas/MessageState'
        attempts:
          type: integer
          minimum: 0
          description: >-
            How many times the message has been handed to a reader.
            Zero is a message nothing has looked at yet, and a rising
            count on a message that is not `completed` is a turn
            failing the same way each time (ADR-0018).
        createdAt:
          type: string
          format: date-time
          description: >-
            When garam stored the message. An undelivered message is
            deleted thirty days after it, so this is what a sender
            measures the retention window against (ADR-0034).
    Claim:
      type: object
      description: >-
        One caller's hold on one message, and the token that fences it.
        A claim also carries the message's content and garam's
        signature over it (ADR-0101); a renewal carries neither, because
        it hands nothing out.
        Renewal and completion carry that token, and a hold handed on to
        the next caller stops matching.
      required: [id, expiresAt, attempt, watchers, message]
      properties:
        id:
          type: string
          description: The claim's identifier, which renewal and completion name.
        expiresAt:
          type: string
          format: date-time
          description: >-
            When the hold lapses and the message is handed to the next
            caller. garam measures it, so no caller's clock decides it.
        attempt:
          type: integer
          minimum: 1
          description: >-
            Which delivery of this message the caller is holding.
            Delivery is at-least-once (ADR-0018), so this is what tells
            a first delivery from a repeat; a message that reaches the
            bound is not handed out again.
        watchers:
          type: integer
          minimum: 0
          description: >-
            How many streams garam was holding for this agent when it
            answered, which is what says whether to forward the turn's
            events (ADR-0022). Zero is the ordinary answer and the field
            is always here: garam stores nothing for an agent nobody
            watches, so it is answered in the same shape as one somebody
            watches. Every renewal carries the count again, so a person
            who opened the view mid-turn is seen without a call of their
            own — and one who left is stopped forwarding to.
        message:
          $ref: '#/components/schemas/Message'
        content:
          type: string
          description: >-
            What the runtime is handed for this message: the
            `garam-message.v1` object of `contract`, `sender` and `body`,
            in that order, encoded so that every attempt of one message
            carries the same characters. `signature` binds a SHA-256 over
            their UTF-8 octets, so a relay forwards them unaltered.
        signature:
          type: string
          description: >-
            garam's signature over this hand-out, a compact JWS signed
            with ES256 and typed `agent-message+jwt` (ADR-0101). Its
            claims name the issuer, the sender garam vouches for, the
            recipient as audience and its organization, the message's
            identifier, the content's digest, and an expiry the lease
            ceiling after the claim was taken. Each claim signs afresh,
            and every attempt of one message carries the same content
            and identifier under it.
    MessageSigningKeySet:
      type: object
      description: A JWK Set (RFC 7517) of the keys garam signs messages with.
      required: [keys]
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/MessageSigningKey'
    MessageSigningKey:
      type: object
      description: >-
        One public P-256 key as a JWK. `kid` is its JWK thumbprint
        (RFC 7638), which is what a signature's header names.
      required: [kid, kty, crv, alg, use, x, 'y']
      properties:
        kid:
          type: string
        kty:
          type: string
          enum: [EC]
        crv:
          type: string
          enum: [P-256]
        alg:
          type: string
          enum: [ES256]
        use:
          type: string
          enum: [sig]
        x:
          type: string
          description: The x coordinate, base64url without padding.
        'y':
          type: string
          description: The y coordinate, base64url without padding.
    TurnEvent:
      type: object
      description: >-
        One event from the agent's monitoring stream, as the agent
        platform emitted it. garam carries it and never reads it, so
        what a kind means and what a body holds are the platform's to
        say.
      required: [kind, body]
      properties:
        kind:
          type: string
          maxLength: 64
          description: >-
            What the platform called this event. It reaches a browser as
            the name of a server-sent event, so it is one line.
        body:
          type: string
          maxLength: 4000
          description: >-
            The event itself. It may be empty and it may span lines.
    AuthorityIntrospection:
      type: object
      required: [authority]
      properties:
        authority:
          type: string
          description: The opaque authority, carried in the body so it never reaches a URL.
    OperationBinding:
      type: object
      required: [operationRef, grantId, orgGrn, actorGrn, audienceGrn, operation, targetGrn, requestId, bodySha256]
      properties:
        operationRef:
          type: string
        grantId:
          type: string
        orgGrn:
          type: string
        actorGrn:
          type: string
          description: The user the operation is performed for.
        audienceGrn:
          type: string
        operation:
          type: string
          enum: [agent:create, agent:configure, agent:recover, agent-template:read, agent-template:publish, execution-profile:read, agent:execution-read, operator:read, agent:replace]
          description: >-
            Each operation is served on one route with one fixed HTTP
            method. A release that does not know an operation refuses
            to mint it rather than minting it without its binding.
        targetGrn:
          type: string
          description: >-
            The controller for `agent:create`; the agent for
            `agent:configure`, `agent:recover`,
            `agent:execution-read` and `agent:replace`; the
            organization
            for
            `agent-template:read`, `agent-template:publish`,
            `execution-profile:read` and `operator:read`.
        assignment:
          $ref: '#/components/schemas/BoundAssignment'
        destinationGrn:
          type: string
          description: >-
            Present for `agent:replace` alone: the controller the
            replacement moves the agent to, which
            `admitAgentEnrollment` compares with the binding's assignee
            (ADR-0107).
        requestId:
          type: string
        bodySha256:
          type: string
        requestTarget:
          type: string
          maxLength: 2048
          description: >-
            Present for `agent-template:read`, `agent-template:publish`,
            `execution-profile:read`, `agent:execution-read` and
            `operator:read`, absent for every other operation. It is
            the exact origin-form
            request target the console sent: the escaped path and the
            raw query, with no scheme or authority, including any path
            prefix of the registered control endpoint. Compare it, before
            decoding, routing or reading any data, with the target the
            request arrived with, byte for byte; the empty body's digest
            does not tell one read from another.
        expiresAt:
          type: string
          format: date-time
          description: When the presented authority stops being usable. Absent on a reference check.
    BoundAssignment:
      type: object
      required: [operatorGrn, epoch]
      description: >-
        Where the agent ran when an operation on it was authorized.
        Present for `agent:configure`, `agent:recover`,
        `agent:execution-read` and `agent:replace` only.
      properties:
        operatorGrn:
          type: string
        epoch:
          type: string
          description: Opaque.
    ControllerIntrospection:
      type: object
      required: [token]
      properties:
        token:
          type: string
          pattern: '^garam_ot_[0-9a-f]{64}$'
          description: >-
            The token the controller exchanged its credential for to be
            shown to the caller, exactly as the controller presented it
            (ADR-0100).
        agent:
          type: [string, 'null']
          description: >-
            An agent GRN, to prove that agent's placement on the
            controller. Absent or null proves the controller alone.
    ControllerProof:
      type: object
      required: [operator, org, agent]
      properties:
        operator:
          type: string
          description: The controller's GRN.
        org:
          type: string
          description: The organization's GRN.
        agent:
          description: The agent's current placement, null where no agent was supplied.
          oneOf:
            - $ref: '#/components/schemas/ProvenAgent'
            - type: 'null'
    ProvenAgent:
      type: object
      required: [grn, epoch]
      properties:
        grn:
          type: string
        epoch:
          type: string
          description: The current assignment's epoch. Opaque; compare it for equality only.
    ActivationRequest:
      type: object
      required: [requestId, epoch, generation, replacesActivationId, operationRef, token]
      properties:
        requestId:
          type: string
          pattern: '^[A-Za-z0-9._~-]{1,128}$'
        epoch:
          type: string
          description: The assignment's epoch the caller expects. Opaque.
        generation:
          type: string
          pattern: '^[0-9a-f]{32}$'
          description: The runtime's start nonce for this process.
        replacesActivationId:
          type: [string, 'null']
          description: The agent's most recent activation, null only before the first.
        operationRef:
          type: [string, 'null']
          description: >-
            A durable `agent:configure` reference for a pending
            revision, or a managed agent's own `agent:create` reference
            for its first activation; null otherwise.
        token:
          type: string
          pattern: '^garam_at_[0-9a-f]{64}$'
          description: >-
            The agent's token its assignee minted to be shown to the
            caller, or, where the caller is the assignee itself — a
            standalone host's supervisor — the token it minted for garam,
            exactly as the agent presented it (ADR-0100).
    Activation:
      type: object
      required: [activationId, token, tokenVersion, grn, epoch, generation, lineage]
      properties:
        activationId:
          type: string
        token:
          type: string
          description: >-
            What the runtime's calls carry as `Authorization:
            Garam-Execution <token>`. Shown once; garam keeps its hash.
        tokenVersion:
          type: integer
          minimum: 1
          description: Rises with every token issued for this activation; keep the highest.
        grn:
          type: string
        epoch:
          type: string
          description: Opaque.
        generation:
          type: string
        lineage:
          type: [string, 'null']
          description: The credential lineage checked.
    ExecutionIntrospectionRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          pattern: '^garam_at_[0-9a-f]{64}$'
          description: >-
            The agent's token its assignee minted to be shown to the
            caller, or, where the caller is the assignee itself — a
            standalone host's supervisor — the token it minted for garam,
            exactly as the agent presented it (ADR-0100).
        generation:
          type: [string, 'null']
          description: A generation to compare with the active one.
    ExecutionIntrospection:
      type: object
      required: [grn, org, assignee, epoch, credential, generation, activationId]
      properties:
        grn:
          type: string
        org:
          type: string
        assignee:
          type: string
          description: What the agent is assigned to, an operator or a supervisor.
        epoch:
          type: string
          description: Opaque.
        credential:
          type: string
          enum: [current, fenced]
        generation:
          type: string
          enum: [current, not_current, none, not_supplied]
          description: >-
            With a generation supplied, whether it is the active one;
            without one, `none` when no generation is active and
            `not_supplied` otherwise.
        activationId:
          type: [string, 'null']
          description: The current activation, null when none is.
    CredentialRecoveryRequest:
      type: object
      required: [requestId, epoch]
      properties:
        requestId:
          type: string
          pattern: '^[A-Za-z0-9._~-]{1,128}$'
        epoch:
          type: string
          description: The assignment's epoch the caller expects. Opaque.
    RecoveredCredential:
      type: object
      description: >-
        The agent and its new lineage; the assignee mints the agent's
        tokens in it (ADR-0100).
      required: [grn, lineage]
      properties:
        grn:
          type: string
        lineage:
          type: string
    AgentEnrollmentBinding:
      type: object
      required: [requestId, placement, assignee, operationRef]
      properties:
        requestId:
          type: string
          pattern: '^[A-Za-z0-9._~-]{1,128}$'
          description: The request identifier the member's reference was minted under.
        placement:
          type: string
          enum: [managed, direct]
          description: >-
            Where the runtime runs: `managed`, provisioned by the
            Operator, or `direct`, running independently of it, which is
            refused until #1355 decides its writer proof.
        assignee:
          type: string
          description: The operator GRN the agent is assigned to, its controller.
        operationRef:
          type: string
          description: >-
            The member's durable `agent:create` reference, or for a
            replacement its `agent:replace` reference.
        replaces:
          $ref: '#/components/schemas/AgentEnrollmentReplacement'
    AgentEnrollmentReplacement:
      type: object
      required: [agent, expectedAssignee, expectedEpoch]
      description: >-
        The agent a replacement moves and the assignment it expects to
        move it from (ADR-0107).
      properties:
        agent:
          type: string
        expectedAssignee:
          type: string
        expectedEpoch:
          type: string
    AgentEnrollmentApproval:
      type: object
      required: [approvalId, requestId, placement, assignee, operationRef]
      properties:
        approvalId:
          type: string
          format: uuid
        requestId:
          type: string
        placement:
          type: string
          enum: [managed]
        assignee:
          type: string
        operationRef:
          type: string
        replaces:
          $ref: '#/components/schemas/AgentEnrollmentReplacement'
    AgentAdmission:
      type: object
      required: [grn, placement, assignee, epoch, lineage, mode, credentialDelivery]
      properties:
        grn:
          type: string
          example: grn:acme:default:agent:0a1b2c3d4e5f6071
        placement:
          type: string
          enum: [managed]
        assignee:
          type: string
        epoch:
          type: string
          description: >-
            The epoch admission assigned: a new agent's first, or the
            one a replacement raised. Opaque.
        lineage:
          type: string
          format: uuid
          description: The credential lineage the agent's tokens are minted in.
        mode:
          type: string
          enum: [fenced]
          description: >-
            The execution's mode: fenced from admission, with no active
            generation.
        credentialDelivery:
          type: string
          enum: [mintAgentToken]
          description: The operation `assignee` delivers the agent's tokens with.
    ManagedAgentRequest:
      type: object
      required: [requestId, operationRef]
      properties:
        requestId:
          type: string
          pattern: '^[A-Za-z0-9._~-]{1,128}$'
          description: The request identifier the member's `agent:create` reference was minted under.
        operationRef:
          type: string
          description: The member's durable `agent:create` reference.
    ManagedAgent:
      type: object
      required: [grn, epoch]
      properties:
        grn:
          type: string
          example: grn:acme:default:agent:0a1b2c3d4e5f6071
        epoch:
          type: string
          description: The first assignment's epoch. Opaque.
    StandaloneEnrollmentRequest:
      type: object
      required: [requestId]
      properties:
        requestId:
          type: string
          description: The identifier the host chose and the administrator approved.
    StandaloneEnrollment:
      type: object
      description: >-
        The supervisor's credential and the garam server root the host
        verifies garam by (ADR-0100).
      required: [grn, supervisorGrn, epoch, lineage, credential, serverRootPem, placement]
      properties:
        grn:
          type: string
          description: The agent's GRN.
        supervisorGrn:
          type: string
        epoch:
          type: string
          description: Opaque. The assignment epoch the supervisor holds the agent at.
        lineage:
          type: string
          format: uuid
        credential:
          type: string
          description: >-
            The supervisor's credential, prefixed `garam_sc_`, answered by
            this call alone. garam stores only its hash, and a retry
            re-issues it.
        serverRootPem:
          type: string
          description: The garam server root, which the host verifies garam's listener against (ADR-0040).
        placement:
          type: string
          enum: [standalone, direct]
          description: >-
            Where the host runs its agent's runtime, as the approval
            named it: started by the supervisor, or attached to
            (ADR-0111).
        replacesActivationId:
          type: string
          format: uuid
          description: >-
            Under a replacement alone: the agent's most recent
            activation as the replacement found it, current or ended,
            read under the execution lock the move held. The new
            supervisor's first `activateAgent` names it as
            `replacesActivationId`, which garam requires, and a host
            whose supervisor has never activated has no other way to
            learn it. A replay answers the same one. Absent for a new
            agent and for an agent never activated.
    Error:
      type: object
      required: [kind, message]
      properties:
        kind:
          type: string
          description: errorx kind, e.g. `not_found`, `permission_denied`.
        message:
          type: string
        reason:
          type: string
          description: >-
            Which refusal this is, where the kind alone does not say,
            set only on a route whose contract lists its reasons
            and absent everywhere else. The
            `agent-enrollment.v1` routes set `binding_conflict`,
            `approval_spent`, `superseded` or `direct_placement_gated`.
            Branch on it only on
            those routes; a new reason is a new contract value.
  headers:
    AssertionContractVersion:
      description: The contract version this answer follows, `machine-token.v2`.
      schema:
        type: string
        enum: [machine-token.v2]
    RetryAfter:
      description: Seconds until the window that refused the request closes.
      schema:
        type: integer
    NoStore:
      description: '`no-store`: the answer carries a bearer token no cache keeps.'
      schema:
        type: string
        enum: [no-store]
    NoCache:
      description: '`no-cache`, for HTTP/1.0 caches.'
      schema:
        type: string
        enum: [no-cache]
    TokenContractVersion:
      description: The contract version this answer follows, `machine-token.v1`.
      schema:
        type: string
    AgentEnrollmentContractVersion:
      description: The contract version this answer follows, `agent-enrollment.v1`.
      schema:
        type: string
    StandaloneContractVersion:
      description: >-
        The contract version this answer follows: `standalone-enrollment.v2`.
      schema:
        type: string
    EnrollmentContractVersion:
      description: >-
        The contract version this answer follows: `managed-enrollment.v2`.
      schema:
        type: string
    DeliveryContractVersion:
      description: >-
        The contract version this answer follows: `durable-delivery.v2`.
      schema:
        type: string
    ExecutionContractVersion:
      description: >-
        The contract version this answer follows: `execution-fence.v2`.
      schema:
        type: string
    ContractVersion:
      description: >-
        The contract version this answer follows: `operation-authority.v2`.
      schema:
        type: string
  responses:
    Error:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    OAuthError:
      description: RFC 6749's error response of the client assertion exchange.
      headers:
        Garam-Contract-Version:
          $ref: '#/components/headers/AssertionContractVersion'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OAuthError'
    TokenContractError:
      description: Error response of the token exchange.
      headers:
        Garam-Contract-Version:
          $ref: '#/components/headers/TokenContractVersion'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AgentEnrollmentContractError:
      description: Error response of an agent-enrollment.v1 route.
      headers:
        Garam-Contract-Version:
          $ref: '#/components/headers/AgentEnrollmentContractVersion'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    StandaloneContractError:
      description: Error response of a standalone enrollment route.
      headers:
        Garam-Contract-Version:
          $ref: '#/components/headers/StandaloneContractVersion'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    EnrollmentContractError:
      description: Error response of a managed enrollment route.
      headers:
        Garam-Contract-Version:
          $ref: '#/components/headers/EnrollmentContractVersion'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    DeliveryContractError:
      description: Error response of the durable submission route.
      headers:
        Garam-Contract-Version:
          $ref: '#/components/headers/DeliveryContractVersion'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ExecutionContractError:
      description: Error response of an execution route.
      headers:
        Garam-Contract-Version:
          $ref: '#/components/headers/ExecutionContractVersion'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ContractError:
      description: Error response of a versioned contract route.
      headers:
        Garam-Contract-Version:
          $ref: '#/components/headers/ContractVersion'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    machineToken:
      type: http
      scheme: Garam-Token
      description: >-
        A token `exchangeToken`, `exchangeClientAssertion` or
        `mintAgentToken` answered, as
        `Authorization: Garam-Token <token>` (ADR-0100). The listener reads the token's row joined
        to what it rests on for every request — an operator's
        registration, an agent's assignment and lineage — so a token
        whose operator was deleted or whose credential was re-issued,
        and an agent's after a reassignment or a recovery, is refused
        from the next request. A token minted for another audience is
        refused on every operation that lists this scheme. garam stores
        only its hash.
    machineBearer:
      type: http
      scheme: bearer
      description: >-
        The same token `machineToken` carries, as `Authorization: Bearer
        <token>` (ADR-0102, RFC 6750): resolved by the same read, held
        to the same operations, contract values and refusals. The scheme name
        matches case-insensitively.
    executionHeader:
      type: apiKey
      in: header
      name: Garam-Execution
      description: >-
        The token an activation issued, in a header of its own, on a
        request whose `Authorization` carries an agent token
        (`machineToken`), which takes that header (ADR-0100). An agent
        whose execution has been activated presents it on every call
        that offers this scheme, and is refused without it; one never
        activated is refused on every such call (ADR-0118). garam stores
        only its hash.
    machineCredential:
      type: http
      scheme: Garam-Credential
      description: >-
        A standalone host's supervisor's credential, as
        `Authorization: Garam-Credential <credential>`, which
        `exchangeToken` alone accepts (ADR-0100). Its enrollment
        answers it once, and garam stores only its hash.
    operationHeader:
      type: apiKey
      in: header
      name: Garam-Operation
      description: >-
        What `operationAuthority` carries, in a header of its own, on a
        request whose `Authorization` carries a token (`machineToken`),
        which takes that header (ADR-0100): a user's handoff for one
        operation, minted for the exact request body it accompanies.
