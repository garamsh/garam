  /orgs/{org}/agent-enrollments:
    post:
      operationId: approveAgentEnrollment
      tags: [agent]
      summary: Approve a standalone host's enrollment. Requires current `agent:enroll`.
      description: >-
        Approves what a standalone host prepared before asking: the
        SHA-256 of a bootstrap secret it keeps, the fingerprints of the
        two public keys it generated — its supervisor's and its
        agent's — and the request identifier it chose (ADR-0082). garam
        mints the supervisor's GRN and, for a new agent, the agent's,
        and stores the hash alone, so the host already holds what
        spending the approval needs and nothing is shown once.

        A replacement names an existing agent, the supervisor holding
        it and the epoch it holds it at; it stands a new supervisor up
        for the same GRN and moves the agent to a new credential
        lineage when spent, and only from exactly that assignment.
        Authorization is decided from current membership, roles, groups
        and persisted policies, on the organization for a new agent and
        on the agent for a replacement; an explicit Deny wins.

        Repeating a `requestId` with the same request answers the same
        approval with 200, spent or not, while it is neither withdrawn
        nor expired; any other request under it is refused with 409,
        and a withdrawn or expired one is never revived.
      parameters:
        - $ref: '#/components/parameters/org'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentEnrollmentApproval'
      responses:
        '200':
          description: The approval this `requestId` already recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentEnrollment'
        '201':
          description: Approval recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentEnrollment'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /orgs/{org}/agent-enrollments/{enrollment}:
    delete:
      operationId: withdrawAgentEnrollment
      tags: [agent]
      summary: Withdraw an unspent standalone approval. Requires current `agent:enroll`.
      description: >-
        Withdraws an approval no host has spent. Spending it afterwards
        is refused as an unknown bootstrap would be, and a withdrawal
        and a spending of one approval never both take effect. A
        withdrawn one answers 204 again; a spent one is refused with
        409, because what it registered is ended by
        `revokeAgentSupervisor`.
      parameters:
        - $ref: '#/components/parameters/org'
        - name: enrollment
          in: path
          required: true
          description: Approval identifier.
          x-go-name: EnrollmentID
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Approval withdrawn.
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /orgs/{org}/agent-supervisors/{supervisor}:
    delete:
      operationId: revokeAgentSupervisor
      tags: [agent]
      summary: Revoke a standalone host's supervisor. Requires current `agent:enroll`.
      description: >-
        Ends the supervisor's registration, the agent's current
        activation and every unspent approval for that agent, in one
        transaction under the agent's execution lock (ADR-0082). The
        supervisor's certificate stops authenticating from its next
        connection and its open ones refuse every lifecycle request;
        the agent's protected writes are refused from its next request,
        because no activation admits them. The agent, its GRN and the
        memory its host keeps are untouched, and only a new approval
        stands a supervisor up for it again. Authorization is decided
        on the agent. A supervisor the organization holds no current
        registration of answers 404.
      parameters:
        - $ref: '#/components/parameters/org'
        - name: supervisor
          in: path
          required: true
          description: Supervisor identifier (the last GRN segment).
          x-go-name: SupervisorSlug
          schema:
            type: string
      responses:
        '204':
          description: Supervisor revoked.
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /orgs/{org}/operators:
    post:
      operationId: registerOperator
      tags: [operator]
      summary: Register an operator of an organization. Requires the `admin` role.
      description: >-
        Records that this organization has an operator under the
        identifier given, so a definition can name one garam holds a
        record of (ADR-0045). The identifier is supplied and not minted:
        an operator that already holds a certificate is registered under
        the GRN that certificate names.

        It mints the operator's enrollment token in the same write, and
        answers with it once (ADR-0064). **No route reads a token
        back**: garam stores only its hash, so a caller that loses this
        one asks for another rather than for this one again.
        `mintOperatorEnrollment` is that ask, and it answers only for
        an operator that holds no certificate (ADR-0067); for one that
        already enrolled, the recovery is the command ADR-0032 ships,
        which mints a certificate out of band and reads no record here.

        The token is not a credential to the operator's identity. It is
        permission to ask for one certificate, once, from
        `enrollOperator` on the machine listener, and it stops being
        spendable ten minutes after this call. The operator generates
        its own key pair in its own cluster and sends a certificate
        signing request presenting the token: no private key is
        transmitted here, displayed here, or held by garam at any
        point.

        The record is what the operator authenticates on. A handshake
        presenting its certificate is checked against this record as
        well as against the organization's certificate authority, so
        `deleteOperator` stops the operator rather than only tidying a
        list (ADR-0070). An unspent token goes with the record, because
        the row holding it references the registration, and so does the
        record of the certificate garam last issued.

        It also issues the operator's credential in the same write, and
        answers it once (ADR-0100). The credential is what the operator
        exchanges on the machine listener for the short-lived tokens it
        authenticates with in place of a certificate. garam stores only
        its hash, so a caller that loses it re-issues it with
        `reissueOperatorCredential`, which voids this one.
      parameters:
        - $ref: '#/components/parameters/org'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperatorRegistration'
      responses:
        '201':
          description: Operator registered, with the enrollment token and the credential shown once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisteredOperator'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
    get:
      operationId: listOperators
      tags: [operator]
      summary: List an organization's operators. Requires the `member` role.
      description: >-
        The operators this organization has registered, each with where
        it stands in obtaining a certificate. An entry says garam holds
        the record and what garam already knows about the operator's
        enrollment; it does not say the operator is running or
        reachable — garam never dials one (ADR-0012) and learns nothing
        about it until it calls, so `enrolled` is an operator that
        obtained a certificate and not one that is alive.
      parameters:
        - $ref: '#/components/parameters/org'
      responses:
        '200':
          description: The organization's operators.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Operator'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /orgs/{org}/operators/{operator}:
    get:
      operationId: getOperator
      tags: [operator]
      summary: Read one of an organization's operators. Requires the `member` role.
      description: >-
        The operator registered under this identifier, answered as
        `listOperators` answers each entry. What it says about
        enrollment is what garam holds and never a report from the
        operator: garam never dials one (ADR-0012), so nothing here
        says whether the operator is running.
      parameters:
        - $ref: '#/components/parameters/org'
        - $ref: '#/components/parameters/operator'
      responses:
        '200':
          description: The operator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operator'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateOperator
      tags: [operator]
      summary: Rename or describe an operator. Requires the `admin` role.
      description: >-
        Changes what the organization calls the operator and what it
        says the operator is for, and nothing else (ADR-0074). A field
        left out keeps its value. The identifier, the GRN it builds and
        the certificate subject that GRN is are not fields here and do
        not move: the certificate garam last issued, an unspent
        enrollment token and every definition naming the operator stand
        as they were.

        It is authorized on an action of its own, `operator:update`,
        rather than on the one that registers or the one that deletes,
        because it grants nothing and withdraws nothing.
      parameters:
        - $ref: '#/components/parameters/org'
        - $ref: '#/components/parameters/operator'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperatorPatch'
      responses:
        '200':
          description: The operator as stored after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operator'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteOperator
      tags: [operator]
      summary: Delete an operator, which stops it authenticating. Requires the `admin` role.
      description: >-
        Removes the organization's record of the operator, and with it
        what the operator authenticates on. A handshake presenting that
        operator's certificate is refused from the moment this returns:
        the machine listener reads this record per connection, so the
        certificate stops being an identity rather than staying valid
        until it expires (ADR-0070). This reverses what ADR-0014 called
        revocation by lifetime, for an operator and for nothing else.

        **It is not a certificate revocation.** There is no revocation
        list and no responder, nothing is published, and no other
        certificate is affected — an agent the operator provisioned
        keeps its own, which garam admits by the claim the operator
        made while it still held the record (ADR-0033). What is
        withdrawn is the organization's statement that this operator is
        theirs, and refusing the certificate is what that statement
        turning out to be load-bearing means.

        The operator's unspent enrollment token goes with the record,
        and so does garam's record of the certificate it last issued,
        so the identifier is left holding nothing. Registering it again
        is therefore a clean start rather than an operator that reads
        as already enrolled.

        **It is refused while an agent definition names the operator.**
        Nothing is deleted in that case: a definition names the
        operator that is to run its agent, and deleting the operator
        underneath it would leave the definition naming a record garam
        no longer holds, which is the state registering an operator
        exists to prevent. `listAgentDefinitions` is what names them.
        Point those definitions at another operator first, or delete
        them.

        Deleting an operator that never enrolled is the same call and
        the same answer. Nothing here asks whether a certificate was
        ever issued.
      parameters:
        - $ref: '#/components/parameters/org'
        - $ref: '#/components/parameters/operator'
      responses:
        '204':
          description: Operator deleted; its certificate no longer authenticates.
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /orgs/{org}/operators/{operator}/credential:
    post:
      operationId: reissueOperatorCredential
      tags: [operator]
      summary: Re-issue a registered operator's credential, voiding the previous one. Requires the `admin` role.
      description: >-
        Issues the operator a new credential and answers it once
        (ADR-0100). **The credential it replaces stops authenticating
        at the moment this returns, and so does every token the
        operator exchanged it for**: the next request presenting one of
        those tokens is refused, on a connection already open too. An
        operator that holds no credential yet — one registered before
        credentials existed — is issued its first.

        It is authorized on an action of its own, `operator:reissue`,
        rather than on the one that registers: re-issuing withdraws
        what the operator runs on until the new credential is placed in
        its cluster, which is why `deleteOperator` has an action of its
        own too (ADR-0070).

        The credential is answered to the caller of this route and to
        nobody else, and garam stores only its hash. It authenticates
        one operation, `exchangeToken` on the machine listener.
      parameters:
        - $ref: '#/components/parameters/org'
        - $ref: '#/components/parameters/operator'
      responses:
        '201':
          description: Credential issued, shown once. The previous one and its tokens no longer authenticate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorCredential'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /orgs/{org}/operators/{operator}/keys:
    get:
      operationId: listOperatorKeys
      tags: [operator]
      summary: List the keys an operator was issued, with where each stands.
      description: >-
        Every key the operator was issued, withdrawn ones included,
        oldest first (ADR-0102). Each answers its public record alone:
        the fingerprint an assertion names it by, its algorithm, its
        state at garam's database time and when it last obtained a
        token. No private key exists here to answer; garam answered it
        once, to the caller of `issueOperatorKey`, and keeps nowhere.
      parameters:
        - $ref: '#/components/parameters/org'
        - $ref: '#/components/parameters/operator'
      responses:
        '200':
          description: The operator's keys.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorKeyList'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    post:
      operationId: issueOperatorKey
      tags: [operator]
      summary: Issue a registered operator a private key, shown once.
      description: >-
        Generates a 3072-bit RSA key for the operator and answers its
        private half once, as PKCS#8 `PRIVATE KEY` PEM, beside its
        public fingerprint, the operator's `clientId` and the
        `tokenUrl` its assertions name as their audience (ADR-0102).
        garam keeps the public key alone: the private key is never
        stored, logged or answered again, and a lost answer is recovered
        by issuing anew with `rotation` `immediate`. The answer is not
        cached. Keys are issued per registered operator identity: an
        Operator has two, its manager and its control service, and each
        is issued its own key here.

        It is the one route that issues a key; registering issues none.
        The first key of an operator that has never been issued one is
        authorized by `operator:register`, as registering it was. Any
        other — beside or in place of a live key, or after every key was
        withdrawn — is `operator:reissue`, and a caller holding only the
        first finds an operator that was ever keyed refused with 403.

        `rotation` says how the key stands beside the ones the operator
        holds. `planned` adds it beside the key in use, which goes on
        verifying for 24 hours and is then withdrawn by itself; a third
        live key is refused with 409 until one is withdrawn. `immediate`
        withdraws every live key, and every token exchanged under one,
        before the new key verifies anything: the answer to a
        compromised key or a lost answer. An operator's agents keep
        their own tokens across either, and recovering them is separate.

        One process issues at most 3 keys per registered operator
        identity and 30 in all per minute, and answers 429 with
        `Retry-After` past either. Where
        no token endpoint is configured (`GARAM_MACHINE_TOKEN_URL`), no
        key is issued and the route answers 409 `failed_precondition`
        with the reason `key_issuance_unconfigured`: an assertion could
        name no audience garam accepts, and the state holds until the
        deployment sets the URL.
      parameters:
        - $ref: '#/components/parameters/org'
        - $ref: '#/components/parameters/operator'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperatorKeyIssuance'
      responses:
        '201':
          description: Key issued, its private half shown once.
          headers:
            Cache-Control:
              description: '`no-store`: the answer carries a private key no cache keeps.'
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedOperatorKey'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /orgs/{org}/operators/{operator}/keys/{kid}:
    delete:
      operationId: revokeOperatorKey
      tags: [operator]
      summary: Withdraw an operator's key and every token exchanged under it. Requires `operator:reissue`.
      description: >-
        Withdraws the key (ADR-0102). **It stops verifying assertions,
        and every token exchanged under it stops authenticating, at the
        moment this returns**: the next request presenting one is
        refused, on a connection already open too, and an exchange
        racing the withdrawal either finishes first and has its token
        withdrawn here, or finds the key withdrawn and obtains nothing.
        The key's record stays, listed as `revoked`. Withdrawing a key
        already withdrawn answers 204 again.
      parameters:
        - $ref: '#/components/parameters/org'
        - $ref: '#/components/parameters/operator'
        - $ref: '#/components/parameters/kid'
      responses:
        '204':
          description: Key withdrawn, with its tokens.
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /orgs/{org}/operators/{operator}/enrollment:
    post:
      operationId: mintOperatorEnrollment
      tags: [operator]
      summary: Mint a fresh enrollment token for a registered operator. Requires the `admin` role.
      description: >-
        Mints the operator a new one-time token and answers it once,
        for an operator that holds no certificate (ADR-0067). It is
        what recovers a registration whose token was lost or ran out
        before it was spent, without minting a certificate out of band
        or standing the operator up under a second identifier.

        **The token this answers is the operator's only live one.**
        Whatever was minted before it stops being spendable at the
        moment this returns, so one operator is never reachable by two
        tokens at once. It grants nothing a registration does not:
        re-minting where no certificate exists is what `deleteOperator`
        and registering the same identifier again would be, and it is
        authorized on the action that registers rather than on the one
        that deletes.

        **It is refused where the operator already enrolled**, with a
        reason rather than a bare conflict. That operator holds a
        certificate, which is the outcome a token exists to produce, so
        a second token would be a second credential path to one
        identity — closer to issuing another credential for an existing
        subject than to registering. Whether a member may do that is
        undecided, and garam cannot tell a member recovering from a
        compromise from the compromise itself. What replaces a
        certificate an operator still holds is `renewOperatorCertificate`
        on the machine listener; what recovers one it has lost is the
        out-of-band command (ADR-0032).

        Enrolling is unchanged: the operator generates its key pair in
        its own cluster and presents this token to `enrollOperator`,
        and garam signs a key it never holds (ADR-0064). Reaching this
        operation from the console is not built — the token is answered
        to the caller of this route and to nobody else.
      parameters:
        - $ref: '#/components/parameters/org'
        - $ref: '#/components/parameters/operator'
      responses:
        '201':
          description: Token minted, shown once. Any token minted before it is spent or dead.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorEnrollment'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /orgs/{org}/operators/{operator}/delegation:
    put:
      operationId: writeOperatorDelegation
      tags: [operator]
      summary: Grant or replace a hosted operator's delegation. Requires current `operator:delegate`.
      description: >-
        Grants the hosted operator bounded authority over this
        organization's controllers (ADR-0078). A grant never changes:
        a new request ends the current grant and creates another, so an
        operation authorized under the first never becomes valid under
        the second. `expectedGrantId` must name the current grant, or
        be absent where there is none; otherwise the write is refused
        with 409 and changes nothing. Repeating a `requestId` answers
        the grant it wrote with 200 while that grant is current, and is
        refused once it has been ended or where any part of the write
        differs: the terms, `expectedGrantId`, or the caller.
        Authorization is decided from current membership, roles,
        groups and persisted policies.
      parameters:
        - $ref: '#/components/parameters/org'
        - $ref: '#/components/parameters/operator'
        - $ref: '#/components/parameters/contractVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DelegationWrite'
      responses:
        '200':
          description: The grant this `requestId` already wrote.
          headers:
            Garam-Contract-Version:
              $ref: '#/components/headers/ContractVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delegation'
        '201':
          description: The new current grant.
          headers:
            Garam-Contract-Version:
              $ref: '#/components/headers/ContractVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delegation'
        '400':
          $ref: '#/components/responses/ContractError'
        '401':
          $ref: '#/components/responses/ContractError'
        '403':
          $ref: '#/components/responses/ContractError'
        '404':
          $ref: '#/components/responses/ContractError'
        '409':
          $ref: '#/components/responses/ContractError'
    get:
      operationId: getOperatorDelegation
      tags: [operator]
      summary: Read a hosted operator's current delegation. Requires the `member` role.
      description: >-
        The current grant, which may have passed its expiry. Ended
        grants are not answered.
      parameters:
        - $ref: '#/components/parameters/org'
        - $ref: '#/components/parameters/operator'
        - $ref: '#/components/parameters/contractVersion'
      responses:
        '200':
          description: The current grant.
          headers:
            Garam-Contract-Version:
              $ref: '#/components/headers/ContractVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delegation'
        '400':
          $ref: '#/components/responses/ContractError'
        '401':
          $ref: '#/components/responses/ContractError'
        '403':
          $ref: '#/components/responses/ContractError'
        '404':
          $ref: '#/components/responses/ContractError'
    delete:
      operationId: endOperatorDelegation
      tags: [operator]
      summary: Withdraw a hosted operator's delegation. Requires current `operator:delegate`.
      description: >-
        Ends the grant named in the body, and only that one. Every
        operation authority minted under it is refused from the next
        introspection or reference check, and no later grant revives
        it. A grant already ended answers 204 and changes nothing, so a
        retried withdrawal never ends a replacement written since; a
        grant this operator never held answers 404.
      parameters:
        - $ref: '#/components/parameters/org'
        - $ref: '#/components/parameters/operator'
        - $ref: '#/components/parameters/contractVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DelegationEnd'
      responses:
        '204':
          description: Grant ended.
          headers:
            Garam-Contract-Version:
              $ref: '#/components/headers/ContractVersion'
        '400':
          $ref: '#/components/responses/ContractError'
        '401':
          $ref: '#/components/responses/ContractError'
        '403':
          $ref: '#/components/responses/ContractError'
        '404':
          $ref: '#/components/responses/ContractError'
  /orgs/{org}/operators/{operator}/control-endpoint:
    put:
      operationId: setOperatorControlEndpoint
      tags: [operator]
      summary: Register where a hosted operator's control service answers the console. Requires current `operator:delegate`.
      description: >-
        Sets the one base URL the console sends this operator's
        operation authorities to. It is an absolute `https` URL of at
        most 2048 bytes with a host, and may carry a port from 1 to
        65535 and a path prefix; credentials, a query, a fragment, a
        `.` or `..` path segment, a trailing slash and any spelling a
        URL parser would rewrite are refused with 400. Changing it is the
        delegating act and is decided from current membership, roles,
        groups and persisted policies; renaming the operator does not
        reach it. An authority already minted names its audience by
        GRN, so a new endpoint moves no audience.
      parameters:
        - $ref: '#/components/parameters/org'
        - $ref: '#/components/parameters/operator'
        - $ref: '#/components/parameters/contractVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControlEndpointWrite'
      responses:
        '200':
          description: The operator as stored.
          headers:
            Garam-Contract-Version:
              $ref: '#/components/headers/ContractVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operator'
        '400':
          $ref: '#/components/responses/ContractError'
        '401':
          $ref: '#/components/responses/ContractError'
        '403':
          $ref: '#/components/responses/ContractError'
        '404':
          $ref: '#/components/responses/ContractError'
    delete:
      operationId: clearOperatorControlEndpoint
      tags: [operator]
      summary: Clear a hosted operator's control endpoint. Requires current `operator:delegate`.
      description: >-
        The console then reaches no control service for this operator.
        Clearing one already clear answers the same.
      parameters:
        - $ref: '#/components/parameters/org'
        - $ref: '#/components/parameters/operator'
        - $ref: '#/components/parameters/contractVersion'
      responses:
        '200':
          description: The operator as stored.
          headers:
            Garam-Contract-Version:
              $ref: '#/components/headers/ContractVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operator'
        '400':
          $ref: '#/components/responses/ContractError'
        '401':
          $ref: '#/components/responses/ContractError'
        '403':
          $ref: '#/components/responses/ContractError'
        '404':
          $ref: '#/components/responses/ContractError'
  /orgs/{org}/operation-authorities:
    post:
      operationId: mintOperationAuthority
      tags: [operator]
      summary: Hand a delegated operator one operation. Requires the operation's action, decided now.
      description: >-
        Mints an opaque authority bound to the signed-in user, this
        organization, the audience operator, the operation, its target,
        `requestId` and `bodySha256` (ADR-0078). The caller sends it to
        the Operator as `Authorization: Garam-Operation <authority>`,
        outside the body whose digest it binds. It is answered once and
        expires after five minutes or at the grant's expiry, whichever
        is first.


        `agent:create` targets the controller that will run the agent
        and is authorized on the organization; `agent:configure`,
        `agent:recover` and `agent:cutover` target the agent, are
        authorized on it, and bind where it runs now. `agent:recover`
        authorizes one exact credential recovery, whose request body
        `bodySha256` digests (ADR-0078). `agent:cutover` authorizes one
        stage of moving a legacy agent's source to the audience
        (ADR-0086). `agent:replace` targets the agent, is authorized on
        it, binds where it runs now and binds `destination`, the
        controller a replacement under `agent-enrollment.v1` moves it to
        (ADR-0107). `agent-template:read`, `agent-template:publish`,
        `execution-profile:read` and `operator:read` target this
        organization and are authorized on it; `operator:read` reads
        what the Operator reports for every operator of it (#1374).
        `agent:execution-read` targets the agent, is
        authorized on it and binds where it runs now. The audience's
        current grant must cover the operation and, where it names one,
        the controller; for `agent:replace`, both the controller the
        agent is on and `destination`.


        Those five operations and `agent:cutover` also bind
        `requestTarget`, the exact request target of the one route they
        are sent to, so an authority for one route or query authorizes
        no other. For `agent:cutover` that route is garam's own cutover
        read or stage of the agent, so a reference minted for one stage
        authorizes no other. No other operation takes one.


        The same `requestId` with the same binding under the same grant
        mints a new authority for the same `operationRef`, replacing the
        previous one. Any other binding under it, including a replaced
        grant or a changed placement, is refused with 409: a newly
        authorized operation takes a new `requestId`.
      parameters:
        - $ref: '#/components/parameters/org'
        - $ref: '#/components/parameters/contractVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperationAuthorityRequest'
      responses:
        '201':
          description: Authority minted, shown once.
          headers:
            Garam-Contract-Version:
              $ref: '#/components/headers/ContractVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationAuthority'
        '400':
          $ref: '#/components/responses/ContractError'
        '401':
          $ref: '#/components/responses/ContractError'
        '403':
          $ref: '#/components/responses/ContractError'
        '404':
          $ref: '#/components/responses/ContractError'
        '409':
          $ref: '#/components/responses/ContractError'
  /orgs/{org}/policies:
    post:
      operationId: createPolicy
      tags: [policy]
      summary: Create a policy in an organization. Requires the `admin` role.
      description: >-
        Stores the document as the policy's first version. The policy
        is a draft until it is activated.
      parameters:
        - $ref: '#/components/parameters/org'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyCreate'
      responses:
        '201':
          description: Policy created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    get:
      operationId: listPolicies
      tags: [policy]
      summary: List an organization's policies. Requires the `admin` role.
      parameters:
        - $ref: '#/components/parameters/org'
      responses:
        '200':
          description: The organization's policies, in ascending GRN order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Policy'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /orgs/{org}/policies/{policy}/versions:
    get:
      operationId: listPolicyVersions
      tags: [policy]
      summary: List a policy's versions. Requires the `admin` role.
      parameters:
        - $ref: '#/components/parameters/org'
        - $ref: '#/components/parameters/policy'
      responses:
        '200':
          description: The policy's versions, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PolicyVersion'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    post:
      operationId: addPolicyVersion
      tags: [policy]
      summary: Append a version to a policy. Requires the `admin` role.
      description: >-
        Versions are append-only. Appending leaves the policy's default
        version where it is, so the policy keeps evaluating that version
        until `rollbackPolicy` makes another stored version, the
        appended one included, the default.
      parameters:
        - $ref: '#/components/parameters/org'
        - $ref: '#/components/parameters/policy'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyVersionCreate'
      responses:
        '201':
          description: Version appended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyVersion'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /orgs/{org}/policies/{policy}/activate:
    post:
      operationId: activatePolicy
      tags: [policy]
      summary: Activate a policy. Requires the `admin` role.
      description: >-
        An active policy contributes its default version to checks.
        Activation changes the policy's status and leaves its default
        version where it is.
      parameters:
        - $ref: '#/components/parameters/org'
        - $ref: '#/components/parameters/policy'
      responses:
        '200':
          description: The activated policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /orgs/{org}/policies/{policy}/archive:
    post:
      operationId: archivePolicy
      tags: [policy]
      summary: Archive a policy. Requires the `admin` role.
      description: >-
        The policy and its versions are retained; it stops contributing
        statements to checks.
      parameters:
        - $ref: '#/components/parameters/org'
        - $ref: '#/components/parameters/policy'
      responses:
        '200':
          description: The archived policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /orgs/{org}/policies/{policy}/rollback:
    post:
      operationId: rollbackPolicy
      tags: [policy]
      summary: Point a policy at a stored version. Requires the `admin` role.
      description: >-
        Makes any stored version of the policy its default, whether it
        is older or newer than the current default; an appended version
        becomes the default this way. The policy's status and versions
        are unchanged: an active policy evaluates the new default from
        then on, and a draft or archived one evaluates nothing until it
        is activated.
      parameters:
        - $ref: '#/components/parameters/org'
        - $ref: '#/components/parameters/policy'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyRollback'
      responses:
        '200':
          description: The policy at its new default version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /orgs/{org}/policies/{policy}/attachments:
    get:
      operationId: listPolicyAttachments
      tags: [policy]
      summary: List a policy's attachments. Requires the `admin` role.
      parameters:
        - $ref: '#/components/parameters/org'
        - $ref: '#/components/parameters/policy'
      responses:
        '200':
          description: The attachments, in ascending subject GRN order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PolicyAttachment'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    post:
      operationId: attachPolicy
      tags: [policy]
      summary: Attach a policy to a subject. Requires the `admin` role.
      description: >-
        The policy then applies to that user or group instead of to the
        whole organization. A policy with no attachment applies
        organization-wide.
      parameters:
        - $ref: '#/components/parameters/org'
        - $ref: '#/components/parameters/policy'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyAttachmentCreate'
      responses:
        '201':
          description: Policy attached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyAttachment'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /orgs/{org}/policies/{policy}/attachments/{subject}:
    delete:
      operationId: detachPolicy
      tags: [policy]
      summary: Detach a policy from a subject. Requires the `admin` role.
      description: >-
        Detaching an active policy's last attachment is refused with
        409, because a policy left with none would apply org-wide.
        Archive the policy, or attach another subject first.
      parameters:
        - $ref: '#/components/parameters/org'
        - $ref: '#/components/parameters/policy'
        - $ref: '#/components/parameters/subject'
      responses:
        '204':
          description: Policy detached.
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /orgs/{org}/consents:
    get:
      operationId: listOrgConsents
      tags: [org]
      summary: List the org's cross-organization consents. Requires the `admin` role.
      description: >-
        Every relation the organization is a side of, standing or
        waiting on one half (ADR-0035). A message crosses between the
        two organizations only while both halves stand.
      parameters:
        - $ref: '#/components/parameters/org'
      responses:
        '200':
          description: The org's consent relations.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrgConsent'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /orgs/{org}/consents/{other}:
    put:
      operationId: grantOrgConsent
      tags: [org]
      summary: Grant the org's half of a cross-organization consent. Requires the `admin` role.
      description: >-
        Stands this organization's half of the pair (ADR-0035). The
        relation stands — and messages may cross in either direction —
        once the other organization has granted its own half. Granting
        a half that already stands only re-stamps it.
      parameters:
        - $ref: '#/components/parameters/org'
        - $ref: '#/components/parameters/other'
      responses:
        '200':
          description: The relation as it now stands.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgConsent'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    delete:
      operationId: withdrawOrgConsent
      tags: [org]
      summary: Withdraw the org's half of a cross-organization consent. Requires the `admin` role.
      description: >-
        Clears this organization's own half (ADR-0035). The relation
        falls at once — a message that no longer has both halves is
        refused back to its sender — and the other organization's half
        keeps standing for a later re-grant to join. Withdrawing a half
        already down changes nothing.
      parameters:
        - $ref: '#/components/parameters/org'
        - $ref: '#/components/parameters/other'
      responses:
        '204':
          description: Consent withdrawn.
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /orgs/{org}/invitations:
    post:
      operationId: createInvitation
      tags: [org]
      summary: Create an invitation. Requires the `admin` role.
      description: >-
        Returns an invitation token. A signed-in user who presents the
        token to `/invitations/{token}/accept` joins the org with the
        role chosen here.
      parameters:
        - $ref: '#/components/parameters/org'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationCreate'
      responses:
        '201':
          description: Invitation created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /invitations/{token}:
    get:
      operationId: getInvitation
      tags: [org]
      summary: Read what an invitation would admit its holder to.
      description: >-
        Answers the organization an invitation names, the role it
        grants and whether it can still be used, so a page can say what
        accepting would do before anyone accepts. It needs no session:
        possession of the token is the whole claim (ADR-0006), and the
        answer carries nothing accepting it would not reveal — no
        inviter, no member of the organization. An unknown token is
        answered as any other not-found.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The invitation's organization, role and state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPreview'
        '404':
          $ref: '#/components/responses/Error'
  /invitations/{token}/accept:
    post:
      operationId: acceptInvitation
      tags: [org]
      summary: Accept an invitation.
      description: >-
        The signed-in user joins the invitation's org with the
        invitation's role. Expired or already-accepted tokens are
        rejected.
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The resulting membership.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
components:
  parameters:
    contractVersion:
      name: Garam-Contract-Version
      in: header
      required: true
      description: Must be `operation-authority.v1` (ADR-0079); any other value is refused with 400 naming it.
      x-go-name: ContractVersion
      schema:
        type: string
    provider:
      name: provider
      in: path
      required: true
      description: Authentication provider name (`google`).
      schema:
        type: string
    org:
      name: org
      in: path
      required: true
      description: Organization identifier (the last GRN segment).
      schema:
        type: string
    other:
      name: other
      in: path
      required: true
      description: The other organization of a consent pair (the last GRN segment).
      x-go-name: OtherSlug
      schema:
        type: string
    group:
      name: group
      in: path
      required: true
      description: Group identifier (the last GRN segment).
      x-go-name: GroupSlug
      schema:
        type: string
    project:
      name: project
      in: path
      required: true
      description: Project identifier (the last GRN segment).
      x-go-name: ProjectSlug
      schema:
        type: string
    member:
      name: member
      in: path
      required: true
      description: Member GRN of a user or agent.
      x-go-name: MemberGrn
      schema:
        type: string
    policy:
      name: policy
      in: path
      required: true
      description: Policy identifier (the last GRN segment).
      x-go-name: PolicySlug
      schema:
        type: string
    agent:
      name: agent
      in: path
      required: true
      description: Agent identifier (the last GRN segment).
      x-go-name: AgentSlug
      schema:
        type: string
    template:
      name: template
      in: path
      required: true
      description: Agent template identifier (the last GRN segment).
      x-go-name: TemplateSlug
      schema:
        type: string
    kid:
      name: kid
      in: path
      required: true
      description: A key's fingerprint, its base64url SHA-256 RFC 7638 thumbprint.
      x-go-name: KeyID
      schema:
        type: string
    operator:
      name: operator
      in: path
      required: true
      description: Operator identifier (the last GRN segment).
      x-go-name: OperatorSlug
      schema:
        type: string
    subject:
      name: subject
      in: path
      required: true
      description: Subject GRN a policy is attached to.
      x-go-name: SubjectGrn
      schema:
        type: string
    permissionAction:
      name: action
      in: query
      required: true
      description: The action asked about.
      schema:
        type: string
        example: policy:update
    permissionResourceType:
      name: resourceType
      in: query
      description: >-
        The kind of resource asked about. Without it and
        `resourceId`, the organization itself.
      schema:
        $ref: '#/components/schemas/PermissionResourceType'
    permissionResourceId:
      name: resourceId
      in: query
      description: >-
        The last segment of the resource's identifier, given with
        `resourceType`.
      schema:
        type: string
    limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
      description: Maximum entries to return; 0 means no limit.
    offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
  schemas:
    User:
      type: object
      required: [grn, nickname]
      properties:
        grn:
          type: string
          example: grn:garam:default:user:117421510527410544321
        nickname:
          type: string
    PasswordLogin:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: alice
        password:
          type: string
          format: password
          description: >-
            Sent on this request only. It is never returned by any
            endpoint, never logged, and never placed in an error
            message (ADR-0041).
    PasswordRegistration:
      type: object
      required: [invitationToken, username, password]
      properties:
        invitationToken:
          type: string
          description: >-
            The invitation being accepted. It names the organization and
            the role the new account joins with.
        username:
          type: string
          description: >-
            Lowercase letters, digits and `-`. It becomes the account's
            GRN identifier under the reserved `local-` prefix, which no
            provider subject may claim, so a local account and a
            provider account can never resolve to one user row
            (ADR-0041).
          example: alice
        password:
          type: string
          format: password
          description: >-
            At least 15 characters, at most 128 bytes. Handled as the
            login password is: never returned, logged, or echoed.
    Organization:
      type: object
      required: [grn, name, createdAt]
      properties:
        grn:
          type: string
          example: grn:garam:default:org:acme
        name:
          type: string
        createdAt:
          type: string
          format: date-time
    OrganizationCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
    OrganizationPatch:
      type: object
      properties:
        name:
          type: string
          minLength: 1
    Group:
      type: object
      required: [grn, name, orgGrn, roles]
      properties:
        grn:
          type: string
          example: grn:acme:default:group:eng
        name:
          type: string
        orgGrn:
          type: string
        roles:
          $ref: '#/components/schemas/ScopedRoles'
    GroupCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        roles:
          $ref: '#/components/schemas/ScopedRoles'
    GroupPatch:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        roles:
          $ref: '#/components/schemas/ScopedRoles'
    Project:
      type: object
      required: [grn, name, orgGrn, roles]
      properties:
        grn:
          type: string
          example: grn:acme:default:project:frontend
        name:
          type: string
        orgGrn:
          type: string
        roles:
          $ref: '#/components/schemas/ScopedRoles'
    ProjectCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        roles:
          $ref: '#/components/schemas/ScopedRoles'
    ProjectPatch:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        roles:
          $ref: '#/components/schemas/ScopedRoles'
    MemberRef:
      type: object
      required: [memberGrn]
      description: A group or project member, addressed by GRN.
      properties:
        memberGrn:
          type: string
          example: grn:acme:default:user:alice
    Role:
      type: string
      enum: [owner, admin, member]
    ScopedRoles:
      type: array
      description: >-
        Roles a group or project grants its own members, scoped to that
        group or project alone. Omitting the field on a patch leaves the
        roles unchanged; an empty array clears them.
      items:
        $ref: '#/components/schemas/Role'
    Member:
      type: object
      required: [userGrn, role, since]
      properties:
        userGrn:
          type: string
        nickname:
          type: string
          description: >-
            Display name from the member's user row. Omitted when that
            row is gone, which the client renders as it chooses; the
            GRN is never a substitute.
        role:
          $ref: '#/components/schemas/Role'
        since:
          type: string
          format: date-time
    OrgDeletionPreview:
      type: object
      description: >-
        What deleting one organization would destroy, read from the
        server rather than assembled from what a caller happens to
        hold. A count taken from a list the caller already has is wrong
        exactly when that list is filtered or stale, which is when the
        answer matters most.
      required: [certificateAuthority, counts]
      properties:
        certificateAuthority:
          type: boolean
          description: >-
            The organization holds a certificate authority, which the
            deletion destroys and nothing restores. It is its own field
            and not an entry in `counts` because it is the only thing
            here that cannot be created again: the private key is
            stored sealed under a key-encryption key and goes with the
            row, `internal/ca` has no import, restore or recreate
            route, and every certificate the authority signed stops
            verifying permanently (ADR-0014, ADR-0016). False where the
            organization has needed no certificate yet, because the
            authority is created on the first one it needs.
        counts:
          $ref: '#/components/schemas/OrgDeletionCounts'
    PermissionCheckRequest:
      type: object
      required: [checks]
      properties:
        checks:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/PermissionCheck'
    PermissionCheck:
      type: object
      required: [action]
      properties:
        action:
          type: string
          example: operator:register
        resource:
          $ref: '#/components/schemas/PermissionResource'
    PermissionResource:
      type: object
      description: >-
        A resource of the organization, named by its kind and the last
        segment of its identifier, as the paths under `/orgs/{org}`
        name it.
      required: [type, id]
      properties:
        type:
          $ref: '#/components/schemas/PermissionResourceType'
        id:
          type: string
          example: eng
    PermissionResourceType:
      type: string
      enum: [group, project, agent, agent-template, policy]
    PermissionCheckAnswer:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/PermissionCheckResult'
    PermissionCheckResult:
      type: object
      required: [action, decision]
      properties:
        action:
          type: string
        resource:
          $ref: '#/components/schemas/PermissionResource'
        decision:
          $ref: '#/components/schemas/PermissionDecision'
    PermissionDecision:
      type: string
      description: >-
        `allow` and `deny` are what enforcement would decide now.
        `unknown` is an action this operation cannot decide: a minted
        action whose caller check allows, leaving the delegation grant
        this operation does not read to decide, or an action whose
        enforcement this operation does not ask at all. Render the
        control and let the operation answer.
      enum: [allow, deny, unknown]
      x-enum-varnames: [DecisionAllow, DecisionDeny, DecisionUnknown]
    PermissionExplanation:
      type: object
      required: [action, decision, basis, statements]
      properties:
        action:
          type: string
        resource:
          $ref: '#/components/schemas/PermissionResource'
        decision:
          $ref: '#/components/schemas/PermissionDecision'
        basis:
          $ref: '#/components/schemas/PermissionBasis'
        statements:
          type: array
          description: >-
            The statements that decided, where `basis` is `statements`;
            empty otherwise, and where nothing allows the action.
          items:
            $ref: '#/components/schemas/ExplainedStatement'
    PermissionBasis:
      type: string
      description: >-
        `statements` is a decision the policy engine reached, explained
        by `statements`. `operation` is an action the operation decides
        past the engine's `Check`, explained no further than the
        decision. `undefined-action` is a name garam does not define.
      enum: [statements, operation, undefined-action]
      x-enum-varnames: [BasisStatements, BasisOperation, BasisUndefinedAction]
    ExplainedStatement:
      type: object
      description: >-
        One statement that decided and the path through which it
        reaches the caller. `source` says which fields are present:
        `roles` for the four role sources, `group` for `group-role`,
        `project` for `project-role`, and `sid`, `policy` and
        `attachment` for `policy` — with `group` where `attachment` is
        `group`. `unreadable-policy` carries `effect` alone.
      required: [effect, source]
      properties:
        effect:
          type: string
          enum: [Allow, Deny]
          x-enum-varnames: [StatementEffectAllow, StatementEffectDeny]
        source:
          type: string
          enum: [org-role, direct-role, group-role, project-role, policy, unreadable-policy]
          x-enum-varnames: [SourceOrgRole, SourceDirectRole, SourceGroupRole, SourceProjectRole, SourcePolicy, SourceUnreadablePolicy]
        sid:
          type: string
        roles:
          type: array
          items:
            type: string
        group:
          type: string
          description: The group's slug.
        project:
          type: string
          description: The project's slug.
        policy:
          type: string
          description: The policy's identifier, as `getPolicy` addresses it.
        attachment:
          type: string
          description: >-
            How the policy reaches the caller: it applies to the whole
            `organization`, is attached to the `caller`, or is attached
            to the `group` named beside it.
          enum: [organization, caller, group]
          x-enum-varnames: [AttachmentOrganization, AttachmentCaller, AttachmentGroup]
    PermissionHolders:
      type: object
      required: [holders]
      properties:
        holders:
          type: array
          items:
            $ref: '#/components/schemas/PermissionHolder'
        nextOffset:
          type: integer
          description: The offset of the next page; absent on the last.
    PermissionHolder:
      type: object
      required: [type, grn]
      properties:
        type:
          type: string
          enum: [user, agent]
          x-enum-varnames: [HolderUser, HolderAgent]
        grn:
          type: string
        nickname:
          type: string
          description: A user's nickname, where its row could be read.
    OrgDeletionCounts:
      type: object
      description: >-
        How many of each kind the deletion removes. Every one of these
        can be created again; what cannot is on `OrgDeletionPreview`
        itself.


        A zero means the organization holds none of that kind. It never
        means the caller may not see them: no count here is filtered by
        what the caller could list, because the deletion is not
        filtered either — the cascade takes every row whatever the
        caller may read. A count narrowed to what one caller can see
        would under-report what the deletion destroys, which is the
        failure this operation exists to prevent. The one permission is
        on the operation itself.
      required:
        - groups
        - projects
        - members
        - invitations
        - policies
        - agents
        - agentDefinitions
        - agentTemplates
        - operators
        - consents
      properties:
        groups:
          type: integer
          minimum: 0
          description: Groups, each taking its membership rows with it.
        projects:
          type: integer
          minimum: 0
          description: Projects, each taking its membership rows with it.
        members:
          type: integer
          minimum: 0
          description: >-
            Memberships of this organization. The user accounts
            themselves are not owned by the organization and stay.
        invitations:
          type: integer
          minimum: 0
          description: >-
            Invitations issued for this organization, accepted and
            pending alike. A pending one stops admitting anybody.
        policies:
          type: integer
          minimum: 0
          description: >-
            Policies, each taking its versions and its attachments with
            it (ADR-0008).
        agents:
          type: integer
          minimum: 0
          description: Agents, each taking its operator assignment with it.
        agentDefinitions:
          type: integer
          minimum: 0
          description: >-
            Agent definitions, which are records of what the
            organization said an agent should be (ADR-0026).
        agentTemplates:
          type: integer
          minimum: 0
          description: >-
            Agent templates (ADR-0075). No agent references one, so the
            count says nothing about the agents defined from them.
        operators:
          type: integer
          minimum: 0
          description: >-
            Registered operators, each taking its unspent enrollment
            tokens with it (ADR-0064). A certificate an operator
            already holds is not counted and outlives the record
            (ADR-0045).
        consents:
          type: integer
          minimum: 0
          description: >-
            Cross-organization consent relations this organization is a
            side of (ADR-0035). Each is a pair, so deleting this
            organization removes it for the other organization too,
            which loses the relation without acting.
    OrgConsent:
      type: object
      description: >-
        One organization's view of a cross-organization consent
        relation (ADR-0035), from the side the path names: `orgGrn` is
        the other organization, and each half says whether that side's
        grant stands. `stands` is both halves at once — the only state
        under which a message crosses.
      required: [orgGrn, grantedHere, grantedThere, stands]
      properties:
        orgGrn:
          type: string
          example: grn:root:default:org:globex
        grantedHere:
          type: boolean
          description: The path organization's half stands.
        grantedThere:
          type: boolean
          description: The other organization's half stands.
        stands:
          type: boolean
          description: Both halves stand, so messages may cross.
    InvitationCreate:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [admin, member]
          description: Owners are not transferable by invitation.
        expiresInHours:
          type: integer
          minimum: 1
          maximum: 720
          description: >-
            Token lifetime in hours. The server applies 168 (seven
            days) when the field is omitted.
    Invitation:
      type: object
      required: [token, orgGrn, role, expiresAt]
      properties:
        token:
          type: string
          description: Bearer token; presented to the accept endpoint.
        orgGrn:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        expiresAt:
          type: string
          format: date-time
    LoginReturnPath:
      type: object
      properties:
        next:
          type: string
          description: The console path to land on once signed in.
    InvitationPreview:
      type: object
      required: [org, orgName, role, state, expiresAt]
      properties:
        org:
          type: string
          description: >-
            Organization identifier (the last GRN segment), the one the
            API's own paths take.
        orgName:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        state:
          type: string
          enum: [pending, accepted, expired]
          description: >-
            `pending` can still be accepted. `accepted` was used once
            and never admits again. `expired` passed `expiresAt` unused.
        expiresAt:
          type: string
          format: date-time
    PolicyDocument:
      type: object
      description: >-
        An IAM-style policy document: a `Version` string and a
        `Statement` list of `Sid` / `Effect` / `Action` / `Resource` /
        `Condition` entries. The authz engine owns the model and
        validates the document on write, so it travels this API
        opaquely; it refuses a key the model does not name rather than
        storing the document without it.
      x-go-type: json.RawMessage
      example:
        Version: '2026-07-25'
        Statement:
          - Sid: AllowOrgRead
            Effect: Allow
            Action: [org:read]
            Resource: ['grn:acme:*']
    PolicyStatus:
      type: string
      description: >-
        A policy's lifecycle state. Only an `active` policy contributes
        statements to a check.
      enum: [draft, active, archived]
    Policy:
      type: object
      required: [grn, orgGrn, name, status, defaultVersion, createdAt, updatedAt]
      properties:
        grn:
          type: string
          example: grn:acme:default:policy:9f2ac1b40d8e7a35
        orgGrn:
          type: string
        name:
          type: string
        status:
          $ref: '#/components/schemas/PolicyStatus'
        defaultVersion:
          type: integer
          minimum: 1
          description: The version evaluated while the policy is active.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PolicyCreate:
      type: object
      required: [name, document]
      properties:
        name:
          type: string
          minLength: 1
        document:
          $ref: '#/components/schemas/PolicyDocument'
    PolicyVersion:
      type: object
      required: [policyGrn, version, document, createdBy, createdAt]
      properties:
        policyGrn:
          type: string
        version:
          type: integer
          minimum: 1
        document:
          $ref: '#/components/schemas/PolicyDocument'
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
    PolicyVersionCreate:
      type: object
      required: [document]
      properties:
        document:
          $ref: '#/components/schemas/PolicyDocument'
    PolicyRollback:
      type: object
      required: [version]
      properties:
        version:
          type: integer
          format: int32
          minimum: 1
          description: >-
            A stored version of the policy, older or newer than its
            current default.
    PolicyAttachment:
      type: object
      required: [policyGrn, subjectGrn, createdAt]
      properties:
        policyGrn:
          type: string
        subjectGrn:
          type: string
          example: grn:acme:default:group:eng
        createdAt:
          type: string
          format: date-time
    PolicyAttachmentCreate:
      type: object
      required: [subjectGrn]
      description: The user or group the policy applies to.
      properties:
        subjectGrn:
          type: string
          example: grn:acme:default:group:eng
    AgentProvisioningState:
      type: string
      description: >-
        What the operator reports about the agent's pod. `pending` is an
        agent no operator has reported on yet. `provisioned` is an agent
        whose workload an operator built and which reports no ready
        replica: it says the pod was built and nothing about its health.
        `ready` is an agent whose workload reports a ready replica, so
        its containers are running; it says nothing about whether the
        agent inside them works. `failed` is an agent an operator
        observed cannot start, which is a stricter observation than an
        absent ready replica: an operator with only a replica count
        reports `provisioned`, so a state other than `failed` is not
        evidence the pod can start. What an operator may report, and
        when, is `api/machine.yaml`'s — the specification the reporting
        party holds, not this one.
      enum: [pending, provisioned, ready, failed]
    AgentRuntimeState:
      type: string
      description: >-
        What the agent reports about itself. `unknown` is an agent that
        has not reported since it was created. `connected` and
        `disconnected` are what the agent last reported about whether it
        is running: garam records the report and checks nothing behind
        it, so each names what the agent last said rather than what is
        true now.
      enum: [unknown, connected, disconnected]
    AgentEnrollmentApproval:
      type: object
      description: >-
        An approval binds the host's two key fingerprints, or neither.
        With both, the host enrolls under `standalone-enrollment.v1` and
        is signed a certificate over each key; with neither, it enrolls
        under `standalone-enrollment.v2` and is answered a supervisor
        credential. Each contract refuses the other's approval
        (ADR-0100). One fingerprint without the other is 400.
      required: [requestId, hostName, expiresAt, secretSha256]
      properties:
        placement:
          type: string
          enum: [standalone, direct]
          default: standalone
          description: >-
            Where the host runs its agent's runtime. `standalone` is three
            containers the host's supervisor starts (ADR-0085). `direct`
            is a runtime already running on the host, which the
            supervisor attaches to and starts nothing of (ADR-0111). A
            direct approval binds no key fingerprint and is spent under
            `standalone-enrollment.v2` alone; one binding both is 400.
            This approval is the only way garam admits a direct agent:
            `agent-enrollment.v1` refuses direct placement to an
            operator.
        requestId:
          type: string
          pattern: '^[A-Za-z0-9._~-]{1,128}$'
          description: The host's own identifier for this request.
        hostName:
          type: string
          description: What the organization calls the host; trimmed, 1 to 100 characters.
        expiresAt:
          type: string
          format: date-time
          description: When the approval stops being spendable; within the next 24 hours.
        secretSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: SHA-256 of the bootstrap secret the host keeps.
        supervisorKeySha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: >-
            SHA-256 of the supervisor key's SubjectPublicKeyInfo DER, for
            a host enrolling under `standalone-enrollment.v1`.
        agentKeySha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: >-
            SHA-256 of the agent key's SubjectPublicKeyInfo DER, for a host
            enrolling under `standalone-enrollment.v1`.
        replaces:
          $ref: '#/components/schemas/AgentEnrollmentReplacement'
    AgentEnrollmentReplacement:
      type: object
      description: The assignment a replacement replaces, exactly as it stands when approved.
      required: [agentGrn, assigneeGrn, epoch]
      properties:
        agentGrn:
          type: string
        assigneeGrn:
          type: string
          description: The supervisor holding the agent now.
        epoch:
          type: integer
          minimum: 1
    AgentEnrollment:
      type: object
      required: [id, agentGrn, supervisorGrn, hostName, expiresAt, spent, placement]
      properties:
        id:
          type: string
          format: uuid
        placement:
          type: string
          enum: [standalone, direct]
        agentGrn:
          type: string
        supervisorGrn:
          type: string
        hostName:
          type: string
        expiresAt:
          type: string
          format: date-time
        spent:
          type: boolean
          description: Whether the host has enrolled with it.
    AgentAssignment:
      type: object
      description: >-
        What holds an agent, at the epoch that binding is on: an
        operator, or the supervisor of a standalone host (ADR-0082).
        Every assignment raises the epoch and fences the assignee it
        replaced.
      required: [assigneeGrn, epoch, since]
      properties:
        assigneeGrn:
          type: string
          example: grn:acme:default:operator:field-one
        operatorGrn:
          type: string
          description: >-
            The assignee when it is an operator, and absent when it is
            a supervisor; it never names a supervisor.
          example: grn:acme:default:operator:field-one
        epoch:
          type: integer
          minimum: 1
        since:
          type: string
          format: date-time
          description: When the current binding was written.
    Agent:
      type: object
      description: >-
        An agent an operator provisioned outside garam. Provisioning
        state and runtime state are separate facts reported by different
        parties, and neither substitutes for the other. `assignment` is
        absent while no operator holds the agent, and `updatedAt` is
        when a state report last landed — either party's report moves it.
      required: [grn, orgGrn, provisioningState, runtimeState, createdAt, updatedAt]
      properties:
        grn:
          type: string
          example: grn:acme:default:agent:9f2ac1b40d8e7a35
        orgGrn:
          type: string
        provisioningState:
          $ref: '#/components/schemas/AgentProvisioningState'
        runtimeState:
          $ref: '#/components/schemas/AgentRuntimeState'
        assignment:
          $ref: '#/components/schemas/AgentAssignment'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    OperatorEnrollmentState:
      type: string
      description: >-
        Where an operator stands in obtaining a certificate from garam.
        It is derived from what garam already holds and reported by
        nobody, so no member says whether the operator is running.
        `enrolled` is an operator garam has issued a certificate for: it
        says one was obtained, not that it is still valid — garam
        records no expiry beside the record and asks the operator
        nothing. `pending` is an operator with no certificate whose
        enrollment token is still spendable, which lasts at most the ten
        minutes the token does. `expired` is an operator with no
        certificate and no spendable token: the token was lost or ran
        out, and `mintOperatorEnrollment` answers such an operator a
        fresh one (ADR-0067), which is the state that operation exists
        for. An operator that holds a
        certificate reads `enrolled` however much of its token is left,
        because the certificate is the outcome the token exists to
        produce.
      enum: [enrolled, pending, expired]
    Operator:
      type: object
      description: >-
        An operator this organization has registered, and where that
        operator stands in obtaining a certificate. The record grants
        nothing and admits nothing (ADR-0045); the enrollment state is
        what garam knows from its own tables and never a report from
        the operator.
      required: [grn, name, description, orgGrn, registeredBy, createdAt, enrollmentState]
      properties:
        grn:
          type: string
          example: grn:acme:default:operator:field-one
        name:
          type: string
          description: >-
            What the organization calls the operator. It is not unique
            and not an identity: two operators may share one, and the
            GRN is what tells them apart. A registration that named
            none, including every one made before names existed, is
            called by its identifier.
          example: Field cluster one
        description:
          type: string
          description: What the organization says the operator is for, empty where it says nothing.
        orgGrn:
          type: string
        registeredBy:
          type: string
          description: The member that registered the operator.
        createdAt:
          type: string
          format: date-time
        enrollmentState:
          $ref: '#/components/schemas/OperatorEnrollmentState'
        controlEndpoint:
          type: string
          description: >-
            Where this operator's control service answers the console,
            absent where none is registered. The console sends an
            operation authority to no other origin. It is written only
            by `setOperatorControlEndpoint` and
            `clearOperatorControlEndpoint`, never by `updateOperator`.
          example: https://control.example.com
        certificateIssuedAt:
          type: string
          format: date-time
          description: >-
            When garam last issued this operator a certificate, absent
            where it has issued none. It is the certificate the
            operator holds now and not the one it enrolled with — a
            renewal moves the record this is read from — so it answers
            when garam last signed for the operator rather than when
            the operator enrolled. Which certificate that is decides a
            renewal and is the machine listener's alone (ADR-0046); no
            part of it is answered here.
    RegisteredOperator:
      type: object
      description: >-
        The record the registration wrote, the enrollment token it
        minted and the credential it issued. garam holds the hash of
        each and no route reads one back (ADR-0064, ADR-0100), so this
        answer, `mintOperatorEnrollment`'s and
        `reissueOperatorCredential`'s are the only places either exists
        in a form anyone can present.
      required: [operator, enrollment, credential]
      properties:
        operator:
          $ref: '#/components/schemas/Operator'
        enrollment:
          $ref: '#/components/schemas/OperatorEnrollment'
        credential:
          $ref: '#/components/schemas/OperatorCredential'
    OperatorCredential:
      type: object
      description: >-
        The credential an operator exchanges for short-lived tokens on
        the machine listener (ADR-0100). It does not expire; a re-issue
        or deleting the operator is what ends it.
      required: [credential, issuedAt]
      properties:
        credential:
          type: string
          description: >-
            The credential itself, answered once. Show it once and say
            it cannot be shown again; garam cannot answer it a second
            time. It is placed in the operator's cluster as a file only
            the operator's process reads.
          example: garam_oc_8f14e45fceea167a5a36dedd4bea2543a1ba1ffc2fbd07a1c4ca4238a0b92382
        issuedAt:
          type: string
          format: date-time
    OperatorKeyIssuance:
      type: object
      description: How an issued key stands beside the keys the operator holds (ADR-0102).
      required: [rotation]
      properties:
        rotation:
          type: string
          enum: [planned, immediate]
          description: >-
            `planned` adds the key beside the one in use, which is
            withdrawn by itself 24 hours later; `immediate` withdraws
            every live key and its tokens first. For an operator holding
            no live key the two are the same.
    IssuedOperatorKey:
      type: object
      description: >-
        A key garam generated for an operator, answered once. Place
        `privateKeyPem` and `tokenUrl` in the operator's cluster for the
        identity `clientId` names; garam cannot answer the private key a
        second time.
      required: [key, privateKeyPem, clientId, tokenUrl]
      properties:
        key:
          $ref: '#/components/schemas/OperatorKey'
        privateKeyPem:
          type: string
          description: >-
            The private key, PKCS#8 `PRIVATE KEY` PEM, answered once.
            Show it once and say it cannot be shown again. It is placed
            in the operator's cluster as a file only the operator's
            process reads, and never in an environment variable, a
            command line, an image or source control.
        clientId:
          type: string
          description: The operator's canonical GRN, which its assertions name as `iss`, `sub` and `client_id`.
          example: grn:acme:default:operator:controller
        tokenUrl:
          type: string
          format: uri
          description: >-
            The token endpoint's absolute URL, which an assertion's
            `aud` equals byte for byte. It is garam's configured value
            and need not be the address the operator dials.
          example: https://machine.garam.example/oauth/token
    OperatorKeyList:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/OperatorKey'
    OperatorKey:
      type: object
      description: The public record of one key an operator was issued (ADR-0102). It carries no private material.
      required: [kid, algorithm, state, issuedAt]
      properties:
        kid:
          type: string
          description: >-
            The key's fingerprint: the base64url SHA-256 RFC 7638
            thumbprint of its public key, which an assertion's protected
            `kid` names. Confirm it against the installed key before
            withdrawing a predecessor.
        algorithm:
          type: string
          enum: [RS256]
        state:
          $ref: '#/components/schemas/OperatorKeyState'
        issuedAt:
          type: string
          format: date-time
        retiresAt:
          type: string
          format: date-time
          description: When a planned rotation withdraws the key, where one set it.
        revokedAt:
          type: string
          format: date-time
          description: When the key was withdrawn, where it was.
        lastExchangedAt:
          type: string
          format: date-time
          description: When an assertion the key signed last obtained a token, where one has.
    OperatorKeyState:
      type: string
      enum: [active, retiring, revoked]
      x-enum-varnames: [OperatorKeyActive, OperatorKeyRetiring, OperatorKeyRevoked]
      description: >-
        Where a key stands at garam's database time. `active` verifies
        assertions; `retiring` verifies them until `retiresAt`, which a
        planned successor set; `revoked` verifies nothing, because it
        was withdrawn or its `retiresAt` has passed, and the tokens
        exchanged under it authenticate nothing.
    OperatorEnrollment:
      type: object
      description: >-
        The one-time token the operator enrols with, and when it stops
        being spendable. It is permission to ask for one certificate,
        once, and it authenticates nothing else.
      required: [token, expiresAt]
      properties:
        token:
          type: string
          description: >-
            The token itself, answered once. Show it once and say it
            cannot be shown again; garam cannot answer it a second time.
          example: 8f14e45fceea167a5a36dedd4bea2543a1ba1ffc2fbd07a1
        expiresAt:
          type: string
          format: date-time
          description: >-
            When the token stops being spendable. A token nobody used by
            then is swept, and minting the operator another is what
            replaces it (ADR-0067).
    OperatorRegistration:
      type: object
      required: [identifier]
      properties:
        identifier:
          type: string
          description: >-
            Lowercase letters, digits and `-`, at most 64 characters. It
            becomes the identifier segment of the operator's GRN, which
            is what the enrollment token names and what the certificate
            signed for it holds in its SAN URI — so it is supplied
            rather than minted, and an operator already holding a
            certificate is registered under the GRN that certificate
            names.
          example: field-one
        name:
          $ref: '#/components/schemas/OperatorName'
        description:
          $ref: '#/components/schemas/OperatorDescription'
    OperatorPatch:
      type: object
      description: >-
        A change to what the organization says about an operator. A
        field left out keeps its value; the identifier is not a field.
      properties:
        name:
          $ref: '#/components/schemas/OperatorName'
        description:
          $ref: '#/components/schemas/OperatorDescription'
    OperatorName:
      type: string
      description: >-
        At most 100 characters once surrounding space is trimmed, and
        at least one. Left out of a registration, the name is the
        identifier.
      example: Field cluster one
    OperatorDescription:
      type: string
      description: >-
        At most 1000 characters once surrounding space is trimmed. Empty
        is no description, and on an update clears the one there was.
    AgentValues:
      type: object
      description: >-
        What an operator constructs the agent from. garam stores the
        keys and the strings and interprets neither: what the payload
        means belongs to the operator that reads it. garam accepts no
        new one (ADR-0090); what it answers was stored before then. A key is one to 64
        characters of lowercase letters, digits and `-`; a value is at
        most 4096 bytes; at most 32 entries.
      additionalProperties:
        type: string
      example:
        model: haiku
        workspace: grn-acme-default-project-frontend
    AgentName:
      type: string
      description: >-
        What the organization calls an agent or a template: at most 100
        characters once surrounding space is trimmed, and at least one.
        It identifies nothing — two may share one — so a consumer that
        must tell them apart reads the GRN beside it (ADR-0075).
      example: Research assistant
    AgentDefinitionPatch:
      type: object
      description: A change to what the organization calls a defined agent.
      required: [name]
      properties:
        name:
          $ref: '#/components/schemas/AgentName'
    AgentTemplate:
      type: object
      description: >-
        A starting point an organization kept for defining agents
        (ADR-0075), retired read-only (ADR-0088). It names no operator
        and no agent, and no definition records which template it
        copied. Agents are created from the Operator control service's
        templates; this is the record of what one said.
      required: [grn, orgGrn, name, description, values, createdBy, createdAt, updatedAt]
      properties:
        grn:
          type: string
          example: grn:acme:default:agent-template:7c1e2a9b3d4f5a60
        orgGrn:
          type: string
        name:
          $ref: '#/components/schemas/AgentName'
        description:
          type: string
        values:
          $ref: '#/components/schemas/AgentValues'
        createdBy:
          type: string
          description: The member that created the template.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AgentDefinition:
      type: object
      description: >-
        What an organization said an agent should be (ADR-0026),
        written before garam stopped accepting definitions (ADR-0090).
        It is a record and not an agent: no state is reported on it, and it
        carries none of the fields an `Agent` carries. `agentGrn` is
        the identity garam minted for the agent this definition
        describes, and no agent answers under it until the claim.
      required: [agentGrn, orgGrn, name, operatorGrn, values, definedBy, createdAt, cutover]
      properties:
        agentGrn:
          type: string
          example: grn:acme:default:agent:9f2ac1b40d8e7a35
        name:
          $ref: '#/components/schemas/AgentName'
        orgGrn:
          type: string
        operatorGrn:
          type: string
          example: grn:acme:default:operator:field-one
        values:
          $ref: '#/components/schemas/AgentValues'
        definedBy:
          type: string
          description: The member that defined the agent.
          example: grn:root:default:user:117421510527410544321
        createdAt:
          type: string
          format: date-time
        cutover:
          description: >-
            The agent's open cutover attempt (ADR-0086), null where none
            is open. A `frozen` or `switched` definition is archival: its
            values stay preserved here and are no longer what its
            operator reads, and only its name still changes.
          oneOf:
            - $ref: '#/components/schemas/AgentDefinitionCutover'
            - type: 'null'
    AgentDefinitionCutover:
      type: object
      required: [stage]
      properties:
        stage:
          type: string
          enum: [frozen, switched]
    DelegationWrite:
      type: object
      required: [requestId, controllers, operations, expiresAt]
      properties:
        requestId:
          $ref: '#/components/schemas/RequestId'
        expectedGrantId:
          type: string
          description: The grant the caller read as current. Absent where it read none.
        controllers:
          type: array
          minItems: 1
          maxItems: 32
          uniqueItems: true
          description: Operator GRNs of this organization the grant may act on. The hosted operator is not one.
          items:
            type: string
        operations:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          items:
            $ref: '#/components/schemas/DelegatedOperation'
        expiresAt:
          type: string
          format: date-time
          description: >-
            Within the next 30 days. Kept to the microsecond: finer digits
            are dropped, and the grant answers and replays the value kept.
    ControlEndpointWrite:
      type: object
      required: [url]
      properties:
        url:
          type: string
          maxLength: 2048
          example: https://control.example.com/garam
    DelegationEnd:
      type: object
      required: [grantId]
      properties:
        grantId:
          type: string
          description: The grant to end, as the caller read it.
    Delegation:
      type: object
      required: [grantId, operatorGrn, controllers, operations, expiresAt, grantedBy, grantedAt]
      properties:
        grantId:
          type: string
        operatorGrn:
          type: string
        controllers:
          type: array
          items:
            type: string
        operations:
          type: array
          items:
            $ref: '#/components/schemas/DelegatedOperation'
        expiresAt:
          type: string
          format: date-time
        grantedBy:
          type: string
        grantedAt:
          type: string
          format: date-time
    DelegatedOperation:
      type: string
      enum: [agent:create, agent:configure, agent:activate, agent:recover, agent-template:read, agent-template:publish, execution-profile:read, agent:execution-read, agent:cutover, operator:read, agent:replace]
      description: >-
        `agent:activate` bounds the hosted operator's own lifecycle
        authority; no user mints it. `agent-template:read`,
        `agent-template:publish`, `execution-profile:read` and
        `operator:read` act on what the Operator holds for the
        organization and name no controller, so a grant covers them
        whatever controllers it lists.
    RequestId:
      type: string
      pattern: '^[A-Za-z0-9._~-]{1,128}$'
    OperationAuthorityRequest:
      type: object
      required: [audience, operation, target, requestId, bodySha256]
      properties:
        audience:
          type: string
          description: GRN of the hosted operator that will act.
        operation:
          type: string
          enum: [agent:create, agent:configure, agent:recover, agent-template:read, agent-template:publish, execution-profile:read, agent:execution-read, agent:cutover, operator:read, agent:replace]
        target:
          type: string
          description: >-
            Controller GRN for `agent:create`; agent GRN for
            `agent:configure`, `agent:recover`, `agent:execution-read`,
            `agent:cutover` and `agent:replace`; this organization's GRN for
            `agent-template:read`, `agent-template:publish`,
            `execution-profile:read` and `operator:read`.
        requestId:
          $ref: '#/components/schemas/RequestId'
        bodySha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: >-
            Lowercase hexadecimal SHA-256 of the exact request body the
            Operator receives; for a GET, that of the empty body.
        requestTarget:
          type: string
          minLength: 1
          maxLength: 2048
          description: >-
            Required for `agent-template:read`, `agent-template:publish`,
            `execution-profile:read`, `agent:execution-read`,
            `agent:cutover` and `operator:read`, and refused with 400 for every other
            operation. The exact origin-form request target the route
            will receive: the escaped path and raw query, with no scheme
            or authority and no empty, `.` or `..` path segment, taken
            from the same URL the request is sent to. For `agent:cutover`
            it is the machine listener's cutover route of the agent, such
            as `/agents/{agent}/cutover/switch`, and garam compares it
            with the target that route receives. garam binds it as given
            and decodes nothing.
        destination:
          type: string
          description: >-
            Required for `agent:replace` and refused with 400 for every
            other operation: the GRN of the controller of this
            organization the replacement moves the agent to (ADR-0107).
    OperationAuthority:
      type: object
      required: [authority, expiresAt, operationRef, grantId]
      properties:
        authority:
          type: string
          description: Opaque. garam stores only its hash and cannot answer it again.
        expiresAt:
          type: string
          format: date-time
        operationRef:
          type: string
          description: The durable reference of the logical operation.
        grantId:
          type: string
    Error:
      type: object
      required: [kind, message]
      properties:
        kind:
          type: string
          description: errorx kind, e.g. `not_found`, `permission_denied`.
        message:
          type: string
        reason:
          type: string
          description: >-
            A stable code naming the rule that refused, present only
            where the kind alone does not say which refusal it was. A
            client branches on this rather than on `message`, which may
            be reworded at any release; a client that does not know a
            code reads the kind as before, and new codes may be added.
            Invitations: `invitation_accepted`, `invitation_expired`.
            Operator keys: `key_issuance_unconfigured`, on the 409 that
            refuses issuing one where this garam has no token endpoint
            configured.
            Policy documents, each with `path`:
            `policy_document_malformed`, `policy_document_trailing_data`,
            `policy_document_wrong_type`, `policy_document_unknown_key`,
            `policy_document_version_missing`,
            `policy_document_statement_empty`,
            `policy_document_effect_invalid`,
            `policy_document_action_missing`,
            `policy_document_resource_missing`.
        path:
          type: string
          description: >-
            A JSON Pointer (RFC 6901) into the document the request sent,
            to the place `reason` is about, e.g. `/Statement/1/Effect`.
            A key the document's format names is spelled as the format
            spells it, whatever case the request used: a document
            accepts `statement` for `Statement`, and the pointer reads
            `/Statement`. A key the format does not name is spelled as
            it was sent. Absent where the reason is about the document
            as a whole or about no document.
  headers:
    ContractVersion:
      description: The contract version this answer follows, `operation-authority.v1`.
      schema:
        type: string
  responses:
    Error:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ContractError:
      description: Error response of a versioned contract route.
      headers:
        Garam-Contract-Version:
          $ref: '#/components/headers/ContractVersion'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: garam_session
security:
  - sessionCookie: []
