        no agent and names no operator. Authorized on
        `agent-template:create`.
      parameters:
        - $ref: '#/components/parameters/org'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentTemplateWrite'
      responses:
        '201':
