                $ref: '#/components/schemas/AgentTemplate'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    get:
      operationId: listAgentTemplates
      tags: [agent]
      summary: List an organization's agent templates. Requires the `member` role.
      description: >-
        The organization's templates, ordered by name. Authorized on
        `agent-template:read`.
      parameters:
        - $ref: '#/components/parameters/org'
      responses:
        '200':
