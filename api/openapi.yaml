        Changes what the organization calls the agent and nothing else
        (ADR-0075). The agent's GRN, its operator, its values, the
        assignment a claim wrote and every team membership or policy
        attachment naming the GRN stand as they were, and no operator
        is told: a name is not configuration.

        It is authorized on `agent:rename`, an action of its own,
        because it moves no value an operator reads.
      parameters:
        - $ref: '#/components/parameters/org'
        - $ref: '#/components/parameters/agent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentDefinitionPatch'
      responses:
