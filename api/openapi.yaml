          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Agent'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /orgs/{org}/agents/{agent}:
    get:
      operationId: getAgent
      tags: [agent]
      summary: Get an agent. Requires the `member` role.
      parameters:
        - $ref: '#/components/parameters/org'
        - $ref: '#/components/parameters/agent'
      responses:
