openapi: 3.1.0
info:
  title: garam API
  version: 0.1.0
  description: >-
    Authentication and organization permission APIs for garam.
    Authentication is cookie-based: the OAuth callback sets a
    `garam_session` cookie that all other endpoints require.

    This is what `garam serve api` serves, and a person's browser is
    what reaches it. `api/machine.yaml` describes a different listener,
    whose callers are the operators and agents that report the state
    this one reads back. Each file is written for its own caller, so a
    value both describe is described here for the caller that reads it
    and there for the one that writes it: neither file is a copy of the
    other, and neither is complete for the other's caller.

    An operation's `responses` list is what it answers when garam is
    working, and is not the complete set of statuses it can return. No
    operation declares a 5xx, because a 5xx belongs to the listener
    rather than to a route (ADR-0050): every operation can answer
    `500`, and one that reaches the policy engine, the database or a
    sign-in provider answers `503` when that dependency is unreachable.
    Both carry the `Error` schema with `message` set to `internal
    error` — a 5xx names no cause, and what a caller does next is on
    the status line. `501` and `504` are in garam's kind mapping and
    nothing produces them.

    `version` above is required by OpenAPI and promises nothing
    (ADR-0049). garam publishes no release of this contract and no
    compatibility window, and the number does not move when this
    surface changes: do not read stability, a deprecation notice or a
    breaking change out of it. The tag garam publishes its images under
    names a build and not this document (ADR-0039).
tags:
  - name: auth
    description: Sign-in, sign-out, and the current identity.
  - name: org
    description: >-
      Organizations, memberships, invitations, and the groups and
      projects an organization contains.
  - name: policy
    description: >-
      The versioned policy documents an organization evaluates, and the
      subjects they are attached to.
  - name: operator
    description: >-
      The operators an organization has registered, and the one-time
      token each enrols with. A record says garam holds the operator
      and nothing more (ADR-0045); the token beside it is permission to
      ask for one certificate, once, and is shown once because garam
      keeps no copy of it (ADR-0064). Registering mints the first, and
      an operator that has not enrolled is minted another on request
      (ADR-0067).
  - name: agent
    description: >-
      The agents an organization holds, and the definitions of the
      agents it says it should have. The two are answered under
      separate paths and separate schemas because they are separate
      facts: a definition is what the organization decided (ADR-0026),
      an agent is what an operator reported. Nothing on this listener
      assigns an agent or issues a certificate. One of them can also be
      watched working, which is a subscription rather than a read and is
      granted separately (ADR-0022).
paths:
  /auth/login/{provider}:
    get:
      operationId: login
      tags: [auth]
      summary: Start the OAuth authorization code flow.
      description: >-
        Redirects to the provider's authorization URL. Sets short-lived
        cookies carrying the OIDC state and PKCE verifier, which the
        callback validates.
      security: []
      parameters:
        - $ref: '#/components/parameters/provider'
      responses:
        '302':
          description: Redirect to the provider's consent screen.
          headers:
            Location:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /auth/callback/{provider}:
    get:
      operationId: oauthCallback
      tags: [auth]
      summary: Complete the OAuth authorization code flow.
      description: >-
        Exchanges the code for tokens, verifies the ID token, upserts
        the user, creates a session, and sets the `garam_session`
        cookie. Redirects to `/` on success.
      security: []
      parameters:
        - $ref: '#/components/parameters/provider'
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        '302':
          description: Redirect to `/` with the session cookie set.
          headers:
            Location:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Revoke the current session and clear the cookie.
      responses:
        '204':
          description: Session revoked.
        '401':
          $ref: '#/components/responses/Error'
  /auth/providers:
    get:
      operationId: listProviders
      tags: [auth]
      summary: List the enabled sign-in providers.
      description: >-
        Public endpoint naming the sign-in providers the server has
        registered. A name absent from the list has no login route:
        `/auth/login/{provider}` is generic and answers 404 for a
        provider nothing registered.
      security: []
      responses:
        '200':
          description: Names of the enabled providers.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                example: ["google"]
  /auth/password/register:
    post:
      operationId: registerPassword
      tags: [auth]
      summary: Create an account from an invitation and sign in.
      description: >-
        Creates the user, its password credential, and the membership
        the invitation names, then sets the `garam_session` cookie.
        There is no registration without an invitation: organizations
        grow by invitation rather than open signup (ADR-0006), and the
        token is the possession proof that authorizes the account
        (ADR-0041). The account is a local one, distinct from any
        account the same person holds through a provider.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordRegistration'
      responses:
        '201':
          description: The resulting membership, with the session cookie set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /auth/password/login:
    post:
      operationId: loginPassword
      tags: [auth]
      summary: Sign in with a username and a password.
      description: >-
        Verifies the password against the stored Argon2id verifier and
        sets the `garam_session` cookie. A wrong password and a username
        no account holds are refused identically — same status, same
        body — because telling them apart publishes the account list
        (ADR-0041). Verifications live at one time are bounded, so this
        answers 429 under load rather than hashing (ADR-0030's shape).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordLogin'
      responses:
        '200':
          description: The signed-in user, with the session cookie set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /me:
    get:
      operationId: me
      tags: [auth]
      summary: Return the signed-in user.
      responses:
        '200':
          description: The current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Error'
  /orgs:
    post:
      operationId: createOrg
      tags: [org]
      summary: Create an organization.
      description: The creator becomes the org's first `owner`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationCreate'
      responses:
        '201':
          description: Organization created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
    get:
      operationId: listOrgs
      tags: [org]
      summary: List organizations the caller belongs to.
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: The caller's organizations.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
  /orgs/{org}:
    get:
      operationId: getOrg
      tags: [org]
      summary: Get an organization. Requires the `member` role.
      parameters:
        - $ref: '#/components/parameters/org'
      responses:
        '200':
          description: The organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateOrg
      tags: [org]
      summary: Update an organization. Requires the `admin` role.
      parameters:
        - $ref: '#/components/parameters/org'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationPatch'
      responses:
        '200':
          description: The updated organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteOrg
      tags: [org]
      summary: Delete an organization. Requires the `owner` role.
      parameters:
        - $ref: '#/components/parameters/org'
      responses:
        '204':
          description: Organization deleted.
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /orgs/{org}/deletion-preview:
    get:
      operationId: getOrgDeletionPreview
      tags: [org]
      summary: What deleting the organization would destroy. Requires the `owner` role.
      description: >-
        What `deleteOrg` would remove, counted on the server at the
        moment of the read. Nothing here deletes anything and nothing
        here reserves the counts: an organization written to after this
        answers is deleted with what it holds then.


        The counts are of the resources keyed on the organization
        itself. What is keyed on those in turn goes with its parent and
        is not counted apart from it — a group's members with the
        group, a project's members with the project, a policy's
        versions and attachments with the policy, an agent's assignment
        with the agent, and an operator's unspent enrollment tokens
        with the operator.


        `certificateAuthority` is outside `counts` because it is the
        one thing on this answer that cannot be created again. The rest
        can be re-made by whoever made them; the authority's private
        key is stored sealed and goes with the row, no route imports or
        restores one, and every certificate it ever signed stops
        verifying for good (ADR-0014, ADR-0016).


        A certificate an operator already holds is not counted and does
        not go: that row carries no foreign key to the registration or
        the organization (ADR-0045). It stops authenticating all the
        same, because the authority that signed it is gone.
      parameters:
        - $ref: '#/components/parameters/org'
      responses:
        '200':
          description: What deleting the organization would destroy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgDeletionPreview'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /orgs/{org}/members:
    get:
      operationId: listOrgMembers
      tags: [org]
      summary: List members of an organization. Requires the `member` role.
      parameters:
        - $ref: '#/components/parameters/org'
      responses:
        '200':
          description: Members with their roles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Member'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /orgs/{org}/groups:
    post:
      operationId: createGroup
      tags: [org]
      summary: Create a group in an organization. Requires the `admin` role.
      parameters:
        - $ref: '#/components/parameters/org'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupCreate'
      responses:
        '201':
          description: Group created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    get:
      operationId: listGroups
      tags: [org]
      summary: List an organization's groups. Requires the `member` role.
      parameters:
        - $ref: '#/components/parameters/org'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: The organization's groups.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Group'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /orgs/{org}/groups/{group}:
    get:
      operationId: getGroup
      tags: [org]
      summary: Get a group. Requires the `member` role.
      parameters:
        - $ref: '#/components/parameters/org'
        - $ref: '#/components/parameters/group'
      responses:
        '200':
          description: The group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateGroup
      tags: [org]
      summary: Rename a group. Requires the `admin` role.
      parameters:
        - $ref: '#/components/parameters/org'
        - $ref: '#/components/parameters/group'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupPatch'
      responses:
        '200':
          description: The updated group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteGroup
      tags: [org]
      summary: Delete a group. Requires the `admin` role.
      parameters:
        - $ref: '#/components/parameters/org'
        - $ref: '#/components/parameters/group'
      responses:
        '204':
          description: Group deleted.
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /orgs/{org}/groups/{group}/members:
    get:
      operationId: listGroupMembers
      tags: [org]
      summary: List a group's members. Requires the `member` role.
      parameters:
        - $ref: '#/components/parameters/org'
        - $ref: '#/components/parameters/group'
      responses:
        '200':
          description: The group's members.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MemberRef'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    post:
      operationId: addGroupMember
      tags: [org]
      summary: Add a member to a group. Requires the `admin` role.
      parameters:
        - $ref: '#/components/parameters/org'
        - $ref: '#/components/parameters/group'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberRef'
      responses:
        '204':
          description: Member added.
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /orgs/{org}/groups/{group}/members/{member}:
    delete:
      operationId: removeGroupMember
      tags: [org]
      summary: Remove a member from a group. Requires the `admin` role.
      parameters:
        - $ref: '#/components/parameters/org'
        - $ref: '#/components/parameters/group'
        - $ref: '#/components/parameters/member'
      responses:
        '204':
          description: Member removed.
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /orgs/{org}/projects:
    post:
      operationId: createProject
      tags: [org]
      summary: Create a project in an organization. Requires the `admin` role.
      parameters:
