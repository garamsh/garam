          $ref: '#/components/responses/Error'
    get:
      operationId: listAgentDefinitions
      tags: [agent]
      summary: List an organization's agent definitions. Requires the `member` role.
      description: >-
        The agents the organization says it should have. An entry here
        is not an agent, and an agent under `/orgs/{org}/agents` is not
        a definition. No response joins them; a consumer can. A claim
        writes the agent under the GRN its definition minted
