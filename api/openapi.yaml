openapi: 3.1.0
info:
  title: garam API
  version: 0.1.0
  description: >-
    Authentication and organization permission APIs for garam.
    Authentication is cookie-based: the OAuth callback sets a
    `garam_session` cookie that all other endpoints require.
tags:
  - name: auth
    description: Sign-in, sign-out, and the current identity.
  - name: org
    description: >-
      Organizations, memberships, invitations, and the groups and
      projects an organization contains.
  - name: policy
    description: >-
      The versioned policy documents an organization evaluates, and the
      subjects they are attached to.
paths:
  /auth/login/{provider}:
    get:
      operationId: login
      tags: [auth]
      summary: Start the OAuth authorization code flow.
      description: >-
        Redirects to the provider's authorization URL. Sets short-lived
        cookies carrying the OIDC state and PKCE verifier, which the
        callback validates.
      security: []
      parameters:
        - $ref: '#/components/parameters/provider'
      responses:
        '302':
          description: Redirect to the provider's consent screen.
          headers:
            Location:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/Error'
  /auth/callback/{provider}:
    get:
      operationId: oauthCallback
      tags: [auth]
      summary: Complete the OAuth authorization code flow.
      description: >-
        Exchanges the code for tokens, verifies the ID token, upserts
        the user, creates a session, and sets the `garam_session`
        cookie. Redirects to `/` on success.
      security: []
      parameters:
        - $ref: '#/components/parameters/provider'
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        '302':
          description: Redirect to `/` with the session cookie set.
          headers:
            Location:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Revoke the current session and clear the cookie.
      responses:
        '204':
          description: Session revoked.
        '401':
          $ref: '#/components/responses/Error'
  /auth/providers:
    get:
      operationId: listProviders
      tags: [auth]
      summary: List the enabled sign-in providers.
      description: >-
        Public endpoint the login page uses to decide which sign-in
        options to render. `dev` appears only when the server runs with
        GARAM_DEV_AUTH=true (ADR-0010).
      security: []
      responses:
        '200':
          description: Names of the enabled providers.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                example: ["dev", "google"]
  /me:
    get:
      operationId: me
      tags: [auth]
      summary: Return the signed-in user.
      responses:
        '200':
          description: The current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Error'
  /orgs:
    post:
      operationId: createOrg
      tags: [org]
      summary: Create an organization.
      description: The creator becomes the org's first `owner`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationCreate'
      responses:
        '201':
          description: Organization created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
    get:
      operationId: listOrgs
      tags: [org]
      summary: List organizations the caller belongs to.
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: The caller's organizations.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Organization'
        '401':
          $ref: '#/components/responses/Error'
  /orgs/{org}:
    get:
      operationId: getOrg
      tags: [org]
      summary: Get an organization. Requires the `member` role.
      parameters:
        - $ref: '#/components/parameters/org'
      responses:
        '200':
          description: The organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateOrg
      tags: [org]
      summary: Update an organization. Requires the `admin` role.
      parameters:
        - $ref: '#/components/parameters/org'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationPatch'
      responses:
        '200':
          description: The updated organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteOrg
      tags: [org]
      summary: Delete an organization. Requires the `owner` role.
      parameters:
        - $ref: '#/components/parameters/org'
      responses:
        '204':
          description: Organization deleted.
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /orgs/{org}/members:
    get:
      operationId: listOrgMembers
      tags: [org]
      summary: List members of an organization. Requires the `member` role.
      parameters:
        - $ref: '#/components/parameters/org'
      responses:
        '200':
          description: Members with their roles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Member'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /orgs/{org}/groups:
    post:
      operationId: createGroup
      tags: [org]
      summary: Create a group in an organization. Requires the `admin` role.
      parameters:
        - $ref: '#/components/parameters/org'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupCreate'
      responses:
        '201':
          description: Group created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    get:
      operationId: listGroups
      tags: [org]
      summary: List an organization's groups. Requires the `member` role.
      parameters:
        - $ref: '#/components/parameters/org'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: The organization's groups.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Group'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /orgs/{org}/groups/{group}:
    get:
      operationId: getGroup
      tags: [org]
      summary: Get a group. Requires the `member` role.
      parameters:
        - $ref: '#/components/parameters/org'
        - $ref: '#/components/parameters/group'
      responses:
        '200':
          description: The group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateGroup
      tags: [org]
      summary: Rename a group. Requires the `admin` role.
      parameters:
        - $ref: '#/components/parameters/org'
        - $ref: '#/components/parameters/group'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupPatch'
      responses:
        '200':
          description: The updated group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteGroup
      tags: [org]
      summary: Delete a group. Requires the `admin` role.
      parameters:
        - $ref: '#/components/parameters/org'
        - $ref: '#/components/parameters/group'
      responses:
        '204':
          description: Group deleted.
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /orgs/{org}/groups/{group}/members:
    get:
      operationId: listGroupMembers
      tags: [org]
      summary: List a group's members. Requires the `member` role.
      parameters:
        - $ref: '#/components/parameters/org'
        - $ref: '#/components/parameters/group'
      responses:
        '200':
          description: The group's members.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MemberRef'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    post:
      operationId: addGroupMember
      tags: [org]
      summary: Add a member to a group. Requires the `admin` role.
      parameters:
        - $ref: '#/components/parameters/org'
        - $ref: '#/components/parameters/group'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberRef'
      responses:
        '204':
          description: Member added.
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /orgs/{org}/groups/{group}/members/{member}:
    delete:
      operationId: removeGroupMember
      tags: [org]
      summary: Remove a member from a group. Requires the `admin` role.
      parameters:
        - $ref: '#/components/parameters/org'
        - $ref: '#/components/parameters/group'
        - $ref: '#/components/parameters/member'
      responses:
        '204':
          description: Member removed.
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /orgs/{org}/projects:
    post:
      operationId: createProject
      tags: [org]
      summary: Create a project in an organization. Requires the `admin` role.
      parameters:
        - $ref: '#/components/parameters/org'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
      responses:
        '201':
          description: Project created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    get:
      operationId: listProjects
      tags: [org]
      summary: List an organization's projects. Requires the `member` role.
      parameters:
        - $ref: '#/components/parameters/org'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: The organization's projects.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /orgs/{org}/projects/{project}:
    get:
      operationId: getProject
      tags: [org]
      summary: Get a project. Requires the `member` role.
      parameters:
        - $ref: '#/components/parameters/org'
        - $ref: '#/components/parameters/project'
      responses:
        '200':
          description: The project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateProject
      tags: [org]
      summary: Rename a project. Requires the `admin` role.
      parameters:
        - $ref: '#/components/parameters/org'
        - $ref: '#/components/parameters/project'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectPatch'
      responses:
        '200':
          description: The updated project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteProject
      tags: [org]
      summary: Delete a project. Requires the `admin` role.
      parameters:
        - $ref: '#/components/parameters/org'
        - $ref: '#/components/parameters/project'
      responses:
        '204':
          description: Project deleted.
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /orgs/{org}/projects/{project}/members:
    get:
      operationId: listProjectMembers
      tags: [org]
      summary: List a project's members. Requires the `member` role.
      parameters:
        - $ref: '#/components/parameters/org'
        - $ref: '#/components/parameters/project'
      responses:
        '200':
          description: The project's members.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MemberRef'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    post:
      operationId: addProjectMember
      tags: [org]
      summary: Add a member to a project. Requires the `admin` role.
      parameters:
        - $ref: '#/components/parameters/org'
        - $ref: '#/components/parameters/project'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberRef'
      responses:
        '204':
          description: Member added.
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /orgs/{org}/projects/{project}/members/{member}:
    delete:
      operationId: removeProjectMember
      tags: [org]
      summary: Remove a member from a project. Requires the `admin` role.
      parameters:
        - $ref: '#/components/parameters/org'
        - $ref: '#/components/parameters/project'
        - $ref: '#/components/parameters/member'
      responses:
        '204':
          description: Member removed.
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /orgs/{org}/policies:
    post:
      operationId: createPolicy
      tags: [policy]
      summary: Create a policy in an organization. Requires the `admin` role.
      description: >-
        Stores the document as the policy's first version. The policy
        is a draft until it is activated.
      parameters:
        - $ref: '#/components/parameters/org'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyCreate'
      responses:
        '201':
          description: Policy created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    get:
      operationId: listPolicies
      tags: [policy]
      summary: List an organization's policies. Requires the `admin` role.
      parameters:
        - $ref: '#/components/parameters/org'
      responses:
        '200':
          description: The organization's policies, in ascending GRN order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Policy'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /orgs/{org}/policies/{policy}/versions:
    get:
      operationId: listPolicyVersions
      tags: [policy]
      summary: List a policy's versions. Requires the `admin` role.
      parameters:
        - $ref: '#/components/parameters/org'
        - $ref: '#/components/parameters/policy'
      responses:
        '200':
          description: The policy's versions, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PolicyVersion'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    post:
      operationId: addPolicyVersion
      tags: [policy]
      summary: Append a version to a policy. Requires the `admin` role.
      description: >-
        Versions are append-only. The policy keeps evaluating its
        default version until a rollback moves the pointer.
      parameters:
        - $ref: '#/components/parameters/org'
        - $ref: '#/components/parameters/policy'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyVersionCreate'
      responses:
        '201':
          description: Version appended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyVersion'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /orgs/{org}/policies/{policy}/activate:
    post:
      operationId: activatePolicy
      tags: [policy]
      summary: Activate a policy. Requires the `admin` role.
      description: An active policy contributes its default version to checks.
      parameters:
        - $ref: '#/components/parameters/org'
        - $ref: '#/components/parameters/policy'
      responses:
        '200':
          description: The activated policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /orgs/{org}/policies/{policy}/archive:
    post:
      operationId: archivePolicy
      tags: [policy]
      summary: Archive a policy. Requires the `admin` role.
      description: >-
        The policy and its versions are retained; it stops contributing
        statements to checks.
      parameters:
        - $ref: '#/components/parameters/org'
        - $ref: '#/components/parameters/policy'
      responses:
        '200':
          description: The archived policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /orgs/{org}/policies/{policy}/rollback:
    post:
      operationId: rollbackPolicy
      tags: [policy]
      summary: Point a policy at an earlier version. Requires the `admin` role.
      parameters:
        - $ref: '#/components/parameters/org'
        - $ref: '#/components/parameters/policy'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyRollback'
      responses:
        '200':
          description: The policy at its new default version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /orgs/{org}/policies/{policy}/attachments:
    get:
      operationId: listPolicyAttachments
      tags: [policy]
      summary: List a policy's attachments. Requires the `admin` role.
      parameters:
        - $ref: '#/components/parameters/org'
        - $ref: '#/components/parameters/policy'
      responses:
        '200':
          description: The attachments, in ascending subject GRN order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PolicyAttachment'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    post:
      operationId: attachPolicy
      tags: [policy]
      summary: Attach a policy to a subject. Requires the `admin` role.
      description: >-
        The policy then applies to that user or group instead of to the
        whole organization. A policy with no attachment applies
        organization-wide.
      parameters:
        - $ref: '#/components/parameters/org'
        - $ref: '#/components/parameters/policy'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyAttachmentCreate'
      responses:
        '201':
          description: Policy attached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyAttachment'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /orgs/{org}/policies/{policy}/attachments/{subject}:
    delete:
      operationId: detachPolicy
      tags: [policy]
      summary: Detach a policy from a subject. Requires the `admin` role.
      parameters:
        - $ref: '#/components/parameters/org'
        - $ref: '#/components/parameters/policy'
        - $ref: '#/components/parameters/subject'
      responses:
        '204':
          description: Policy detached.
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /orgs/{org}/invitations:
    post:
      operationId: createInvitation
      tags: [org]
      summary: Create an invitation. Requires the `admin` role.
      description: >-
        Returns an invitation token. A signed-in user who presents the
        token to `/invitations/{token}/accept` joins the org with the
        role chosen here.
      parameters:
        - $ref: '#/components/parameters/org'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationCreate'
      responses:
        '201':
          description: Invitation created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /invitations/{token}/accept:
    post:
      operationId: acceptInvitation
      tags: [org]
      summary: Accept an invitation.
      description: >-
        The signed-in user joins the invitation's org with the
        invitation's role. Expired or already-accepted tokens are
        rejected.
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The resulting membership.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
components:
  parameters:
    provider:
      name: provider
      in: path
      required: true
      description: >-
        Authentication provider name (`google`; `dev` only when the
        server runs with GARAM_DEV_AUTH=true).
      schema:
        type: string
    org:
      name: org
      in: path
      required: true
      description: Organization identifier (the last GRN segment).
      schema:
        type: string
    group:
      name: group
      in: path
      required: true
      description: Group identifier (the last GRN segment).
      x-go-name: GroupSlug
      schema:
        type: string
    project:
      name: project
      in: path
      required: true
      description: Project identifier (the last GRN segment).
      x-go-name: ProjectSlug
      schema:
        type: string
    member:
      name: member
      in: path
      required: true
      description: Member GRN of a user or agent.
      x-go-name: MemberGrn
      schema:
        type: string
    policy:
      name: policy
      in: path
      required: true
      description: Policy identifier (the last GRN segment).
      x-go-name: PolicySlug
      schema:
        type: string
    subject:
      name: subject
      in: path
      required: true
      description: Subject GRN a policy is attached to.
      x-go-name: SubjectGrn
      schema:
        type: string
    limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
      description: Maximum entries to return; 0 means no limit.
    offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
  schemas:
    User:
      type: object
      required: [grn, nickname]
      properties:
        grn:
          type: string
          example: grn:garam:default:user:117421510527410544321
        nickname:
          type: string
    Organization:
      type: object
      required: [grn, name, createdAt]
      properties:
        grn:
          type: string
          example: grn:garam:default:org:acme
        name:
          type: string
        createdAt:
          type: string
          format: date-time
    OrganizationCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
    OrganizationPatch:
      type: object
      properties:
        name:
          type: string
          minLength: 1
    Group:
      type: object
      required: [grn, name, orgGrn, roles]
      properties:
        grn:
          type: string
          example: grn:acme:default:group:eng
        name:
          type: string
        orgGrn:
          type: string
        roles:
          $ref: '#/components/schemas/ScopedRoles'
    GroupCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        roles:
          $ref: '#/components/schemas/ScopedRoles'
    GroupPatch:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        roles:
          $ref: '#/components/schemas/ScopedRoles'
    Project:
      type: object
      required: [grn, name, orgGrn, roles]
      properties:
        grn:
          type: string
          example: grn:acme:default:project:frontend
        name:
          type: string
        orgGrn:
          type: string
        roles:
          $ref: '#/components/schemas/ScopedRoles'
    ProjectCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        roles:
          $ref: '#/components/schemas/ScopedRoles'
    ProjectPatch:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        roles:
          $ref: '#/components/schemas/ScopedRoles'
    MemberRef:
      type: object
      required: [memberGrn]
      description: A group or project member, addressed by GRN.
      properties:
        memberGrn:
          type: string
          example: grn:acme:default:user:alice
    Role:
      type: string
      enum: [owner, admin, member]
    ScopedRoles:
      type: array
      description: >-
        Roles a group or project grants its own members, scoped to that
        group or project alone. Omitting the field on a patch leaves the
        roles unchanged; an empty array clears them.
      items:
        $ref: '#/components/schemas/Role'
    Member:
      type: object
      required: [userGrn, role, since]
      properties:
        userGrn:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        since:
          type: string
          format: date-time
    InvitationCreate:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [admin, member]
          description: Owners are not transferable by invitation.
        expiresInHours:
          type: integer
          minimum: 1
          maximum: 720
          default: 168
    Invitation:
      type: object
      required: [token, orgGrn, role, expiresAt]
      properties:
        token:
          type: string
          description: Bearer token; presented to the accept endpoint.
        orgGrn:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        expiresAt:
          type: string
          format: date-time
    PolicyDocument:
      type: object
      description: >-
        An IAM-style policy document: a `Version` string and a
        `Statement` list of `Sid` / `Effect` / `Action` / `Resource`
        entries. The authz engine owns the model and validates the
        document on write, so it travels this API opaquely.
      x-go-type: json.RawMessage
      example:
        Version: '2026-07-25'
        Statement:
          - Sid: AllowOrgRead
            Effect: Allow
            Action: [org:read]
            Resource: ['grn:acme:*']
    PolicyStatus:
      type: string
      description: >-
        A policy's lifecycle state. Only an `active` policy contributes
        statements to a check.
      enum: [draft, active, archived]
    Policy:
      type: object
      required: [grn, orgGrn, name, status, defaultVersion, createdAt, updatedAt]
      properties:
        grn:
          type: string
          example: grn:acme:default:policy:9f2ac1b40d8e7a35
        orgGrn:
          type: string
        name:
          type: string
        status:
          $ref: '#/components/schemas/PolicyStatus'
        defaultVersion:
          type: integer
          minimum: 1
          description: The version evaluated while the policy is active.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PolicyCreate:
      type: object
      required: [name, document]
      properties:
        name:
          type: string
          minLength: 1
        document:
          $ref: '#/components/schemas/PolicyDocument'
    PolicyVersion:
      type: object
      required: [policyGrn, version, document, createdBy, createdAt]
      properties:
        policyGrn:
          type: string
        version:
          type: integer
          minimum: 1
        document:
          $ref: '#/components/schemas/PolicyDocument'
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
    PolicyVersionCreate:
      type: object
      required: [document]
      properties:
        document:
          $ref: '#/components/schemas/PolicyDocument'
    PolicyRollback:
      type: object
      required: [version]
      properties:
        version:
          type: integer
          minimum: 1
          description: An existing version of the policy.
    PolicyAttachment:
      type: object
      required: [policyGrn, subjectGrn, createdAt]
      properties:
        policyGrn:
          type: string
        subjectGrn:
          type: string
          example: grn:acme:default:group:eng
        createdAt:
          type: string
          format: date-time
    PolicyAttachmentCreate:
      type: object
      required: [subjectGrn]
      description: The user or group the policy applies to.
      properties:
        subjectGrn:
          type: string
          example: grn:acme:default:group:eng
    Error:
      type: object
      required: [kind, message]
      properties:
        kind:
          type: string
          description: errorx kind, e.g. `not_found`, `permission_denied`.
        message:
          type: string
  responses:
    Error:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: garam_session
security:
  - sessionCookie: []
