  /orgs/{org}/agents:
    get:
      operationId: listAgents
      tags: [agent]
      summary: List an organization's agents. Requires the `member` role.
      parameters:
        - $ref: '#/components/parameters/org'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
