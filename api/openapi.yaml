          description: The definition as stored after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDefinition'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /orgs/{org}/agent-templates:
    post:
      operationId: createAgentTemplate
      tags: [agent]
      summary: Create an agent template. Requires the `admin` role.
