                  $ref: '#/components/schemas/AgentDefinition'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /orgs/{org}/agent-definitions/{agent}:
    get:
      operationId: getAgentDefinition
      tags: [agent]
      summary: Read one of an organization's agent definitions. Requires the `member` role.
      description: >-
        The definition that minted this agent identifier, answered as
