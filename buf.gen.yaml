version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/garamsh/garam/proto/gen
# Nothing parses this file for a pin, so the two plugin versions below
# move when a contributor moves them, and a bump lands with the `make
# gen` that follows it or `check-gen` fails.
plugins:
  - local: [go, run, google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11]
    out: proto/gen
    opt: paths=source_relative
  - local: [go, run, google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2]
    out: proto/gen
    opt: paths=source_relative
