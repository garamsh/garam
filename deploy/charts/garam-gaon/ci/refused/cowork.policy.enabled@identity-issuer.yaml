# The policy half of cowork on, and no issuer that answers its token
# exchange.
cowork:
  policy:
    enabled: true
    ca:
      configMap: cowork-policy-ca
      key: ca.crt
    deploymentKey:
      secret: cowork-deployment
      key: deployment.key
machine:
  tokenUrl: https://machine.garam.example/oauth/token
