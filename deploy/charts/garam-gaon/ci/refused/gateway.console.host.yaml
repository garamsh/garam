# Two HTTPS listeners of one port and one hostname.
gateway:
  enabled: true
  site:
    host: garam.example
    certificate: site-tls
  console:
    host: garam.example
    certificate: console-tls
  cowork:
    host: cowork.garam.example
    certificate: cowork-tls
  userContent:
    host: content.garam.example
    certificate: content-tls
  machine:
    host: machine.garam.example
