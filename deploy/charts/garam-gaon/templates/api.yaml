{{- if eq (include "garam-gaon.stage" .) "serve" }}
{{- $ctx := dict "root" $ "word" "api" }}
{{- $policy := .Values.api.policy }}
{{- $google := .Values.api.google }}
# The browser-facing API: `garam serve api`; probes share its listener.
apiVersion: workloads.gaon.garam.sh/v1alpha1
kind: Deployment
metadata:
  name: {{ include "garam-gaon.name" $ctx }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "garam-gaon.selector" $ctx | nindent 6 }}
  template:
    image: {{ include "garam-gaon.image" (dict "root" $ "image" "server") }}
    user: {{ include "garam-gaon.user" (dict "root" $ "image" "server") | quote }}
    command:
      - garam
    args:
      - serve
      - api
    env:
      {{- include "garam-gaon.envSecret" (dict "name" "GARAM_DATABASE_URL" "path" "database.garam" "ref" .Values.database.garam) | nindent 6 }}
      {{- include "garam-gaon.env" (dict "name" "GARAM_HTTP_ADDR" "value" ":8080") | nindent 6 }}
      {{- include "garam-gaon.env" (dict "name" "GARAM_AUTHZ_ADDR" "value" (printf "%s:9090" (include "garam-gaon.host" (dict "root" $ "word" "authz")))) | nindent 6 }}
      {{- with .Values.api.sessionTtl }}
      {{- include "garam-gaon.env" (dict "name" "GARAM_SESSION_TTL" "value" .) | nindent 6 }}
      {{- end }}
      {{- include "garam-gaon.env" (dict "name" "GARAM_COOKIE_SECURE" "value" .Values.api.cookieSecure) | nindent 6 }}
      {{- with include "garam-gaon.machineTokenUrl" $ }}
      {{- include "garam-gaon.env" (dict "name" "GARAM_MACHINE_TOKEN_URL" "value" .) | nindent 6 }}
      {{- end }}
      {{- if or $google.clientId $google.redirectUrl $google.clientSecret.secret $google.clientSecret.key }}
      {{- include "garam-gaon.env" (dict "name" "GOOGLE_CLIENT_ID" "value" (required "api.google.clientId is required once any api.google value is set: garam refuses to start holding one half of the credential" $google.clientId)) | nindent 6 }}
      {{- include "garam-gaon.env" (dict "name" "GOOGLE_REDIRECT_URL" "value" (required "api.google.redirectUrl is required once any api.google value is set" $google.redirectUrl)) | nindent 6 }}
      {{- include "garam-gaon.envSecret" (dict "name" "GOOGLE_CLIENT_SECRET" "path" "api.google.clientSecret" "ref" $google.clientSecret) | nindent 6 }}
      {{- end }}
      {{- include "garam-gaon.env" (dict "name" "GARAM_POLICY_ADDR" "value" (printf "%s:8443" (include "garam-gaon.host" (dict "root" $ "word" "policy")))) | nindent 6 }}
      {{- include "garam-gaon.env" (dict "name" "GARAM_POLICY_CA_FILE" "value" "/etc/garam/policy/ca.crt") | nindent 6 }}
      {{- include "garam-gaon.env" (dict "name" "GARAM_POLICY_SIGNING_KEY_FILE" "value" "/etc/garam/policy/signing.key") | nindent 6 }}
      {{- include "garam-gaon.env" (dict "name" "GARAM_POLICY_TOKEN_ISSUER" "value" (required "policy.tokenIssuer is required: it is the issuer the policy service trusts and the api signs under, one value for both" .Values.policy.tokenIssuer)) | nindent 6 }}
    files:
      {{- include "garam-gaon.fileConfigMap" (dict "file" "/etc/garam/policy/ca.crt" "path" "api.policy.ca" "ref" $policy.ca) | nindent 6 }}
      {{- include "garam-gaon.fileSecret" (dict "file" "/etc/garam/policy/signing.key" "path" "api.policy.signingKey" "ref" $policy.signingKey) | nindent 6 }}
    ports:
      - name: http
        port: 8080
        protocol: TCP
    livenessProbe:
      httpGet:
        path: /healthz
        port: http
    readinessProbe:
      httpGet:
        path: /readyz
        port: http
      timeoutSeconds: 3
---
apiVersion: compute.gaon.garam.sh/v1alpha1
kind: Service
metadata:
  name: {{ include "garam-gaon.name" $ctx }}
spec:
  type: ClusterIP
  selector:
    {{- include "garam-gaon.selector" $ctx | nindent 4 }}
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: http
{{- end }}
