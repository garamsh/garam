{{- if eq (include "garam-gaon.stage" .) "serve" }}
{{- $ctx := dict "root" $ "word" "machine" }}
{{- $service := .Values.machine.service }}
{{- if not (has $service.type (list "ClusterIP" "LoadBalancer")) }}
{{- fail (printf "machine.service.type must be ClusterIP or LoadBalancer, got %q" $service.type) }}
{{- end }}
{{- if and $service.loadBalancerIP (ne $service.type "LoadBalancer") }}
{{- fail "machine.service.loadBalancerIP is set with a type other than LoadBalancer: an address is held only by a LoadBalancer Service" }}
{{- end }}
# The machine listener: `garam serve machine`. It terminates TLS itself
# and authenticates the client certificate per connection (ADR-0014), so
# nothing that terminates TLS may stand in front of port 8443; the
# gateway passes it through by server name.
apiVersion: workloads.gaon.garam.sh/v1alpha1
kind: Deployment
metadata:
  name: {{ include "garam-gaon.name" $ctx }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "garam-gaon.selector" $ctx | nindent 6 }}
  template:
    image: {{ include "garam-gaon.image" (dict "root" $ "image" "server") }}
    user: {{ include "garam-gaon.user" (dict "root" $ "image" "server") | quote }}
    command:
      - garam
    args:
      - serve
      - machine
    env:
      {{- include "garam-gaon.envSecret" (dict "name" "GARAM_DATABASE_URL" "path" "database.garam" "ref" .Values.database.garam) | nindent 6 }}
      {{- include "garam-gaon.env" (dict "name" "GARAM_MACHINE_ADDR" "value" ":8443") | nindent 6 }}
      {{- include "garam-gaon.env" (dict "name" "GARAM_MACHINE_HEALTH_ADDR" "value" ":8444") | nindent 6 }}
      {{- include "garam-gaon.env" (dict "name" "GARAM_AUTHZ_ADDR" "value" (printf "%s:9090" (include "garam-gaon.host" (dict "root" $ "word" "authz")))) | nindent 6 }}
      {{- include "garam-gaon.env" (dict "name" "GARAM_MACHINE_TLS_CERT_FILE" "value" "/etc/garam/machine/tls.crt") | nindent 6 }}
      {{- include "garam-gaon.env" (dict "name" "GARAM_MACHINE_TLS_KEY_FILE" "value" "/etc/garam/machine/tls.key") | nindent 6 }}
      {{- include "garam-gaon.env" (dict "name" "GARAM_MACHINE_SERVER_ROOT_FILE" "value" "/etc/garam/machine/server-root.crt") | nindent 6 }}
      {{- include "garam-gaon.env" (dict "name" "GARAM_CA_KEY_FILE" "value" "/etc/garam/machine/ca.key") | nindent 6 }}
      {{- with .Values.machine.agentTokenLifetime }}
      {{- include "garam-gaon.env" (dict "name" "GARAM_AGENT_TOKEN_LIFETIME" "value" .) | nindent 6 }}
      {{- end }}
      {{- include "garam-gaon.env" (dict "name" "GARAM_MACHINE_ISSUER" "value" (required "machine.issuer is required: the https origin every credential garam issues names" .Values.machine.issuer)) | nindent 6 }}
      {{- with include "garam-gaon.machineTokenUrl" $ }}
      {{- include "garam-gaon.env" (dict "name" "GARAM_MACHINE_TOKEN_URL" "value" .) | nindent 6 }}
      {{- end }}
    files:
      {{- include "garam-gaon.fileConfigMap" (dict "file" "/etc/garam/machine/tls.crt" "path" "machine.tlsCert" "ref" .Values.machine.tlsCert) | nindent 6 }}
      {{- include "garam-gaon.fileSecret" (dict "file" "/etc/garam/machine/tls.key" "path" "machine.tlsKey" "ref" .Values.machine.tlsKey) | nindent 6 }}
      {{- include "garam-gaon.fileConfigMap" (dict "file" "/etc/garam/machine/server-root.crt" "path" "machine.serverRoot" "ref" .Values.machine.serverRoot) | nindent 6 }}
      {{- include "garam-gaon.fileSecret" (dict "file" "/etc/garam/machine/ca.key" "path" "machine.caKey" "ref" .Values.machine.caKey) | nindent 6 }}
    ports:
      - name: mtls
        port: 8443
        protocol: TCP
      - name: health
        port: 8444
        protocol: TCP
    livenessProbe:
      httpGet:
        path: /healthz
        port: health
    readinessProbe:
      httpGet:
        path: /readyz
        port: health
---
apiVersion: compute.gaon.garam.sh/v1alpha1
kind: Service
metadata:
  name: {{ include "garam-gaon.name" $ctx }}
spec:
  type: {{ $service.type }}
  {{- with $service.loadBalancerIP }}
  loadBalancerIP: {{ . | quote }}
  {{- end }}
  selector:
    {{- include "garam-gaon.selector" $ctx | nindent 4 }}
  ports:
    - name: mtls
      protocol: TCP
      port: 8443
      targetPort: mtls
{{- end }}
