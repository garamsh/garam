apiVersion: v2
name: garam
description: The workloads garam runs — serve api, serve machine, the policy service, the web console, the site, and the two migrate jobs
type: application
# The chart's own version, moved by a change to the chart. It is not a
# garam version: a release publishes the chart under the release's
# version, set when it is packaged, so a consumer pins that artifact by
# digest or this source by a git ref of garamsh/garam, and pins the
# images separately through image.*.tag (ADR-0042).
version: 0.19.1
# No appVersion in the source. The published artifact's appVersion is
# the release's version, set when `make chart-publish` packages it
# (ADR-0181), so the source names no garam version and the artifact
# does.
