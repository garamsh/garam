# The configuration the minimal file leaves out — Google sign-in, and an
# account created and annotated for every workload, two of the branches
# in the templates — so the render `make chart` checks covers both sides
# of each. The minimal file covers the other side of the second: no
# name, so no account and no binding.
#
# `resources` is set nowhere here. No template branches on it, so a
# value covers nothing, and `helm package` ships this file inside the
# chart, where a quantity reads as a figure garam measured. None is
# (`docs/architecture/deployment-contract.md` §Not established).
#
# Each name and annotation below is a fixture. A deployment's names are
# whatever its own infrastructure repository binds a role to, and which
# key performs the binding is that deployment's platform's; the chart
# holds neither.
image:
  server:
    tag: "0.0.0-ci"
  web:
    tag: "0.0.0-ci"
  pullPolicy: Always
  pullSecrets:
    - garam-registry
database:
  secretName: garam-database
  secretKey: uri
api:
  serviceAccount:
    name: garam-api
    create: true
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/garam-ci-api
  sessionTTL: 24h
  cookieSecure: true
  google:
    clientId: "0000000000-ci.apps.googleusercontent.com"
    redirectUrl: https://garam.example/auth/callback/google
    clientSecret:
      secretName: garam-google
      secretKey: client-secret
authz:
  serviceAccount:
    name: garam-authz
    create: true
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/garam-ci-authz
machine:
  serviceAccount:
    name: garam-machine
    create: true
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/garam-ci-machine
  keyMaterial:
    secretName: garam-machine-key-material
    certKey: tls.crt
    keyKey: tls.key
    serverRootKey: server-root.pem
    kekKey: ca-kek.hex
  certificateLifetime: 1h
web:
  serviceAccount:
    name: garam-web
    create: true
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/garam-ci-web
  apiUrl: https://garam.example/api
migrate:
  serviceAccount:
    name: garam-migrate
    create: true
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/garam-ci-migrate
