# Every optional value set, so the render `make chart` checks covers the
# configuration the minimal one leaves out — Google sign-in and a
# ServiceAccount annotation, which are the two branches in the templates.
#
# Each annotation below is a fixture that exercises the branch rendering
# one. Which key binds a role is the deployment's platform's, and the
# chart holds none.
image:
  server:
    tag: "0.0.0-ci"
  web:
    tag: "0.0.0-ci"
  pullPolicy: Always
  pullSecrets:
    - garam-registry
database:
  secretName: garam-database
  secretKey: uri
api:
  serviceAccount:
    create: true
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/garam-ci-api
  sessionTTL: 24h
  cookieSecure: true
  google:
    clientId: "0000000000-ci.apps.googleusercontent.com"
    redirectUrl: https://garam.example/auth/callback/google
    clientSecret:
      secretName: garam-google
      secretKey: client-secret
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
authz:
  serviceAccount:
    create: true
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/garam-ci-authz
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
machine:
  serviceAccount:
    create: true
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/garam-ci-machine
  keyMaterial:
    secretName: garam-machine-key-material
    certKey: tls.crt
    keyKey: tls.key
    serverRootKey: server-root.pem
    kekKey: ca-kek.hex
  certificateLifetime: 1h
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
web:
  serviceAccount:
    create: true
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/garam-ci-web
  apiUrl: https://garam.example/api
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
migrate:
  serviceAccount:
    create: true
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/garam-ci-migrate
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
