# Every required value and nothing else: the render
# `make -C deploy/charts ci` checks a deployment that takes every
# default.
image:
  server:
    tag: "0.0.0-ci"
  web:
    tag: "0.0.0-ci"
  site:
    tag: "0.0.0-ci"
database:
  secretName: garam-database
machine:
  keyMaterial:
    secretName: garam-machine-key-material
  issuer: https://garam-machine.example
web:
  apiUrl: http://garam-api:8080
  siteUrl: https://garam.example
site:
  apiUrl: http://garam-api:8080
  consoleUrl: https://console.garam.example
  coworkUrl: https://cowork.garam.example
