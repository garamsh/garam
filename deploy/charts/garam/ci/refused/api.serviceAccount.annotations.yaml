# Annotations on an account the chart does not create. The render must
# refuse and name api.serviceAccount.annotations: under create: false
# the chart renders no ServiceAccount, so the annotation would reach
# nothing and the cloud role it binds would never arrive.
api:
  serviceAccount:
    create: false
    name: garam-api
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::0:role/x
