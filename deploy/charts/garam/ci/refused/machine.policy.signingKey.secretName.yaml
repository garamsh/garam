# The signing key named twice: a Secret the pod copies it from and a
# file the deployment writes. The render must refuse and name
# machine.policy.signingKey.secretName, since the two would disagree on
# what the process reads.
machine:
  policy:
    signingKeyFile: /vault/secrets/policy-signing-key
    signingKey:
      secretName: garam-policy-signing-key
