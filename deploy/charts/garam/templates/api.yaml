# The browser-facing API (ADR-0003). Its probes and /metrics answer on
# the same listener, with no credential (ADR-0021).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "garam.fullname" . }}-api
  labels:
    {{- include "garam.labels" (dict "root" $ "component" "api") | nindent 4 }}
spec:
  # Fixed at one, as on every workload here: replica safety above one is
  # not established.
  replicas: 1
  selector:
    matchLabels:
      {{- include "garam.selectorLabels" (dict "root" $ "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "garam.selectorLabels" (dict "root" $ "component" "api") | nindent 8 }}
    spec:
{{- include "garam.imagePullSecrets" . }}
      containers:
        - name: api
          image: {{ include "garam.serverImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve", "api"]
          env:
            {{- include "garam.databaseEnv" . | nindent 12 }}
            - name: GARAM_HTTP_ADDR
              value: ":8080"
            - name: GARAM_AUTHZ_ADDR
              value: {{ printf "%s-authz:9090" (include "garam.fullname" .) | quote }}
            - name: GARAM_SESSION_TTL
              value: {{ required "api.sessionTTL is required" .Values.api.sessionTTL | quote }}
            - name: GARAM_COOKIE_SECURE
              value: {{ .Values.api.cookieSecure | quote }}
            {{- if .Values.api.google.clientId }}
            - name: GOOGLE_CLIENT_ID
              value: {{ .Values.api.google.clientId | quote }}
            - name: GOOGLE_REDIRECT_URL
              value: {{ required "api.google.redirectUrl is required when api.google.clientId is set" .Values.api.google.redirectUrl | quote }}
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ required "api.google.clientSecret.secretName is required when api.google.clientId is set: the secret is a Secret reference, never a value" .Values.api.google.clientSecret.secretName }}
                  key: {{ required "api.google.clientSecret.secretKey is required when api.google.clientId is set" .Values.api.google.clientSecret.secretKey }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            timeoutSeconds: 3
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "garam.fullname" . }}-api
  labels:
    {{- include "garam.labels" (dict "root" $ "component" "api") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "garam.selectorLabels" (dict "root" $ "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
