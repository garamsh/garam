# The browser-facing API (ADR-0003). Its probes and /metrics answer on
# the same listener, with no credential (ADR-0021).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "garam.name" (dict "root" $ "word" "api") }}
  labels:
    {{- include "garam.labels" (dict "root" $ "component" "api") | nindent 4 }}
spec:
  # Fixed at one, as on every workload here: replica safety above one is
  # not established.
  replicas: 1
  # Recreate, not the default RollingUpdate: at one replica the default
  # brings the new pod up before taking the old one down, so an upgrade
  # runs two of a workload whose safety above one replica is not
  # established (docs/architecture/deployment-contract.md §Not
  # established). Terminating first holds the count `replicas` fixes
  # across an upgrade as well as at rest.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "garam.selectorLabels" (dict "root" $ "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "garam.selectorLabels" (dict "root" $ "component" "api") | nindent 8 }}
    spec:
{{- include "garam.serviceAccountName" (dict "root" $ "component" "api") }}
{{- include "garam.imagePullSecrets" . }}
      # 10001 is the account deploy/local/Dockerfile creates.
{{- include "garam.podSecurityContext" (dict "uid" 10001) }}
      containers:
        - name: api
          image: {{ include "garam.serverImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve", "api"]
{{- include "garam.containerSecurityContext" . }}
          env:
            {{- include "garam.databaseEnv" . | nindent 12 }}
            - name: GARAM_HTTP_ADDR
              value: ":8080"
            - name: GARAM_AUTHZ_ADDR
              value: {{ printf "%s:9090" (include "garam.name" (dict "root" $ "word" "authz")) | quote }}
            - name: GARAM_SESSION_TTL
              value: {{ required "api.sessionTTL is required" .Values.api.sessionTTL | quote }}
            - name: GARAM_COOKIE_SECURE
              value: {{ .Values.api.cookieSecure | quote }}
            {{- $google := .Values.api.google }}
            {{- if or $google.clientId $google.redirectUrl $google.clientSecret.secretName $google.clientSecret.secretKey }}
            - name: GOOGLE_CLIENT_ID
              value: {{ required "api.google.clientId is required once any api.google value is set: garam refuses to start holding one half of the credential, so the render refuses first" $google.clientId | quote }}
            - name: GOOGLE_REDIRECT_URL
              value: {{ required "api.google.redirectUrl is required once any api.google value is set" $google.redirectUrl | quote }}
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ required "api.google.clientSecret.secretName is required once any api.google value is set: the secret is a Secret reference, never a value" $google.clientSecret.secretName }}
                  key: {{ required "api.google.clientSecret.secretKey is required once any api.google value is set" $google.clientSecret.secretKey }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            timeoutSeconds: 3
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "garam.name" (dict "root" $ "word" "api") }}
  labels:
    {{- include "garam.labels" (dict "root" $ "component" "api") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "garam.selectorLabels" (dict "root" $ "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- include "garam.serviceAccount" (dict "root" $ "component" "api") }}
