# The engine (ADR-0003). It speaks gRPC only, so its probes and /metrics
# share a listener of their own (ADR-0021).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "garam.name" (dict "root" $ "word" "authz") }}
  labels:
    {{- include "garam.labels" (dict "root" $ "component" "authz") | nindent 4 }}
spec:
  # Fixed at one. No leader election exists and replica safety above one
  # is not established, so the chart offers no value for it.
  replicas: 1
  # Recreate, not the default RollingUpdate: at one replica the default
  # brings the new pod up before taking the old one down, so an upgrade
  # runs two of a workload whose safety above one replica is not
  # established (docs/architecture/deployment-contract.md §Not
  # established). Terminating first holds the count `replicas` fixes
  # across an upgrade as well as at rest.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "garam.selectorLabels" (dict "root" $ "component" "authz") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "garam.selectorLabels" (dict "root" $ "component" "authz") | nindent 8 }}
    spec:
{{- include "garam.serviceAccountName" (dict "root" $ "component" "authz") }}
{{- include "garam.imagePullSecrets" . }}
      # 10001 is the account deploy/local/Dockerfile creates.
{{- include "garam.podSecurityContext" (dict "uid" 10001) }}
      containers:
        - name: authz
          image: {{ include "garam.serverImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve", "authz"]
{{- include "garam.containerSecurityContext" . }}
          env:
            {{- include "garam.databaseEnv" . | nindent 12 }}
            - name: GARAM_GRPC_ADDR
              value: ":9090"
            - name: GARAM_METRICS_ADDR
              value: ":9091"
          ports:
            - name: grpc
              containerPort: 9090
            - name: health
              containerPort: 9091
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9091
          # The handler bounds one answer at 2s, so a probe timing out at
          # the default 1s reports its own deadline instead of the
          # dependency that failed.
          readinessProbe:
            httpGet:
              path: /readyz
              port: 9091
            timeoutSeconds: 3
          resources: {{- toYaml .Values.authz.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "garam.name" (dict "root" $ "word" "authz") }}
  labels:
    {{- include "garam.labels" (dict "root" $ "component" "authz") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "garam.selectorLabels" (dict "root" $ "component" "authz") | nindent 4 }}
  ports:
    - name: grpc
      port: 9090
      targetPort: grpc
    - name: health
      port: 9091
      targetPort: health
{{- include "garam.serviceAccount" (dict "root" $ "component" "authz") }}
