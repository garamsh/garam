# The machine listener (ADR-0017). It terminates TLS itself and
# authenticates the client certificate per connection (ADR-0014), so
# nothing that terminates TLS may stand in front of the mtls port — see
# the chart README, §Exposure is the cluster owner's.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "garam.name" (dict "root" $ "word" "machine") }}
  labels:
    {{- include "garam.labels" (dict "root" $ "component" "machine") | nindent 4 }}
spec:
{{- include "garam.replicasAndRollout" (dict "root" $ "workload" "machine") }}
  selector:
    matchLabels:
      {{- include "garam.selectorLabels" (dict "root" $ "component" "machine") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "garam.selectorLabels" (dict "root" $ "component" "machine") | nindent 8 }}
      {{- with .Values.machine.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
{{- include "garam.serviceAccountName" (dict "root" $ "component" "machine") }}
{{- include "garam.imagePullSecrets" . }}
{{- include "garam.topologySpread" (dict "root" $ "component" "machine") }}
      # The volume below is projected 0440, so its group owner decides
      # who reads it. fsGroup makes that group the containers', without
      # which the copy cannot open its source. It is the server image's
      # group because both containers here run under that account.
{{- include "garam.podSecurityContext" (dict "root" $ "name" "server" "fsGroup" .Values.image.server.runAsGroup) }}
{{- $km := .Values.machine.keyMaterial }}
{{- $secret := required "machine.keyMaterial.secretName is required: it names the Secret holding the listener's certificate and key, the root that signed them, and the key-encryption key, less whichever of the four names a Secret of its own" $km.secretName }}
{{- $keyMaterial := dict "name" "key-material" "source" "/etc/garam/key-material" "dest" "/run/garam/key-material" "mode" "0600" "sources" (list (dict "secretName" (default $secret $km.certSecretName) "key" $km.certKey) (dict "secretName" (default $secret $km.keySecretName) "key" $km.keyKey) (dict "secretName" (default $secret $km.kekSecretName) "key" $km.kekKey) (dict "secretName" (default $secret $km.serverRootSecretName) "key" $km.serverRootKey)) }}
{{- $machinePolicy := .Values.machine.policy }}
{{- $keyFile := include "garam.policySigningKeyFile" (dict "policy" $machinePolicy "value" "machine.policy") }}
{{- $signing := dict "name" "policy-signing" "source" "/etc/garam/policy-signing-secret" "dest" (include "garam.policySigningDir" .) "mode" "0400" "sources" (include "garam.policySigningKeySources" (dict "policy" $machinePolicy) | fromYamlArray) }}
      initContainers:
        # The machine container's figure reaches each copy too. A quota
        # admits a pod only when every container carries the resource it
        # bounds and a QoS class is read across every container, and the
        # pod's effective request is the max of its init containers and
        # the sum of the rest, so the copies reserve nothing beyond the
        # figure below.
{{- include "garam.ownerOnlyInit" (merge (dict "root" $ "resources" .Values.machine.resources) $keyMaterial) }}
{{- include "garam.ownerOnlyInit" (merge (dict "root" $ "resources" .Values.machine.resources) $signing) }}
      containers:
        - name: machine
          image: {{ include "garam.image" (dict "root" $ "name" "server") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
{{- include "garam.containerSecurityContext" . }}
          args: ["serve", "machine"]
          env:
            {{- include "garam.databaseEnv" . | nindent 12 }}
            - name: GARAM_MACHINE_ADDR
              value: ":8443"
            - name: GARAM_MACHINE_HEALTH_ADDR
              value: ":8444"
            # These four name files and carry none of their contents.
            #
            # The pair is re-read per handshake, so a replaced one is
            # served on the next connection (ADR-0040). The copy above
            # is made once, at pod start, and this chart renders nothing
            # that refreshes it — so rotation here is still a restart,
            # and whatever refreshes the copy renames over the file
            # rather than writing in place (chart README, §Key material
            # and secrets).
            - name: GARAM_MACHINE_TLS_CERT_FILE
              value: {{ printf "/run/garam/key-material/%s" (required "machine.keyMaterial.certKey is required" .Values.machine.keyMaterial.certKey) | quote }}
            - name: GARAM_MACHINE_TLS_KEY_FILE
              value: {{ printf "/run/garam/key-material/%s" (required "machine.keyMaterial.keyKey is required" .Values.machine.keyMaterial.keyKey) | quote }}
            # The root every caller garam issues a credential to pins
            # garam by, answered beside each one. It signed the pair
            # above and nothing else, it is public, and it is read once
            # at startup (ADR-0040).
            - name: GARAM_MACHINE_SERVER_ROOT_FILE
              value: {{ printf "/run/garam/key-material/%s" (required "machine.keyMaterial.serverRootKey is required" .Values.machine.keyMaterial.serverRootKey) | quote }}
            - name: GARAM_CA_KEY_FILE
              value: {{ printf "/run/garam/key-material/%s" (required "machine.keyMaterial.kekKey is required" .Values.machine.keyMaterial.kekKey) | quote }}
            - name: GARAM_AGENT_TOKEN_LIFETIME
              value: {{ required "machine.agentTokenLifetime is required" .Values.machine.agentTokenLifetime | quote }}
            - name: GARAM_INSTANCE_REGISTRATION_LIMIT
              value: {{ required "machine.instanceRegistrationLimit is required" .Values.machine.instanceRegistrationLimit | quote }}
            - name: GARAM_MACHINE_ISSUER
              value: {{ required "machine.issuer is required" .Values.machine.issuer | quote }}
{{- include "garam.machineTokenUrlEnv" . }}
{{- include "garam.identityIssuerEnv" (dict "root" $ "keyFile" $keyFile "keyFileValue" "machine.policy.signingKeyFile") }}
{{- $serviceKeys := .Values.identity.serviceKeys }}
{{- if $serviceKeys.secretName }}
{{- if not (hasSuffix "/oauth/token" .Values.machine.tokenUrl) }}
{{- fail "identity.serviceKeys.secretName is set and machine.tokenUrl does not end in /oauth/token: serve machine refuses to start holding service keys where the token URL is not the listener's token endpoint (ADR-0129)" }}
{{- end }}
            # Public keys only, read at start and again on every
            # authentication, so the volume below is mounted as a
            # directory: a Secret mounted by subPath is never updated.
            - name: GARAM_IDENTITY_SERVICE_KEYS_FILE
              value: {{ printf "/etc/garam/identity/%s" (required "identity.serviceKeys.key is required beside identity.serviceKeys.secretName" $serviceKeys.key) | quote }}
{{- end }}
{{- $policy := .Values.api.policy }}
            # Every send is the policy service's decision (ADR-0168),
            # so the listener refuses to start without it. It reaches
            # the service as the api does, by the values the api
            # takes, so the issuer the service trusts, the address and
            # the root are one value each for both callers. Only the
            # path of the signing key is its own: the file is the copy
            # this pod makes of a Secret or the one the deployment
            # writes, as the api's is in its.
            - name: GARAM_POLICY_ADDR
              value: {{ default (printf "%s:8443" (include "garam.name" (dict "root" $ "word" "policy"))) $policy.address | quote }}
            - name: GARAM_POLICY_CA_FILE
              value: {{ printf "/etc/garam/policy/%s" (required "api.policy.caKey is required" $policy.caKey) | quote }}
            - name: GARAM_POLICY_SIGNING_KEY_FILE
              value: {{ required "machine.policy.signingKeyFile is required unless machine.policy.signingKey.secretName names the Secret to copy it from: it names the file the token signing key is read from in the machine container" $keyFile | quote }}
            - name: GARAM_POLICY_TOKEN_ISSUER
              value: {{ required "api.policy.tokenIssuer is required: it is the issuer the policy service trusts" $policy.tokenIssuer | quote }}
{{- $transit := .Values.machine.transit }}
{{- if $transit.address }}
            # The message signing keys are held in Transit (ADR-0104).
            # The token file is written and renewed by what the
            # deployment runs, and re-read on every call.
            - name: GARAM_TRANSIT_ADDR
              value: {{ $transit.address | quote }}
            - name: GARAM_TRANSIT_CA_FILE
              value: {{ printf "/etc/garam/transit/%s" (required "machine.transit.caKey is required" $transit.caKey) | quote }}
            - name: GARAM_TRANSIT_TOKEN_FILE
              value: {{ required "machine.transit.tokenFile is required beside machine.transit.address: it names the file the OpenBao token is read from" $transit.tokenFile | quote }}
            - name: GARAM_TRANSIT_SIGNING_KEY
              value: {{ required "machine.transit.signingKey is required beside machine.transit.address: it names the Transit key messages are signed under" $transit.signingKey | quote }}
            - name: GARAM_TRANSIT_MOUNT
              value: {{ required "machine.transit.mount is required" $transit.mount | quote }}
{{- end }}
          ports:
            - name: mtls
              containerPort: 8443
            - name: health
              containerPort: 8444
          # The mtls listener serves no probe route, so the probes
          # answer on a plaintext listener of their own (ADR-0021).
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8444
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8444
            timeoutSeconds: 3
          volumeMounts:
{{- include "garam.ownerOnlyMount" $keyMaterial }}
{{- include "garam.ownerOnlyMount" $signing }}
            - name: policy-ca
              mountPath: /etc/garam/policy
              readOnly: true
{{- if $transit.address }}
            - name: transit-ca
              mountPath: /etc/garam/transit
              readOnly: true
{{- end }}
{{- if $serviceKeys.secretName }}
            - name: identity-service-keys
              mountPath: /etc/garam/identity
              readOnly: true
{{- end }}
          resources: {{- toYaml .Values.machine.resources | nindent 12 }}
      volumes:
        # One source per file, so material a deployment holds in more
        # than one Secret arrives in one directory: what issues the
        # pair and what holds the key-encryption key are different
        # systems, and neither is this chart's to move. Each source
        # names one key, so nothing else its Secret carries is
        # projected.
{{- include "garam.ownerOnlyVolumes" $keyMaterial }}
{{- include "garam.ownerOnlyVolumes" $signing }}
        # The root the policy service is verified against. It is public,
        # so it is projected as it is.
        - name: policy-ca
          secret:
            secretName: {{ required "api.policy.caSecretName is required: it names the Secret holding the root the policy service's certificate is verified against" $policy.caSecretName }}
            items:
              - key: {{ $policy.caKey }}
                path: {{ $policy.caKey }}
{{- if $transit.address }}
        # The root OpenBao is verified against. It is public, so it is
        # projected as it is rather than copied to an owner-only file.
        - name: transit-ca
          secret:
            secretName: {{ required "machine.transit.caSecretName is required beside machine.transit.address: it names the Secret holding the root OpenBao's certificate is verified against" $transit.caSecretName }}
            items:
              - key: {{ $transit.caKey }}
                path: {{ $transit.caKey }}
{{- end }}
{{- if $serviceKeys.secretName }}
        # The first-party services' public keys. Mounted as a directory,
        # so a change to the Secret reaches the file the process
        # re-reads without a restart.
        - name: identity-service-keys
          secret:
            secretName: {{ $serviceKeys.secretName }}
            items:
              - key: {{ $serviceKeys.key }}
                path: {{ $serviceKeys.key }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "garam.name" (dict "root" $ "word" "machine") }}
  labels:
    {{- include "garam.labels" (dict "root" $ "component" "machine") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "garam.selectorLabels" (dict "root" $ "component" "machine") | nindent 4 }}
  ports:
    - name: mtls
      port: 8443
      targetPort: mtls
    - name: health
      port: 8444
      targetPort: health
{{- include "garam.serviceAccount" (dict "root" $ "component" "machine") }}
---
{{ include "garam.podDisruptionBudget" (dict "root" $ "component" "machine") }}
