# The machine listener (ADR-0017). It terminates TLS itself and
# authenticates the client certificate per connection (ADR-0014), so
# nothing that terminates TLS may stand in front of the mtls port — see
# the chart README, §Exposure is the cluster owner's.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "garam.name" (dict "root" $ "word" "machine") }}
  labels:
    {{- include "garam.labels" (dict "root" $ "component" "machine") | nindent 4 }}
spec:
  # Fixed at one, as on every workload here: replica safety above one is
  # not established.
  replicas: 1
  # Recreate, not the default RollingUpdate: at one replica the default
  # brings the new pod up before taking the old one down, so an upgrade
  # runs two of a workload whose safety above one replica is not
  # established (docs/architecture/deployment-contract.md §Not
  # established). Terminating first holds the count `replicas` fixes
  # across an upgrade as well as at rest.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "garam.selectorLabels" (dict "root" $ "component" "machine") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "garam.selectorLabels" (dict "root" $ "component" "machine") | nindent 8 }}
    spec:
{{- include "garam.serviceAccountName" (dict "root" $ "component" "machine") }}
{{- include "garam.imagePullSecrets" . }}
      # The Secret below is projected 0440, so its group owner decides
      # who reads it. fsGroup makes that group the init container's,
      # without which the copy cannot open its source.
      #
      # runAsNonRoot is asserted here rather than left to the UIDs below:
      # the kubelet reads it as set or unset and infers it from no
      # number. Both containers set a numeric runAsUser, which is what
      # makes it admissible for an image whose USER is a name.
      securityContext:
        fsGroup: 10001
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # A projected Secret is root-owned and group-readable, and the
        # process refuses a key file it does not own or that any group or
        # other bit is set on (ADR-0015). This copies it as the same UID.
        - name: key-material
          image: {{ required "machine.copyImage is required" .Values.machine.copyImage }}
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command: ["/bin/sh", "-ec"]
          args:
            - |
              for f in {{ .Values.machine.keyMaterial.certKey }} {{ .Values.machine.keyMaterial.keyKey }} {{ .Values.machine.keyMaterial.kekKey }} {{ .Values.machine.keyMaterial.serverRootKey }}; do
                install -m 0600 "/etc/garam/key-material/$f" "/run/garam/key-material/$f"
              done
              ls -l /run/garam/key-material
          volumeMounts:
            - name: key-material-secret
              mountPath: /etc/garam/key-material
              readOnly: true
            - name: key-material
              mountPath: /run/garam/key-material
          # The machine container's figure reaches this one too. A quota
          # admits a pod only when every container carries the resource
          # it bounds and a QoS class is read across every container, and
          # the pod's effective request is the max of its init containers
          # and the sum of the rest — so the copy reserves nothing beyond
          # the figure below.
          resources: {{- toYaml .Values.machine.resources | nindent 12 }}
      containers:
        - name: machine
          image: {{ include "garam.serverImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # The UID both sides share. The image's USER only implies it,
          # and the startup check compares the file's owner against the
          # reader's UID.
          securityContext:
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          args: ["serve", "machine"]
          env:
            {{- include "garam.databaseEnv" . | nindent 12 }}
            - name: GARAM_MACHINE_ADDR
              value: ":8443"
            - name: GARAM_MACHINE_HEALTH_ADDR
              value: ":8444"
            - name: GARAM_AUTHZ_ADDR
              value: {{ printf "%s:9090" (include "garam.name" (dict "root" $ "word" "authz")) | quote }}
            # These four name files and carry none of their contents.
            #
            # The pair is re-read per handshake, so a replaced one is
            # served on the next connection (ADR-0040). The copy above
            # is made once, at pod start, and this chart renders nothing
            # that refreshes it — so rotation here is still a restart,
            # and whatever refreshes the copy renames over the file
            # rather than writing in place (chart README, §Key material
            # and secrets).
            - name: GARAM_MACHINE_TLS_CERT_FILE
              value: {{ printf "/run/garam/key-material/%s" (required "machine.keyMaterial.certKey is required" .Values.machine.keyMaterial.certKey) | quote }}
            - name: GARAM_MACHINE_TLS_KEY_FILE
              value: {{ printf "/run/garam/key-material/%s" (required "machine.keyMaterial.keyKey is required" .Values.machine.keyMaterial.keyKey) | quote }}
            # The root every identity garam issues a certificate to pins
            # garam by. It signed the pair above and nothing else, it is
            # public, and it is read once at startup (ADR-0040).
            - name: GARAM_MACHINE_SERVER_ROOT_FILE
              value: {{ printf "/run/garam/key-material/%s" (required "machine.keyMaterial.serverRootKey is required" .Values.machine.keyMaterial.serverRootKey) | quote }}
            - name: GARAM_CA_KEY_FILE
              value: {{ printf "/run/garam/key-material/%s" (required "machine.keyMaterial.kekKey is required" .Values.machine.keyMaterial.kekKey) | quote }}
            - name: GARAM_CERTIFICATE_LIFETIME
              value: {{ required "machine.certificateLifetime is required" .Values.machine.certificateLifetime | quote }}
          ports:
            - name: mtls
              containerPort: 8443
            - name: health
              containerPort: 8444
          # The mtls listener serves no probe route, so the probes
          # answer on a plaintext listener of their own (ADR-0021).
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8444
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8444
            timeoutSeconds: 3
          volumeMounts:
            - name: key-material
              mountPath: /run/garam/key-material
              readOnly: true
          resources: {{- toYaml .Values.machine.resources | nindent 12 }}
      volumes:
        - name: key-material-secret
          secret:
            secretName: {{ required "machine.keyMaterial.secretName is required: it names the Secret holding the listener's certificate and key, the root that signed them, and the key-encryption key" .Values.machine.keyMaterial.secretName }}
            defaultMode: 0440
        # Memory-backed, so the copy the process owns never reaches the
        # node's disk.
        - name: key-material
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "garam.name" (dict "root" $ "word" "machine") }}
  labels:
    {{- include "garam.labels" (dict "root" $ "component" "machine") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "garam.selectorLabels" (dict "root" $ "component" "machine") | nindent 4 }}
  ports:
    - name: mtls
      port: 8443
      targetPort: mtls
    - name: health
      port: 8444
      targetPort: health
{{- include "garam.serviceAccount" (dict "root" $ "component" "machine") }}
