# Applies pending migrations and exits. It runs before anything that
# reads the schema, as a hook rather than an ordinary manifest.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "garam.name" (dict "root" $ "word" "migrate") }}
  labels:
    {{- include "garam.labels" (dict "root" $ "component" "migrate") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    # before-hook-creation, and deliberately not hook-failed: a failed
    # run's log is the only place its error exists, and deleting the Job
    # on failure destroys it.
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "garam.selectorLabels" (dict "root" $ "component" "migrate") | nindent 8 }}
    spec:
      restartPolicy: Never
{{- include "garam.serviceAccountName" (dict "root" $ "component" "migrate") }}
{{- include "garam.imagePullSecrets" . }}
{{- include "garam.podSecurityContext" (dict "root" $ "name" "server") }}
      containers:
        - name: migrate
          image: {{ include "garam.image" (dict "root" $ "name" "server") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["migrate"]
{{- include "garam.containerSecurityContext" . }}
          env:
            {{- include "garam.databaseEnv" . | nindent 12 }}
          resources: {{- toYaml .Values.migrate.resources | nindent 12 }}
{{/*
A pre-install hook runs before the chart's ordinary resources exist, so
the Job's account is created in the same phase and at a lower weight.
An account created as an ordinary resource would not exist yet, and the
apiserver refuses a pod naming an account it cannot find.
*/}}
{{- $hook := dict "helm.sh/hook" "pre-install,pre-upgrade" "helm.sh/hook-weight" "-10" "helm.sh/hook-delete-policy" "before-hook-creation" -}}
{{- include "garam.serviceAccount" (dict "root" $ "component" "migrate" "hookAnnotations" $hook) }}
