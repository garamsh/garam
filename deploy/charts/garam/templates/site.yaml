# The Next.js site (ADR-0131): the landing page and the way in. Like the
# console it reads nothing outside itself, so both probes are one answer
# on two paths and an API outage takes no replica out of rotation
# (ADR-0023).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "garam.name" (dict "root" $ "word" "site") }}
  labels:
    {{- include "garam.labels" (dict "root" $ "component" "site") | nindent 4 }}
spec:
  # Fixed at one, as on every workload here: replica safety above one is
  # not established.
  replicas: 1
  # Recreate, not the default RollingUpdate: at one replica the default
  # brings the new pod up before taking the old one down, so an upgrade
  # runs two of a workload whose safety above one replica is not
  # established (docs/architecture/deployment-contract.md §Not
  # established). Terminating first holds the count `replicas` fixes
  # across an upgrade as well as at rest.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "garam.selectorLabels" (dict "root" $ "component" "site") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "garam.selectorLabels" (dict "root" $ "component" "site") | nindent 8 }}
    spec:
{{- include "garam.serviceAccountName" (dict "root" $ "component" "site") }}
{{- include "garam.imagePullSecrets" . }}
{{- include "garam.podSecurityContext" (dict "root" $ "name" "site") }}
      containers:
        - name: site
          image: {{ include "garam.image" (dict "root" $ "name" "site") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
{{- include "garam.containerSecurityContext" . }}
          env:
            # Baked into the image at build time as well, so this must
            # equal the value that build used.
            - name: GARAM_API_URL
              value: {{ required "site.apiUrl is required: without it every server-rendered route answers 500" .Values.site.apiUrl | quote }}
            # Where a signed-in visitor, and every address under
            # `/console`, is sent (ADR-0131).
            - name: GARAM_CONSOLE_URL
              value: {{ required "site.consoleUrl is required: without it the site has nowhere to send a person who signed in" .Values.site.consoleUrl | quote }}
          # PORT=3000 is set in the image (deploy/local/Dockerfile.web);
          # the chart does not set it, so the port below is the image's.
          ports:
            - name: http
              containerPort: 3000
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
          resources: {{- toYaml .Values.site.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "garam.name" (dict "root" $ "word" "site") }}
  labels:
    {{- include "garam.labels" (dict "root" $ "component" "site") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "garam.selectorLabels" (dict "root" $ "component" "site") | nindent 4 }}
  ports:
    - name: http
      port: 3000
      targetPort: http
{{- include "garam.serviceAccount" (dict "root" $ "component" "site") }}
