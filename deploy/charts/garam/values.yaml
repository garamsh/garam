# No value here is a secret, and none may become one. Every credential is
# named as a Secret the cluster already holds (ADR-0015).
#
# `<workload>.serviceAccount.name` is the account that workload runs as,
# taken verbatim. The chart composes none: another repository owns the
# role bound to that subject, so a name composed here would move the
# subject whenever a deployment renamed its release (ADR-0043). No name
# leaves the workload on the namespace `default`, and `create` renders
# the object under the name given and refuses the render without one.
# Annotations are how a cloud role binds to an account, and the chart
# holds none. They reach an account this chart creates, so setting them
# under `create: false` is refused: there is no object to carry them and
# a dropped annotation is a role that never arrives.
#
# Both default to off. An account nothing uses is a subject the next
# reader takes for one that was needed, and an annotated one is worse:
# it makes a consumer assume a role that does not exist, which fails at
# runtime rather than at apply.

image:
  # Both tags are required: the version a deployment runs is its own to
  # name, and a default would go on naming one release after the next
  # lands (ADR-0039). Both repositories carry a default and neither may
  # be emptied: an empty one renders `image: :<tag>`, which no registry
  # resolves and `helm lint` accepts, so the render refuses it as it
  # refuses a missing tag.
  #
  # A digest is optional and renders after the tag, never in place of
  # it, so the tag goes on naming the version and the digest decides
  # which bytes that name resolves to — see the README, §Pinning a
  # version.
  #
  # `runAsUser` and `runAsGroup` are the account the image declares,
  # written as numbers because a kubelet resolves a name to none. They
  # sit under the image rather than under a workload because the
  # account is the image's: four of the five workloads run the server
  # image, so a deployment running it under another account moves one
  # pair rather than four.
  server:
    repository: 486152169996.dkr.ecr.ap-northeast-2.amazonaws.com/garam/garam-server
    tag: ""
    digest: ""
    # `USER garam`, the uid and gid deploy/local/Dockerfile creates.
    runAsUser: 10001
    runAsGroup: 10001
  web:
    repository: 486152169996.dkr.ecr.ap-northeast-2.amazonaws.com/garam/garam-web
    tag: ""
    digest: ""
    # `USER node`, the uid and gid the node base image carries
    # (deploy/local/Dockerfile.web).
    runAsUser: 1000
    runAsGroup: 1000
  # The site (ADR-0131), built from the same Dockerfile as `web` with
  # `APP=site-web`, so it runs as the same account.
  site:
    repository: 486152169996.dkr.ecr.ap-northeast-2.amazonaws.com/garam/garam-site
    tag: ""
    digest: ""
    runAsUser: 1000
    runAsGroup: 1000
  pullPolicy: IfNotPresent
  # Secret names, never a credential. How a node obtains the one ECR
  # requires is the deployment's to decide.
  pullSecrets: []

database:
  # The Secret holding the connection string, and its key. One DSN,
  # consumed as-is.
  secretName: ""
  secretKey: uri

api:
  serviceAccount:
    name: ""
    create: false
    annotations: {}
  sessionTTL: 168h
  # Assumes a TLS-terminating proxy in front of `serve api` and the web
  # app. Without one a browser rejects the cookie over plain HTTP:
  # nothing refuses at startup, every page renders, and sign-in never
  # sticks — see the README, §Exposure is the cluster owner's.
  cookieSecure: true
  # Set all of these or none of them. Setting any one makes the rest
  # required: garam refuses to start holding one half of the credential,
  # so the render refuses first rather than installing a release whose
  # sign-in method is silently absent.
  google:
    clientId: ""
    redirectUrl: ""
    clientSecret:
      secretName: ""
      secretKey: ""
  resources: {}

authz:
  serviceAccount:
    name: ""
    create: false
    annotations: {}
  resources: {}

machine:
  serviceAccount:
    name: ""
    create: false
    annotations: {}
  # The listener's certificate and key, the garam server root that
  # signed them, and the key-encryption key: the Secret each is read
  # from and the key it is under. The chart generates none of them: a
  # regenerated key-encryption key opens no key already sealed under
  # the first (ADR-0016, ADR-0104), and one authority signs the pair and
  # nothing else (ADR-0040).
  #
  # `secretName` is where a file is read from unless that file names a
  # Secret of its own. What issues the pair and what holds the
  # key-encryption key are different systems, and one Secret carrying
  # all four is a layout rather than a requirement — see the README,
  # §Key material and secrets.
  keyMaterial:
    secretName: ""
    certKey: tls.crt
    certSecretName: ""
    keyKey: tls.key
    keySecretName: ""
    serverRootKey: server-root.pem
    serverRootSecretName: ""
    kekKey: ca-kek.hex
    kekSecretName: ""
  # How long an agent token garam mints is accepted (ADR-0100). The
  # agent's operator mints the next between two thirds and three
  # quarters of the lifetime, so a quarter of it is the margin a
  # Secret's propagation into the agent's Pod has to fit in. The binary
  # refuses the start outside twenty minutes and twenty-four hours.
  agentTokenLifetime: 1h
  # The issuer every message signature names (ADR-0101): an identity,
  # compared byte for byte, that need not resolve or be reachable.
  # Prefer a stable name the deployment owns, such as the dev cluster's
  # https://machine.dev.garam.sh, and keep it for the deployment's life.
  # An https URL with a lowercase host, no empty port, no path and no
  # trailing slash. A verifier fetches the key set from its own
  # keys-url, where it reaches this listener, and not from this value.
  # Required; the binary refuses any other shape at startup.
  issuer: ""
  # The operator exchange's token endpoint (ADR-0102): this listener's
  # /oauth/token as a caller outside the cluster names it, such as
  # https://machine.dev.garam.sh/oauth/token. It renders on both
  # `serve api` and `serve machine` from this one value. Every operator
  # assertion names it as its audience byte for byte, so keep it for the
  # deployment's life. It is not `issuer` above, the message issuer.
  # Empty renders nothing: `serve api` then issues no operator key (409
  # key_issuance_unconfigured) and `serve machine` answers the exchange
  # 503. Set, the render refuses what the binary refuses at startup: an
  # https URL with a host and no user information, query or fragment.
  # No private key passes through this value or any other here.
  tokenUrl: ""
  # Runs the copy that gives the process a file it owns. The garam image
  # is scratch and carries no shell. Pinned by digest, the reference
  # deploy/local/minikube/garam.yaml already uses.
  #
  # Nothing proposes a bump for it: Dependabot's docker and helm
  # ecosystems descend only into keys named `image` or `repository`, and
  # this is neither. No scheduled review is named for it either; naming
  # no mover of its own, it is the PM's to move under AGENTS.md §Roles.
  #
  # The container that runs it renders no `imagePullPolicy`, and
  # `image.pullPolicy` above is not it: that value names the two garam
  # images, and this reference is a digest, so which of the policies a
  # kubelet applies cannot change what runs.
  copyImage: alpine:3.24.1@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
  # Holds the message signing keys in an OpenBao or Vault Transit key
  # the deployment supplies, instead of sealing them under the
  # key-encryption key (ADR-0104). Off while `address` is empty; set,
  # the CA Secret, the token file and the key are required, and the
  # render refuses a partial setting. None of these carries a secret:
  # the token arrives as a file something the deployment runs writes
  # and renews, as the process's UID and readable by it alone — see the
  # README, §Message signing keys in OpenBao Transit.
  transit:
    # OpenBao's https base URL.
    address: ""
    # The Transit mount and the ecdsa-p256 key under it.
    mount: transit
    signingKey: ""
    # The Secret holding the PEM root OpenBao's certificate is verified
    # against, and its key.
    caSecretName: ""
    caKey: ca.crt
    # Where in the machine container the token file is read from.
    tokenFile: ""
  # Annotations on the machine pod, for whatever the deployment uses to
  # put the Transit token file there, such as OpenBao Agent's injector.
  podAnnotations: {}
  # Reaches both of this pod's containers, the copy above and the process
  # it prepares for. A quota and a QoS class are each read across every
  # container of a pod, so one figure here covers both — see the README,
  # §Values a deployment must supply.
  resources: {}

web:
  serviceAccount:
    name: ""
    create: false
    annotations: {}
  # The address the web process reaches `serve api` on, read twice: baked
  # into the image at build time as the `/api/*` rewrite target, and read
  # again at runtime by every server-side render. It must equal the value
  # that build used, and nothing here checks it — see the README, §Values
  # a deployment must supply.
  apiUrl: ""
  # Where the site is served (ADR-0131): a visitor without a session is
  # sent there to sign in. Read when a request arrives, not when the
  # image was built.
  siteUrl: ""
  resources: {}

# The landing page and the way in (ADR-0131), a Next.js app beside the
# console.
site:
  serviceAccount:
    name: ""
    create: false
    annotations: {}
  # As `web.apiUrl`: baked into the image as the `/api/*` rewrite target
  # and read again at runtime, so it must equal the value that build
  # used.
  apiUrl: ""
  # Where the console is served. Every address under `/console`, and
  # a signed-in visitor, is sent there.
  consoleUrl: ""
  # Where cowork's web app is served. A sign-in for cowork is sent
  # there. This chart deploys no cowork; the address is required
  # because the site hands a sign-in to it in every deployment.
  coworkUrl: ""
  resources: {}

migrate:
  serviceAccount:
    name: ""
    create: false
    annotations: {}
  resources: {}
