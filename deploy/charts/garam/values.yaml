# No value here is a secret, and none may become one. Every credential is
# named as a Secret the cluster already holds (ADR-0015).
#
# `<workload>.serviceAccount.name` is the account that workload runs as,
# taken verbatim. The chart composes none: another repository owns the
# role bound to that subject, so a name composed here would move the
# subject whenever a deployment renamed its release (ADR-0043). No name
# leaves the workload on the namespace `default`, and `create` renders
# the object under the name given and refuses the render without one.
# Annotations are how a cloud role binds to an account, and the chart
# holds none.
#
# Both default to off. An account nothing uses is a subject the next
# reader takes for one that was needed, and an annotated one is worse:
# it makes a consumer assume a role that does not exist, which fails at
# runtime rather than at apply.

image:
  # Both tags are required: no release exists, so no default names an
  # image that can be pulled (ADR-0039).
  server:
    repository: 486152169996.dkr.ecr.ap-northeast-2.amazonaws.com/garam/garam-server
    tag: ""
  web:
    repository: 486152169996.dkr.ecr.ap-northeast-2.amazonaws.com/garam/garam-web
    tag: ""
  pullPolicy: IfNotPresent
  # Secret names, never a credential. How a node obtains the one ECR
  # requires is the deployment's to decide.
  pullSecrets: []

database:
  # The Secret holding the connection string, and its key. One DSN,
  # consumed as-is.
  secretName: ""
  secretKey: uri

api:
  serviceAccount:
    name: ""
    create: false
    annotations: {}
  sessionTTL: 168h
  cookieSecure: true
  # Set all three or none. One Google credential without the other
  # refuses the start, which the template rejects rather than deploys.
  google:
    clientId: ""
    redirectUrl: ""
    clientSecret:
      secretName: ""
      secretKey: ""
  resources: {}

authz:
  serviceAccount:
    name: ""
    create: false
    annotations: {}
  resources: {}

machine:
  serviceAccount:
    name: ""
    create: false
    annotations: {}
  # The Secret holding the listener's certificate and key, the garam
  # server root that signed them, and the key-encryption key, and the
  # key each is under. The chart generates none of them: a regenerated
  # key-encryption key opens no certificate authority already sealed
  # (ADR-0016), and one authority signs the pair and nothing else
  # (ADR-0040).
  keyMaterial:
    secretName: ""
    certKey: tls.crt
    keyKey: tls.key
    serverRootKey: server-root.pem
    kekKey: ca-kek.hex
  # How long a certificate garam signs for an agent or an operator
  # lives. Expiry is the only revocation garam has, so this is the
  # window a stolen certificate stays usable in; the binary refuses the
  # start outside one hour and thirty days. Lowering it is safe only
  # where those identities rewrite their own files without a restart —
  # see the README, §Key material and secrets.
  certificateLifetime: 24h
  # Runs the copy that gives the process a file it owns. The garam image
  # is scratch and carries no shell. Pinned by digest, the reference
  # deploy/local/minikube/garam.yaml already uses.
  #
  # Nothing proposes a bump for it: Dependabot's docker and helm
  # ecosystems descend only into keys named `image` or `repository`, and
  # this is neither. It moves when a contributor moves it.
  copyImage: alpine:3.24.1@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
  resources: {}

web:
  serviceAccount:
    name: ""
    create: false
    annotations: {}
  # The `/api/*` rewrite target, baked into the image at build time: this
  # must equal the value that build used, and nothing here checks it.
  apiUrl: ""
  resources: {}

migrate:
  serviceAccount:
    name: ""
    create: false
    annotations: {}
  resources: {}
