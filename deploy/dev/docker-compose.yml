services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: garam
      POSTGRES_PASSWORD: garam
      POSTGRES_DB: garam
    ports:
      - "${GARAM_DB_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U garam"]
      interval: 2s
      timeout: 5s
      retries: 10
