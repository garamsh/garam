# What `make codehub-e2e` adds to docker-compose.yml, always with the
# `policy` profile and never in the default stack: garam's OIDC issuer
# (ADR-0141), the machine listener that answers codehub's token
# requests, the policy service trusting that issuer, and the delivery
# loop feeding it. tooling/codehub-e2e.sh writes the key material this
# reads, names the project, and removes both at the end.
#
# Nothing here publishes a port the default stack does, so a run can sit
# beside it: the api and the machine listener take a free port each,
# which the script asks compose for.

x-issuer: &issuer https://garam.localhost/api

services:
  # Writes what the services below read into a volume, as the account
  # they run as: the signing key and the service keys the script made
  # on the host, a key-encryption key, and the machine listener's
  # certificate. Compose starts it before either server.
  codehub-keys:
    image: alpine:3.24.4@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
    command: ["sh", "/codehub-e2e-keys.sh", "10001"]
    volumes:
      - ./codehub-e2e-keys.sh:/codehub-e2e-keys.sh:ro
      - ${CODEHUB_E2E_KEYS_DIR:?names the directory of keys the run made}:/in:ro
      - codehub-keys:/keys
    restart: "no"

  postgres:
    ports: !reset []

  authz:
    ports: !reset []

  # The delivery loop reaches the policy service over TLS, verifying its
  # certificate against the one policy-tls wrote, and signs each call
  # with the issuer's key.
  api:
    ports: !override
      - "127.0.0.1::8080"
    environment:
      GARAM_IDENTITY_ISSUER: *issuer
      GARAM_POLICY_TOKEN_ISSUER: *issuer
      GARAM_POLICY_SIGNING_KEY_FILE: /keys/signing.pem
      GARAM_IDENTITY_SERVICE_KEYS_FILE: /keys/service-keys.json
      GARAM_POLICY_ADDR: policy:8443
      GARAM_POLICY_CA_FILE: /policy-tls/tls.crt
      GARAM_MACHINE_TOKEN_URL: https://machine:8443/oauth/token
    volumes:
      - codehub-keys:/keys:ro
      - policy-tls:/policy-tls:ro
    depends_on:
      codehub-keys:
        condition: service_completed_successfully
      policy-tls:
        condition: service_completed_successfully

  # `serve machine` is not in the default stack, because key material
  # made on the host is not readable by the image's account (ADR-0017);
  # codehub-keys makes it readable here.
  machine:
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile
    command: ["serve", "machine"]
    environment:
      GARAM_DATABASE_URL: ${GARAM_DATABASE_URL:-postgres://garam:garam@postgres:5432/garam?sslmode=disable}
      GARAM_AUTHZ_ADDR: authz:9090
      GARAM_MACHINE_ADDR: ":8443"
      GARAM_MACHINE_HEALTH_ADDR: ":8444"
      GARAM_MACHINE_TLS_CERT_FILE: /keys/machine.crt
      GARAM_MACHINE_TLS_KEY_FILE: /keys/machine.key
      GARAM_MACHINE_SERVER_ROOT_FILE: /keys/machine.crt
      GARAM_CA_KEY_FILE: /keys/kek.hex
      GARAM_MACHINE_ISSUER: https://machine:8443
      GARAM_MACHINE_TOKEN_URL: https://machine:8443/oauth/token
      GARAM_IDENTITY_ISSUER: *issuer
      GARAM_POLICY_SIGNING_KEY_FILE: /keys/signing.pem
      GARAM_IDENTITY_SERVICE_KEYS_FILE: /keys/service-keys.json
    ports:
      - "127.0.0.1::8443"
    volumes:
      - codehub-keys:/keys:ro
    depends_on:
      codehub-keys:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      authz:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/garam", "probe", "http://127.0.0.1:8444/readyz"]
      interval: 2s
      timeout: 5s
      retries: 10

  # Trusts the issuer's own keys, which the script fetches from the
  # running api and writes where this reads them, so the service
  # verifies what the issuer signed rather than a key made beside it.
  # The contract's port is published for the run's HTTP calls.
  policy:
    ports:
      - "127.0.0.1::8443"
    environment:
      POLICY_TOKEN_ISSUER: *issuer
    volumes:
      - ${CODEHUB_E2E_JWKS_FILE:?names the issuer's keys the run fetched}:/etc/policy/jwks.json:ro

volumes:
  codehub-keys:
