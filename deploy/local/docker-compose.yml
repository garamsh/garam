# The whole garam stack on one machine, and also the dev/e2e Postgres:
# `make db-up` starts only the postgres and openbao services from this
# file, so both concerns share the one compose project (and its
# volume). They do not share a database — the stack owns `garam`, the
# two Go suites own `garam_test`, because `make integration`
# truncates. See README.md.
name: garam-local

services:
  postgres:
    # Digest as well as tag: the tag resolves through a mutable pointer,
    # and `17.11` names the Postgres patch, so what moves under it is the
    # Alpine rebuild. Dependabot moves the pair together.
    #
    # The `17` is not Dependabot's to move: deploy/local/minikube/postgres.yaml
    # and the dev cluster in garamsh/gitops — read there on 2026-08-26 —
    # run that same major, so a bump crossing it lands at all three sites
    # or at none.
    image: postgres:17.11-alpine3.24@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_USER: garam
      POSTGRES_PASSWORD: garam
      POSTGRES_DB: garam
    ports:
      - "${GARAM_DB_PORT:-25432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Over TCP, not the unix socket: the image runs a temporary server on
    # that socket to initialise the data directory, so a socket probe
    # reports healthy while the real server is still to start.
    # start_period covers that initialisation, which the retry budget
    # alone does not survive on a slow machine.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U garam"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 60s

  # The OpenBao the Transit provider's integration tests sign against
  # (ADR-0104), started by `make db-up` beside postgres. Dev mode: one
  # in-memory, unsealed server over TLS, whose CA and root token it
  # generates inside the container at every start, where
  # platform/tests/integration reads them. Nothing in the stack above
  # uses it.
  #
  # Digest as well as tag, the digest of the multi-platform index.
  # Dependabot's docker-compose entry moves the pair, as it does
  # postgres's.
  openbao:
    image: openbao/openbao:2.7.1@sha256:6d2b93856e3fcf7b18ad855a0b51eaba474dc8b79cf554379ea32034797d2acf
    command: ["server", "-dev", "-dev-tls", "-dev-tls-cert-dir=/openbao/file"]
    ports:
      - "${GARAM_OPENBAO_PORT:-28200}:8200"
    # The server's own status command, over the TLS it serves: healthy
    # means initialised and unsealed rather than a port open.
    healthcheck:
      test: ["CMD-SHELL", "BAO_ADDR=https://127.0.0.1:8200 BAO_CACERT=/openbao/file/vault-ca.pem bao status >/dev/null"]
      interval: 2s
      timeout: 5s
      retries: 15

  # The object store cowork's artifacts are kept in (ADR-0127 §2),
  # over the S3 API. `make db-up` starts it for the integration suite;
  # its keys are this stack's alone, never a deployment's.
  rustfs:
    image: rustfs/rustfs:1.0.4@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2
    environment:
      RUSTFS_ACCESS_KEY: cowork
      RUSTFS_SECRET_KEY: cowork-local-secret
      RUSTFS_VOLUMES: /data
    ports:
      - "${COWORK_S3_PORT:-29000}:9000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health >/dev/null"]
      interval: 2s
      timeout: 5s
      retries: 15

  # One-shot: applies pending migrations and exits. The servers wait for
  # it to succeed.
  migrate:
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile
    command: ["migrate"]
    environment:
      GARAM_DATABASE_URL: ${GARAM_DATABASE_URL:-postgres://garam:garam@postgres:5432/garam?sslmode=disable}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  authz:
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile
    command: ["serve", "authz"]
    environment:
      GARAM_DATABASE_URL: ${GARAM_DATABASE_URL:-postgres://garam:garam@postgres:5432/garam?sslmode=disable}
      GARAM_GRPC_ADDR: ":9090"
      # The engine speaks gRPC only, so /metrics and the probes get a
      # listener and a published port of its own; the api's ride on its
      # HTTP port.
      GARAM_METRICS_ADDR: ":9091"
    ports:
      - "${GARAM_LOCAL_METRICS_PORT:-9091}:9091"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # /readyz, so healthy means the engine can answer rather than that a
    # port is open. It starts answering once the gRPC port is bound.
    # The image carries no shell or wget, so the check runs the binary's
    # own probe subcommand.
    healthcheck:
      test: ["CMD", "/usr/local/bin/garam", "probe", "http://127.0.0.1:9091/readyz"]
      interval: 2s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile
    command: ["serve", "api"]
    environment:
      GARAM_DATABASE_URL: ${GARAM_DATABASE_URL:-postgres://garam:garam@postgres:5432/garam?sslmode=disable}
      GARAM_HTTP_ADDR: ":8080"
      GARAM_AUTHZ_ADDR: authz:9090
      # Plain HTTP locally, so the session cookie cannot be Secure.
      GARAM_COOKIE_SECURE: "false"
      # The site and the console are two hosts under one parent
      # (ADR-0131), and a session signed in on one reaches the other
      # only through a cookie scoped to that parent. `localhost` has no
      # subdomains to share one with, so the local hosts are
      # garam.localhost and console.garam.localhost, which a browser
      # resolves to this machine.
      GARAM_COOKIE_DOMAIN: ${GARAM_COOKIE_DOMAIN:-garam.localhost}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Sign-in is the site's, so Google returns the browser there.
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-http://garam.localhost:3001/api/auth/callback/google}
      # Lets the local stack issue operator keys (ADR-0102), which the
      # console's key setup and its e2e need. Nothing exchanges them
      # locally: the stack runs no machine listener, so the URL is only
      # the audience an issued key's assertions would name.
      GARAM_MACHINE_TOKEN_URL: ${GARAM_MACHINE_TOKEN_URL:-https://machine.garam.localhost/oauth/token}
    ports:
      - "${GARAM_LOCAL_API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      authz:
        condition: service_healthy
    # /readyz covers the database and the engine channel both, so `web`
    # waits for an api that can serve a request rather than one that has
    # bound its port. The probe is the binary's own subcommand, as for
    # authz: the image carries no shell or wget.
    healthcheck:
      test: ["CMD", "/usr/local/bin/garam", "probe", "http://127.0.0.1:8080/readyz"]
      interval: 2s
      timeout: 5s
      retries: 10

  # Opt-in: `docker compose --profile web up`, which starts the console
  # at console.garam.localhost:3000 and the site at garam.localhost:3001.
  # The browser reaches the backend through each one's same-origin
  # `/api/*` rewrite.
  web:
    profiles: ["web"]
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile.web
      args:
        APP: console
        GARAM_API_URL: http://api:8080
    environment:
      GARAM_API_URL: http://api:8080
      GARAM_SITE_URL: ${GARAM_SITE_URL:-http://garam.localhost:3001}
    ports:
      - "${GARAM_LOCAL_WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    # /readyz, as the other two services use, so every service in the
    # stack reports health the same way. Here it reads nothing outside
    # the process (ADR-0023), so an api outage leaves this healthy.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/readyz"]
      interval: 2s
      timeout: 5s
      retries: 10

  site:
    profiles: ["web"]
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile.web
      args:
        APP: site
        GARAM_API_URL: http://api:8080
    environment:
      GARAM_API_URL: http://api:8080
      GARAM_CONSOLE_URL: ${GARAM_CONSOLE_URL:-http://console.garam.localhost:3000}
    ports:
      - "${GARAM_LOCAL_SITE_PORT:-3001}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/readyz"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
