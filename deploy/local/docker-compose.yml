# The whole garam stack on one machine, and also the dev/e2e Postgres:
# `make db-up` starts only the postgres and openbao services from this
# file, so both concerns share the one compose project (and its
# volume). They do not share a database — the stack owns `garam`, the
# two Go suites own `garam_test`, because `make integration`
# truncates. See README.md.
name: garam-local

services:
  postgres:
    # Digest as well as tag: the tag resolves through a mutable pointer,
    # and `17.11` names the Postgres patch, so what moves under it is the
    # Alpine rebuild. Dependabot moves the pair together.
    #
    # The `17` is not Dependabot's to move: deploy/local/minikube/postgres.yaml
    # and the dev cluster in garamsh/gitops — read there on 2026-08-26 —
    # run that same major, so a bump crossing it lands at all three sites
    # or at none.
    image: postgres:17.11-alpine3.24@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_USER: garam
      POSTGRES_PASSWORD: garam
      POSTGRES_DB: garam
    ports:
      - "${GARAM_DB_PORT:-25432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Over TCP, not the unix socket: the image runs a temporary server on
    # that socket to initialise the data directory, so a socket probe
    # reports healthy while the real server is still to start.
    # start_period covers that initialisation, which the retry budget
    # alone does not survive on a slow machine.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U garam"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 60s

  # The OpenBao the Transit provider's integration tests sign against
  # (ADR-0104), started by `make db-up` beside postgres. Dev mode: one
  # in-memory, unsealed server over TLS, whose CA and root token it
  # generates inside the container at every start, where
  # platform/tests/integration reads them. Nothing in the stack above
  # uses it.
  #
  # Digest as well as tag, the digest of the multi-platform index.
  # Dependabot's docker-compose entry moves the pair, as it does
  # postgres's.
  openbao:
    image: openbao/openbao:2.7.2@sha256:5046911075e137e154ce49ab051502f4ec7cf367d484ae4a4dce665d9b90561f
    command: ["server", "-dev", "-dev-tls", "-dev-tls-cert-dir=/openbao/file"]
    ports:
      - "${GARAM_OPENBAO_PORT:-28200}:8200"
    # The server's own status command, over the TLS it serves: healthy
    # means initialised and unsealed rather than a port open.
    healthcheck:
      test: ["CMD-SHELL", "BAO_ADDR=https://127.0.0.1:8200 BAO_CACERT=/openbao/file/vault-ca.pem bao status >/dev/null"]
      interval: 2s
      timeout: 5s
      retries: 15

  # The object store cowork's artifacts are kept in (ADR-0127 §2),
  # over the S3 API. `make db-up` starts it for the integration suite;
  # its keys are this stack's alone, never a deployment's.
  rustfs:
    image: rustfs/rustfs:1.0.4@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2
    environment:
      RUSTFS_ACCESS_KEY: cowork
      RUSTFS_SECRET_KEY: cowork-local-secret
      RUSTFS_VOLUMES: /data
    ports:
      - "${COWORK_S3_PORT:-29000}:9000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health >/dev/null"]
      interval: 2s
      timeout: 5s
      retries: 15

  # One-shot: applies pending migrations and exits. The servers wait for
  # it to succeed.
  migrate:
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile
    command: ["migrate"]
    environment:
      GARAM_DATABASE_URL: ${GARAM_DATABASE_URL:-postgres://garam:garam@postgres:5432/garam?sslmode=disable}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  authz:
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile
    command: ["serve", "authz"]
    environment:
      GARAM_DATABASE_URL: ${GARAM_DATABASE_URL:-postgres://garam:garam@postgres:5432/garam?sslmode=disable}
      GARAM_GRPC_ADDR: ":9090"
      # The engine speaks gRPC only, so /metrics and the probes get a
      # listener and a published port of its own; the api's ride on its
      # HTTP port.
      GARAM_METRICS_ADDR: ":9091"
    ports:
      - "${GARAM_LOCAL_METRICS_PORT:-9091}:9091"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # /readyz, so healthy means the engine can answer rather than that a
    # port is open. It starts answering once the gRPC port is bound.
    # The image carries no shell or wget, so the check runs the binary's
    # own probe subcommand.
    healthcheck:
      test: ["CMD", "/usr/local/bin/garam", "probe", "http://127.0.0.1:9091/readyz"]
      interval: 2s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile
    command: ["serve", "api"]
    environment:
      GARAM_DATABASE_URL: ${GARAM_DATABASE_URL:-postgres://garam:garam@postgres:5432/garam?sslmode=disable}
      GARAM_HTTP_ADDR: ":8080"
      GARAM_AUTHZ_ADDR: authz:9090
      # Plain HTTP locally, so the session cookie cannot be Secure.
      GARAM_COOKIE_SECURE: "false"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Sign-in is the site's, so Google returns the browser there.
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-http://garam.localhost:3001/api/auth/callback/google}
      # Lets the local stack issue operator keys (ADR-0102), which the
      # console's key setup and its e2e need. Nothing exchanges them
      # locally: the stack runs no machine listener, so the URL is only
      # the audience an issued key's assertions would name.
      GARAM_MACHINE_TOKEN_URL: ${GARAM_MACHINE_TOKEN_URL:-https://machine.garam.localhost/oauth/token}
    ports:
      - "${GARAM_LOCAL_API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      authz:
        condition: service_healthy
    # /readyz covers the database and the engine channel both, so `web`
    # waits for an api that can serve a request rather than one that has
    # bound its port. The probe is the binary's own subcommand, as for
    # authz: the image carries no shell or wget.
    healthcheck:
      test: ["CMD", "/usr/local/bin/garam", "probe", "http://127.0.0.1:8080/readyz"]
      interval: 2s
      timeout: 5s
      retries: 10

  # Opt-in: `docker compose --profile web up`, which starts the
  # console at console.garam.localhost:3000 and the site at
  # garam.localhost:3001.
  # Each holds a host-only session the site hands it (ADR-0131), and a
  # cookie names a host and not a port, so the two are two hosts and
  # not two ports of localhost; a browser resolves both to this machine.
  # The browser reaches the backend through each one's same-origin
  # `/api/*` rewrite.
  web:
    profiles: ["web"]
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile.web
      args:
        APP: platform-web
        GARAM_API_URL: http://api:8080
    environment:
      GARAM_API_URL: http://api:8080
      GARAM_SITE_URL: ${GARAM_SITE_URL:-http://garam.localhost:3001}
    ports:
      - "${GARAM_LOCAL_WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    # /readyz, as the other two services use, so every service in the
    # stack reports health the same way. Here it reads nothing outside
    # the process (ADR-0023), so an api outage leaves this healthy.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/readyz"]
      interval: 2s
      timeout: 5s
      retries: 10

  site:
    profiles: ["web"]
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile.web
      args:
        APP: site-web
        GARAM_API_URL: http://api:8080
    environment:
      GARAM_API_URL: http://api:8080
      GARAM_CONSOLE_URL: ${GARAM_CONSOLE_URL:-http://console.garam.localhost:3000}
      GARAM_COWORK_URL: ${GARAM_COWORK_URL:-http://cowork.garam.localhost:3100}
    ports:
      - "${GARAM_LOCAL_SITE_PORT:-3001}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/readyz"]
      interval: 2s
      timeout: 5s
      retries: 10

  # Opt-in: `docker compose --profile web --profile cowork up`, which
  # starts cowork and its web app against the platform above, behind
  # cowork-gateway at cowork.garam.localhost:3100. A person signs in on
  # the site, which the `web` profile starts, and is handed a session of
  # that host's own (ADR-0135).
  #
  # cowork owns its database (ADR-0125), `cowork` on the one server.
  # Postgres has no CREATE DATABASE IF NOT EXISTS, so this one-shot asks
  # first; output and exit status are read apart, as `make db-up` reads
  # them (#344). It runs the postgres service's image, which Dependabot
  # moves with that one.
  cowork-db:
    profiles: ["cowork"]
    image: postgres:17.11-alpine3.24@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      PGHOST: postgres
      PGUSER: garam
      PGPASSWORD: garam
    entrypoint:
      - sh
      - -c
      - >-
        present=$$(psql -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='cowork'") || exit 1;
        test -n "$$present" || createdb cowork
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  cowork-migrate:
    profiles: ["cowork"]
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile.cowork
    command: ["migrate"]
    environment:
      COWORK_DATABASE_URL: postgres://garam:garam@postgres:5432/cowork?sslmode=disable
    depends_on:
      cowork-db:
        condition: service_completed_successfully
    restart: "no"

  # Artifacts go to the rustfs above, in a bucket serve creates where it
  # is missing, and HTML artifacts are viewed from a user-content origin
  # of their own on localhost:8092 (ADR-0127 §8). The API is published
  # only through cowork-gateway, as a deployment serves it. The signing
  # key, like
  # rustfs's keys, is this stack's alone and signs nothing a deployment
  # trusts.
  cowork:
    profiles: ["cowork"]
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile.cowork
    command: ["serve"]
    environment:
      COWORK_DATABASE_URL: postgres://garam:garam@postgres:5432/cowork?sslmode=disable
      COWORK_PLATFORM_URL: http://api:8080
      COWORK_LISTEN_ADDR: ":8090"
      COWORK_WEB_ORIGINS: cowork.garam.localhost:${COWORK_LOCAL_WEB_PORT:-3100}
      COWORK_BLOB_STORE: s3
      COWORK_S3_ENDPOINT: http://rustfs:9000
      COWORK_S3_BUCKET: cowork
      COWORK_S3_PATH_STYLE: "true"
      COWORK_S3_CREATE_BUCKET: "true"
      COWORK_S3_ACCESS_KEY: cowork
      COWORK_S3_SECRET_KEY: cowork-local-secret
      COWORK_USERCONTENT_ORIGIN: http://localhost:${COWORK_LOCAL_USERCONTENT_PORT:-8092}
      COWORK_USERCONTENT_ADDR: ":8092"
      COWORK_USERCONTENT_SECRET: local-stack-only-usercontent-signing-key
    ports:
      - "${COWORK_LOCAL_USERCONTENT_PORT:-8092}:8092"
    depends_on:
      cowork-migrate:
        condition: service_completed_successfully
      rustfs:
        condition: service_healthy
      api:
        condition: service_healthy
    # /readyz, which answers while the database does. The image is
    # scratch, so the check runs the binary's own probe subcommand.
    healthcheck:
      test: ["CMD", "/usr/local/bin/cowork", "probe", "http://127.0.0.1:8090/readyz"]
      interval: 2s
      timeout: 5s
      retries: 10

  # The policy service keeps a database of its own on the one Postgres
  # (ADR-0130), created as cowork-db creates cowork's. Nothing calls the
  # service yet.
  policy-db:
    profiles: ["policy"]
    image: postgres:17.11-alpine3.24@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      PGHOST: postgres
      PGUSER: garam
      PGPASSWORD: garam
    entrypoint:
      - sh
      - -c
      - >-
        present=$$(psql -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='policy'") || exit 1;
        test -n "$$present" || createdb policy
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  policy-migrate:
    profiles: ["policy"]
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile.policy
    command: ["migrate"]
    environment:
      POLICY_DATABASE_URL: postgres://garam:garam@postgres:5432/policy?sslmode=disable
    depends_on:
      policy-db:
        condition: service_completed_successfully
    restart: "no"

  # policy serves no plaintext, here as anywhere: this one-shot writes
  # it a certificate only this stack trusts, a new one at each start,
  # owned by the account the image runs as.
  policy-tls:
    profiles: ["policy"]
    image: alpine:3.24.1@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
    command: ["sh", "/policy-tls.sh", "policy", "10001"]
    volumes:
      - ./policy-tls.sh:/policy-tls.sh:ro
      - policy-tls:/tls
    restart: "no"

  # policy-jwks.json holds a public key whose private half was never
  # kept, so no token verifies here until the platform's issuer lands
  # (ADR-0138). The contract's port is published to nothing.
  policy:
    profiles: ["policy"]
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile.policy
    command: ["serve"]
    environment:
      POLICY_ADDR: 0.0.0.0:8443
      POLICY_HEALTH_ADDR: 0.0.0.0:8091
      POLICY_DATABASE_URL: postgres://garam:garam@postgres:5432/policy?sslmode=disable
      POLICY_TOKEN_ISSUER: https://garam.localhost
      POLICY_JWKS_FILE: /etc/policy/jwks.json
      POLICY_TLS_CERT_FILE: /etc/policy/tls/tls.crt
      POLICY_TLS_KEY_FILE: /etc/policy/tls/tls.key
    volumes:
      - ./policy-jwks.json:/etc/policy/jwks.json:ro
      - policy-tls:/etc/policy/tls:ro
    depends_on:
      policy-migrate:
        condition: service_completed_successfully
      policy-tls:
        condition: service_completed_successfully
    # /readyz, which answers while the database does. The image is
    # scratch, so the check runs the binary's own probe subcommand.
    healthcheck:
      test: ["CMD", "/usr/local/bin/policy", "probe", "http://127.0.0.1:8091/readyz"]
      interval: 2s
      timeout: 5s
      retries: 10

  # cowork-web reads every address at runtime; nothing is baked. Its
  # server reaches cowork and the api inside the network, and the
  # browser reaches cowork's sync WebSocket through cowork-gateway, on
  # the host its session cookie names.
  cowork-web:
    profiles: ["cowork"]
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile.web
      args:
        APP: cowork-web
    environment:
      COWORK_API_URL: http://cowork:8090
      COWORK_SYNC_URL: ws://cowork.garam.localhost:${COWORK_LOCAL_WEB_PORT:-3100}/api
      GARAM_API_URL: http://api:8080
      GARAM_SITE_URL: ${GARAM_SITE_URL:-http://garam.localhost:3001}
    depends_on:
      cowork:
        condition: service_healthy
    # /readyz, as the other apps use. It reads nothing outside the
    # process (ADR-0023).
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/readyz"]
      interval: 2s
      timeout: 5s
      retries: 10

  # cowork's one host, split by path as a deployment's gateway splits it
  # (cowork-gateway.Caddyfile, ADR-0135). Digest as well as tag, the
  # digest of the multi-platform index, pulled from Google's mirror for
  # the reason deploy/local/Dockerfile states.
  cowork-gateway:
    profiles: ["cowork"]
    image: mirror.gcr.io/library/caddy:2.11.7-alpine@sha256:e70b164da81ef698b3ad19af799ea6086ce6d9e48ed4079eb9fe26f6fbf14ee5
    volumes:
      - ./cowork-gateway.Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "${COWORK_LOCAL_WEB_PORT:-3100}:8080"
    depends_on:
      cowork-web:
        condition: service_healthy
    # Through the split, so healthy means the route to the app works.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/readyz"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  policy-tls:
