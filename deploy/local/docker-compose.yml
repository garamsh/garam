# The whole garam stack on one machine, and also the dev/e2e Postgres:
# `make db-up` starts only the postgres service from this file, so both
# concerns share the one compose project (and its volume).
name: garam-local

services:
  postgres:
    image: postgres:17.10-alpine3.24
    environment:
      POSTGRES_USER: garam
      POSTGRES_PASSWORD: garam
      POSTGRES_DB: garam
    ports:
      - "${GARAM_DB_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U garam"]
      interval: 2s
      timeout: 5s
      retries: 10

  # One-shot: applies pending migrations and exits. The servers wait for
  # it to succeed.
  migrate:
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile
    command: ["migrate"]
    environment:
      GARAM_DATABASE_URL: ${GARAM_DATABASE_URL:-postgres://garam:garam@postgres:5432/garam?sslmode=disable}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  authz:
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile
    command: ["serve", "authz"]
    environment:
      GARAM_DATABASE_URL: ${GARAM_DATABASE_URL:-postgres://garam:garam@postgres:5432/garam?sslmode=disable}
      GARAM_GRPC_ADDR: ":9090"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # The engine serves gRPC without the health service, so readiness is
    # a TCP connect.
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9090"]
      interval: 2s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile
    command: ["serve", "api"]
    environment:
      GARAM_DATABASE_URL: ${GARAM_DATABASE_URL:-postgres://garam:garam@postgres:5432/garam?sslmode=disable}
      GARAM_HTTP_ADDR: ":8080"
      GARAM_AUTHZ_ADDR: authz:9090
      # Plain HTTP locally, so the session cookie cannot be Secure.
      GARAM_COOKIE_SECURE: "false"
      # Opt-in one-click local sign-in (ADR-0010).
      GARAM_DEV_AUTH: ${GARAM_DEV_AUTH:-false}
      GARAM_DEV_REDIRECT_URL: ${GARAM_DEV_REDIRECT_URL:-http://localhost:3000/api/auth/callback/dev}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-http://localhost:3000/api/auth/callback/google}
    ports:
      - "${GARAM_LOCAL_API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      authz:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8080"]
      interval: 2s
      timeout: 5s
      retries: 10

  # Opt-in: `docker compose --profile web up`. The browser reaches the
  # backend through this service's same-origin `/api/*` rewrite.
  web:
    profiles: ["web"]
    build:
      context: ../../web
      dockerfile: ../deploy/local/Dockerfile.web
      args:
        GARAM_API_URL: http://api:8080
    environment:
      GARAM_API_URL: http://api:8080
    ports:
      - "${GARAM_LOCAL_WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
