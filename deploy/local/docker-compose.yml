# The whole garam stack on one machine, and also the dev/e2e Postgres:
# `make db-up` starts only the postgres service from this file, so both
# concerns share the one compose project (and its volume). They do not
# share a database — the stack owns `garam`, the two Go suites own
# `garam_test`, because `make integration` truncates. See README.md.
name: garam-local

services:
  postgres:
    # Digest as well as tag: the tag resolves through a mutable pointer,
    # and `17.11` names the Postgres patch, so what moves under it is the
    # Alpine rebuild. Dependabot moves the pair together.
    #
    # The `17` is not Dependabot's to move: deploy/local/minikube/postgres.yaml
    # and the dev cluster in garamsh/gitops — read there on 2026-08-26 —
    # run that same major, so a bump crossing it lands at all three sites
    # or at none.
    image: postgres:17.11-alpine3.24@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_USER: garam
      POSTGRES_PASSWORD: garam
      POSTGRES_DB: garam
    ports:
      - "${GARAM_DB_PORT:-25432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Over TCP, not the unix socket: the image runs a temporary server on
    # that socket to initialise the data directory, so a socket probe
    # reports healthy while the real server is still to start.
    # start_period covers that initialisation, which the retry budget
    # alone does not survive on a slow machine.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U garam"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 60s

  # One-shot: applies pending migrations and exits. The servers wait for
  # it to succeed.
  migrate:
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile
    command: ["migrate"]
    environment:
      GARAM_DATABASE_URL: ${GARAM_DATABASE_URL:-postgres://garam:garam@postgres:5432/garam?sslmode=disable}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  authz:
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile
    command: ["serve", "authz"]
    environment:
      GARAM_DATABASE_URL: ${GARAM_DATABASE_URL:-postgres://garam:garam@postgres:5432/garam?sslmode=disable}
      GARAM_GRPC_ADDR: ":9090"
      # The engine speaks gRPC only, so /metrics and the probes get a
      # listener and a published port of its own; the api's ride on its
      # HTTP port.
      GARAM_METRICS_ADDR: ":9091"
    ports:
      - "${GARAM_LOCAL_METRICS_PORT:-9091}:9091"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # /readyz, so healthy means the engine can answer rather than that a
    # port is open. It starts answering once the gRPC port is bound.
    # The image carries no shell or wget, so the check runs the binary's
    # own probe subcommand.
    healthcheck:
      test: ["CMD", "/usr/local/bin/garam", "probe", "http://127.0.0.1:9091/readyz"]
      interval: 2s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile
    command: ["serve", "api"]
    environment:
      GARAM_DATABASE_URL: ${GARAM_DATABASE_URL:-postgres://garam:garam@postgres:5432/garam?sslmode=disable}
      GARAM_HTTP_ADDR: ":8080"
      GARAM_AUTHZ_ADDR: authz:9090
      # Plain HTTP locally, so the session cookie cannot be Secure.
      GARAM_COOKIE_SECURE: "false"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-http://localhost:3000/api/auth/callback/google}
      # Lets the local stack issue operator keys (ADR-0102), which the
      # console's key setup and its e2e need. No local listener exchanges
      # them: the stack runs no machine listener, so the URL is only the
      # audience an issued key's assertions would name.
      GARAM_MACHINE_TOKEN_URL: ${GARAM_MACHINE_TOKEN_URL:-https://machine.garam.localhost/oauth/token}
    ports:
      - "${GARAM_LOCAL_API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      authz:
        condition: service_healthy
    # /readyz covers the database and the engine channel both, so `web`
    # waits for an api that can serve a request rather than one that has
    # bound its port. The probe is the binary's own subcommand, as for
    # authz: the image carries no shell or wget.
    healthcheck:
      test: ["CMD", "/usr/local/bin/garam", "probe", "http://127.0.0.1:8080/readyz"]
      interval: 2s
      timeout: 5s
      retries: 10

  # Opt-in: `docker compose --profile web up`. The browser reaches the
  # backend through this service's same-origin `/api/*` rewrite.
  web:
    profiles: ["web"]
    build:
      context: ../../web
      dockerfile: ../deploy/local/Dockerfile.web
      args:
        GARAM_API_URL: http://api:8080
    environment:
      GARAM_API_URL: http://api:8080
    ports:
      - "${GARAM_LOCAL_WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    # /readyz, as the other two services use, so every service in the
    # stack reports health the same way. Here it reads nothing outside
    # the process (ADR-0023), so an api outage leaves this healthy.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/readyz"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
