# The three serve processes of ADR-0017 and the web application, as one
# local Kubernetes deployment. Local only: no ingress, no DNS, no
# certificate any authority issued, and images that exist nowhere but
# this machine's cluster. What reconciles a real cluster is not this
# (ADR-0020).
#
# `/healthz` and `/readyz` on the ports below are the interface ADR-0021
# publishes. A repository this one does not control probes them, so they
# are not free to move here.
#
# GARAM_IMAGE_ID, GARAM_WEB_IMAGE_ID and GARAM_POLICY_IMAGE_ID are
# replaced by `make minikube-apps` with the ids the cluster's daemon
# holds for the three tags below. Applying this file by hand replaces
# those ids in the cluster with the placeholders: every pod rolls onto
# whatever the tags point at now, and the annotation names a placeholder
# rather than the image that is running, until the next
# `make -C deploy/local minikube-apps`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authz
  namespace: garam-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authz
  template:
    metadata:
      labels:
        app: authz
      annotations:
        image-id: "GARAM_IMAGE_ID"
    spec:
      containers:
        - name: authz
          image: garam:local
          imagePullPolicy: Never
          args: ["serve", "authz"]
          env:
            - name: GARAM_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-app
                  key: uri
            - name: GARAM_GRPC_ADDR
              value: ":9090"
            # The engine speaks gRPC only, so the probes and /metrics
            # share a listener of their own.
            - name: GARAM_METRICS_ADDR
              value: ":9091"
          ports:
            - name: grpc
              containerPort: 9090
            - name: health
              containerPort: 9091
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9091
          # The readiness handler bounds one answer at 2s, so a probe
          # timing out at the default 1s reports its own deadline where
          # the process would have named the dependency that failed.
          readinessProbe:
            httpGet:
              path: /readyz
              port: 9091
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: authz
  namespace: garam-local
spec:
  selector:
    app: authz
  ports:
    - name: grpc
      port: 9090
      targetPort: grpc
    - name: health
      port: 9091
      targetPort: health
---
# The policy service (ADR-0130), which the api feeds and the machine
# listener asks. It serves no plaintext, so the certificate in its
# Secret is what the other two verify it by. Its image is built by the
# same bring-up from deploy/local/Dockerfile.policy, and its id is
# stamped in as the other images' are.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: policy
  namespace: garam-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: policy
  template:
    metadata:
      labels:
        app: policy
      annotations:
        image-id: "GARAM_POLICY_IMAGE_ID"
    spec:
      # As on the machine pod below: the Secret is projected 0440, and
      # fsGroup lets the init container read it.
      securityContext:
        fsGroup: 10001
      initContainers:
        # The service refuses a TLS key another account can read, which
        # a Secret volume's file is. The copy is made as the UID the
        # image runs as, with the pins the machine pod's init container
        # explains. It copies the JWKS and never the signing key, so
        # the serving container holds neither a Secret nor the key the
        # callers sign with.
        - name: key-material
          image: alpine:3.24.1@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
          command: ["/bin/sh", "-ec"]
          args:
            - |
              for f in tls.crt tls.key jwks.json; do
                install -m 0600 "/etc/garam/policy-throwaway/$f" "/etc/policy/$f"
              done
          volumeMounts:
            - name: policy-throwaway-secret
              mountPath: /etc/garam/policy-throwaway
              readOnly: true
            - name: policy-material
              mountPath: /etc/policy
      containers:
        - name: policy
          image: policy:local
          imagePullPolicy: Never
          securityContext:
            runAsUser: 10001
          args: ["serve"]
          env:
            - name: PGHOST
              valueFrom:
                secretKeyRef:
                  name: postgres-app
                  key: host
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: postgres-app
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-app
                  key: password
            - name: POLICY_DATABASE_URL
              value: postgres://$(PGUSER):$(PGPASSWORD)@$(PGHOST):5432/policy
            - name: POLICY_ADDR
              value: 0.0.0.0:8443
            # The probes get a listener of their own, as the machine
            # listener's do.
            - name: POLICY_HEALTH_ADDR
              value: 0.0.0.0:8091
            # The issuer the api and the machine listener name.
            - name: POLICY_TOKEN_ISSUER
              value: https://garam.localhost/api
            - name: POLICY_JWKS_FILE
              value: /etc/policy/jwks.json
            - name: POLICY_TLS_CERT_FILE
              value: /etc/policy/tls.crt
            - name: POLICY_TLS_KEY_FILE
              value: /etc/policy/tls.key
          ports:
            - name: grpc
              containerPort: 8443
            - name: health
              containerPort: 8091
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8091
          # /readyz answers while the database does.
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8091
            timeoutSeconds: 3
          volumeMounts:
            - name: policy-material
              mountPath: /etc/policy
              readOnly: true
      volumes:
        # Generated by `deploy/local/minikube/policy-key-material.sh`;
        # the api and machine pods mount the same Secret, each only the
        # files it copies.
        - name: policy-throwaway-secret
          secret:
            secretName: policy-throwaway-key-material
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
              - key: jwks.json
                path: jwks.json
            defaultMode: 0440
        # Memory-backed, so the copy the process owns never reaches the
        # node's disk.
        - name: policy-material
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
---
apiVersion: v1
kind: Service
metadata:
  name: policy
  namespace: garam-local
spec:
  selector:
    app: policy
  ports:
    - name: grpc
      port: 8443
      targetPort: grpc
    - name: health
      port: 8091
      targetPort: health
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: garam-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
      annotations:
        image-id: "GARAM_IMAGE_ID"
    spec:
      # As on the machine pod below: the Secret is projected 0440, and
      # fsGroup lets the init container read it.
      securityContext:
        fsGroup: 10001
      initContainers:
        # The signing key is checked at startup for being owned by the
        # process and readable by nobody else, which a Secret volume's
        # root-owned file is not. The copy is made as the UID the
        # api runs as, with the pins the machine pod's init container
        # explains, and the certificate travels with it so the serving
        # container mounts no Secret.
        - name: policy-key-material
          image: alpine:3.24.1@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
          command: ["/bin/sh", "-ec"]
          args:
            - |
              for f in tls.crt signing.pem; do
                install -m 0600 "/etc/garam/policy-throwaway/$f" "/run/garam/policy/$f"
              done
          volumeMounts:
            - name: policy-throwaway-secret
              mountPath: /etc/garam/policy-throwaway
              readOnly: true
            - name: policy-material
              mountPath: /run/garam/policy
      containers:
        - name: api
          image: garam:local
          imagePullPolicy: Never
          securityContext:
            runAsUser: 10001
          args: ["serve", "api"]
          env:
            - name: GARAM_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-app
                  key: uri
            - name: GARAM_HTTP_ADDR
              value: ":8080"
            - name: GARAM_AUTHZ_ADDR
              value: "authz:9090"
            # The policy service the feed delivers to (ADR-0140),
            # verified against its own certificate and called with a
            # token signed by the key beside it. The issuer is one
            # string for the three that name it: the api and the
            # machine listener serve it and the policy service trusts
            # it, and each refuses to start on a different one. The
            # machine listener's own issuer below is another name.
            - name: GARAM_POLICY_ADDR
              value: "policy:8443"
            - name: GARAM_POLICY_CA_FILE
              value: /run/garam/policy/tls.crt
            - name: GARAM_POLICY_SIGNING_KEY_FILE
              value: /run/garam/policy/signing.pem
            - name: GARAM_POLICY_TOKEN_ISSUER
              value: https://garam.localhost/api
            - name: GARAM_IDENTITY_ISSUER
              value: https://garam.localhost/api
            # Nothing here is reached over TLS, so the session cookie
            # cannot be Secure.
            - name: GARAM_COOKIE_SECURE
              value: "false"
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            timeoutSeconds: 3
          volumeMounts:
            - name: policy-material
              mountPath: /run/garam/policy
              readOnly: true
      volumes:
        # Generated by `deploy/local/minikube/policy-key-material.sh`
        # and worth nothing off this machine, as the machine pod's
        # Secret is.
        - name: policy-throwaway-secret
          secret:
            secretName: policy-throwaway-key-material
            items:
              - key: tls.crt
                path: tls.crt
              - key: signing.pem
                path: signing.pem
            defaultMode: 0440
        # Memory-backed, so the copy the process owns never reaches the
        # node's disk.
        - name: policy-material
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: garam-local
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: machine
  namespace: garam-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: machine
  template:
    metadata:
      labels:
        app: machine
      annotations:
        image-id: "GARAM_IMAGE_ID"
    spec:
      # The Secret below is projected 0440, so its group owner decides
      # who reads it. fsGroup makes that group the init container's,
      # without which the copy cannot open its source.
      securityContext:
        fsGroup: 10001
      initContainers:
        # The Secret arrives root-owned and group-readable. This copies
        # it as the same UID `serve machine` runs as, so what the
        # process opens is owned by it and readable by nobody else —
        # which the key-encryption key is checked for at startup and
        # refused without (ADR-0015).
        #
        # The runAsUser pins declare the UID both sides share; the
        # image's USER only implies it. The startup check compares the
        # file's owner against the reader's UID, so a pod-level
        # runAsUser or an edit to one container not mirrored on the
        # other turns a correct file into a refused one. The garam
        # image is scratch now and carries no shell, so the copy runs
        # on the alpine release the repo already pins.
        #
        # Nothing proposes a bump for it: the docker entry covers
        # deploy/local and does not search subdirectories, so no entry in
        # .github/dependabot.yml reaches this file. No scheduled review
        # is named for it either; naming no mover of its own, it is the
        # PM's to move under AGENTS.md §Roles.
        - name: key-material
          image: alpine:3.24.1@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
          command: ["/bin/sh", "-ec"]
          args:
            - |
              for f in ca-kek.hex tls.crt tls.key server-root.pem; do
                install -m 0600 "/etc/garam/throwaway/$f" "/run/garam/throwaway/$f"
              done
              ls -l /run/garam/throwaway
              # The policy service's certificate and the key the
              # listener signs its calls with, held to the same check
              # as the key-encryption key.
              for f in tls.crt signing.pem; do
                install -m 0600 "/etc/garam/policy-throwaway/$f" "/run/garam/policy/$f"
              done
          volumeMounts:
            - name: throwaway-secret
              mountPath: /etc/garam/throwaway
              readOnly: true
            - name: throwaway
              mountPath: /run/garam/throwaway
            - name: policy-throwaway-secret
              mountPath: /etc/garam/policy-throwaway
              readOnly: true
            - name: policy-material
              mountPath: /run/garam/policy
      containers:
        - name: machine
          image: garam:local
          imagePullPolicy: Never
          securityContext:
            runAsUser: 10001
          args: ["serve", "machine"]
          env:
            - name: GARAM_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-app
                  key: uri
            - name: GARAM_MACHINE_ADDR
              value: ":8443"
            # Every message this listener accepts is decided by the
            # engine, so it dials the same one the api server does.
            - name: GARAM_AUTHZ_ADDR
              value: "authz:9090"
            # The listener above serves no probe route, so the probes
            # get a plaintext listener of their own (ADR-0021).
            - name: GARAM_MACHINE_HEALTH_ADDR
              value: ":8444"
            # These four name files and carry none of their contents. A
            # key in the environment is inherited by every child process,
            # readable at /proc/<pid>/environ, and captured in a crash
            # dump (ADR-0015).
            #
            # The pair is re-read per handshake, so replacing the two
            # files in place would replace what the next connection is
            # served (ADR-0040). The initContainer above copies them at
            # pod start and nothing refreshes the copy, so rotation here
            # is still a restart — the deployment's half of the
            # mechanism, not garam's.
            - name: GARAM_MACHINE_TLS_CERT_FILE
              value: /run/garam/throwaway/tls.crt
            - name: GARAM_MACHINE_TLS_KEY_FILE
              value: /run/garam/throwaway/tls.key
            # The root every agent pins garam by, which signed the pair
            # above and nothing else.
            - name: GARAM_MACHINE_SERVER_ROOT_FILE
              value: /run/garam/throwaway/server-root.pem
            - name: GARAM_CA_KEY_FILE
              value: /run/garam/throwaway/ca-kek.hex
            # The issuer every message signature names (ADR-0101). No
            # verifier outside the cluster reaches this one.
            - name: GARAM_MACHINE_ISSUER
              value: https://garam-machine:8443
            # The policy service decides every send (ADR-0168), reached
            # as the api reaches it and under the same issuer, which
            # the policy service trusts and the listener refuses to
            # start without.
            - name: GARAM_POLICY_ADDR
              value: "policy:8443"
            - name: GARAM_POLICY_CA_FILE
              value: /run/garam/policy/tls.crt
            - name: GARAM_POLICY_SIGNING_KEY_FILE
              value: /run/garam/policy/signing.pem
            - name: GARAM_POLICY_TOKEN_ISSUER
              value: https://garam.localhost/api
            - name: GARAM_IDENTITY_ISSUER
              value: https://garam.localhost/api
          ports:
            - name: mtls
              containerPort: 8443
            - name: health
              containerPort: 8444
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8444
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8444
            timeoutSeconds: 3
          volumeMounts:
            - name: throwaway
              mountPath: /run/garam/throwaway
              readOnly: true
            - name: policy-material
              mountPath: /run/garam/policy
              readOnly: true
      volumes:
        # Generated by `deploy/local/minikube/policy-key-material.sh`;
        # the api and policy pods mount the same Secret.
        - name: policy-throwaway-secret
          secret:
            secretName: policy-throwaway-key-material
            items:
              - key: tls.crt
                path: tls.crt
              - key: signing.pem
                path: signing.pem
            defaultMode: 0440
        - name: policy-material
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        # Every value in this Secret is generated on this machine by
        # `deploy/local/minikube/machine-key-material.sh` and is worth
        # nothing off it: the certificate and the root that signed it are
        # trusted by nothing, and the key-encryption key seals message
        # signing keys that exist only in this cluster's database.
        #
        # The real one is not like this. A cluster that loses its
        # key-encryption key loses every key sealed under it with no
        # way back (ADR-0016) — so nothing about how this one is made,
        # stored or thrown away is a pattern to copy.
        - name: throwaway-secret
          secret:
            secretName: machine-throwaway-key-material
            defaultMode: 0440
        # Memory-backed, so the copy the process owns never reaches the
        # node's disk.
        - name: throwaway
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
---
apiVersion: v1
kind: Service
metadata:
  name: machine
  namespace: garam-local
spec:
  selector:
    app: machine
  ports:
    - name: mtls
      port: 8443
      targetPort: mtls
    - name: health
      port: 8444
      targetPort: health
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: garam-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
      annotations:
        image-id: "GARAM_WEB_IMAGE_ID"
    spec:
      containers:
        - name: web
          image: garam-web:local
          imagePullPolicy: Never
          env:
            # The /api/* target, read when the process starts.
            - name: GARAM_API_URL
              value: "http://api:8080"
            # Where a visitor without a session signs in (ADR-0131),
            # the origin compose sets; the process exits without it.
            - name: GARAM_SITE_URL
              value: "http://garam.localhost:3001"
          ports:
            - name: http
              containerPort: 3000
          # The same two paths the other three answer on (ADR-0023).
          # Both read nothing outside the process, so they are one
          # answer on two paths and neither needs the extra timeout the
          # other three's readiness takes.
          #
          # What these replaced is the lesson worth keeping: readiness
          # asked for /login, which server-renders the sign-in options
          # it asks the api for and answers 500 while the api is down,
          # and liveness had already been split off it because probing
          # it restarted the web app every time the api blipped. That
          # was measured here.
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: garam-local
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 3000
      targetPort: http
