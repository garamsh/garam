services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: gaon
      POSTGRES_PASSWORD: gaon
      POSTGRES_DB: gaon
    ports:
      - "${GAON_DB_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gaon"]
      interval: 2s
      timeout: 5s
      retries: 10
