syntax = "proto3";

package garam.authz.v1;

import "google/protobuf/timestamp.proto";

// PolicyService manages the org-scoped policy documents the engine
// owns (ADR-0002). Versions are append-only; rollback moves the
// default-version pointer, activation changes only the status, and
// deleting a policy removes it with its versions (ADR-0117).
service PolicyService {
  // CreatePolicy stores a new draft policy with its first version.
  rpc CreatePolicy(CreatePolicyRequest) returns (CreatePolicyResponse);

  // AddPolicyVersion appends a version. The default version is
  // unchanged until a rollback moves the pointer.
  rpc AddPolicyVersion(AddPolicyVersionRequest) returns (AddPolicyVersionResponse);

  // ListPolicies lists an org's policies in ascending GRN order.
  rpc ListPolicies(ListPoliciesRequest) returns (ListPoliciesResponse);

  // SearchPolicies lists an org's policies whose name or identifier
  // holds the query, case aside, in ascending GRN order.
  rpc SearchPolicies(SearchPoliciesRequest) returns (SearchPoliciesResponse);

  // ListPolicyVersions lists a policy's versions, oldest first.
  rpc ListPolicyVersions(ListPolicyVersionsRequest) returns (ListPolicyVersionsResponse);

  // ActivatePolicy makes a draft policy count in evaluation.
  rpc ActivatePolicy(ActivatePolicyRequest) returns (ActivatePolicyResponse);

  // DeletePolicy removes a policy together with its versions and
  // attachments, so it stops contributing statements to checks.
  rpc DeletePolicy(DeletePolicyRequest) returns (DeletePolicyResponse);

  // RollbackPolicy points the policy at any stored version, older or
  // newer than its current default.
  rpc RollbackPolicy(RollbackPolicyRequest) returns (RollbackPolicyResponse);

  // AttachPolicy binds the policy to a subject, so it applies to that
  // subject instead of to the whole org (ADR-0008).
  rpc AttachPolicy(AttachPolicyRequest) returns (AttachPolicyResponse);

  // DetachPolicy removes one attachment. Removing an active policy's
  // last attachment is refused with FAILED_PRECONDITION rather than
  // widening the policy to the whole org; delete the policy or attach
  // another subject first. An active policy created without
  // attachments still applies org-wide (ADR-0008).
  rpc DetachPolicy(DetachPolicyRequest) returns (DetachPolicyResponse);

  // ListPolicyAttachments lists a policy's attachments in ascending
  // subject GRN order.
  rpc ListPolicyAttachments(ListPolicyAttachmentsRequest) returns (ListPolicyAttachmentsResponse);
}

// PolicyStatus is a policy's lifecycle state. Only ACTIVE policies
// contribute statements to a check.
enum PolicyStatus {
  POLICY_STATUS_UNSPECIFIED = 0;
  POLICY_STATUS_DRAFT = 1;
  POLICY_STATUS_ACTIVE = 2;
  reserved 3;
  reserved "POLICY_STATUS_ARCHIVED";
}

// Policy is a versioned, org-managed rule set.
message Policy {
  string grn = 1;
  string org_grn = 2;
  string name = 3;
  PolicyStatus status = 4;
  // default_version is the version evaluated while the policy is
  // active.
  int32 default_version = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

// PolicyVersion is one immutable revision of a policy's document.
message PolicyVersion {
  string policy_grn = 1;
  int32 version = 2;
  // document is the policy document JSON (ADR-0002): a Version string
  // and a Statement list.
  string document = 3;
  string created_by = 4;
  google.protobuf.Timestamp created_at = 5;
}

message CreatePolicyRequest {
  string org_grn = 1;
  string name = 2;
  string document = 3;
  string created_by = 4;
}

message CreatePolicyResponse {
  Policy policy = 1;
}

message AddPolicyVersionRequest {
  string policy_grn = 1;
  string document = 2;
  string created_by = 3;
}

message AddPolicyVersionResponse {
  PolicyVersion version = 1;
}

message ListPoliciesRequest {
  string org_grn = 1;
}

message ListPoliciesResponse {
  repeated Policy policies = 1;
}

message SearchPoliciesRequest {
  string org_grn = 1;
  // The text matched: 1 to 100 characters once trimmed.
  string query = 2;
}

message SearchPoliciesResponse {
  repeated Policy policies = 1;
}

message ListPolicyVersionsRequest {
  string policy_grn = 1;
}

message ListPolicyVersionsResponse {
  repeated PolicyVersion versions = 1;
}

message ActivatePolicyRequest {
  string policy_grn = 1;
}

message ActivatePolicyResponse {
  Policy policy = 1;
}

message DeletePolicyRequest {
  string policy_grn = 1;
}

message DeletePolicyResponse {}

message RollbackPolicyRequest {
  string policy_grn = 1;
  int32 version = 2;
}

message RollbackPolicyResponse {
  Policy policy = 1;
}

// PolicyAttachment binds a policy to the subject it applies to
// (ADR-0008). The subject is a user or a group of the policy's org;
// the engine matches its GRN as a string.
message PolicyAttachment {
  string policy_grn = 1;
  string subject_grn = 2;
  google.protobuf.Timestamp created_at = 3;
}

message AttachPolicyRequest {
  string policy_grn = 1;
  string subject_grn = 2;
}

message AttachPolicyResponse {
  PolicyAttachment attachment = 1;
}

message DetachPolicyRequest {
  string policy_grn = 1;
  string subject_grn = 2;
}

message DetachPolicyResponse {}

message ListPolicyAttachmentsRequest {
  string policy_grn = 1;
}

message ListPolicyAttachmentsResponse {
  repeated PolicyAttachment attachments = 1;
}
