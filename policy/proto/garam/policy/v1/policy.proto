syntax = "proto3";

package garam.policy.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// PolicyService is the policy service's wire contract (ADR-0130). Its
// messages take the shape of OpenID AuthZEN Authorization API 1.0, over
// gRPC. A caller sends who asks, what for and on what; the service
// reads the subject's memberships and the resource's ancestors from its
// own store, so no caller supplies the grounds of its own decision.
service PolicyService {
  // Evaluate answers whether the subject may perform the action on the
  // resource.
  rpc Evaluate(EvaluateRequest) returns (EvaluateResponse);

  // Evaluations answers Evaluate's question many times in one call
  // (ADR-0115). Each entry of the request is one question, and an empty
  // list is the one question the request's defaults state. A question
  // at fault is denied in its own answer, with the fault as its reason.
  rpc Evaluations(EvaluationsRequest) returns (EvaluationsResponse);

  // ApplyEntityChanges writes what an entity's owner says it now is
  // (ADR-0138). A change at or below the stored sequence changes
  // nothing, so a replayed or reordered delivery is a no-op. A change
  // to a type the caller does not own fails the call and writes
  // nothing. A change at fault otherwise is refused in the response
  // and the rest are written.
  rpc ApplyEntityChanges(ApplyEntityChangesRequest) returns (ApplyEntityChangesResponse);

  // CreatePolicy stores an organization's policy as a draft holding
  // version 1 (ADR-0146 item 3). The platform alone calls the write
  // RPCs, and every one names the writer whose action the service
  // evaluates on the organization, read current, before it stores.
  rpc CreatePolicy(CreatePolicyRequest) returns (CreatePolicyResponse);

  // AppendPolicyVersion adds a version of the policy's own kind and
  // leaves its default where it is.
  rpc AppendPolicyVersion(AppendPolicyVersionRequest) returns (AppendPolicyVersionResponse);

  // ActivatePolicy makes the policy's default version decide.
  rpc ActivatePolicy(ActivatePolicyRequest) returns (ActivatePolicyResponse);

  // RollBackPolicy moves the default to a stored version, older or
  // newer.
  rpc RollBackPolicy(RollBackPolicyRequest) returns (RollBackPolicyResponse);

  // DeletePolicy removes the policy with its versions.
  rpc DeletePolicy(DeletePolicyRequest) returns (DeletePolicyResponse);

  // GetPolicy reads one policy with its versions.
  rpc GetPolicy(GetPolicyRequest) returns (GetPolicyResponse);

  // ListPolicies reads the organization's policies, unpaged.
  rpc ListPolicies(ListPoliciesRequest) returns (ListPoliciesResponse);

  // ListAuditRecords reads the organization's records of every policy
  // write and every denial (ADR-0148), newest first. The platform
  // alone calls it, for a reader that holds `iam:audit.read` on the
  // organization, which the service evaluates itself.
  rpc ListAuditRecords(ListAuditRecordsRequest) returns (ListAuditRecordsResponse);
}

// Subject is who asks. It carries no properties, unlike AuthZEN's: a
// subject's attributes are the grounds a caller does not supply.
message Subject {
  // type is an entity type of the Cedar schema, such as `User`.
  string type = 1;
  // id is the subject's GRN.
  string id = 2;
}

// Action is what the subject asks to do.
message Action {
  // name is an action of the Cedar schema, such as `project.read`.
  string name = 1;
}

// Resource is what the action is asked of.
message Resource {
  // type is an entity type of the Cedar schema, such as `Project`.
  string type = 1;
  // id is the resource's GRN.
  string id = 2;
  // properties are refused: an owner writes an entity through
  // ApplyEntityChanges, and no question carries one (ADR-0140).
  google.protobuf.Struct properties = 3;
}

// Read says where an evaluation reads policies and entities from.
enum Read {
  READ_UNSPECIFIED = 0;
  // READ_CACHED answers from the service's cache.
  READ_CACHED = 1;
  // READ_CURRENT reads storage when asked and fails rather than answer
  // when storage cannot be read, as CheckCurrent does today (ADR-0078).
  READ_CURRENT = 2;
}

// EvaluateRequest is one authorization question.
message EvaluateRequest {
  Subject subject = 1;
  Action action = 2;
  Resource resource = 3;
  // context is the request's context. The schema declares none yet, so
  // a context holding a field is refused.
  google.protobuf.Struct context = 4;
  Read read = 5;
  // probe states that the question is a probe: the caller is deciding
  // what to show, as when it filters a list or enables a control. A
  // denied probe is not recorded (ADR-0148). The default is an
  // attempt, a request someone made, and a denied attempt is.
  bool probe = 6;
}

// Reason names one ground of a decision. An allow names every policy
// that permits, a deny every policy that forbids and nothing that
// permits, and a deny nothing matched names none. The order is not
// stated: compare the reasons as a set.
message Reason {
  // policy_id names a policy that decided, or the policy an evaluation
  // error arose in. A stored policy is named by its GRN, so a role link
  // the platform wrote is named by the reserved identifier it computes
  // (ADR-0161, ADR-0163), a system policy by its file's name, such as
  // `tenant-isolation`, and a guardrail of the sending organization
  // that denies a message.send to another by `<organization GRN>/<its
  // GRN>`. It is empty when the question itself was refused.
  string policy_id = 1;
  // error is empty unless the policy failed to evaluate or the question
  // was refused, and either makes the decision a deny (ADR-0137).
  string error = 2;
}

// DecisionContext is what a decision carries beside its answer.
message DecisionContext {
  repeated Reason reasons = 1;
}

message EvaluateResponse {
  // decision is the answer. The zero value is deny.
  bool decision = 1;
  DecisionContext context = 2;
}

// Evaluation is one question of an EvaluationsRequest. A field left
// unset takes the request's value, as AuthZEN's defaults do.
message Evaluation {
  Subject subject = 1;
  Action action = 2;
  Resource resource = 3;
  google.protobuf.Struct context = 4;
  // probe, where set, replaces the request's.
  optional bool probe = 5;
}

// EvaluationsRequest holds the defaults its evaluations share.
message EvaluationsRequest {
  Subject subject = 1;
  Action action = 2;
  Resource resource = 3;
  google.protobuf.Struct context = 4;
  Read read = 5;
  repeated Evaluation evaluations = 6;
  // probe is the default of every entry, as EvaluateRequest's is.
  bool probe = 7;
}

message EvaluationsResponse {
  // evaluations holds one answer per evaluation, in the request's
  // order, and never none.
  repeated EvaluateResponse evaluations = 1;
}

// EntityRef names an entity of the Cedar schema.
message EntityRef {
  // type is an entity type of the Cedar schema, such as `Team`, of at
  // most 64 bytes.
  string type = 1;
  // id is the entity's identifier, its GRN for all but `OrgMembers`,
  // which takes its organization's.
  // An id is at most 512 bytes.
  string id = 2;
}

// EntityUpsert is what an entity now is. It carries containment and
// membership, and three attributes of the one type each belongs to
// (ADR-0138, ADR-0146, ADR-0147, ADR-0164).
message EntityUpsert {
  // org is required of every resource type, and an `Org` names itself.
  EntityRef org = 1;
  // members is required of an `Org`, and names its own `OrgMembers`.
  EntityRef members = 2;
  // parents holds at most 1000 references.
  repeated EntityRef parents = 3;
  // consents holds the organizations an `Org` has granted its half of
  // a message toward (ADR-0147). Each is an `Org`, and an upsert of
  // any other type that holds one is refused. Left empty, the `Org`
  // consents to none.
  repeated EntityRef consents = 4;
  // operations holds the operations an `Operator`'s current delegation
  // grants, as action names in their wire form, such as
  // `iam:agent.activate` (ADR-0146). Each is an action `Iam::Operator`
  // may be the principal of, and an upsert of any other type that
  // holds one is refused. Left empty, the `Operator` holds none.
  repeated string operations = 5;
  // agent is the agent a `Supervisor` holds (ADR-0164). It is an
  // `Agent`, and an upsert of any other type that names one is refused.
  // Left unset, the `Supervisor` holds none.
  EntityRef agent = 6;
}

// EntityDelete says the owner no longer has the entity.
message EntityDelete {}

// EntityChange is one write.
message EntityChange {
  EntityRef entity = 1;
  // sequence is above zero and rises with every change the owner makes
  // to this entity.
  int64 sequence = 2;
  oneof operation {
    EntityUpsert upsert = 3;
    EntityDelete delete = 4;
  }
}

message ApplyEntityChangesRequest {
  // changes holds at most 1000 changes, applied in order in one
  // transaction.
  repeated EntityChange changes = 1;
}

// EntityChangeRefusal is one change refused for its own fault.
message EntityChangeRefusal {
  // index is the change's place in the request.
  uint32 index = 1;
  string error = 2;
}

message ApplyEntityChangesResponse {
  // written counts the changes that took effect.
  uint32 written = 1;
  // dropped counts the changes at or below the stored sequence.
  uint32 dropped = 2;
  repeated EntityChangeRefusal refusals = 3;
}

// Role is a role an organization's role link grants.
enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_OWNER = 1;
  ROLE_ADMIN = 2;
  ROLE_MEMBER = 3;
}

// RoleScope is the template set a role link is drawn from.
enum RoleScope {
  ROLE_SCOPE_UNSPECIFIED = 0;
  // ROLE_SCOPE_ORGANIZATION links a principal to the organization.
  ROLE_SCOPE_ORGANIZATION = 1;
  // ROLE_SCOPE_TEAM_OR_PROJECT links a principal to a team or project.
  ROLE_SCOPE_TEAM_OR_PROJECT = 2;
}

// PolicyKind is what a policy says, fixed by its first version.
enum PolicyKind {
  POLICY_KIND_UNSPECIFIED = 0;
  POLICY_KIND_ROLE_LINK = 1;
  POLICY_KIND_GUARDRAIL = 2;
  POLICY_KIND_PERMIT = 3;
}

// PolicyStatus says whether a policy decides anything.
enum PolicyStatus {
  POLICY_STATUS_UNSPECIFIED = 0;
  // POLICY_STATUS_DRAFT is stored and evaluated by nothing.
  POLICY_STATUS_DRAFT = 1;
  // POLICY_STATUS_ACTIVE composes the default version into decisions.
  POLICY_STATUS_ACTIVE = 2;
}

// RoleLink assigns a role to a principal on a resource.
message RoleLink {
  Role role = 1;
  RoleScope scope = 2;
  EntityRef principal = 3;
  EntityRef resource = 4;
}

// PolicyBody is what one version of a policy says.
message PolicyBody {
  oneof body {
    RoleLink role_link = 1;
    // guardrail is the text of one Cedar `forbid`.
    string guardrail = 2;
    // permit is the text of one Cedar `permit`.
    string permit = 3;
  }
}

// PolicyVersion is one stored version.
message PolicyVersion {
  int32 version = 1;
  PolicyBody body = 2;
  // created_by is the writer's GRN, or the calling service's subject
  // (`platform`) for a write with none.
  string created_by = 3;
}

// PolicySummary is a policy without its versions.
message PolicySummary {
  // policy is the policy's GRN, `grn:<org slug>/iam/policy/<id>`.
  string policy = 1;
  string name = 2;
  PolicyStatus status = 3;
  int32 default_version = 4;
  PolicyKind kind = 5;
}

// CreatePolicyRequest names the writer, the organization and the
// policy. A writer left unset is accepted for a role link alone, a
// write from a membership.
message CreatePolicyRequest {
  Subject writer = 1;
  // org is the organization's GRN.
  string org = 2;
  string policy = 3;
  string name = 4;
  PolicyBody body = 5;
}

message CreatePolicyResponse {}

message AppendPolicyVersionRequest {
  Subject writer = 1;
  string org = 2;
  string policy = 3;
  PolicyBody body = 4;
}

message AppendPolicyVersionResponse {
  // version is the new version's number.
  int32 version = 1;
}

message ActivatePolicyRequest {
  Subject writer = 1;
  string org = 2;
  string policy = 3;
}

message ActivatePolicyResponse {}

message RollBackPolicyRequest {
  Subject writer = 1;
  string org = 2;
  string policy = 3;
  int32 version = 4;
}

message RollBackPolicyResponse {}

message DeletePolicyRequest {
  Subject writer = 1;
  string org = 2;
  string policy = 3;
}

message DeletePolicyResponse {}

// GetPolicyRequest names the reader, who must hold `iam:policy.read`
// on the organization.
message GetPolicyRequest {
  Subject writer = 1;
  string org = 2;
  string policy = 3;
}

message GetPolicyResponse {
  PolicySummary policy = 1;
  // versions are oldest first.
  repeated PolicyVersion versions = 2;
}

message ListPoliciesRequest {
  Subject writer = 1;
  string org = 2;
}

message ListPoliciesResponse {
  repeated PolicySummary policies = 1;
}

// AuditRecordKind is what an audit record is.
enum AuditRecordKind {
  AUDIT_RECORD_KIND_UNSPECIFIED = 0;
  // AUDIT_RECORD_KIND_WRITE is a write of a policy.
  AUDIT_RECORD_KIND_WRITE = 1;
  // AUDIT_RECORD_KIND_DENIAL is a denial, or the identical denials of
  // one hour, counted.
  AUDIT_RECORD_KIND_DENIAL = 2;
  // AUDIT_RECORD_KIND_DENIAL_OVERFLOW counts the denials of one UTC day
  // that the organization's cap stored no record for, and holds
  // nothing else.
  AUDIT_RECORD_KIND_DENIAL_OVERFLOW = 3;
}

// AuditRecord is one record of an organization, all of it readable by
// the organization's owners and administrators. It holds no policy
// text, no context, no token and no fault text.
message AuditRecord {
  int64 id = 1;
  AuditRecordKind kind = 2;
  // first_at is when a write was made or a denial first occurred.
  google.protobuf.Timestamp first_at = 3;
  // last_at is when a denial last occurred, and a write's first_at.
  google.protobuf.Timestamp last_at = 4;
  // count is how many identical denials the record holds; 1 for a
  // write.
  int64 count = 5;
  // service is the `sub` of the service that made the request. It is
  // empty on an overflow record.
  string service = 6;
  // subject is the GRN of who asked or wrote, and empty for a write
  // the service made with no writer and on an overflow record.
  string subject = 7;
  // action is in its qualified wire form, such as `iam:permit.write`.
  string action = 8;
  // resource is the GRN asked about; for a write, the policy's.
  string resource = 9;
  // outcome is `deny`, or `created`, `version-added`, `activated`,
  // `rolled-back` or `removed`.
  string outcome = 10;
  // policy_ids are the policies of a denial's reasons, with `fault`
  // for a reason that is an evaluation fault; for a write, the
  // policy.
  repeated string policy_ids = 11;
  // version_from is the default a write moved from, or 0.
  int32 version_from = 12;
  // version_to is the version a write wrote or moved to, or 0.
  int32 version_to = 13;
  // day is the first second of the UTC day an overflow record holds.
  google.protobuf.Timestamp day = 14;
}

// ListAuditRecordsRequest names the reader, who must hold
// `iam:audit.read` on the organization.
message ListAuditRecordsRequest {
  Subject writer = 1;
  string org = 2;
  // page_size is at most the service's bound, and 0 asks the bound.
  int32 page_size = 3;
  // page_token is the previous response's next_page_token.
  string page_token = 4;
}

message ListAuditRecordsResponse {
  // records are newest first.
  repeated AuditRecord records = 1;
  // next_page_token reads the next page, and is empty at the end.
  string next_page_token = 2;
}
