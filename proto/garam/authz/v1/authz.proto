syntax = "proto3";

package garam.authz.v1;

// AuthzService is the policy engine's wire contract (ADR-0003). The
// engine evaluates the union of the caller's role-derived statements
// and the org's persisted policies (ADR-0007); it matches strings only
// and never imports a domain.
service AuthzService {
  // Check answers whether the subject may perform the action on the
  // object.
  rpc Check(CheckRequest) returns (CheckResponse);

  // Explain answers the same question and reports which statements
  // matched and which produced the final decision.
  rpc Explain(ExplainRequest) returns (ExplainResponse);
}

// Effect is a statement's outcome when it matches (ADR-0002).
enum Effect {
  EFFECT_UNSPECIFIED = 0;
  EFFECT_ALLOW = 1;
  EFFECT_DENY = 2;
}

// Statement is one IAM-style rule. Action and Resource entries are
// patterns: "*" matches any run of characters, "?" exactly one.
message Statement {
  string sid = 1;
  Effect effect = 2;
  repeated string action = 3;
  repeated string resource = 4;
}

// CheckRequest is one authorization question: may the subject perform
// the action on the object.
message CheckRequest {
  string subject_grn = 1;
  string object_grn = 2;
  string action = 3;
  // statements carry the caller's role-derived grants (ADR-0007). The
  // engine unions them with the policies persisted for the object's
  // org; either side alone may decide.
  repeated Statement statements = 4;
  // subject_groups are the GRNs of the groups the subject belongs to
  // (ADR-0008). Group membership is org data the caller resolves; the
  // engine uses it only to find the policies attached to the subject.
  repeated string subject_groups = 5;
  // subject_org is the GRN of the organization the subject belongs to
  // when the subject is an org member (ADR-0038). The engine refuses
  // the call when it is unset and the object's organization is not the
  // subject's: the boundary ADR-0025 leaves to the caller, enforced
  // where the obligation lives.
  string subject_org = 6;
}

message CheckResponse {
  // allowed is the final decision: explicit Deny wins, otherwise any
  // matching Allow permits. The zero value is deny.
  bool allowed = 1;
}

// ExplainRequest mirrors CheckRequest.
message ExplainRequest {
  string subject_grn = 1;
  string object_grn = 2;
  string action = 3;
  repeated Statement statements = 4;
  repeated string subject_groups = 5;
  string subject_org = 6;
}

message ExplainResponse {
  bool allowed = 1;
  repeated StatementTrace traces = 2;
}

// StatementTrace records one statement's contribution to a check.
message StatementTrace {
  string sid = 1;
  bool matched = 2;
  Effect effect = 3;
}
