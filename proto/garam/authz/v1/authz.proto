syntax = "proto3";

package garam.authz.v1;

// AuthzService is the policy engine's wire contract (ADR-0003). The
// engine evaluates the union of the caller's role-derived statements
// and the org's persisted policies (ADR-0007); it matches strings only
// and never imports a domain.
service AuthzService {
  // Check answers whether the subject may perform the action on the
  // object.
  rpc Check(CheckRequest) returns (CheckResponse);

  // Explain answers the same question and reports which statements
  // matched and which produced the final decision.
  rpc Explain(ExplainRequest) returns (ExplainResponse);

  // CheckCurrent answers Check's question with the org's persisted
  // policies read from storage when it is asked, never from the
  // engine's cache, and fails rather than answer when storage cannot
  // be read. Only that read is current: statements, subject_groups and
  // subject_org are taken as sent, so a caller needing them current
  // resolves them afresh. It is a method of its own so that an engine
  // predating it answers UNIMPLEMENTED: a field on CheckRequest would
  // be dropped unread by such an engine, which would then answer from
  // its cache.
  rpc CheckCurrent(CheckCurrentRequest) returns (CheckCurrentResponse);

  // CheckBatch answers Check's question for one subject and one action
  // over many objects of the subject's organization, in one call
  // (ADR-0115). Each object is decided as a Check would decide it given
  // the shared statements and the object's own, over the persisted
  // policies read once for the call. One object outside subject_org
  // refuses the whole call, as Check refuses it.
  rpc CheckBatch(CheckBatchRequest) returns (CheckBatchResponse);
}

// Effect is a statement's outcome when it matches (ADR-0002).
enum Effect {
  EFFECT_UNSPECIFIED = 0;
  EFFECT_ALLOW = 1;
  EFFECT_DENY = 2;
}

// Statement is one IAM-style rule. Action and Resource entries are
// patterns: "*" matches any run of characters, "?" exactly one.
message Statement {
  string sid = 1;
  Effect effect = 2;
  repeated string action = 3;
  repeated string resource = 4;
}

// CheckRequest is one authorization question: may the subject perform
// the action on the object.
message CheckRequest {
  string subject_grn = 1;
  string object_grn = 2;
  string action = 3;
  // statements carry the caller's role-derived grants (ADR-0007). The
  // engine unions them with the policies persisted for the object's
  // org; either side alone may decide.
  repeated Statement statements = 4;
  // subject_groups are the GRNs of the groups the subject belongs to
  // (ADR-0008). Group membership is org data the caller resolves; the
  // engine uses it only to find the policies attached to the subject.
  repeated string subject_groups = 5;
  // subject_org is the GRN of the organization the subject belongs to
  // when the subject is an org member (ADR-0038). The engine refuses
  // the call when it is unset and the object's organization is not the
  // subject's: the boundary ADR-0025 leaves to the caller, enforced
  // where the obligation lives.
  string subject_org = 6;
}

message CheckResponse {
  // allowed is the final decision: explicit Deny wins, otherwise any
  // matching Allow permits. The zero value is deny.
  bool allowed = 1;
}

// CheckCurrentRequest mirrors CheckRequest.
message CheckCurrentRequest {
  string subject_grn = 1;
  string object_grn = 2;
  string action = 3;
  repeated Statement statements = 4;
  repeated string subject_groups = 5;
  string subject_org = 6;
}

message CheckCurrentResponse {
  // allowed is decided as CheckResponse.allowed is.
  bool allowed = 1;
}

// CheckBatchRequest is CheckRequest's question asked of many objects.
// Its subject_grn, action, subject_groups and subject_org are
// CheckRequest's, and hold for every object.
message CheckBatchRequest {
  string subject_grn = 1;
  string action = 2;
  // statements are the caller's role-derived grants that hold for every
  // object, such as an org role's.
  repeated Statement statements = 3;
  repeated string subject_groups = 4;
  string subject_org = 5;
  repeated CheckBatchObject objects = 6;
}

// CheckBatchObject is one object of a CheckBatchRequest.
message CheckBatchObject {
  string object_grn = 1;
  // statements are grants that reach the subject through this object
  // alone, such as a group's roles scoped to the group. The engine
  // unions them with the request's statements for this object only.
  repeated Statement statements = 2;
}

message CheckBatchResponse {
  // allowed holds one decision per object, in the request's order, each
  // decided as CheckResponse.allowed is.
  repeated bool allowed = 1;
}

// ExplainRequest mirrors CheckRequest.
message ExplainRequest {
  string subject_grn = 1;
  string object_grn = 2;
  string action = 3;
  repeated Statement statements = 4;
  repeated string subject_groups = 5;
  string subject_org = 6;
}

message ExplainResponse {
  bool allowed = 1;
  repeated StatementTrace traces = 2;
}

// StatementTrace records one statement's contribution to a check.
message StatementTrace {
  string sid = 1;
  bool matched = 2;
  Effect effect = 3;
  // policy_grn is the persisted policy holding the statement, and empty
  // for a statement the caller sent.
  string policy_grn = 4;
  // attached_to names the subjects of the request — subject_grn or one
  // of subject_groups — that the policy is attached to. It is empty for
  // a policy that applies org-wide and for a statement the caller sent
  // (ADR-0008).
  repeated string attached_to = 5;
}
